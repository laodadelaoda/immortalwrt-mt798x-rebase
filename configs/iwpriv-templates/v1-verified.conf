# N60 Pro verified iwpriv runtime commands v1
# Source: 10-01 WEXT baseline + NX62 official firmware strings
# Verified: 2026-10-24
# Usage: manual execution only; do not auto-run until each line is verified.

# ===== 11r FT: verified =====
# NX62 official FtSupport=0 (default off)
# 10-01 baseline: iwpriv rax0 set ftenable=1 -> dmesg FT Enable=1
iwpriv rax0 set ftenable=1
iwpriv ra0 set ftenable=1

# ===== 11v BTM: verified trigger, but Linux 6.12 WARNING =====
# NX62 official Dot11vMbssid=0 (default off)
# 10-01 baseline: iwpriv rax0 set SendBTMReq=<MAC> triggers BTM,
# but causes wnm.c:2025 FORTIFY WARNING. Do not enable until fixed.
# iwpriv rax0 set SendBTMReq=<MAC>

# ===== Weak signal kick: driver command exists, official uses mapd =====
# NX62 official dat has no KickStaRssiLow; mapd uses APSteerRssiTh=-54.
# Do not map blindly. Verify official MAP path first.
# iwpriv rax0 set KickStaRssiLow=-75
# iwpriv rax0 set AssocReqRssiThres=-75

