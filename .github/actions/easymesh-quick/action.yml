        # Fail fast on source hashes and patch application before toolchain and
        # OpenSSL builds consume the majority of Quick's preparation time.
        make -C package/mtk/applications/datconf TOPDIR="$GITHUB_WORKSPACE" prepare V=s
        DATCONF_CMAKE="build_dir/target-aarch64_cortex-a53_musl/datconf/datconf/CMakeLists.txt"
        test -s "$DATCONF_CMAKE" || { echo "::error::Prepared datconf CMakeLists.txt is missing."; exit 1; }
        grep -Fq 'add_subdirectory(lua)' "$DATCONF_CMAKE" || {
          echo "::error::Prepared datconf source is missing its Lua binding declaration."; exit 1;
        }
        ! grep -Fq 'add_subdirectory(ucode)' "$DATCONF_CMAKE" || {
          echo "::error::Prepared datconf source unexpectedly gained a ucode CMake target; review dependencies."; exit 1;
        }
        make -C package/mtk/applications/easymesh-n60 TOPDIR="$GITHUB_WORKSPACE" prepare V=s
        EASYMESH_SRC="build_dir/target-aarch64_cortex-a53_musl/easymesh-n60-7.6.7.3"
        python3 - "$EASYMESH_SRC" package/mtk/applications/easymesh-n60/files/etc/map/wts_bss_info_config <<'PY'
        import pathlib, sys
        root = pathlib.Path(sys.argv[1])
        template = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8").splitlines()
        rows = [line for line in template if line.strip() and not line.lstrip().startswith("#")]
        if len(rows) != 12:
            raise SystemExit("N60 vendor WTS template must retain exactly 12 rows")
        bands = {"8x": 0, "11x": 0, "12x": 0}
        for line in rows:
            index, rest = line.split(",", 1)
            fields = rest.split()
            if len(fields) < 9:
                raise SystemExit("WTS row has fewer than 9 required fields: " + index)
            mac, op, ssid, auth, enc, key, r1, r2, hidden = fields[:9]
            if len(mac) != 17 or any(mac[pos] != ":" for pos in (2, 5, 8, 11, 14)):
                raise SystemExit("WTS MAC is not canonical: " + index)
            if op not in bands or not ssid or len(ssid.encode()) > 32 or not key or len(key) > 64:
                raise SystemExit("WTS field exceeds parser bounds: " + index)
            if not auth.startswith("0x") or not enc.startswith("0x") or not r1.isdigit() or not r2.isdigit():
                raise SystemExit("WTS numeric field is malformed: " + index)
            if hidden not in ("hidden-N", "hidden-Y"):
                raise SystemExit("WTS hidden-SSID field is malformed: " + index)
            bands[op] += 1
        if bands != {"8x": 4, "11x": 4, "12x": 4}:
            raise SystemExit("N60 vendor WTS band coverage changed: " + repr(bands))
        main = (root / "wappd/common/main.c").read_text(encoding="utf-8")
        a = main.index("int wapp_read_wts_map_config(")
        b = main.index("\n#ifdef DPP_SUPPORT", a)
        parser = main[a:b]
        for required in ("os_strlen(pos1) >= sizeof(op_class)", "os_strlen(pos1) >= sizeof(ssid)", "os_strlen(pos1) >= sizeof(key)",
                         'sscanf(pos1, "%3s"', 'sscanf(pos1, "%32s"', 'sscanf(pos1, "%64s"',
                         "if (ret != 6)", "while ((ch = fgetc(f)) != EOF)", "content[i] = '\\0';", "if (i == 0)"):
            if required not in parser:
                raise SystemExit("WAPP WTS parser hardening missing: " + required)
        if "key=%s" in parser or "if (ret == EOF)" in parser or "}while (EOF != ch);" in parser:
            raise SystemExit("WAPP WTS parser retains a secret log or unchecked sscanf result")
        checks = {
            "wappd/common/wdev.c": "psk = %s",
            "wappd/map/map_1905.c": "key=%s",
            "1905daemon/src/file_io.c": "key=%s",
            "1905daemon/src/multi_ap.c": "key=%s",
            "mapd/src/topologySrv/topologySrv.c": "key=%s",
        }
        for rel, forbidden in checks.items():
            if forbidden in (root / rel).read_text(encoding="utf-8"):
                raise SystemExit("Plaintext Wi-Fi key diagnostic remains in " + rel)
        print("PASS: WTS parser hardening and secret redaction verified; 12 vendor profiles retain 4/4/4 band coverage.")
        PY
        # mapfilter is a required runtime kernel module for the N60 EasyMesh
        # stack. Prepare its exact 7.6.7.3 source and apply all Linux 6.12
        # compatibility patches before the expensive toolchain build.
        make -C package/kernel/mapfilter TOPDIR="$GITHUB_WORKSPACE" clean V=s
        MAPFILTER_PREPARE_LOG="artifacts/easymesh-quick/mapfilter-prepare-quick.log"
        mkdir -p artifacts/easymesh-quick
        make -C package/kernel/mapfilter TOPDIR="$GITHUB_WORKSPACE" prepare V=s 2>&1 | tee "$MAPFILTER_PREPARE_LOG"
        MAPFILTER_BUILD_DIR="build_dir/target-aarch64_cortex-a53_musl/linux-mediatek_filogic/mapfilter"
        test -s "$MAPFILTER_BUILD_DIR/mtkmapfilter.c" || {
          echo "::error::Prepared mapfilter 7.6.7.3 source tree is missing."
          exit 1
        }
        for patch in package/kernel/mapfilter/patches/*.patch; do
          [ -s "$patch" ] || continue
          grep -Fq "$(basename "$patch")" "$MAPFILTER_PREPARE_LOG" || {
            echo "::error::mapfilter prepare log does not confirm patch application: $patch"
            exit 1
          }
        done
        ! grep -Fq '.cb_mutex = NULL' "$MAPFILTER_BUILD_DIR/mtkmapfilter.c" || {
          echo "::error::Linux 6.12 netlink_kernel_cfg still contains removed cb_mutex field."
          exit 1
        }
        grep -Fq 'sockptr_t user' "$MAPFILTER_BUILD_DIR/mtkmapfilter.c" || {
          echo "::error::mapfilter setsockopt callback was not converted to sockptr_t."
          exit 1
        }
        grep -Fq '#include <linux/sockptr.h>' "$MAPFILTER_BUILD_DIR/mtkmapfilter.c" || {
          echo "::error::mapfilter does not explicitly include the Linux sockptr API header."
          exit 1
        }
        grep -Fq 'copy_from_sockptr(almac, user, ETH_ALEN)' "$MAPFILTER_BUILD_DIR/mtkmapfilter.c" || {
          echo "::error::mapfilter sockptr_t callback still uses copy_from_user."
          exit 1
        }
        echo "PASS: mapfilter 7.6.7.3 archive verified; all package patches applied; Linux 6.12 netlink and sockptr APIs checked."
        P1905_ROOT_MAKEFILE="build_dir/target-aarch64_cortex-a53_musl/easymesh-n60-7.6.7.3/1905daemon/Makefile"
        P1905_ETH_MAKEFILE="build_dir/target-aarch64_cortex-a53_musl/easymesh-n60-7.6.7.3/1905daemon/ethernet/Makefile"
        grep -Fq '$(MAKE) -C $(ETH_OPS_LIB_DIR) AR="$(AR)" RANLIB="$(RANLIB)" CC="$(CC)" CFLAGS="$(CFLAGS) $(EXTRA_CFLAGS)" LDFLAGS="$(LDFLAGS)" INCLUDE="$(INCLUDES)"' "$P1905_ROOT_MAKEFILE" || {
          echo "::error::P1905 root build does not propagate target EXTRA_CFLAGS/LDFLAGS into Ethernet."
          exit 1
        }
        grep -Fq '$(MAKE) -C $(LIBDIR) AR="$(AR)" RANLIB="$(RANLIB)" CC="$(CC)" CFLAGS="$(CFLAGS)" INCLUDE="$(INCLUDE)"' "$P1905_ETH_MAKEFILE" || {
          echo "::error::P1905 DSA libbridge recursive build does not inherit target tools and flags."
          exit 1
        }
        grep -Fq '$(CC) $(CFLAGS) $(LDFLAGS) -I../inc -I. -I$(INC) -fPIC -shared -o $@ $^' "$P1905_ETH_MAKEFILE" || {
          echo "::error::P1905 Ethernet shared-library link does not consume target LDFLAGS."
          exit 1
        }
        echo "PASS: P1905 DSA recursive compiler and shared-library linker flags are propagated."
        EASYMESH_BUILD_DIR="build_dir/target-aarch64_cortex-a53_musl/easymesh-n60-7.6.7.3"
        for f in wappd/Makefile mapd/Makefile 1905daemon/Makefile libmapd/Makefile; do
          test -s "$EASYMESH_BUILD_DIR/$f" || {
            echo "::error::Prepared EasyMesh source tree is missing $f"; exit 1;
          }
        done
        grep -Fq 'SIOCGMIIREG' "$EASYMESH_BUILD_DIR/1905daemon/ethernet/mediatek_DSA/eth_ops_dsa.c" || {
          echo "::error::N60 Linux 6.12 DSA ioctl patch was not applied to P1905 source."; exit 1;
        }
        grep -Fq '$(CFLAGS) -I ./include -c -fPIC' "$EASYMESH_BUILD_DIR/libmapd/Makefile" || {
          echo "::error::libmapd target compile flags patch was not applied."; exit 1;
        }
        grep -Fq '$(CC) $(LDFLAGS) -shared -o $@ $^' "$EASYMESH_BUILD_DIR/libmapd/Makefile" || {
          echo "::error::libmapd target link flags patch was not applied."; exit 1;
        }
        grep -Fq '$(MAKE) -C $(ETH_OPS_LIB_DIR) AR="$(AR)" RANLIB="$(RANLIB)" CC="$(CC)"' "$EASYMESH_BUILD_DIR/1905daemon/Makefile" || {
          echo "::error::P1905 Ethernet submake did not receive target AR/RANLIB/CC variables."; exit 1;
        }
        grep -Fq '$(MAKE) -C $(LIBDIR) AR="$(AR)" RANLIB="$(RANLIB)" CC="$(CC)"' "$EASYMESH_BUILD_DIR/1905daemon/ethernet/Makefile" || {
          echo "::error::P1905 libbridge submake did not receive target AR/RANLIB/CC variables."; exit 1;
        }
        echo "PASS: datconf and all four EasyMesh source trees prepared; patch application verified before toolchain build."
        make toolchain/install -j"$(nproc)" V=s
        # Quick builds need OpenSSL's target development files, not runtime APKs.
        # Request the package's InstallDev staging stamp directly. The package-local
        # "compile" goal also enters APK generation and dependency scanning, which
        # is outside Quick's responsibility and can fail on unrelated runtime
        # package metadata (Run #53: libc.so/libgcc_s.so.1).
        # The stamp target builds OpenSSL and runs Build/InstallDev only; it does
        # not create libopenssl3 APKs or invoke the global package scheduler.
        TARGET_STAGING="$GITHUB_WORKSPACE/staging_dir/target-aarch64_cortex-a53_musl"
        make -C package/libs/openssl TOPDIR="$GITHUB_WORKSPACE" \
          "$TARGET_STAGING/stamp/.openssl_installed" -j"$(nproc)" V=s
        test -s "$TARGET_STAGING/usr/include/openssl/x509.h" || {
          echo "::error::Target OpenSSL development headers were not staged: $TARGET_STAGING/usr/include/openssl/x509.h"
          exit 1
        }
        for lib in libssl.so libssl.so.3 libcrypto.so libcrypto.so.3; do
          test -e "$TARGET_STAGING/usr/lib/$lib" || {
            echo "::error::Target OpenSSL link library missing: $TARGET_STAGING/usr/lib/$lib"; exit 1;
          }
        done
        echo "PASS: target OpenSSL headers and OpenSSL 3 link libraries staged."
        # The package-local EasyMesh compile intentionally bypasses OpenWrt's
        # global package dependency scheduler. Stage datconf's development
        # interface explicitly so WAPP can include libdatconf.h and link
        # against the matching target libdatconf/libkvcutil outputs.
        # WAPP needs datconf's C development interface only. The optional
        # datconf ucode module is not part of EasyMesh and requires libucode
        # headers that this package-local Quick path intentionally does not stage.
        # Disable that unrelated binding for this staging-only build; Full firmware
        # retains the normal package configuration and dependency resolution.
        make -C package/mtk/applications/datconf TOPDIR="$GITHUB_WORKSPACE" \
          CMAKE_OPTIONS="-DLUAPATH=/usr/lib/lua -DBUILD_LUA=OFF" \
          "$TARGET_STAGING/stamp/.datconf_installed" -j"$(nproc)" V=s
        test -s "$TARGET_STAGING/usr/include/libdatconf.h" || {
          echo "::error::Target datconf development header was not staged: $TARGET_STAGING/usr/include/libdatconf.h"
          exit 1
        }
        test -s "$TARGET_STAGING/usr/include/libkvcutil.h" || {
          echo "::error::Target kvcutil development header was not staged: $TARGET_STAGING/usr/include/libkvcutil.h"
          exit 1
        }
        test -s "$TARGET_STAGING/usr/lib/libdatconf.a" || {
          echo "::error::Target libdatconf archive was not staged."
          exit 1
        }
        test -e "$TARGET_STAGING/usr/lib/libkvcutil.so" || {
          echo "::error::Target libkvcutil shared library was not staged."
          exit 1
        }
        test -e "$TARGET_STAGING/usr/lib/libkvcutil.so.1" || {
          echo "::error::Target libkvcutil.so.1 ABI library was not staged."
          exit 1
        }
        echo "PASS: target datconf/kvcutil development headers and libraries staged."
        # libnl-tiny is the third declared PKG_BUILD_DEPENDS of easymesh-n60.
        # Stage its target headers and ABI library explicitly because the
        # package-local EasyMesh compile bypasses the global dependency scheduler.
        make -C package/libs/libnl-tiny TOPDIR="$GITHUB_WORKSPACE" \
          "$TARGET_STAGING/stamp/.libnl-tiny_installed" -j"$(nproc)" V=s
        test -d "$TARGET_STAGING/usr/include/libnl-tiny" || {
          echo "::error::Target libnl-tiny development include directory was not staged."
          exit 1
        }
        test -n "$(find "$TARGET_STAGING/usr/include/libnl-tiny" -type f -print -quit)" || {
          echo "::error::Target libnl-tiny development headers are empty."
          exit 1
        }
        test -e "$TARGET_STAGING/usr/lib/libnl-tiny.so.1" || {
          echo "::error::Target libnl-tiny ABI library was not staged."
          exit 1
        }
        test -e "$TARGET_STAGING/usr/lib/libnl-tiny.so" || {
          echo "::error::Target libnl-tiny linker interface libnl-tiny.so was not staged."
          exit 1
        }
        echo "PASS: target libnl-tiny development headers and ABI library staged."
        LIBGCC_SO="$(find staging_dir -type f -path '*/lib/libgcc_s.so.*' -print -quit)"
        test -n "$LIBGCC_SO" || { echo "::error::Target libgcc_s.so was not staged."; exit 1; }
        echo "PASS: target runtime staged: $LIBGCC_SO"
        # Quick consumes only the patched target kernel source tree and MTK
        # WAPP UAPI headers. It does not need kernel Kconfig, .config, modules
        # or mapfilter. kernel_oldconfig is an unnecessary interactive phase.
        make target/linux/prepare V=s
        KERNEL_BASE="build_dir/target-aarch64_cortex-a53_musl/linux-mediatek_filogic"
        KERNEL_DIR="$(find "$KERNEL_BASE" -mindepth 1 -maxdepth 1 -type d -name 'linux-*' -print -quit)"
        test -n "$KERNEL_DIR" || {
          echo "::error::Target Linux source directory was not prepared under $KERNEL_BASE."
          exit 1
        }
        test -s "$KERNEL_DIR/Makefile" || {
          echo "::error::Prepared target Linux source tree is incomplete: $KERNEL_DIR"
          exit 1
        }
        WAPP_UAPI_DIR="$KERNEL_DIR/include/uapi/linux/wapp"
        for header in wapp_cmm_type.h mt_wlan_cmm_oid.h; do
          test -s "$WAPP_UAPI_DIR/$header" || {
            echo "::error::Required MTK WAPP UAPI header missing: $WAPP_UAPI_DIR/$header"
            exit 1
          }
        done
        echo "PASS: patched target kernel source and MTK WAPP UAPI headers are ready: $KERNEL_DIR"
        grep -Fq 'config MAP_FILTER_SUPPORT' "$KERNEL_DIR/net/netfilter/Kconfig" || {
          echo "::error::Linux 6.12 MAP_FILTER_SUPPORT Kconfig integration is missing."
          exit 1
        }
        grep -Fq 'depends on NF_CONNTRACK' "$KERNEL_DIR/net/netfilter/Kconfig"
        grep -Fq 'depends on NF_NAT' "$KERNEL_DIR/net/netfilter/Kconfig"

        # Prepare the matching 7.6.7.3 driver source without compiling the kernel module.
        # This proves the pinned MT_WIFI source and its N60 WNM patch series still apply.
        make package/mtk/drivers/mt_wifi/clean V=s
        mkdir -p artifacts/easymesh-quick
        MT_WIFI_PREPARE_LOG="artifacts/easymesh-quick/mtwifi-prepare-quick.log"
        make package/mtk/drivers/mt_wifi/prepare V=s 2>&1 | tee "$MT_WIFI_PREPARE_LOG"
        for patch in 094-fix-wnm-fortify.patch 095-fix-wnm-fortify-rsp.patch 096-wnm-fix-send-btm-req-fortify.patch; do
          test -s "package/mtk/drivers/mt_wifi/patches-7673/$patch" || {
            echo "::error::Missing MT Wi-Fi 7.6.7.3 compatibility patch: $patch"; exit 1;
          }
          grep -Fq "$patch" "$MT_WIFI_PREPARE_LOG" || {
            echo "::error::MT Wi-Fi prepare log does not confirm application of $patch"; exit 1;
          }
        done
        if grep -Eq 'Hunk FAILED|Patch failed|patch failed' "$MT_WIFI_PREPARE_LOG"; then
          echo "::error::MT Wi-Fi 7.6.7.3 patch application failed."; exit 1
        fi
        MT_WIFI_SRC="build_dir/target-aarch64_cortex-a53_musl/linux-mediatek_filogic/mt_wifi"
        grep -Fq '#include <linux/random.h>' "$MT_WIFI_SRC/embedded/common/rt_os_util.c" || {
          echo "::error::MT Wi-Fi get_random_u32 patch is missing its Linux random API declaration."
          exit 1
        }
        grep -Fq 'return get_random_u32();' "$MT_WIFI_SRC/embedded/common/rt_os_util.c" || {
          echo "::error::MT Wi-Fi Linux 6.1 random API replacement was not applied."
          exit 1
        }
        echo "PASS: matching MT Wi-Fi 7.6.7.3 source prepared; all patch files applied; random API declaration verified; no driver compilation."

        # Persist the audited Quick dependency closure alongside the compiled
        # binaries. This is a report only; it does not expand Quick into kernel
        # module, APK or firmware packaging work.
        mkdir -p artifacts/easymesh-quick
        MATRIX="artifacts/easymesh-quick/PREPARE-DEPENDENCY-MATRIX.txt"
        {
          echo "Revision: $(git rev-parse HEAD)"
          echo "Scope: userspace EasyMesh source build; no kernel module/APK/ITB build"
          echo "Vendor stack compatibility lock:"
          grep -E '^(PKG_VERSION|PKG_SOURCE|PKG_HASH):=' package/mtk/applications/easymesh-n60/Makefile package/mtk/drivers/mt_wifi/Makefile
          echo "MT Wi-Fi selected Kconfig:"
          grep -qx 'CONFIG_MTK_MT_WIFI_DRIVER_VERSION_7673=y' .config
          grep '^PKG_BUILD_DEPENDS' package/mtk/applications/easymesh-n60/Makefile
          echo
          echo "Host tools:"
          for f in staging_dir/host/bin/sed staging_dir/host/bin/cmake; do
            test -x "$f" && printf "PASS %s\\n" "$f"
          done
          echo
          echo "Target OpenSSL development interface:"
          for f in usr/include/openssl/x509.h usr/lib/libssl.so usr/lib/libssl.so.3 usr/lib/libcrypto.so usr/lib/libcrypto.so.3; do
            test -e "$TARGET_STAGING/$f" && printf "PASS %s\\n" "$TARGET_STAGING/$f"
          done
          echo
          echo "Target datconf/kvcutil development interface:"
          for f in usr/include/libdatconf.h usr/include/libkvcutil.h usr/lib/libdatconf.a usr/lib/libkvcutil.so usr/lib/libkvcutil.so.1; do
            test -e "$TARGET_STAGING/$f" && printf "PASS %s\\n" "$TARGET_STAGING/$f"
          done
          echo
          echo "Target libnl-tiny development interface:"
          for f in usr/lib/libnl-tiny.so usr/lib/libnl-tiny.so.1; do
            test -e "$TARGET_STAGING/$f" && printf "PASS %s\\n" "$TARGET_STAGING/$f"
          done
          find "$TARGET_STAGING/usr/include/libnl-tiny" -type f -print | sort
          echo
          echo "Target runtime:"
          printf "PASS %s\\n" "$LIBGCC_SO"
          echo
          echo "MTK WAPP UAPI:"
          printf "Kernel source: %s\\n" "$KERNEL_DIR"
          for f in "$WAPP_UAPI_DIR/wapp_cmm_type.h" "$WAPP_UAPI_DIR/mt_wlan_cmm_oid.h"; do
            printf "PASS %s\\n" "$f"
          done
          echo
          echo "EasyMesh source archive checksums:"
          echo "All vendor archive SHA256 values were verified against package/mtk/vendor-sources.lock.json."
        } > "$MATRIX"
        cat "$MATRIX"

    - name: Compile EasyMesh package only
      shell: bash
      run: |
        set -Eeuo pipefail
        mkdir -p artifacts/easymesh-quick
        LOG="artifacts/easymesh-quick/easymesh-source-compile.log"
        # Build the package's source .built stamp directly. Even the package-local
        # "compile" goal enters APK generation and CheckDependencies; that is
        # Full-mode runtime packaging work and caused Run #53's libc.so/libgcc_s
        # package-metadata failure. Quick validates only the six source outputs.
        EASYMESH_BUILD_DIR="$GITHUB_WORKSPACE/build_dir/target-aarch64_cortex-a53_musl/easymesh-n60-7.6.7.3"
        make -C package/mtk/applications/easymesh-n60 TOPDIR="$GITHUB_WORKSPACE" \
          "$EASYMESH_BUILD_DIR/.built" -j"$(nproc)" V=s 2>&1 | tee "$LOG"
        test -s "$EASYMESH_BUILD_DIR/.built" || {
          echo "::error::EasyMesh source-build stamp was not produced."; exit 1;
        }
        if grep -Eq 'gen-dependencies\.sh|apk mkpkg|package/kernel/(gpio-button-hotplug|mapfilter)/compile' "$LOG"; then
          echo "::error::Quick entered APK dependency scanning or the global kernel-module scheduler."
          exit 1
        fi

        WAPP_BIN="$(find build_dir -type f -path '*/easymesh-n60*/wappd/wapp' -print -quit)"
        test -n "$WAPP_BIN" || { echo "::error::Source-built WAPP was not found."; exit 1; }
        SRC_DIR="$(dirname "$(dirname "$WAPP_BIN")")"
        MAPD_BIN="$SRC_DIR/mapd/mapd"
        P1905_BIN="$SRC_DIR/1905daemon/p1905_managerd"
        WAPPCTRL_BIN="$SRC_DIR/wappd/wappctrl"
        ETH_OPS_LIB="$SRC_DIR/1905daemon/ethernet/libeth_1905ops.so"
        MAPD_IF_LIB="$SRC_DIR/libmapd/libmapd_interface_client.so"

        ELF_AUDIT_DIR="$RUNNER_TEMP/n60-easymesh-elf-audit"
        STAGING_ROOT="$GITHUB_WORKSPACE/staging_dir"
        mkdir -p "$ELF_AUDIT_DIR"
        for f in "$WAPP_BIN" "$MAPD_BIN" "$P1905_BIN" "$WAPPCTRL_BIN" "$ETH_OPS_LIB" "$MAPD_IF_LIB"; do
          test -s "$f" || { echo "::error::Missing source-built output: $f"; exit 1; }
          readelf -h "$f" | grep -Fq 'AArch64' || { echo "::error::Not an AArch64 ELF: $f"; exit 1; }
          dynamic="$ELF_AUDIT_DIR/$(basename "$f").dynamic.txt"
          readelf -d "$f" > "$dynamic" || { echo "::error::Cannot read ELF dynamic section: $f"; exit 1; }
          grep -q 'Dynamic section' "$dynamic" || { echo "::error::ELF has no readable dynamic section: $f"; exit 1; }
          if grep -Eq 'Shared library: \[lib(ssl|crypto)[.]so[.]1[.]1\]' "$dynamic"; then
            echo "::error::Obsolete OpenSSL 1.1 dependency detected in $f."
            exit 1
          fi
          while IFS= read -r needed; do
            test -n "$needed" || continue
            if ! find "$STAGING_ROOT" "$SRC_DIR" -name "$needed" -print -quit | grep -q .; then
              echo "::error::Unresolved direct ELF dependency in $f: $needed"
              exit 1
            fi
          done < <(sed -n 's/.*Shared library: \[\([^]]*\)\].*/\1/p' "$dynamic")
          {
            echo "===== ELF dynamic dependencies: $f ====="
            grep -E '\(NEEDED\)|\(SONAME\)|\(RPATH\)|\(RUNPATH\)' "$dynamic" || true
          } >> "$ELF_AUDIT_DIR/ALL-ELF-DEPENDENCIES.txt"
        done
        grep -Fq 'libkvcutil.so.1' "$ELF_AUDIT_DIR/wapp.dynamic.txt"
        grep -Fq 'libssl.so.3' "$ELF_AUDIT_DIR/wapp.dynamic.txt"
        grep -Fq 'libcrypto.so.3' "$ELF_AUDIT_DIR/wapp.dynamic.txt"
        grep -Fq 'libnl-tiny.so.1' "$ELF_AUDIT_DIR/p1905_managerd.dynamic.txt"
        grep -Fq 'libeth_1905ops.so' "$ELF_AUDIT_DIR/p1905_managerd.dynamic.txt"
        grep -Fq 'libssl.so.3' "$ELF_AUDIT_DIR/p1905_managerd.dynamic.txt"
        grep -Fq 'libcrypto.so.3' "$ELF_AUDIT_DIR/p1905_managerd.dynamic.txt"
        for symbol in wapp_read_wts_map_config /etc/map/wts_bss_info_config wapp_socket_and_ctrl_inf_init driver_rrm_onoff driver_wnm_btm_onoff wapp_send_btm_req_11kv_api; do
          strings -a "$WAPP_BIN" | grep -Fq "$symbol" || { echo "::error::WAPP missing required WTS/11k/11v path: $symbol"; exit 1; }
        done
        for symbol in STEER_FSM topo_srv_handle_topology_event steer_fsm_trigger parse_client_steering_btm_report_message; do
          strings -a "$MAPD_BIN" | grep -Fq "$symbol" || { echo "::error::MAPD missing steering/topology path: $symbol"; exit 1; }
        done
        for symbol in "read wts_bss_info_config to ctx->bss_config" "send topology discovery data" "Topology Discovery"; do
          strings -a "$P1905_BIN" | grep -Fq "$symbol" || { echo "::error::P1905 missing WTS/topology path: $symbol"; exit 1; }
        done

        cp "$WAPP_BIN" "$MAPD_BIN" "$P1905_BIN" "$WAPPCTRL_BIN" "$ETH_OPS_LIB" "$MAPD_IF_LIB" artifacts/easymesh-quick/
        cp "$ELF_AUDIT_DIR/ALL-ELF-DEPENDENCIES.txt" artifacts/easymesh-quick/
        {
          echo "Build revision: $(git rev-parse HEAD)"
          echo "Build scope: source .built only; APK packaging and runtime dependency scanning are deferred to Full."
          echo "Source build directory: $SRC_DIR"
          for binary in "$WAPP_BIN" "$MAPD_BIN" "$P1905_BIN" "$WAPPCTRL_BIN" "$ETH_OPS_LIB" "$MAPD_IF_LIB"; do
            echo "===== Dynamic dependencies: $binary ====="
            readelf -d "$binary" | grep -E 'NEEDED|SONAME|RPATH|RUNPATH' || true
          done
          echo "===== Source-built EasyMesh binary checksums ====="
          sha256sum "$WAPP_BIN" "$MAPD_BIN" "$P1905_BIN" "$WAPPCTRL_BIN" "$ETH_OPS_LIB" "$MAPD_IF_LIB"
        } > artifacts/easymesh-quick/QUICK-BUILD-INFO.txt
        echo "PASS: WAPP, MAPD, P1905, wappctrl and both shared libraries source-built and audited; no APK packaging was run."

    - name: Audit auxiliary bndstrg_plus and fwdd AArch64 sources
      shell: bash
      run: |
        set -Eeuo pipefail
        bash package/mtk/applications/easymesh-n60/scripts/n60-auxiliary-source-audit.sh

    - name: Upload EasyMesh Quick Build artifacts
      uses: actions/upload-artifact@v6
      with:
        name: n60pro-easymesh-quick-${{ github.run_number }}
        path: artifacts/easymesh-quick/
        if-no-files-found: error
        retention-days: 14
