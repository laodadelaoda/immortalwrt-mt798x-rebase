    - name: Audit WAPP DPP source, API contract and credential parsing before toolchain build
      shell: bash
      run: |
        set -euo pipefail
        ARCHIVE="dl/$(python3 - "$GITHUB_WORKSPACE" <<'PY'
        import json, pathlib, sys
        lock=json.loads((pathlib.Path(sys.argv[1])/"package/mtk/vendor-sources.lock.json").read_text())
        print(next(x["archive"] for x in lock["sources"] if x["id"]=="wappd"))
        PY
        )"
        AUDIT_DIR="$RUNNER_TEMP/n60-wapp-dpp-audit"
        REPORT="artifacts/easymesh-quick/DPP-SOURCE-API-AUDIT.txt"
        test -s "$ARCHIVE" || {
          echo "::error::Pinned WAPP source archive is missing; DPP audit cannot run."
          exit 1
        }
        python3 package/mtk/applications/easymesh-n60/scripts/n60-vendor-lock.py download --repo "$GITHUB_WORKSPACE" --dl-dir dl --ids wappd
        rm -rf "$AUDIT_DIR"
        mkdir -p "$AUDIT_DIR" artifacts/easymesh-quick
        tar -xjf "$ARCHIVE" -C "$AUDIT_DIR"
        WAPP_SRC="$AUDIT_DIR/wappd"
        test -d "$WAPP_SRC/dpp" || {
          echo "::error::Pinned WAPP archive has no wappd/dpp source directory."
          exit 1
        }
        python3 - "$WAPP_SRC" "$REPORT" <<'PY'
        import pathlib, re, sys
        root = pathlib.Path(sys.argv[1])
        report = pathlib.Path(sys.argv[2])
        symbol = "dpp_read_config_file_for_connection"
        files = sorted(p for p in root.rglob("*") if p.is_file() and p.suffix.lower() in {".c", ".h", ".cc", ".cpp"})
        hits = []
        for path in files:
            try:
                text = path.read_text(encoding="utf-8", errors="replace")
            except OSError as exc:
                raise SystemExit(f"ERROR: cannot read DPP source file {path}: {exc}") from exc
            for n, line in enumerate(text.splitlines(), 1):
                if symbol in line:
                    hits.append((path, n, line.strip()))
        if not hits:
            raise SystemExit("ERROR: expected DPP API symbol is absent from the pinned WAPP source; refusing to treat an empty grep as a passing audit.")
        definitions = []
        for path in files:
            text = path.read_text(encoding="utf-8", errors="replace")
            # A definition must have a parameter list followed by a body; a
            # prototype ending in ';' is not counted as a definition.
            pattern = re.compile(r"(?m)^[^;{}\n]*\b" + re.escape(symbol) + r"\s*\([^;{}]*\)\s*\{")
            for match in pattern.finditer(text):
                brace = text.find("{", match.start())
                depth, end = 0, None
                for i in range(brace, len(text)):
                    if text[i] == "{": depth += 1
                    elif text[i] == "}":
                        depth -= 1
                        if depth == 0:
                            end = i + 1
                            break
                if end is None:
                    raise SystemExit(f"ERROR: unterminated function body: {path}")
                definitions.append((path, text.count("\n", 0, match.start()) + 1, text[match.start():end]))
        if len(definitions) != 1:
            raise SystemExit(f"ERROR: expected exactly one function definition for {symbol}; found {len(definitions)}")
        path, start_line, body = definitions[0]
        lines = body.splitlines()
        # Confirm the pinned vendor source still has the known set-only variable
        # pattern: its only reads belong to a #if 0 legacy block. Build/Prepare
        # applies the exact minimal transformation before compilation.
        active_body = re.sub(r"(?ms)^\s*#if\s+0\b.*?^\s*#endif\s*$", "", body)
        if not re.search(r"(?m)^\s*cred_len\s*=\s*sizeof\(\*cred\)\s*\+\s*cred->payload_len\s*;", active_body):
            raise SystemExit("ERROR: pinned DPP cred_len assignment changed; review the source repair instead of applying a stale transformation.")
        if not re.search(r"(?m)^\s*hex_dump\(DPP_MAP_PREX.*cred_len", body):
            raise SystemExit("ERROR: expected legacy DPP credential-length consumer is missing; review source drift.")
        # Report the full function body and all credential-length references.
        cred = []
        for p in files:
            txt = p.read_text(encoding="utf-8", errors="replace")
            for n, line in enumerate(txt.splitlines(), 1):
                if re.search(r"cred_len|credential.{0,24}length|length.{0,24}credential", line, re.I):
                    cred.append((p.relative_to(root), n, line.strip()))
        out = []
        out += ["DPP SOURCE/API AUDIT", f"Source root: {root}", f"Function: {symbol}",
                f"Definition: {path.relative_to(root)}:{start_line}", "",
                "== All API references =="]
        out += [f"{p.relative_to(root)}:{n}: {line}" for p,n,line in hits]
        out += ["", "== Complete function body =="]
        out += [f"{start_line+i}: {line}" for i,line in enumerate(lines)]
        out += ["", "== Credential-length data flow references =="]
        out += [f"{p}:{n}: {line}" for p,n,line in cred] or ["No credential-length identifiers found."]
        out += ["", "== Review scope ==",
                "The source audit verifies symbol presence, a unique implementation, declaration/call locations and credential-length references.",
                "The audit identified cred_len as set-only in active code: its consumers are confined to a #if 0 legacy block. Build/Prepare moves the declaration into that disabled block and removes the orphan active assignment.",
                "The fix preserves active DPP behavior and does not suppress -Werror; the subsequent target build verifies the repaired source.",
                "Runtime file/path/permission and peer-connection behavior require runtime tests."]
        report.write_text("\n".join(out) + "\n", encoding="utf-8")
        print(report.read_text(encoding="utf-8"))
        print("PASS: DPP source/API audit completed before target toolchain build.")
        PY
    - name: Download exact fully patched DPP source from vendor audit
      uses: actions/download-artifact@v4
      with:
        name: dpp-security-audit-source
        path: ${{ runner.temp }}/n60-dpp-security-audit
    - name: Audit DPP caller, compile gates, configuration API and repaired credential parser
      shell: bash
      run: |
        set -euo pipefail
        AUDIT_ROOT="$RUNNER_TEMP/n60-dpp-security-audit"
        WAPP_SRC="$AUDIT_ROOT/wappd"
        DPP_CONTRACT_TEST="package/mtk/applications/easymesh-n60/tests/test-dpp-source-contract.py"
        test -s "$AUDIT_ROOT/SOURCE-MANIFEST.txt"
        test -d "$AUDIT_ROOT/patched"
        grep -Fq "Repository revision: $GITHUB_SHA" "$AUDIT_ROOT/SOURCE-MANIFEST.txt"
        grep -Fq "DPP patch series: 017-dpp-credential-bounds-zeroization-and-log-redaction.patch -> 018-dpp-security-logging-and-credential-lifecycle.patch" "$AUDIT_ROOT/SOURCE-MANIFEST.txt"
        test ! -e "$WAPP_SRC"
        ln -s "$AUDIT_ROOT/patched" "$WAPP_SRC"
        test -s "$WAPP_SRC/common/main.c"
        test -s "$WAPP_SRC/dpp/dpp.c"
        test -s "$WAPP_SRC/dpp/dpp_wdev.c"
        test -s "$WAPP_SRC/hotspot/hotspot.c"
        python3 - "$WAPP_SRC/dpp/dpp.h" <<'PY'
        import pathlib, sys
        source = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
        old = "EC_KEY * EVP_PKEY_get0_EC_KEY(EVP_PKEY *pkey);"
        if old in source:
            raise SystemExit("ERROR: local EVP_PKEY_get0_EC_KEY prototype remains; OpenSSL 3 native declaration must be used.")
        print("PASS: local legacy EVP_PKEY_get0_EC_KEY prototype is absent from the fully patched DPP source.")
        PY
        python3 "$DPP_CONTRACT_TEST" "$AUDIT_ROOT"
        python3 - "$WAPP_SRC/hotspot/hotspot.c" <<'PY'
        import pathlib, sys
        source = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
        expected = [
            "os_memset((u8 *)vname_duple_new + size, 0, more_size);",
            "os_memset((u8 *)realm_data_new + size, 0, more_size);",
            "os_memset((u8 *)authparam_new + size, 0, more_size);",
            "os_memset((u8 *)op_name_duple_new + size, 0, more_size);",
        ]
        for line in expected:
            if source.count(line) != 1:
                raise SystemExit("ERROR: expected exactly one repaired WAPP hotspot allocation write: " + line)
        forbidden = ["os_memset(vname_duple_new + size", "os_memset(realm_data_new + size", "os_memset(authparam_new + size", "os_memset(op_name_duple + size"]
        if any(token in source for token in forbidden):
            raise SystemExit("ERROR: unsafe typed-pointer arithmetic or stale pre-realloc pointer remains in hotspot parser.")
        print("PASS: all four WAPP hotspot realloc writes use byte offsets and the post-realloc pointer.")
        PY
        python3 - "$WAPP_SRC/include/map_1905.h" <<'PY'
        import pathlib, sys
        b = pathlib.Path(sys.argv[1]).read_bytes()
        pairs = [
            (b"struct GNU_PACKED air_monitor_query_rsp{", b"struct air_monitor_query_rsp{"),
            (b"struct GNU_PACKED bh_assoc_ctrl {", b"struct bh_assoc_ctrl {"),
        ]
        for packed, normalized in pairs:
            assert b.count(packed) == 0, "Build/Prepare packed-structure normalization is missing: " + packed.decode()
            assert b.count(normalized) == 1, "expected exactly one normalized in-memory list structure: " + normalized.decode()
        print("PASS: both in-memory list structures are already normalized in the audited source snapshot.")
        PY
        # The canonical test-dpp-source-contract.py above owns the DPP
        # semantic contract. Avoid duplicating stale checks here: the parser's
        # credential pack/send path was deliberately removed from main.c;
        # credential ownership belongs to wapp_dpp_process_config().
        python3 - "$WAPP_SRC/common/main.c" <<'PY'
        import pathlib, sys
        source = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
        symbol = "int dpp_read_config_file_for_connection("
        start = source.find(symbol)
        if start < 0:
            raise SystemExit("ERROR: DPP connection-config parser is missing.")
        end = source.find("\\n}", start)
        if end < 0:
            raise SystemExit("ERROR: DPP connection-config parser has no closing brace.")
        body = source[start:end + 2]
        for dead in (
            "struct dpp_authentication auth;",
            '"_1905netAccessKey"',
            '"_1905cSignKey"',
            "wapp_dpp_save_dpp_cred(&auth)",
        ):
            if dead in body:
                raise SystemExit("ERROR: removed duplicate DPP credential path reappeared: " + dead)
        if "if (!wapp)" not in body or "dev_list = &wapp->dev_list" not in body:
            raise SystemExit("ERROR: DPP parser no longer validates WAPP before accessing its device list.")
        if "wdev_config_error:" not in body or "goto wdev_config_error;" not in body:
            raise SystemExit("ERROR: DPP per-interface allocation rollback path is missing.")
        print("PASS: DPP parser follows the single credential-ownership path; NULL guard and allocation rollback remain.")
        PY
