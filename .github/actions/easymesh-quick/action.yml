name: N60 Pro EasyMesh compatibility and source-build gate
description: Validate Linux 6.12, ImmortalWrt 25.12, OpenSSL 3.x and build the N60 EasyMesh userspace stack. Full firmware must depend on this gate.
inputs:
  device:
    description: Target router profile
    required: false
    default: netcore_n60-pro
runs:
  using: composite
  steps:
    - name: Pin Node.js 24
      uses: actions/setup-node@v5
      with:
        node-version: 24

    - name: Initialize Quick environment
      shell: bash
      env:
        QUICK_DEVICE: ${{ inputs.device }}
      run: |
        echo "DEVICE=$QUICK_DEVICE" >> "$GITHUB_ENV"
        echo "PROFILE=standard" >> "$GITHUB_ENV"
    - name: Static preflight - EasyMesh runtime configuration and dependency declarations
      shell: bash
      run: |
        set -euo pipefail
        # Compatibility Gate 0: reject known-incompatible platform baselines
        # before feeds, host tools, target toolchain or source preparation.
        grep -Fqx 'KERNEL_PATCHVER:=6.12' target/linux/mediatek/Makefile || {
          echo "::error::N60 EasyMesh audit requires Linux 6.12 target kernel."; exit 1;
        }
        grep -Fq '25.12-SNAPSHOT' include/version.mk || {
          echo "::error::ImmortalWrt 25.12-SNAPSHOT version baseline is missing."; exit 1;
        }
        OPENSSL_VERSION="$(sed -n 's/^PKG_VERSION:=//p' package/libs/openssl/Makefile | head -n1)"
        case "$OPENSSL_VERSION" in
          3.*) echo "OpenSSL source baseline: $OPENSSL_VERSION (ABI major 3)" ;;
          *) echo "::error::Expected OpenSSL 3.x, found '$OPENSSL_VERSION'."; exit 1 ;;
        esac
        test "$(grep -c '^PKG_VERSION:=' package/libs/openssl/Makefile)" -eq 1 || {
          echo "::error::OpenSSL package version declaration is ambiguous."; exit 1;
        }
        grep -Fq 'PKG_BUILD_DEPENDS:=datconf openssl libnl-tiny' package/mtk/applications/easymesh-n60/Makefile || {
          echo "::error::EasyMesh build dependency closure changed."; exit 1;
        }
        for patch in \
          022-since-v5.18-drop-deprecated-mm_segment_t-usages.patch \
          026-since-v6.1-replace-deprecated-prandom_u32-usage.patch \
          034-since-v6.12-fix-unaligned_h-not-found-error.patch \
          035-since-v6.8-change-strlcpy-to-strscpy.patch; do
          PATCH_PATH="package/mtk/drivers/mt_wifi/patches-7673/$patch"
          test -s "$PATCH_PATH" || {
            echo "::error::Required Linux 6.12 driver compatibility patch missing: $patch"; exit 1;
          }
          git apply --numstat "$PATCH_PATH" >/dev/null || {
            echo "::error::Malformed Linux 6.12 driver compatibility patch: $patch"; exit 1;
          }
        done
        echo "PASS: platform baseline Linux 6.12 / ImmortalWrt 25.12 / OpenSSL $OPENSSL_VERSION; required driver compatibility patches present."
        ROOT="package/mtk/applications/easymesh-n60/files"
        BIN="$ROOT/usr/bin"
        for f in wapp mapd p1905_managerd wappctrl wapp-n60-wrapper; do
          test -s "$BIN/$f" || { echo "::error::Missing EasyMesh input/audit reference: $f"; exit 1; }
        done
        for f in libcrypto.so.1.1 libssl.so.1.1 libeth_1905ops.so libmapd_interface_client.so; do
          test -s "$ROOT/usr/lib/$f" || { echo "::error::Missing EasyMesh library audit reference: $f"; exit 1; }
        done
        for f in mapd_cfg mapd_user.cfg 1905d.cfg wts_bss_info_config; do
          test -s "$ROOT/etc/map/$f" || { echo "::error::Missing MAP config: $f"; exit 1; }
        done
        sh "package/mtk/applications/easymesh-n60/tests/test-vendor-wts-defaults.sh"
        sh "$ROOT/usr/sbin/easymesh-n60-validate-wts" "$ROOT/etc/map/wts_bss_info_config"
        for f in "$ROOT/etc/init.d/easymesh" "$ROOT/etc/uci-defaults/1001-easymesh-n60" "$BIN/wapp-n60-wrapper"; do
          sh -n "$f"
        done
        grep -qx 'DeviceRole=1' "$ROOT/etc/map/mapd_cfg"
        grep -qx 'DhcpCtl=0' "$ROOT/etc/map/mapd_cfg"
        if grep -Eiq '6G|6GHz' "$ROOT/etc/map/mapd_cfg" "$ROOT/etc/map/1905d.cfg" "$ROOT/etc/map/wts_bss_info_config"; then
          echo "::error::N60 Pro is dual-band only; 6GHz configuration must not be installed."
          exit 1
        fi
        grep -qx 'map_root=1' "$ROOT/etc/map/1905d.cfg"
        grep -qx 'map_agent=0' "$ROOT/etc/map/1905d.cfg"
        grep -qx 'bh_type=eth' "$ROOT/etc/map/1905d.cfg"
        grep -qx 'radio_band=24G;5GL;5GH;' "$ROOT/etc/map/1905d.cfg"
        grep -qx 'al_inf=rax0' "$ROOT/etc/map/1905d.cfg"
        grep -qx 'bss_config_priority=ra0;rax0' "$ROOT/etc/map/mapd_cfg"
        grep -qx 'bss_config_priority=ra0;rax0;apclix0' "$ROOT/etc/map/1905d.cfg"
        ! grep -Eq '^map_(controller|agent)_alid=' "$ROOT/etc/map/1905d.cfg"
        DPP_PATCH="package/mtk/applications/easymesh-n60/patches/002-dpp-parser-safety.patch"
        OPENSSL3_DPP_PATCH="package/mtk/applications/easymesh-n60/patches/007-openssl3-use-native-evp-pkey-get0-ec-key.patch"
        test -s "$OPENSSL3_DPP_PATCH" || { echo "::error::OpenSSL 3 DPP accessor compatibility patch is missing."; exit 1; }
        DPP_BOUNDARY_PATCH="package/mtk/applications/easymesh-n60/patches/008-dpp-parser-bounds-and-secret-redaction.patch"
        test -s "$DPP_BOUNDARY_PATCH" || { echo "::error::DPP parser boundary and secret-redaction patch is missing."; exit 1; }
        git apply --numstat "$DPP_BOUNDARY_PATCH" >/dev/null || { echo "::error::DPP parser boundary patch has invalid unified-diff syntax."; exit 1; }
        DPP_NULL_PATCH="package/mtk/applications/easymesh-n60/patches/009-dpp-null-guard-and-unused-cred-length.patch"
        test -s "$DPP_NULL_PATCH" || { echo "::error::DPP null-guard/unused-length patch is missing."; exit 1; }
        git apply --numstat "$DPP_NULL_PATCH" >/dev/null || { echo "::error::DPP null-guard patch has invalid unified-diff syntax."; exit 1; }
        DPP_ALLOC_PATCH="package/mtk/applications/easymesh-n60/patches/010-dpp-wdev-config-allocation-rollback.patch"
        test -s "$DPP_ALLOC_PATCH" || { echo "::error::DPP per-interface allocation rollback patch is missing."; exit 1; }
        git apply --numstat "$DPP_ALLOC_PATCH" >/dev/null || { echo "::error::DPP allocation rollback patch has invalid unified-diff syntax."; exit 1; }
        WTS_SECURITY_PATCH="package/mtk/applications/easymesh-n60/patches/011-wapp-wts-security.patch"
        test -s "$WTS_SECURITY_PATCH" || { echo "::error::Vendor WTS parser security patch is missing."; exit 1; }
        python3 package/mtk/applications/easymesh-n60/scripts/n60-vendor-source-transforms.py verify-lock "$GITHUB_WORKSPACE"
        grep -Fq 'apply_patch_strict()' package/mtk/applications/easymesh-n60/Makefile
        grep -Fq 'patch --dry-run --batch --forward --fuzz=0' package/mtk/applications/easymesh-n60/Makefile || {
          echo "::error::Vendor patches are not preflighted with zero fuzz before application."; exit 1;
        }
        grep -Fq 'patch --batch --forward --fuzz=0' package/mtk/applications/easymesh-n60/Makefile || {
          echo "::error::Vendor patches are not applied strictly with zero fuzz."; exit 1;
        }
        grep -Fq 'apply_patch_strict()' package/mtk/applications/easymesh-n60/Makefile || {
          echo "::error::WTS patch cannot use the strict patch helper."; exit 1;
        }
        ! grep -Fq 'n60-wts-hardening.py' package/mtk/applications/easymesh-n60/Makefile || {
          echo "::error::Legacy Python WTS source rewriter remains in the build path."; exit 1;
        }
        test ! -e package/mtk/applications/easymesh-n60/scripts/n60-wts-hardening.py || {
          echo "::error::Legacy Python WTS source rewriter was not removed."; exit 1;
        }
        git apply --numstat "$WTS_SECURITY_PATCH" >/dev/null || {
          echo "::error::WTS security patch has invalid unified-diff syntax."; exit 1;
        }
        grep -Fq 'os_strlen(pos1) >= sizeof(key)' "$WTS_SECURITY_PATCH"
        grep -Fq 'key is configured' "$WTS_SECURITY_PATCH"
        STATIC_CONTRACT_TEST="package/mtk/applications/easymesh-n60/tests/test-easymesh-static-contract.py"
        test -s "$STATIC_CONTRACT_TEST" || { echo "::error::OpenSSL/MAC/startup static-contract test is missing."; exit 1; }
        grep -Fq '# WTS security contract:' "$STATIC_CONTRACT_TEST" || {
          echo "::error::WTS source-boundary, error-path and secret-redaction contracts are missing."; exit 1;
        }
        grep -Fq 'python3 ./tests/test-easymesh-static-contract.py $(PKG_BUILD_DIR) $(TOPDIR)' package/mtk/applications/easymesh-n60/Makefile || {
          echo "::error::OpenSSL/MAC/startup static-contract test is not wired into Build/Prepare."; exit 1;
        }
        VENDOR_INVENTORY_TEST="package/mtk/applications/easymesh-n60/tests/test-vendor-artifact-inventory.py"
        test -s "$VENDOR_INVENTORY_TEST" || { echo "::error::Vendor artifact inventory test is missing."; exit 1; }
        grep -Fq 'python3 ./tests/test-vendor-artifact-inventory.py $(PKG_BUILD_DIR) $(TOPDIR)' package/mtk/applications/easymesh-n60/Makefile || {
          echo "::error::Vendor artifact inventory test is not wired into Build/Prepare."; exit 1;
        }
        grep -Fq 'grep -Fq "@1905_daemon" /proc/net/unix' package/mtk/applications/easymesh-n60/files/etc/init.d/easymesh || {
          echo "::error::MAPD startup does not wait for the P1905 abstract control socket."; exit 1;
        }
        DPP_CONTRACT_TEST="package/mtk/applications/easymesh-n60/tests/test-dpp-source-contract.py"
        test -s "$DPP_CONTRACT_TEST" || { echo "::error::DPP semantic source-contract test is missing."; exit 1; }
        grep -Fq 'python3 ./tests/test-dpp-source-contract.py $(PKG_BUILD_DIR)' package/mtk/applications/easymesh-n60/Makefile || { echo "::error::DPP source-contract test is not wired into Build/Prepare."; exit 1; }
        git apply --numstat "$OPENSSL3_DPP_PATCH" >/dev/null || { echo "::error::OpenSSL 3 DPP accessor patch has invalid unified-diff syntax."; exit 1; }
        test -s "$DPP_PATCH" || { echo "::error::DPP parser safety patch is missing."; exit 1; }
        test -s package/mtk/applications/easymesh-n60/patches/004-libmapd-target-flags.patch
        HOTSPOT_PATCH="package/mtk/applications/easymesh-n60/patches/005-wapp-hotspot-realloc-pointer-arithmetic.patch"
        test -s "$HOTSPOT_PATCH" || { echo "::error::WAPP hotspot realloc pointer fix is missing."; exit 1; }
        LIBBRIDGE_PATCH="package/mtk/applications/easymesh-n60/patches/006-p1905-libbridge-tool-propagation.patch"
        test -s "$LIBBRIDGE_PATCH" || { echo "::error::P1905 recursive libbridge toolchain propagation patch is missing."; exit 1; }
        TRANSFORM_HELPER="package/mtk/applications/easymesh-n60/scripts/n60-vendor-source-transforms.py"
        test -s "$TRANSFORM_HELPER" || {
          echo "::error::Shared EasyMesh non-patch source transformation helper is missing."; exit 1;
        }
        grep -Fq 'n60-vendor-source-transforms.py normalize "$(PKG_BUILD_DIR)"' package/mtk/applications/easymesh-n60/Makefile || {
          echo "::error::Build/Prepare does not call the shared CRLF normalization phase before dependent patches."; exit 1;
        }
        grep -Fq 'n60-vendor-source-transforms.py finalize "$(PKG_BUILD_DIR)"' package/mtk/applications/easymesh-n60/Makefile || {
          echo "::error::Build/Prepare does not call the shared final source/config transformation phase."; exit 1;
        }
        git apply --numstat "$LIBBRIDGE_PATCH" >/dev/null || {
          echo "::error::P1905 libbridge tool propagation patch has invalid unified-diff syntax."; exit 1;
        }
        grep -Fq 'if grep -Eq' package/mtk/applications/easymesh-n60/Makefile || {
          echo "::error::EasyMesh compiler logs are not checked for diagnostics hidden by inherited make flags."; exit 1;
        }
        grep -Fq 'P1905_COMPILE_LOG=' package/mtk/applications/easymesh-n60/Makefile
        grep -Fq 'MAPD_COMPILE_LOG=' package/mtk/applications/easymesh-n60/Makefile
        grep -Fq 'LDFLAGS="$(TARGET_LDFLAGS)"' package/mtk/applications/easymesh-n60/Makefile || {
          echo "::error::libmapd must receive target link flags."; exit 1;
        }
        grep -Fq 'AR="$(TARGET_AR)" RANLIB="$(TARGET_RANLIB)"' package/mtk/applications/easymesh-n60/Makefile || {
          echo "::error::P1905 DSA bridge archive must use the target AR/RANLIB tools."; exit 1;
        }
        grep -Fq 'rm -rf $(PKG_BUILD_DIR)' package/mtk/applications/easymesh-n60/Makefile || {
          echo "::error::EasyMesh Build/Prepare must remove restored stale source/object trees."; exit 1;
        }
        ! grep -Fq 'V=s all 2>&1 | tee' package/mtk/applications/easymesh-n60/Makefile || {
          echo "::error::WAPP build still uses a failure-masking tee pipeline."; exit 1;
        }
        PKG_MAKEFILE="package/mtk/applications/easymesh-n60/Makefile"
        DRIVER_MAKEFILE="package/mtk/drivers/mt_wifi/Makefile"
        DRIVER_CONFIG="package/mtk/drivers/mt_wifi/config.in"
        grep -Fqx 'PKG_VERSION:=7.6.7.3' "$DRIVER_MAKEFILE"
        grep -Fq 'config MTK_MT_WIFI_DRIVER_VERSION_7673' "$DRIVER_CONFIG"
        grep -Fqx 'PKG_VERSION:=7.6.7.3' "$PKG_MAKEFILE"
        grep -Fqx 'PKG_BUILD_DEPENDS:=datconf openssl libnl-tiny' "$PKG_MAKEFILE" || {
          echo "::error::EasyMesh build dependency declaration changed; update the Quick staging matrix."
          exit 1
        }
        grep -Fqx '  DEPENDS:=+kmod-mapfilter +libnl-tiny +libkvcutil +libopenssl' "$PKG_MAKEFILE" || {
          echo "::error::EasyMesh runtime dependency declaration changed; update Full package verification."
          exit 1
        }
        grep -Fq -- '-ldatconf -lkvcutil -lssl -lcrypto' "$PKG_MAKEFILE" || {
          echo "::error::WAPP datconf/kvcutil/OpenSSL link dependencies are missing."
          exit 1
        }
        grep -Fq -- '-lnl-tiny -lssl -lcrypto' "$PKG_MAKEFILE" || {
          echo "::error::P1905 libnl-tiny/OpenSSL link dependencies are missing."
          exit 1
        }
        test -s "$ROOT/etc/ethernet_cfg.txt" || {
          echo "::error::Missing N60 Pro DSA ethernet_cfg.txt."
          exit 1
        }
        grep -qx 'lan=lan1 lan2 lan3 lan4' "$ROOT/etc/ethernet_cfg.txt"
        grep -qx 'br_lan=br-lan' "$ROOT/etc/ethernet_cfg.txt"
        grep -qx 'ext_phy_port=5 6' "$ROOT/etc/ethernet_cfg.txt"
        test "$(grep -c 'CONFIG_MAP_R2_SUPPORT=y' "$PKG_MAKEFILE")" -eq 3 || {
          echo "::error::MAP R2 base macro must be passed to WAPP, MAPD and P1905."
          exit 1
        }
        test "$(grep -c 'CONFIG_MAP_R3_SUPPORT=y' "$PKG_MAKEFILE")" -eq 3 || {
          echo "::error::MAP R3 macro must be passed to WAPP, MAPD and P1905."
          exit 1
        }
        grep -q 'UAPD_INCLUDE_PATH=' "$PKG_MAKEFILE" || {
          echo "::error::WAPP UAPI include path is not explicit."
          exit 1
        }
        grep -Fq '$(INSTALL_DATA) ./files/etc/ethernet_cfg.txt' "$PKG_MAKEFILE" || {
          echo "::error::P1905 DSA runtime config is not installed."
          exit 1
        }
        # Build/Prepare is expanded through nested OpenWrt/GNU Make macros.
        # Require four dollars for shell variables, then verify the emitted recipe.
        python3 - <<'PY'
        import pathlib, re
        path = pathlib.Path("package/mtk/applications/easymesh-n60/Makefile")
        source = path.read_text(encoding="utf-8")
        prepare = source.split("define Build/Prepare", 1)[1].split("endef", 1)[0]
        # Reject literal backslash-t prefixes: they are not recipe indentation and can turn a patch command into an invalid shell command.
        malformed = [f"{i}: {line}" for i, line in enumerate(source.splitlines(), 1) if line.startswith(r"\t")]
        if malformed:
            raise SystemExit("ERROR: literal \\t found at start of Makefile line(s): " + "; ".join(malformed))
        shell_vars = re.findall(r"(?<!\$)(?:\${1,4})([A-Za-z_][A-Za-z0-9_]*)", prepare)
        bad = sorted(set(re.findall(r"(?<!\$)\$(?!\$)[A-Za-z_][A-Za-z0-9_]*", prepare)))
        if bad:
            raise SystemExit("ERROR: unescaped shell variable(s) in Build/Prepare: " + ", ".join(bad))
        for name in ("DRIVER_MAKEFILE",):
            if prepare.count("$$" + name) != 1:
                raise SystemExit("ERROR: " + name + " must use four-dollar escaping at its single remaining package-version reference; archive/hash pins belong to vendor-sources.lock.json")
        # Exercise GNU Make's two-stage dollar reduction contract explicitly.
        for name in ("DRIVER_MAKEFILE",):
            value = "$$$$" + name
            stage1 = value.replace("$$$$", "$$")
            stage2 = stage1.replace("$$", "$")
            if stage2 != "$" + name:
                raise SystemExit("ERROR: nested Make expansion simulation failed for " + name)
        print("PASS: Build/Prepare shell-variable escaping matches nested Make expansion.")
        PY
        DSA_PATCH="package/mtk/applications/easymesh-n60/patches/001-dsa-use-linux-mii-ioctl.patch"
        P1905_TOOL_PATCH="package/mtk/applications/easymesh-n60/patches/006-p1905-libbridge-tool-propagation.patch"
        test -s "$P1905_TOOL_PATCH"
        git apply --numstat "$P1905_TOOL_PATCH" >/dev/null || { echo "::error::P1905 recursive DSA tool/link propagation patch has invalid unified-diff syntax."; exit 1; }
        test -s "$DSA_PATCH"
        grep -q 'SIOCGMIIREG' "$DSA_PATCH"
        git apply --numstat "$DSA_PATCH" >/dev/null || { echo "::error::EasyMesh DSA patch has invalid unified-diff syntax."; exit 1; }
        echo "PASS: WAPP/MAPD/P1905/WTS/DSA configuration, R2/R3 macros and Linux 6.12 MII patch."

    - name: Free disk space
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
          "$AGENT_TOOLSDIRECTORY" || true
        df -h

    - name: Install build dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-dev rsync unzip zlib1g-dev file wget time xsltproc \
          libelf-dev device-tree-compiler qemu-utils python3-setuptools \
          python3-pyelftools swig ccache

    - name: Set Go proxy
      shell: bash
      run: |
        echo "GOPROXY=https://goproxy.cn,direct" >> "$GITHUB_ENV"
        echo "GOSUMDB=off" >> "$GITHUB_ENV"

    - name: Restore OpenWrt build environment cache
      uses: actions/cache@v5
      with:
        path: |
          build_dir
          staging_dir
          dl
        key: ${{ runner.os }}-n60pro-quick-openwrt-${{ hashFiles('Makefile', 'rules.mk', 'config/**', 'feeds.conf.default', 'include/**', 'scripts/**', 'tools/**', 'toolchain/**', 'target/linux/generic/**', 'target/linux/mediatek/**', 'package/mtk/applications/easymesh-n60/**', 'package/mtk/applications/datconf/**', 'package/libs/openssl/**', 'package/libs/libnl-tiny/**', 'package/mtk/drivers/mt_wifi/**', 'package/mtk/drivers/conninfra/**', 'package/mtk/drivers/warp/**', 'package/mtk/vendor-sources.lock.json', '.github/workflows/easymesh-quick.yml', '.github/workflows/vendor-source-patch-audit.yml', '.github/workflows/quick-prepare-audit.yml', '.github/actions/easymesh-quick/action.yml') }}

    - name: Update and install feeds
      shell: bash
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configure N60 Pro build
      shell: bash
      run: |
        set -euo pipefail
        cp config/n60pro-1001.config .config
        # Quick only needs the target OpenSSL headers and libssl/libcrypto
        # link interfaces. The firmware config enables the optional
        # libopenssl-devcrypto engine, which requires cryptodev-linux's
        # kernel UAPI header and is unrelated to WAPP/MAPD/P1905.
        # Disable only that optional engine package in this ephemeral Quick
        # config; the committed N60 config and Full firmware remain unchanged.
        sed -i '/^CONFIG_PACKAGE_libopenssl-devcrypto=y$/d' .config
        echo '# CONFIG_PACKAGE_libopenssl-devcrypto is not set' >> .config
        if grep -q '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_' .config; then
          sed -i -E "s|^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_[^=]+=y|# &|" .config
          sed -i -E "s|^# (CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEVICE})=y|\\1=y|" .config
        fi
        if ! grep -q "^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEVICE}=y" .config; then
          echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEVICE}=y" >> .config
        fi
        make defconfig
        for option in \
          CONFIG_MTK_CONNINFRA_APSOC=y \
          CONFIG_MTK_CONNINFRA_APSOC_MT7986=y \
          CONFIG_CONNINFRA_EMI_SUPPORT=y \
          CONFIG_CONNINFRA_AUTO_UP=y
        do
          grep -qx "$option" .config || {
            echo "::error::Required N60 Pro conninfra option missing after Quick defconfig: $option"
            exit 1
          }
        done
        if grep -qx 'CONFIG_PACKAGE_libopenssl-devcrypto=y' .config; then
          echo "::error::Quick config unexpectedly re-enabled optional libopenssl-devcrypto."
          exit 1
        fi
        echo "PASS: Quick excludes optional devcrypto engine; Full firmware config is unchanged."
        for option in \
          CONFIG_MTK_WIFI_MODE_AP=m \
          CONFIG_MTK_MT_AP_SUPPORT=m \
          CONFIG_MTK_BAND_STEERING=y \
          CONFIG_MTK_MBO_SUPPORT=y \
          CONFIG_MTK_MAP_SUPPORT=y
        do
          grep -qx "$option" .config || {
            echo "::error::Required MTK option missing after defconfig: $option"
            exit 1
          }
        done
        grep -qx "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEVICE}=y" .config
        if grep -qx "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEVICE}-mtkuboot=y" .config; then
          echo "::error::MTK U-Boot profile must not be selected."
          exit 1
        fi
        grep -qx 'CONFIG_MTK_MT_WIFI_DRIVER_VERSION_7673=y' .config || {
          echo "::error::Quick selected a different MT Wi-Fi driver version; N60 EasyMesh source batch requires 7.6.7.3."
          exit 1
        }
        grep -qx 'CONFIG_MTK_MAP_R2_VER_SUPPORT=y' .config
        grep -qx 'CONFIG_MTK_MAP_R3_VER_SUPPORT=y' .config
        for option in \
          CONFIG_PACKAGE_kmod-conninfra=y \
          CONFIG_PACKAGE_kmod-mt_wifi=y \
          CONFIG_PACKAGE_kmod-mapfilter=y \
          CONFIG_PACKAGE_kmod-nf-conntrack=y \
          CONFIG_PACKAGE_kmod-nf-nat=y \
          CONFIG_PACKAGE_easymesh-n60=y
        do
          grep -qx "$option" .config || {
            echo "::error::Required closed-driver/EasyMesh dependency was not selected by defconfig: $option"
            exit 1
          }
        done
        echo "PASS: N60 Pro Standard configuration, conninfra/mt_wifi/mapfilter/netfilter dependency closure and 7.6.7.3 compatibility lock resolved."

    - name: Download required MTK package sources
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p dl
        python3 package/mtk/applications/easymesh-n60/scripts/n60-vendor-lock.py download \
          --repo "$GITHUB_WORKSPACE" --dl-dir dl \
          --ids wappd mapd 1905daemon libmapd
        for pkg in package/mtk/drivers/mt_wifi package/mtk/drivers/conninfra; do
          make -C "$pkg" TOPDIR="$GITHUB_WORKSPACE" download V=s
        done
        python3 package/mtk/applications/easymesh-n60/scripts/n60-vendor-lock.py verify-downloads \
          --repo "$GITHUB_WORKSPACE" --dl-dir dl --ids mtwifi conninfra
        ls -lh dl/

