name: N60 Pro EasyMesh Quick Build
description: Build the real EasyMesh target package through native OpenWrt Make targets; no independent audit pipeline.
inputs:
  device:
    description: Target router profile
    required: false
    default: netcore_n60-pro
runs:
  using: composite
  steps:
    - name: Free runner disk space
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
        df -h

    - name: Install build dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-dev rsync unzip zlib1g-dev file wget time xsltproc libelf-dev device-tree-compiler qemu-utils python3-setuptools python3-pyelftools swig ccache

    - name: Configure build environment
      shell: bash
      env:
        QUICK_DEVICE: ${{ inputs.device }}
      run: |
        set -euo pipefail
        echo "GOPROXY=https://goproxy.cn,direct" >> "$GITHUB_ENV"
        echo "GOSUMDB=off" >> "$GITHUB_ENV"
        echo "DEVICE=$QUICK_DEVICE" >> "$GITHUB_ENV"

    - name: Restore OpenWrt build cache
      uses: actions/cache@v5
      with:
        path: |
          build_dir
          staging_dir
          dl
        key: ${{ runner.os }}-n60pro-quick-${{ hashFiles('Makefile', 'rules.mk', 'config/**', 'feeds.conf.default', 'include/**', 'scripts/**', 'tools/**', 'toolchain/**', 'target/linux/**', 'package/mtk/applications/easymesh-n60/**', 'package/mtk/applications/datconf/**', 'package/libs/openssl/**', 'package/libs/libnl-tiny/**', 'package/mtk/vendor-sources.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-n60pro-quick-

    - name: Update feeds
      shell: bash
      run: |
        set -euo pipefail
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configure N60 Pro target
      shell: bash
      run: |
        set -euo pipefail
        cp config/n60pro-1001.config .config
        sed -i '/^CONFIG_PACKAGE_libopenssl-devcrypto=y$/d' .config
        echo '# CONFIG_PACKAGE_libopenssl-devcrypto is not set' >> .config
        if grep -q '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_' .config; then
          sed -i -E "s|^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_[^=]+=y|# &|" .config
          sed -i -E "s|^# (CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEVICE})=y|\\1=y|" .config
        fi
        grep -q "^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEVICE}=y" .config || echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEVICE}=y" >> .config
        make defconfig

    - name: Download EasyMesh vendor source inputs
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p dl
        python3 package/mtk/applications/easymesh-n60/scripts/n60-vendor-lock.py download --repo "$GITHUB_WORKSPACE" --dl-dir dl --ids wappd mapd 1905daemon libmapd

    - name: Build OpenWrt host tools and target toolchain
      shell: bash
      run: |
        set -euo pipefail
        make tools/install -j"$(nproc)" V=s
        make toolchain/install -j"$(nproc)" V=s

    - name: Prepare patched Linux source and MTK UAPI
      shell: bash
      run: |
        set -euo pipefail
        make target/linux/prepare V=s
        KERNEL_BASE="build_dir/target-aarch64_cortex-a53_musl/linux-mediatek_filogic"
        KERNEL_DIR="$(find "$KERNEL_BASE" -mindepth 1 -maxdepth 1 -type d -name 'linux-*' -print -quit)"
        test -n "$KERNEL_DIR"
        test -s "$KERNEL_DIR/Makefile"
        for header in wapp_cmm_type.h mt_wlan_cmm_oid.h; do
          test -s "$KERNEL_DIR/include/uapi/linux/wapp/$header"
        done

    - name: Stage EasyMesh target build dependencies
      shell: bash
      run: |
        set -euo pipefail
        TARGET_STAGING="$GITHUB_WORKSPACE/staging_dir/target-aarch64_cortex-a53_musl"
        make -C package/libs/openssl TOPDIR="$GITHUB_WORKSPACE" "$TARGET_STAGING/stamp/.openssl_installed" -j"$(nproc)" V=s
        make -C package/mtk/applications/datconf TOPDIR="$GITHUB_WORKSPACE" CMAKE_OPTIONS="-DLUAPATH=/usr/lib/lua -DBUILD_LUA=OFF" "$TARGET_STAGING/stamp/.datconf_installed" -j"$(nproc)" V=s
        make -C package/libs/libnl-tiny TOPDIR="$GITHUB_WORKSPACE" "$TARGET_STAGING/stamp/.libnl-tiny_installed" -j"$(nproc)" V=s

    - name: Build EasyMesh from vendor source
      shell: bash
      run: |
        set -Eeuo pipefail
        BUILD_DIR="$GITHUB_WORKSPACE/build_dir/target-aarch64_cortex-a53_musl/easymesh-n60-7.6.7.3"
        LOG="$RUNNER_TEMP/easymesh-quick-build.log"
        make -C package/mtk/applications/easymesh-n60 TOPDIR="$GITHUB_WORKSPACE" "$BUILD_DIR/.built" -j"$(nproc)" V=s 2>&1 | tee "$LOG"
        test -s "$BUILD_DIR/.built"
        mkdir -p artifacts/easymesh-quick
        for output in wappd/wapp wappd/wappctrl mapd/mapd 1905daemon/p1905_managerd 1905daemon/ethernet/libeth_1905ops.so libmapd/libmapd_interface_client.so; do
          test -s "$BUILD_DIR/$output"
          readelf -h "$BUILD_DIR/$output" | grep -Fq AArch64
          cp "$BUILD_DIR/$output" artifacts/easymesh-quick/
        done
        cp "$LOG" artifacts/easymesh-quick/
        sha256sum artifacts/easymesh-quick/* > artifacts/easymesh-quick/SHA256SUMS
        echo "Quick build completed: native OpenWrt Prepare and EasyMesh source compilation/linking succeeded."

    - name: Upload Quick build outputs
      uses: actions/upload-artifact@v6
      with:
        name: n60pro-easymesh-quick-${{ github.run_number }}
        path: artifacts/easymesh-quick/
        if-no-files-found: error
        retention-days: 14
