name: N60 EasyMesh OpenSSL 1.1.1w to 3.5.9 API reference baseline
# Header inventory includes both checked-in *.h and public *.h.in source templates.

# The 68-item baseline is traceability only: presence/deprecation in 3.5.9 never implies migration is required. The active source/API gate is separate.
# It runs on every maintenance-branch revision because Quick Prepare requires an exact-SHA credential.
on:
  workflow_call:
  push:
    branches: ["n60pro-mtk-closed-driver"]
  pull_request:
    paths:
      - ".github/workflows/openssl-migration-baseline-audit.yml"
      - ".github/workflows/openssl-target-preprocessor-regression.yml"
      - "package/mtk/applications/easymesh-n60/scripts/openssl-target-preprocessor-audit.py"
      - "package/mtk/applications/easymesh-n60/tests/test-openssl-target-preprocessor-audit.py"
      - "package/mtk/applications/easymesh-n60/scripts/enforce-openssl-target-api-gate.py"
      - "package/mtk/applications/easymesh-n60/tests/test-openssl-target-api-gate.py"
      - "package/mtk/applications/easymesh-n60/tests/openssl-easymesh-scope.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n60-openssl-migration-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  header-baseline:
    if: github.event_name != 'pull_request'
    name: Trace 68 EasyMesh source candidates against OpenSSL 1.1.1w and 3.5.9 headers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout audited revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate baseline auditor syntax and deprecation parser
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile package/mtk/applications/easymesh-n60/scripts/audit-openssl-migration-baseline.py
          python3 package/mtk/applications/easymesh-n60/tests/test-openssl-migration-baseline-selftest.py

      - name: Download immutable OpenSSL 1.1.1w reference archive
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/openssl-migration"
          archive="$RUNNER_TEMP/openssl-migration/openssl-1.1.1w.tar.gz"
          if ! curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 600 \
            https://www.openssl.org/source/old/1.1.1/openssl-1.1.1w.tar.gz -o "$archive"; then
            echo "::warning::Primary OpenSSL 1.1.1w archive endpoint failed; retrying the official mirror."
            curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 600 \
              https://mirror.openssl-library.org/source/old/1.1.1/openssl-1.1.1w.tar.gz -o "$archive"
          fi
          echo "cf3098950cb4d853ad95c0841f1f9c6d3dc102dccfcacd521d93925208b76ac8  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/openssl-migration/1.1.1w"
          tar -xzf "$archive" -C "$RUNNER_TEMP/openssl-migration/1.1.1w" --strip-components=1

      - name: Download exact OpenSSL 3.5.9 target archive
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/openssl-migration/openssl-3.5.9.tar.gz"
          if ! curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 900 \
            https://www.openssl.org/source/openssl-3.5.9.tar.gz -o "$archive"; then
            echo "::warning::Primary OpenSSL 3.5.9 archive endpoint failed; retrying the official GitHub release asset."
            curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 900 \
              https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz -o "$archive"
          fi
          echo "603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/openssl-migration/3.5.9"
          tar -xzf "$archive" -C "$RUNNER_TEMP/openssl-migration/3.5.9" --strip-components=1

      - name: Compare retained EasyMesh API candidates against the complete OpenSSL headers
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 package/mtk/applications/easymesh-n60/tests/test-openssl-api-inventory-selftest.py
          python3 package/mtk/applications/easymesh-n60/scripts/audit-openssl-migration-baseline.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --openssl-1111-source "$RUNNER_TEMP/openssl-migration/1.1.1w" \
            --openssl-359-source "$RUNNER_TEMP/openssl-migration/3.5.9" \
            --archive-1111 "$RUNNER_TEMP/openssl-migration/openssl-1.1.1w.tar.gz" \
            --archive-359 "$RUNNER_TEMP/openssl-migration/openssl-3.5.9.tar.gz" \
            --git-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output-dir "$GITHUB_WORKSPACE/artifacts/openssl-migration-baseline"

      - name: Upload immutable OpenSSL migration baseline evidence
        id: baseline_evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: n60-openssl-1111w-to-359-header-baseline
          path: artifacts/openssl-migration-baseline/
          if-no-files-found: warn
          retention-days: 90

      - name: Generate run-bound OpenSSL baseline attestation
        if: steps.baseline_evidence.outcome == 'success'
        shell: bash
        env:
          BASELINE_ARTIFACT_ID: ${{ steps.baseline_evidence.outputs.artifact-id }}
          BASELINE_ARTIFACT_DIGEST: ${{ steps.baseline_evidence.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          root=Path("artifacts/openssl-migration-baseline")
          summary=json.loads((root/"openssl-migration-baseline.json").read_text())
          artifact_id=os.environ["BASELINE_ARTIFACT_ID"]
          digest=os.environ["BASELINE_ARTIFACT_DIGEST"].removeprefix("sha256:")
          if not artifact_id.isdigit() or not re.fullmatch(r"[0-9a-f]{64}",digest):
              raise SystemExit("GitHub baseline artifact ID/digest is missing or malformed")
          if summary.get("failures") or summary.get("migration_map_rows")!=68 or summary.get("migration_map_apis_present_in_1_1_1w")!=68:
              raise SystemExit("68-item 1.1.1w traceability inventory is incomplete")
          att={
            "schema_version":2,"status":"VERIFIED","baseline_id":summary["baseline_id"],
            "run":{"id":int(os.environ["GITHUB_RUN_ID"]),"attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),
                   "git_sha":os.environ["GITHUB_SHA"],"url":os.environ["GITHUB_SERVER_URL"]+"/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"]},
            "artifact":{"id":int(artifact_id),"name":"n60-openssl-1111w-to-359-header-baseline","sha256":digest},
            "input_sha256":summary["input_sha256"],
            "source":{"from_version":summary["from_version"],"to_version":summary["to_version"],
                      "archive_sha256":summary["archive_sha256"],"header_tree_sha256":summary["header_tree_sha256"]},
            "results":{"header_api_names":summary["header_api_names"],
                       "deprecated_api_declarations_3_5_9":summary["deprecated_api_declarations"]["3.5.9"],
                       "migration_map_rows":summary["migration_map_rows"],
                       "migration_map_apis_present_in_1_1_1w":summary["migration_map_apis_present_in_1_1_1w"],
                       "migration_map_apis_deprecated_in_3_5_9":summary["migration_map_apis_deprecated_in_3_5_9"],
                       "failures":summary["failures"]},
            "limitations":summary["limitations"]
          }
          out=Path("artifacts/openssl-migration-baseline-attestation")
          out.mkdir(parents=True,exist_ok=True)
          (out/"openssl-migration-baseline.attestation.json").write_text(json.dumps(att,indent=2)+chr(10))
          print(json.dumps({"run":att["run"],"artifact":att["artifact"],"results":att["results"]},indent=2))
          PY

      - name: Upload run-bound OpenSSL baseline attestation
        uses: actions/upload-artifact@v6
        with:
          name: n60-openssl-baseline-attestation
          path: artifacts/openssl-migration-baseline-attestation/openssl-migration-baseline.attestation.json
          if-no-files-found: error
          retention-days: 90

  target-preprocessor-regressions:
    name: Target preprocessor and 40-API gate positive/negative regressions
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact audited revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile OpenSSL audit and regression scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile \
            package/mtk/applications/easymesh-n60/scripts/openssl-target-preprocessor-audit.py \
            package/mtk/applications/easymesh-n60/tests/test-openssl-target-preprocessor-audit.py \
            package/mtk/applications/easymesh-n60/scripts/enforce-openssl-target-api-gate.py \
            package/mtk/applications/easymesh-n60/tests/test-openssl-target-api-gate.py
      - name: Run positive and negative regression cases
        shell: bash
        run: |
          set -Eeuo pipefail
          python package/mtk/applications/easymesh-n60/tests/test-openssl-target-preprocessor-audit.py
          python package/mtk/applications/easymesh-n60/tests/test-openssl-target-api-gate.py
