name: N60 OpenSSL target regressions and optional historical API traceability
# Manual diagnostics only. Production compatibility is verified by the Quick
# source build and Full firmware build; this workflow does not gate either.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n60-openssl-diagnostics
  cancel-in-progress: true

jobs:
  header-baseline:
    continue-on-error: true
    if: github.event_name == 'workflow_dispatch'
    name: Optional historical OpenSSL header traceability
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate baseline auditor and regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile package/mtk/applications/easymesh-n60/scripts/audit-openssl-migration-baseline.py
          python3 package/mtk/applications/easymesh-n60/tests/test-openssl-migration-baseline-selftest.py
          python3 -m py_compile \
            package/mtk/applications/easymesh-n60/scripts/openssl-target-preprocessor-audit.py \
            package/mtk/applications/easymesh-n60/scripts/enforce-openssl-target-api-gate.py \
            package/mtk/applications/easymesh-n60/tests/test-openssl-target-preprocessor-audit.py \
            package/mtk/applications/easymesh-n60/tests/test-openssl-target-api-gate.py
          python3 package/mtk/applications/easymesh-n60/tests/test-openssl-target-preprocessor-audit.py
          python3 package/mtk/applications/easymesh-n60/tests/test-openssl-target-api-gate.py
          python3 package/mtk/applications/easymesh-n60/tests/test-openssl-api-inventory-selftest.py
