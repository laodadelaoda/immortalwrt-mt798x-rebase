name: N60 Pro Full duplicate suppressor

on:
  push:
    branches:
      - n60pro-25.12-upstream-base

jobs:
  suppress-pending-full:
    if: contains(github.event.head_commit.message, '[N60PRO-SUPPRESS-SECOND]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: n60pro-full-firmware
      cancel-in-progress: false
    steps:
      - name: Replace the duplicate pending Full reservation without cancelling the active Full
        run: echo "The active Full job is preserved; the duplicate pending Full reservation is replaced by this no-build guard."
