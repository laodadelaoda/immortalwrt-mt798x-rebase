name: N60 Source Bridge

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to export (defaults to this workflow's ref)"
        required: false
        type: string
      include_auxiliary:
        description: "Include all locked auxiliary vendor sources and patch sets"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: n60-source-bridge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export-source-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout requested source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and verify every locked vendor archive
        env:
          INCLUDE_AUXILIARY: ${{ inputs.include_auxiliary || 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bridge/dl
          python3 - <<'PY'
          import hashlib, json, os, pathlib, time, urllib.request
          lock_path = pathlib.Path("package/mtk/vendor-sources.lock.json")
          lock = json.loads(lock_path.read_text())
          include_aux = os.environ.get("INCLUDE_AUXILIARY", "true").lower() == "true"
          manifest = []
          for item in lock["sources"]:
              if not include_aux and item.get("source_scope") == "auxiliary-audit-only":
                  continue
              name = item["archive"]
              target = pathlib.Path("bridge/dl") / name
              url = item["url"]
              last = None
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "N60-Source-Bridge/1.0"})
                      with urllib.request.urlopen(req, timeout=90) as response, target.open("wb") as out:
                          while True:
                              chunk = response.read(1024 * 1024)
                              if not chunk: break
                              out.write(chunk)
                      break
                  except Exception as exc:
                      last = exc
                      target.unlink(missing_ok=True)
                      if attempt == 3: raise
                      time.sleep(3 * (attempt + 1))
              digest = hashlib.sha256(target.read_bytes()).hexdigest()
              expected = item["sha256"].lower()
              if digest != expected:
                  raise SystemExit(f"SHA256 mismatch for {name}: expected {expected}, got {digest}")
              manifest.append({"id": item["id"], "archive": name, "sha256": digest, "url": url})
              print(f"VERIFIED {item['id']} {name} {digest}")
          pathlib.Path("bridge/vendor-archives.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Assemble exact source and patch snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bridge/repo
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          lock_path = pathlib.Path("package/mtk/vendor-sources.lock.json")
          lock = json.loads(lock_path.read_text())
          prefixes = set()
          exact = {
              "package/mtk/vendor-sources.lock.json",
              "package/mtk/applications/easymesh-n60/Makefile",
              "package/mtk/applications/easymesh-n60/scripts/n60-vendor-lock.py",
              "package/mtk/applications/easymesh-n60/scripts/n60-vendor-source-transforms.py",
              "package/mtk/applications/easymesh-n60/tests/test-vendor-lock-evaluation.py",
              "config/n60pro-1001.config",
          }
          for source in lock["sources"]:
              exact.add(source["package_makefile"])
              if source.get("expected_patch_dir"):
                  prefixes.add(source["expected_patch_dir"])
          for patch_set in lock["patch_sets"]:
              prefixes.add(patch_set["directory"])
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          selected = []
          for p in tracked:
              if not p: continue
              if p in exact or any(p.startswith(d.rstrip("/") + "/") for d in prefixes):
                  selected.append(p)
          if not selected:
              raise SystemExit("No locked repository inputs selected")
          pathlib.Path("bridge/repo-files.txt").write_text("\n".join(sorted(selected)) + "\n")
          subprocess.run(["tar", "-czf", "bridge/repository-inputs.tar.gz", "-T", "bridge/repo-files.txt"], check=True)
          sha = hashlib.sha256(lock_path.read_bytes()).hexdigest()
          metadata = {
              "repository": "${{ github.repository }}",
              "ref": "${{ github.ref }}",
              "commit": "${{ github.sha }}",
              "lock_path": str(lock_path),
              "lock_sha256": sha,
              "selected_tracked_file_count": len(selected),
              "patch_sets": [{"id": p["id"], "directory": p["directory"], "application_order": p.get("application_order", []), "post_normalize_order": p.get("post_normalize_order", [])} for p in lock["patch_sets"]],
              "source_archives": json.loads(pathlib.Path("bridge/vendor-archives.json").read_text()),
          }
          pathlib.Path("bridge/bridge-manifest.json").write_text(json.dumps(metadata, indent=2) + "\n")
          print(json.dumps(metadata, indent=2))
          PY
          cp package/mtk/vendor-sources.lock.json bridge/
          tar -czf "n60-source-bridge-${GITHUB_SHA}.tar.gz" -C bridge .
          sha256sum "n60-source-bridge-${GITHUB_SHA}.tar.gz" | tee "n60-source-bridge-${GITHUB_SHA}.tar.gz.sha256"

      - name: Upload source bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: n60-source-bridge-${{ github.sha }}
          path: |
            n60-source-bridge-${{ github.sha }}.tar.gz
            n60-source-bridge-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
