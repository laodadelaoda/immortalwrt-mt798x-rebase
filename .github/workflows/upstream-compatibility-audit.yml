name: N60 Pro upstream delta and closed-component compatibility audit
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"
permissions:
  contents: read
  actions: read
concurrency:
  group: n60-upstream-compatibility-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pinned-vendor-audit:
    name: Revalidate pinned vendor archives, patch stacks and native Prepare
    uses: ./.github/workflows/vendor-source-patch-audit.yml
  upstream-impact:
    name: Map upstream delta to closed components and verify evidence provenance
    needs: pinned-vendor-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact N60 Pro revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Fetch upstream branch
        shell: bash
        run: |
          set -Eeuo pipefail
          UPSTREAM_URL="$(python3 -c 'import json; print(json.load(open("package/mtk/upstream-compatibility.lock.json"))["upstream_repository"])')"
          UPSTREAM_BRANCH="$(python3 -c 'import json; print(json.load(open("package/mtk/upstream-compatibility.lock.json"))["upstream_branch"])')"
          git remote add n60-upstream "$UPSTREAM_URL"
          git fetch --no-tags n60-upstream "$UPSTREAM_BRANCH"
          echo "UPSTREAM_TARGET_SHA=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
          echo "UPSTREAM_BASE_SHA=$(python3 -c 'import json; print(json.load(open("package/mtk/upstream-compatibility.lock.json"))["last_integrated_upstream_sha"])')" >> "$GITHUB_ENV"
      - name: Download vendor audit attestation
        uses: actions/download-artifact@v6
        with:
          name: n60-vendor-audit-attestation
          path: .audit-attestation
      - name: Verify exact commit, Lock and run identity
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 package/mtk/applications/easymesh-n60/scripts/verify-vendor-audit-attestation.py verify \
            --repo "$GITHUB_WORKSPACE" --attestation .audit-attestation/vendor-audit-attestation.json \
            --expected-run-id "$GITHUB_RUN_ID" --expected-run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Generate upstream impact report
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 package/mtk/applications/easymesh-n60/scripts/n60-upstream-compat-audit.py \
            --repo "$GITHUB_WORKSPACE" --base-sha "$UPSTREAM_BASE_SHA" --target-sha "$UPSTREAM_TARGET_SHA"
          python3 - "$GITHUB_WORKSPACE" <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          root=Path(sys.argv[1]); attpath=root/".audit-attestation/vendor-audit-attestation.json"
          att=json.loads(attpath.read_text()); path=root/"upstream-compatibility-report/upstream-compatibility-report.json"
          report=json.loads(path.read_text())
          if att.get("commit_sha")!=os.environ["GITHUB_SHA"]: raise SystemExit("FAIL: attested commit mismatch")
          if att.get("run_id")!=os.environ["GITHUB_RUN_ID"] or att.get("run_attempt")!=os.environ["GITHUB_RUN_ATTEMPT"]: raise SystemExit("FAIL: attestation run identity mismatch")
          report["vendor_audit_evidence"]={"status":att["status"],"commit_sha":att["commit_sha"],"run_id":att["run_id"],"run_attempt":att["run_attempt"],"lock_sha256":att["lock_sha256"],"file_count":len(att["files"]),"attestation_sha256":hashlib.sha256(attpath.read_bytes()).hexdigest()}
          report["compatibility_verdict"]="NOT_PROVEN_REVIEW_REQUIRED" if report["verdict"]=="REVIEW_REQUIRED_COMPATIBILITY_NOT_YET_PROVEN" else ("BLOCKED" if report["verdict"]=="BLOCKED_UNMAPPED_SOURCE_CHANGE" else ("NO_DELTA_VENDOR_AUDIT_PASSED" if report["verdict"]=="NO_UPSTREAM_DELTA" else "NONBUILD_DELTA_REVIEW"))
          path.write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print("Compatibility verdict:",report["compatibility_verdict"])
          PY
          {
            echo "## N60 Pro upstream compatibility audit"
            cat upstream-compatibility-report/upstream-compatibility-report.md
            echo
            echo "Vendor patch/Prepare success is not proof of closed-binary ABI or device runtime compatibility."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload upstream delta and compatibility evidence
        uses: actions/upload-artifact@v6
        with:
          name: n60-upstream-compatibility-evidence
          path: |
            upstream-compatibility-report/
            .audit-attestation/vendor-audit-attestation.json
          if-no-files-found: error
          retention-days: 90
