name: Conninfra patch reorganization

on:
  push:
    branches:
      - n60pro-25.12-upstream-base
    paths:
      - .github/workflows/conninfra-regroup.yml
      - .github/scripts/regroup_conninfra_patches.py

permissions:
  contents: write

concurrency:
  group: conninfra-patch-reorganization
  cancel-in-progress: false

jobs:
  regroup-and-replay:
    if: github.ref == 'refs/heads/n60pro-25.12-upstream-base'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v5
        with:
          ref: n60pro-25.12-upstream-base
          fetch-depth: 0
      - name: Regroup Conninfra patches and verify GNU replay
        run: python3 .github/scripts/regroup_conninfra_patches.py
