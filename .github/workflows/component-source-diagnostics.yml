name: N60 Pro component source diagnostics

# Consolidated manual-only diagnostics. These jobs preserve their original source checks
# and artifacts; choose one component or run all. Canonical vendor gating remains elsewhere.
on:
  workflow_dispatch:
    inputs:
      component:
        description: Select the source diagnostic to run
        required: true
        type: choice
        default: all
        options:
          - all
          - wapp
          - conninfra
          - wts

permissions:
  contents: read
  actions: read

concurrency:
  group: n60-component-source-diagnostics-${{ github.ref }}-${{ inputs.component }}
  cancel-in-progress: false

jobs:
  wapp:
    if: inputs.component == 'wapp' || inputs.component == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository binaries
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Validate source-audit scripts and vendor patch declarations
        shell: bash
        run: |
          set -euo pipefail
          PKG="package/mtk/applications/easymesh-n60"
          python3 -m py_compile "$PKG/tests/test-easymesh-static-contract.py" "$PKG/tests/test-dpp-source-contract.py" "$PKG/tests/test-vendor-artifact-inventory.py"
          bash -n "$PKG/scripts/n60-auxiliary-source-audit.sh"
          test -s "$PKG/patches/011-wapp-wts-security.patch"
          test -s "$PKG/patches/012-p1905-wts-hardening.patch"
          test -s "$PKG/patches/013-wapp-wts-parser-fail-closed.patch"
          test -s "$PKG/patches/014-wapp-wps-key-log-redaction.patch"
          git apply --numstat "$PKG/patches/012-p1905-wts-hardening.patch" >/dev/null
          git apply --numstat "$PKG/patches/013-wapp-wts-parser-fail-closed.patch" >/dev/null
          git apply --numstat "$PKG/patches/014-wapp-wps-key-log-redaction.patch" >/dev/null
          test -s "$PKG/patches/015-dpp-config-lookup-null-and-error-guard.patch"
          git apply --numstat "$PKG/patches/015-dpp-config-lookup-null-and-error-guard.patch" >/dev/null
          test -s "$PKG/patches/016-dpp-qr-count-boundaries-and-error-propagation.patch"
          git apply --numstat "$PKG/patches/016-dpp-qr-count-boundaries-and-error-propagation.patch" >/dev/null
          python3 "$PKG/scripts/n60-vendor-source-transforms.py" verify-lock "$GITHUB_WORKSPACE"
          grep -Fq 'apply_patch_strict' "$PKG/Makefile"
          grep -Fq 'if (i >= content_len - 1)' "$PKG/patches/011-wapp-wts-security.patch"
          grep -Fq 'key is configured' "$PKG/patches/011-wapp-wts-security.patch"
          git apply --numstat "$PKG/auxiliary-patches/001-bndstrg-gcc14-werror-and-init.patch" >/dev/null
          git apply --numstat "$PKG/auxiliary-patches/002-fwdd-gcc14-bounded-ifname-copy.patch" >/dev/null
          echo "PASS: current WTS patch, Python source-contract tests and auxiliary audit script validate; removed WTS rewriter is no longer referenced."

      - name: Download and verify exact WAPP source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wapp-audit"
          python3 package/mtk/applications/easymesh-n60/scripts/n60-vendor-lock.py download \
            --repo "$GITHUB_WORKSPACE" --dl-dir "$RUNNER_TEMP/wapp-audit" \
            --ids wappd mapd 1905daemon libmapd
          cd "$RUNNER_TEMP/wapp-audit"
          echo "===== ARCHIVE CONTENTS ====="
          tar -tjf wappd-80ca5724.tar.bz2 | tee archive-files.txt
          mkdir source
          tar -xjf wappd-80ca5724.tar.bz2 -C source
          mkdir dpp-patch-root
          tar -xjf wappd-80ca5724.tar.bz2 -C dpp-patch-root
          tar -xjf mapd-6eca4331.tar.bz2 -C dpp-patch-root
          tar -xjf 1905daemon-35234223.tar.bz2 -C dpp-patch-root
          tar -xjf libmapd-0132d199.tar.bz2 -C dpp-patch-root
          LOCK_HELPER="$GITHUB_WORKSPACE/package/mtk/applications/easymesh-n60/scripts/n60-vendor-lock.py"
          TRANSFORM_HELPER="$GITHUB_WORKSPACE/package/mtk/applications/easymesh-n60/scripts/n60-vendor-source-transforms.py"
          patch_names="$(python3 "$LOCK_HELPER" patch-order --repo "$GITHUB_WORKSPACE" --set easymesh --phase application)"
          test -n "$patch_names" || { echo "DPP source capture has no locked application patch order" >&2; exit 1; }
          for name in $patch_names; do
            if [ "$name" = "017-dpp-credential-bounds-zeroization-and-log-redaction.patch" ]; then
              mkdir -p pre017-snapshot/common pre017-snapshot/dpp
              cp dpp-patch-root/wappd/common/main.c pre017-snapshot/common/main.c
              cp dpp-patch-root/wappd/dpp/dpp_wdev.c pre017-snapshot/dpp/dpp_wdev.c
              cp dpp-patch-root/wappd/dpp/dpp.c pre017-snapshot/dpp/dpp.c
              cp dpp-patch-root/wappd/dpp/dpp.h pre017-snapshot/dpp/dpp.h
            fi
            patch_file="$GITHUB_WORKSPACE/package/mtk/applications/easymesh-n60/patches/$name"
            if [ "$name" = "008-dpp-parser-bounds-and-secret-redaction.patch" ]; then
              context_dir="$RUNNER_TEMP/wapp-audit/failed-patch-context/008"
              mkdir -p "$context_dir/source/wappd/common" "$context_dir/source/wappd/dpp" "$context_dir/patches"
              cp dpp-patch-root/wappd/common/main.c "$context_dir/source/wappd/common/main.c.before-008"
              cp dpp-patch-root/wappd/dpp/dpp.c "$context_dir/source/wappd/dpp/dpp.c.before-008"
              cp dpp-patch-root/wappd/dpp/dpp.h "$context_dir/source/wappd/dpp/dpp.h.before-008"
              cp dpp-patch-root/wappd/dpp/dpp_wdev.c "$context_dir/source/wappd/dpp/dpp_wdev.c.before-008"
              cp dpp-patch-root/wappd/common/wdev.c "$context_dir/source/wappd/common/wdev.c.before-008"
              for prior in 002-dpp-parser-safety.patch 007-openssl3-use-native-evp-pkey-get0-ec-key.patch; do
                cp "$GITHUB_WORKSPACE/package/mtk/applications/easymesh-n60/patches/$prior" "$context_dir/patches/"
              done
              cp "$patch_file" "$context_dir/patches/"
              {
                echo "repository_sha=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
                echo "lock_sha256=$(sha256sum "$GITHUB_WORKSPACE/package/mtk/vendor-sources.lock.json" | awk '{print $1}')"
                echo "patch_002_sha256=$(sha256sum "$context_dir/patches/002-dpp-parser-safety.patch" | awk '{print $1}')"
                echo "patch_007_sha256=$(sha256sum "$context_dir/patches/007-openssl3-use-native-evp-pkey-get0-ec-key.patch" | awk '{print $1}')"
                echo "patch_008_sha256=$(sha256sum "$context_dir/patches/008-dpp-parser-bounds-and-secret-redaction.patch" | awk '{print $1}')"
              } > "$context_dir/CONTEXT-MANIFEST.txt"
              if ! patch --verbose --dry-run --batch --forward --fuzz=0 -p1 -d dpp-patch-root < "$patch_file" > "$context_dir/008-dry-run.log" 2>&1; then
                cat "$context_dir/008-dry-run.log"
                exit 1
              fi
              cat "$context_dir/008-dry-run.log"
              if ! patch --verbose --batch --forward --fuzz=0 -p1 -d dpp-patch-root < "$patch_file" > "$context_dir/008-apply.log" 2>&1; then
                cat "$context_dir/008-apply.log"
                exit 1
              fi
              cat "$context_dir/008-apply.log"
            else
              patch --dry-run --batch --forward --fuzz=0 -p1 -d dpp-patch-root < "$patch_file"
              patch --batch --forward --fuzz=0 -p1 -d dpp-patch-root < "$patch_file"
            fi
          done
          python3 "$TRANSFORM_HELPER" normalize "$RUNNER_TEMP/wapp-audit/dpp-patch-root"
          post_names="$(python3 "$LOCK_HELPER" patch-order --repo "$GITHUB_WORKSPACE" --set easymesh --phase post_normalize)"
          for name in $post_names; do
            patch_root_suffix="$(python3 "$LOCK_HELPER" patch-root --repo "$GITHUB_WORKSPACE" --set easymesh --phase post_normalize --name "$name")"
            patch_root="dpp-patch-root"
            if [ -n "$patch_root_suffix" ]; then patch_root="$patch_root/$patch_root_suffix"; fi
            patch_file="$GITHUB_WORKSPACE/package/mtk/applications/easymesh-n60/patches/$name"
            patch --dry-run --batch --forward --fuzz=0 -p1 -d "$patch_root" < "$patch_file"
            patch --batch --forward --fuzz=0 -p1 -d "$patch_root" < "$patch_file"
          done
          python3 "$TRANSFORM_HELPER" finalize "$RUNNER_TEMP/wapp-audit/dpp-patch-root"
          python3 - <<'PY'
          import pathlib
          root = pathlib.Path("dpp-patch-root/wappd/dpp")
          targets = {
              "dpp_wdev.c": ["void wapp_dpp_get_uri_frm_file(", "void dpp_save_dpp_uri_to_file("],
              "dpp.c": ["int  dpp_reset_dpp_config_file(", "void  dpp_remove_uri_from_file("],
          }
          for filename, signatures in targets.items():
              source = (root / filename).read_text()
              for signature in signatures:
                  start = source.index(signature)
                  brace = source.index("{", start)
                  depth = 0
                  for end in range(brace, len(source)):
                      if source[end] == "{": depth += 1
                      elif source[end] == "}":
                          depth -= 1
                          if depth == 0: break
                  else: raise SystemExit(f"unterminated {signature}")
                  print(f"\\n===== POST-LOCK {filename}: {signature} =====")
                  print(source[start:end + 1])
          PY
          echo "===== EXTRACTED FILE COUNT ====="
          find source -type f | wc -l
          echo "===== EXACT DPP QR COUNT SOURCE CONTEXT (PINNED WAPP ARCHIVE) ====="
          grep -RIn -C 45 --include='*.c' --include='*.h' 'qr_count' source/wappd/dpp | head -700
          echo "===== DPP QR COUNT CALLS AND TYPES ====="
          grep -RInE --include='*.c' --include='*.h' 'atoi\(value\)|uri_num|uri_cnt|MAP_MAX_DPP_URI_COUNT|qr_count' source/wappd/dpp | head -300
          mkdir -p binaries
          for name in wapp mapd p1905_managerd; do
            cp "$GITHUB_WORKSPACE/package/mtk/applications/easymesh-n60/files/usr/bin/$name" "binaries/$name"
            file "binaries/$name"
            readelf -h "binaries/$name" | grep -E "Class:|Machine:" || true
            echo "===== STRINGS: $name ====="
            strings -a "binaries/$name" | grep -iE "WAPP_USER_GET_WTS_CONFIG|WAPP_WTS_CONFIG|wts_bss_info_config|wapp_read_wts_map_config|EVENT_REGISTER|/tmp/wapp_server|map_handler" | head -100 || true
          done

      - name: Upload exact post-Lock DPP source for patch generation
        uses: actions/upload-artifact@v4
        with:
          name: dpp-post-lock-source
          path: |
            ${{ runner.temp }}/wapp-audit/dpp-patch-root/wappd/dpp/dpp.c
            ${{ runner.temp }}/wapp-audit/dpp-patch-root/wappd/dpp/dpp.h
            ${{ runner.temp }}/wapp-audit/dpp-patch-root/wappd/dpp/dpp_wdev.c
            ${{ runner.temp }}/wapp-audit/dpp-patch-root/wappd/common/main.c
            ${{ runner.temp }}/wapp-audit/pre017-snapshot/common/main.c
            ${{ runner.temp }}/wapp-audit/pre017-snapshot/dpp/dpp_wdev.c
            ${{ runner.temp }}/wapp-audit/pre017-snapshot/dpp/dpp.c
            ${{ runner.temp }}/wapp-audit/pre017-snapshot/dpp/dpp.h
          if-no-files-found: error
          retention-days: 7

      - name: Upload exact pre-008 DPP failure context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wapp-dpp-008-failure-context
          path: ${{ runner.temp }}/wapp-audit/failed-patch-context/008/
          if-no-files-found: warn
          retention-days: 14

      - name: Audit WTS parser, events, interface registration and WTS writers
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/wapp-audit"
          python3 - <<'PY'
          import pathlib, re
          root = pathlib.Path("source")
          files = [p for p in root.rglob("*") if p.is_file() and p.suffix.lower() in {".c",".h",".cc",".cpp",".hpp",".mk"}]
          print("SOURCE FILES:", len(files))
          patterns = {
              "WTS parser": re.compile(r"wapp_read_wts_map_config", re.I),
              "WTS references and writers": re.compile(r"wts|bss_info_config", re.I),
              "event registration/dispatch": re.compile(r"register.{0,50}event|event.{0,50}register|map_handler|event_handler|event_callback|notify.{0,30}event", re.I),
              "interface registration": re.compile(r"register.{0,50}(interface|ifname|netdev)|(?:interface|ifname|netdev).{0,50}register", re.I),
          }
          for label, rx in patterns.items():
              print("\n===== " + label + " =====")
              count = 0
              for p in files:
                  try: lines = p.read_text(errors="replace").splitlines()
                  except OSError as exc: raise SystemExit(f"cannot read audited source file {p}: {exc}") from exc
                  for n,line in enumerate(lines,1):
                      if rx.search(line):
                          print(f"{p}:{n}:{line[:300]}")
                          count += 1
                          if count >= 180:
                              print("... output capped at 180 matches")
                              break
                  if count >= 180: break
              print("MATCHES PRINTED:", count)
          print("\n===== COMPLETE WTS PARSER FUNCTION =====")
          def print_function(filename, signature, label):
              p = root / filename
              s = p.read_text(errors="replace")
              start = s.index(signature)
              brace = s.index("{", start)
              depth = 0
              for i in range(brace, len(s)):
                  if s[i] == "{": depth += 1
                  elif s[i] == "}":
                      depth -= 1
                      if depth == 0:
                          print("\\n===== " + label + " (" + filename + ") =====")
                          print(s[start:i+1])
                          return
              raise RuntimeError("unterminated function " + signature)
          print_function("wappd/common/main.c", "int wapp_read_wts_map_config(", "WTS PARSER")
          print_function("wappd/common/wdev.c", "void wdev_wps_configuration_handle(", "WTS WRITER")
          print_function("wappd/map/map_1905.c", "int map_handle_get_wts_config(", "WTS GET EVENT")
          print_function("wappd/map/map_1905.c", "int map_build_wts_config(", "WTS EVENT BUILDER")
          print_function("wappd/wapp_usr_intf/wapp_usr_intf.c", "int wapp_iface_process(", "USER SOCKET COMMAND DISPATCH")
          print_function("wappd/wapp_usr_intf/wapp_usr_intf.c", "void send_event_dispatch(", "USER EVENT DISPATCH")
          print("\\n===== WPS EVENT ROUTING =====")
          p = root / "wappd/common/wapp_cmm.c"
          lines = p.read_text(errors="replace").splitlines()
          for n in range(1498, 1523):
              print(f"{p}:{n+1}:{lines[n]}")
          print("\\n===== WAPP STARTUP / INTERFACE INIT REFERENCES =====")
          for p in files:
              for n,line in enumerate(p.read_text(errors="replace").splitlines(),1):
                  if "wapp_iface_init(wapp)" in line or "wapp_get_wireless_interfaces(wapp)" in line:
                      print(f"{p}:{n}:{line}")
          PY

      - name: Download and audit exact MAPD and P1905 source archives
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/wapp-audit"
          test -s mapd-6eca4331.tar.bz2
          test -s 1905daemon-35234223.tar.bz2
          mkdir -p mapd-source p1905-source
          tar -xjf mapd-6eca4331.tar.bz2 -C mapd-source
          tar -xjf 1905daemon-35234223.tar.bz2 -C p1905-source
          echo "===== MAPD SOURCE MACROS / VERSION CONFIG ====="
          grep -RInE 'CONFIG_MAP_R[234]_SUPPORT|MAP_R[234]_SUPPORT|map_ver|MAP_VERSION' mapd-source | head -240 || true
          echo "===== P1905 SOURCE DSA / ETHERNET CONFIG REFERENCES ====="
          grep -RInE 'SWTICH_DSA_ARCH|SWITCH_DSA_ARCH|ethernet_cfg\.txt|ext_phy_port|br_lan|lan_vid|wan_vid|CONFIG_MAP_R[234]_SUPPORT|MAP_R[234]_SUPPORT' p1905-source | head -300 || true
          echo "===== P1905 CONFIG MAKEFILE ====="
          find p1905-source -path '*/ethernet/config.mk' -o -path '*/ethernet/Makefile' | sort
          for f in $(find p1905-source -path '*/ethernet/config.mk' -o -path '*/ethernet/Makefile' | sort); do
            echo "--- $f ---"
            sed -n '1,220p' "$f"
          done

          echo "===== VERIFY COMPLETE WTS PATCH ON ALL THREE PINNED SOURCE TREES ====="
          PATCH_ROOT="$RUNNER_TEMP/wapp-audit/wts-patch-root"
          rm -rf "$PATCH_ROOT"
          mkdir -p "$PATCH_ROOT"
          tar -xjf wappd-80ca5724.tar.bz2 -C "$PATCH_ROOT"
          tar -xjf mapd-6eca4331.tar.bz2 -C "$PATCH_ROOT"
          tar -xjf 1905daemon-35234223.tar.bz2 -C "$PATCH_ROOT"
          tar -xjf libmapd-0132d199.tar.bz2 -C "$PATCH_ROOT"
          LOCK_HELPER="$GITHUB_WORKSPACE/package/mtk/applications/easymesh-n60/scripts/n60-vendor-lock.py"
          TRANSFORM_HELPER="$GITHUB_WORKSPACE/package/mtk/applications/easymesh-n60/scripts/n60-vendor-source-transforms.py"
          patch_names="$(python3 "$LOCK_HELPER" patch-order --repo "$GITHUB_WORKSPACE" --set easymesh --phase application)"
          test -n "$patch_names" || { echo "::error::Locked EasyMesh application patch order is empty."; exit 1; }
          wts_captured=0
          for name in $patch_names; do
            patch_file="$GITHUB_WORKSPACE/package/mtk/applications/easymesh-n60/patches/$name"
            test -s "$patch_file" || { echo "::error::Missing Lock-listed EasyMesh patch: $patch_file"; exit 1; }
            patch --dry-run --batch --forward --fuzz=0 -p1 -d "$PATCH_ROOT" < "$patch_file"
            patch --batch --forward --fuzz=0 -p1 -d "$PATCH_ROOT" < "$patch_file"
            if [ "$name" = "011-wapp-wts-security.patch" ]; then
              # Capture the real Lock-ordered state immediately after 011.
              mkdir -p "$RUNNER_TEMP/p1905-post-011" "$RUNNER_TEMP/wapp-post-011"
              cp "$PATCH_ROOT/1905daemon/src/file_io.c" "$RUNNER_TEMP/p1905-post-011/file_io.c"
              cp "$PATCH_ROOT/wappd/common/main.c" "$RUNNER_TEMP/wapp-post-011/main.c"
              wts_captured=1
            fi
          done
          test "$wts_captured" -eq 1 || { echo "::error::Patch 011 was not present in the locked application series."; exit 1; }
          # Match Build/Prepare exactly: all application patches first, then normalize,
          # post-normalize patches in Lock order, and finally source transforms.
          python3 "$TRANSFORM_HELPER" normalize "$PATCH_ROOT"
          post_names="$(python3 "$LOCK_HELPER" patch-order --repo "$GITHUB_WORKSPACE" --set easymesh --phase post_normalize)"
          for name in $post_names; do
            patch_root_suffix="$(python3 "$LOCK_HELPER" patch-root --repo "$GITHUB_WORKSPACE" --set easymesh --phase post_normalize --name "$name")"
            patch_root="$PATCH_ROOT"
            if [ -n "$patch_root_suffix" ]; then patch_root="$patch_root/$patch_root_suffix"; fi
            patch_file="$GITHUB_WORKSPACE/package/mtk/applications/easymesh-n60/patches/$name"
            patch --dry-run --batch --forward --fuzz=0 -p1 -d "$patch_root" < "$patch_file"
            patch --batch --forward --fuzz=0 -p1 -d "$patch_root" < "$patch_file"
          done
          python3 "$TRANSFORM_HELPER" finalize "$PATCH_ROOT"
          python3 - "$PATCH_ROOT" <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          p = (root / "1905daemon/src/file_io.c").read_text()
          start = p.index("int _1905_read_set_config(")
          end = p.index("\nchar* get_raw_data_end", start)
          fn = p[start:end]
          assert "if (*pos1 == '\\0')\n\t\t\tbreak;" in fn, "P1905 clean end-of-input guard missing"
          assert fn.index("if (i >= max_bss_num)") < fn.index("bss_info[i].authmode"), "P1905 record limit is not checked before array writes"
          assert "i--;" not in fn, "P1905 legacy post-write count rollback remains"
          assert fn.count("break;") == 1, "P1905 parser has a non-EOF break that can return partial success"
          assert "os_memset(bss_info, 0, sizeof(*bss_info) * max_bss_num);" in fn[fn.index("err:"):]
          assert "*config_bss_num = 0;" in fn[fn.index("err:"):]
          close = fn.index("if (fclose(f) < 0)")
          assert fn.index("ctx->map_policy.setting.primary_vid = pending_primary_vid;") > close
          assert "ctx->map_policy.setting.primary_vid = vid;" not in fn
          assert "ctx->map_policy.setting.dft.PCP = pcp;" not in fn
          assert "ctx->map_policy.tpolicy.updated = 1;" not in fn
          for field_error in ("index not found", "mac not found", "opclass not found", "ssid not found",
                              "authmode not found", "encrytype not found", "key not found",
                              "resv1 not found", "end line not found"):
              pos = fn.find(field_error)
              block_end = fn.find("}", pos)
              block = fn[pos:block_end + 1] if pos >= 0 and block_end >= 0 else ""
              assert "goto err;" in block and "break;" not in block, f"P1905 field must fail closed: {field_error}"
          w = (root / "wappd/common/main.c").read_text()
          ws = w.index("int wapp_read_wts_map_config(")
          we = w.index("\n#ifdef DPP_SUPPORT", ws)
          wfn = w[ws:we]
          loop = wfn[wfn.index("while (1) {"):wfn.index("\n\tif (i == 0)")]
          assert loop.index("if (i >= max_bss_num)") < loop.index("bss_info[i].operating_chan"), "WAPP record bound is not checked before array writes"
          assert "i--;" not in loop and "too much bss wireless setting info" not in loop, "WAPP legacy post-write truncation remains"
          assert loop.count("break;") == 1, "WAPP parser loop contains non-EOF break"
          assert re.search(r'wrong format hidden ssid\\n"\);\s*goto err;', loop), "WAPP malformed hidden-SSID path is not fail-closed"
          err = wfn[wfn.index("err:"):]
          assert "*config_bss_num = 0;" in err and "memset(bss_info, 0, sizeof(*bss_info) * max_bss_num);" in err
          assert "if (ferror(f))\n\t\tgoto err;" in wfn
          assert "continue;" not in loop, "WAPP malformed sscanf input can continue with partial parser state"
          for field_error in ("index not found", "mac not found", "opclass not found", "ssid not found",
                              "authmode not found", "encrytype not found", "key not found",
                              "resv1 not found", "resv2 not found"):
              pos = loop.find(field_error)
              block_end = loop.find("}", pos)
              block = loop[pos:block_end + 1] if pos >= 0 and block_end >= 0 else ""
              assert "goto err;" in block and "break;" not in block, f"WAPP field must fail closed: {field_error}"
          wps = (root / "wappd/common/wdev.c").read_text()
          assert "key is configured, len = %d" in wps and "\\nSSID = %s, key = %s, len = %d" not in wps, "WAPP WPS credential log redaction missing"
          dw = (root / "wappd/dpp/dpp_wdev.c").read_text()
          conf_start = dw.index("int wapp_dpp_get_conf_frm_file(")
          conf_end = dw.index("\nvoid wapp_dpp_get_uri_frm_file", conf_start)
          conf_fn = dw[conf_start:conf_end]
          assert "char param[64] = {0}, value[64] = {0};" in conf_fn
          assert "if (!wapp || !wapp->map || !str)" in conf_fn
          assert "get_dpp_parameters(wapp->map, param, value, sizeof(value)) < 0" in conf_fn

          m = (root / "mapd/src/topologySrv/topologySrv.c").read_text()
          assert "key is configured" in m and "key=%s" not in m, "MAPD secret-log redaction missing"
          print("PASS: WAPP pre-write record bound, malformed-input fail-closed path and MAPD key-log redaction")
          print("PASS: P1905 pre-write record bound, fail-closed parser, output rollback and deferred MAP R2 state")
          PY
          echo "PASS: complete WAPP/MAPD/P1905 patch series applied to pinned archives with zero fuzz."

      - name: Upload exact P1905 and WAPP post-011 parser sources for patch rebasing
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: p1905-post-011-parser-source
          path: |
            ${{ runner.temp }}/p1905-post-011/file_io.c
            ${{ runner.temp }}/wapp-post-011/main.c
          if-no-files-found: error
          retention-days: 3

      - name: Upload verified source archive and audit inventory
        uses: actions/upload-artifact@v6
        with:
          name: wappd-80ca5724-source-audit
          path: |
            ${{ runner.temp }}/wapp-audit/wappd-80ca5724.tar.bz2
            ${{ runner.temp }}/wapp-audit/mapd-6eca4331.tar.bz2
            ${{ runner.temp }}/wapp-audit/1905daemon-35234223.tar.bz2
            ${{ runner.temp }}/wapp-audit/archive-files.txt
            ${{ runner.temp }}/wapp-audit/binaries/*
          if-no-files-found: error
          retention-days: 7

  conninfra-warp:
    if: inputs.component == 'conninfra' || inputs.component == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download and verify the exact conninfra source archive
        shell: bash
        run: |
          set -euo pipefail
          cp config/n60pro-1001.config .config
          make defconfig
          python3 package/mtk/applications/easymesh-n60/scripts/n60-vendor-lock.py verify-packages --repo "$GITHUB_WORKSPACE"
          mkdir -p audit/input audit/extracted audit/output
          make -C package/mtk/drivers/conninfra TOPDIR="$GITHUB_WORKSPACE" DL_DIR="$GITHUB_WORKSPACE/audit/input" download V=s
          python3 package/mtk/applications/easymesh-n60/scripts/n60-vendor-lock.py verify-downloads --repo "$GITHUB_WORKSPACE" --dl-dir audit/input --ids conninfra
          SOURCE="$(python3 - "$GITHUB_WORKSPACE" <<'PY'
          import json, pathlib, sys
          lock=json.loads((pathlib.Path(sys.argv[1])/"package/mtk/vendor-sources.lock.json").read_text())
          print(next(x["archive"] for x in lock["sources"] if x["id"]=="conninfra"))
          PY
          )"
          tar -xJf "audit/input/$SOURCE" -C audit/extracted
          python3 - <<'PY'
          from pathlib import Path
          root = Path("audit/extracted/conninfra")
          files = [p for p in root.rglob("*") if p.is_file()]
          headers = [p for p in files if p.suffix.lower() in {".h", ".hh", ".hpp"}]
          assert len(files) == 47, f"conninfra source inventory changed: {len(files)} files"
          assert len(headers) == 24, f"conninfra header inventory changed: {len(headers)} headers"
          print(f"PASS: conninfra archive inventory: {len(files)} files, {len(headers)} headers")
          PY
          PATCH_DIR="package/mtk/drivers/conninfra/patches"
          PATCH_LOG="audit/output/CONNINFRA-PATCH-APPLY.txt"
          : > "$PATCH_LOG"
          mapfile -t LOCKED_PATCHES < <(python3 package/mtk/applications/easymesh-n60/scripts/n60-vendor-lock.py patch-order --repo "$GITHUB_WORKSPACE" --set conninfra --phase all)
          for patch_name in "${LOCKED_PATCHES[@]}"; do
            patch_file="$PATCH_DIR/$patch_name"
            test -s "$patch_file" || { echo "::error::Missing/empty Lock-listed conninfra patch: $patch_file"; exit 1; }
            echo "CHECK $patch_file" | tee -a "$PATCH_LOG"
            patch --dry-run --batch --forward --fuzz=0 -p1 -d audit/extracted/conninfra < "$patch_file" 2>&1 | tee -a "$PATCH_LOG"
            patch --batch --forward --fuzz=0 -p1 -d audit/extracted/conninfra < "$patch_file" 2>&1 | tee -a "$PATCH_LOG"
          done
          if grep -RInE 'class_create.*THIS_MODULE|ioremap_nocache' audit/extracted/conninfra --include='*.c' --include='*.h'; then
            echo "::error::Known Linux 6.12 incompatible conninfra APIs remain after patch application."
            exit 1
          fi
          grep -RIn 'devm_clk_get_enabled' audit/extracted/conninfra/platform/consys_hw.c
          grep -RIn 'ret = dev_err_probe' audit/extracted/conninfra/platform/consys_hw.c
          grep -Fq '"mediatek,mt7986-wmac"' audit/extracted/conninfra/platform/consys_hw_plat_data.c
          grep -Fq 'conninfra_probe_status = 0' audit/extracted/conninfra/platform/consys_hw.c
          grep -Fq 'platform probe did not complete successfully' audit/extracted/conninfra/platform/consys_hw.c
          grep -Fq 'int FlashRead(char *name' audit/extracted/conninfra/base/osal.c
          grep -Fq '#include <linux/errno.h>' audit/extracted/conninfra/base/osal.c
          grep -Fq 'mt_eeprom_read_wifi(offset, size, value)' audit/extracted/conninfra/base/osal.c
          KERNEL_EEPROM_PATCH="target/linux/mediatek/patches-6.12/999-zzz-5203-mtk-wifi_utility-add-universal-eeprom-read-write-backend.patch"
          test -s "$KERNEL_EEPROM_PATCH"
          git apply --numstat "$KERNEL_EEPROM_PATCH" >/dev/null
          grep -Fq 'obj-y += mt_wifi_eeprom.o' "$KERNEL_EEPROM_PATCH"
          grep -Fq 'EXPORT_SYMBOL(mt_eeprom_read_wifi)' "$KERNEL_EEPROM_PATCH"
          grep -Fq 'mediatek,mt7986-wmac' "$KERNEL_EEPROM_PATCH"
          grep -Fq 'ioremap failed for register window' audit/extracted/conninfra/platform/mt7986/mt7986_consys_reg.c
          grep -Fq 'of_node_put(np)' audit/extracted/conninfra/platform/emi_mng.c
          grep -Fq 'gConEmiSize < fw_emi_size' audit/extracted/conninfra/platform/emi_mng.c
          grep -Fq 'osal_thread_destroy(p_thread)' audit/extracted/conninfra/base/msg_thread.c
          grep -Fq 'msg_thread_deinit(&infra_ctx->cb_ctx)' audit/extracted/conninfra/core/conninfra_core.c
          grep -Fq 'goto err_subdrv' audit/extracted/conninfra/core/conninfra_core.c
          grep -Fq 'ret = -EHOSTDOWN' audit/extracted/conninfra/core/conninfra_core.c
          grep -Fq 'ret = -EACCES' audit/extracted/conninfra/core/conninfra_core.c
          grep -Fq 'if (!value)' audit/extracted/conninfra/core/conninfra_core.c
          grep -Fq 'return -ENOMEM' audit/extracted/conninfra/platform/consys_reg_mng.c
          tar -czf audit/output/conninfra-source-patched.tar.gz -C audit/extracted/conninfra .

          make -C package/mtk/drivers/mt_wifi TOPDIR="$GITHUB_WORKSPACE" DL_DIR="$GITHUB_WORKSPACE/audit/input" download V=s
          python3 package/mtk/applications/easymesh-n60/scripts/n60-vendor-lock.py verify-downloads --repo "$GITHUB_WORKSPACE" --dl-dir audit/input --ids mtwifi
          MT_WIFI_SOURCE="$(python3 - "$GITHUB_WORKSPACE" <<'PY'
          import json, pathlib, sys
          lock=json.loads((pathlib.Path(sys.argv[1])/"package/mtk/vendor-sources.lock.json").read_text())
          print(next(x["archive"] for x in lock["sources"] if x["id"]=="mtwifi"))
          PY
          )"
          MT_WIFI_SHA256="$(python3 - "$GITHUB_WORKSPACE" <<'PY'
          import json, pathlib, sys
          lock=json.loads((pathlib.Path(sys.argv[1])/"package/mtk/vendor-sources.lock.json").read_text())
          print(next(x["sha256"] for x in lock["sources"] if x["id"]=="mtwifi"))
          PY
          )"
          mkdir -p audit/mtwifi
          tar -xJf "audit/input/$MT_WIFI_SOURCE" -C audit/mtwifi
          MT_WIFI_SRC="audit/mtwifi/mt_wifi"
          test -s "$MT_WIFI_SRC/os/linux/rt_linux.c" || { echo "::error::MT Wi-Fi source layout changed."; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root = Path("audit/mtwifi")
          files = [p for p in root.rglob("*") if p.is_file()]
          headers = [p for p in files if p.suffix.lower() in {".h", ".hh", ".hpp"}]
          assert len(files) == 1107, f"mt_wifi source inventory changed: {len(files)} files"
          assert len(headers) == 551, f"mt_wifi header inventory changed: {len(headers)} headers"
          elf_files = [p for p in files if p.read_bytes()[:4] == b"\x7fELF"]
          assert len(elf_files) == 10, f"mt_wifi ELF inventory changed: {len(elf_files)} ELF files"
          host_tools = {"mt_wifi/txpwr/data2h", "mt_wifi/txpwr/dat2h", "mt_wifi/embedded/tools/bin2h"}
          seen_host = set()
          seen_firmware = set()
          for path in elf_files:
              rel = path.relative_to(root).as_posix()
              desc = subprocess.run(["file", str(path)], check=True, text=True,
                                    stdout=subprocess.PIPE).stdout
              if "x86-64" in desc:
                  assert rel in host_tools, f"unexpected x86-64 executable in vendor archive: {rel}"
                  seen_host.add(rel)
              elif "Andes" in desc:
                  assert rel.startswith("bin/"), f"Andes ELF is outside firmware payload tree: {rel}"
                  seen_firmware.add(rel)
              else:
                  raise AssertionError(f"unclassified ELF architecture: {rel}: {desc.strip()}")
          assert seen_host == host_tools, f"host-tool inventory changed: {sorted(seen_host)}"
          assert len(seen_firmware) == 7, f"Andes firmware ELF inventory changed: {sorted(seen_firmware)}"
          print(f"PASS: mt_wifi archive inventory: {len(files)} files, {len(headers)} headers")
          print(f"PASS: binary classification: {len(seen_host)} x86-64 build tools, {len(seen_firmware)} Andes firmware ELF")
          PY
          MT_WIFI_MAKEFILE="package/mtk/drivers/mt_wifi/Makefile"
          grep -Fq 'PKG_BUILD_DEPENDS:=warp conninfra' "$MT_WIFI_MAKEFILE"
          grep -Fq 'KBUILD_EXTRA_SYMBOLS="$(KERNEL_BUILD_DIR)/conninfra/Module.symvers"' "$MT_WIFI_MAKEFILE"
          grep -Fq 'conninfra Module.symvers is missing' "$MT_WIFI_MAKEFILE"
          grep -Fq 'CONFIG_CONNINFRA_SUPPORT' "$MT_WIFI_SRC/os/linux/Makefile.mt_wifi_ap"
          DEP_REPORT="audit/output/MT-WIFI-CONNINFRA-DEPENDENCY-AUDIT.txt"
          : > "$DEP_REPORT"
          for symbol in conninfra_pwr_on conninfra_pwr_off conninfra_get_emi_phy_addr; do
            grep -Rqs "EXPORT_SYMBOL($symbol)" audit/extracted/conninfra --include='*.c' || {
              echo "::error::conninfra does not export required mt_wifi symbol: $symbol"
              exit 1
            }
            grep -Rqs "$symbol" "$MT_WIFI_SRC" --include='*.c' || {
              echo "::error::mt_wifi does not reference expected conninfra symbol: $symbol"
              exit 1
            }
            echo "PASS: $symbol is exported by conninfra and referenced by mt_wifi" | tee -a "$DEP_REPORT"
          done
          echo "PASS: mt_wifi has an explicit build dependency on conninfra (PKG_NAME)." | tee -a "$DEP_REPORT"
          echo "PASS: mt_wifi Kbuild receives conninfra Module.symvers." | tee -a "$DEP_REPORT"
          echo "MT Wi-Fi source SHA256: $MT_WIFI_SHA256" | tee -a "$DEP_REPORT"
          sha256sum audit/output/* > audit/output/SHA256SUMS.txt
          {
            echo "Repository revision: $(git rev-parse HEAD)"
            echo "Source archive: $SOURCE"
            echo "Archive SHA256 was verified against the canonical vendor Lock."
            echo "Archive size: $(stat -c %s "audit/input/$SOURCE") bytes"
            echo "Extracted files: $(find audit/extracted -type f | wc -l)"
            echo
            echo "===== FILE INVENTORY ====="
            find audit/extracted -type f -printf '%P\t%s bytes\n' | sort
            echo
            echo "===== BUILD FILES ====="
            find audit/extracted -type f \( -name 'Makefile' -o -name 'Kconfig' -o -name '*.mk' \) -print
            echo
            echo "===== KERNEL API CANDIDATES ====="
            grep -RInE 'get_fs|set_fs|mm_segment_t|ioremap_nocache|virt_to_bus|dma_[a-z_]+\(|class_create\(|proc_create\(|timer_setup\(|setup_timer\(|tasklet_[a-z_]+\(|netif_napi_add\(|strlcpy\(|prandom_u32|ktime_get_real_ts64|init_timer\(' audit/extracted --include='*.c' --include='*.h' || true
            echo
            echo "===== CONFIG AND PLATFORM CANDIDATES ====="
            grep -RInE 'MT7986|MT7981|CONNINFRA_APSOC|EMI_SUPPORT|AUTO_UP|CONFIG_' audit/extracted --include='Makefile' --include='Kconfig' --include='*.mk' --include='*.c' --include='*.h' | head -n 500 || true
            echo
            echo "===== SYMBOL EXPORTS AND IMPORTS ====="
            grep -RInE 'EXPORT_SYMBOL(_GPL)?|MODULE_IMPORT_NS|extern[[:space:]].*conninfra|conninfra_' audit/extracted --include='*.c' --include='*.h' || true
          } > audit/output/CONNINFRA-SOURCE-AUDIT-INITIAL.txt
          tar -czf audit/output/conninfra-source-extracted.tar.gz -C audit/extracted .
          cp "audit/input/$SOURCE" audit/output/
          cat audit/output/CONNINFRA-SOURCE-AUDIT-INITIAL.txt

      - name: Download and apply the complete WARP Linux 6.12 patch stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/warp/input audit/warp/extracted audit/output
          make -C package/mtk/drivers/warp TOPDIR="$GITHUB_WORKSPACE" DL_DIR="$GITHUB_WORKSPACE/audit/warp/input" download V=s
          python3 package/mtk/applications/easymesh-n60/scripts/n60-vendor-lock.py verify-downloads --repo "$GITHUB_WORKSPACE" --dl-dir audit/warp/input --ids warp
          SOURCE="$(python3 - "$GITHUB_WORKSPACE" <<'PY'
          import json, pathlib, sys
          lock=json.loads((pathlib.Path(sys.argv[1])/"package/mtk/vendor-sources.lock.json").read_text())
          print(next(x["archive"] for x in lock["sources"] if x["id"]=="warp"))
          PY
          )"
          tar -xJf "audit/warp/input/$SOURCE" -C audit/warp/extracted
          python3 - <<'PY'
          from pathlib import Path
          root = Path("audit/warp/extracted/warp")
          files = [p for p in root.rglob("*") if p.is_file()]
          headers = [p for p in files if p.suffix.lower() in {".h", ".hh", ".hpp"}]
          assert len(files) == 71, f"WARP source inventory changed: {len(files)} files"
          assert len(headers) == 35, f"WARP header inventory changed: {len(headers)} headers"
          print(f"PASS: WARP archive inventory: {len(files)} files, {len(headers)} headers")
          PY
          WARP_SRC="audit/warp/extracted/warp"
          test -s "$WARP_SRC/warp_proc.c" || { echo "::error::WARP source layout changed."; exit 1; }
          PATCH_DIR="package/mtk/drivers/warp/patches"
          PATCH_LOG="audit/output/WARP-PATCH-APPLY.txt"
          : > "$PATCH_LOG"
          mapfile -t LOCKED_PATCHES < <(python3 package/mtk/applications/easymesh-n60/scripts/n60-vendor-lock.py patch-order --repo "$GITHUB_WORKSPACE" --set warp --phase all)
          for patch_name in "${LOCKED_PATCHES[@]}"; do
            patch_file="$PATCH_DIR/$patch_name"
            test -s "$patch_file" || { echo "::error::Missing/empty Lock-listed WARP patch: $patch_file"; exit 1; }
            echo "CHECK $patch_file" | tee -a "$PATCH_LOG"
            patch --dry-run --batch --forward --fuzz=0 -p1 -d "$WARP_SRC" < "$patch_file" 2>&1 | tee -a "$PATCH_LOG"
            patch --batch --forward --fuzz=0 -p1 -d "$WARP_SRC" < "$patch_file" 2>&1 | tee -a "$PATCH_LOG"
          done
          grep -Fq 'struct proc_ops' "$WARP_SRC/warp_proc.c"
          grep -Fq 'pde_data(' "$WARP_SRC/warp_proc.c"
          if grep -nE 'PDE_DATA\(|struct file_operations' "$WARP_SRC/warp_proc.c"; then
            echo "::error::WARP procfs source still contains pre-5.17 file_operations/PDE_DATA APIs."
            exit 1
          fi
          grep -Fqx 'PATCH_DIR:=patches' package/mtk/drivers/warp/Makefile
          tar -czf audit/output/warp-source-patched.tar.gz -C "$WARP_SRC" .
          cp "audit/warp/input/$SOURCE" audit/output/
          {
            echo "Repository revision: $(git rev-parse HEAD)"
            echo "Source archive: $SOURCE"
            echo "Archive SHA256 was verified against the canonical vendor Lock."
            echo "Extracted source root: $WARP_SRC"
            echo "Patch stack: $PATCH_DIR"
            echo "Verified: proc_ops and pde_data are applied; legacy procfs API references are absent."
            echo
            echo "===== WARP PROCFS PATCHED API ====="
            grep -nE 'struct proc_ops|pde_data\(' "$WARP_SRC/warp_proc.c"
            echo
            echo "===== WARP PATCH INVENTORY ====="
            find "$PATCH_DIR" -maxdepth 1 -type f -name '*.patch' -printf '%f\n' | sort
          } > audit/output/WARP-SOURCE-AUDIT.txt
          cat audit/output/WARP-SOURCE-AUDIT.txt

      - name: Upload verified source and initial inventory
        uses: actions/upload-artifact@v6
        with:
          name: n60-conninfra-warp-source-audit-${{ github.run_number }}
          path: audit/output/
          if-no-files-found: error
          retention-days: 14

  wts-template:
    if: inputs.component == 'wts' || inputs.component == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download and verify all remaining 7.6.7.3 EasyMesh source packages
        shell: bash
        run: |
          set -euo pipefail
          cp config/n60pro-1001.config .config
          make defconfig
          python3 package/mtk/applications/easymesh-n60/scripts/n60-vendor-lock.py verify-packages --repo "$GITHUB_WORKSPACE"
          mkdir -p "$RUNNER_TEMP/wts-audit"/{archives,mapd,1905,mapfilter,libmapd,bndstrg_plus,fwdd}
          python3 package/mtk/applications/easymesh-n60/scripts/n60-vendor-lock.py download \
            --repo "$GITHUB_WORKSPACE" --dl-dir "$RUNNER_TEMP/wts-audit/archives" \
            --ids mapd 1905daemon libmapd bndstrg_plus fwdd
          make -C package/mtk/applications/datconf TOPDIR="$GITHUB_WORKSPACE" DL_DIR="$RUNNER_TEMP/wts-audit/archives" download V=s
          make -C package/kernel/mapfilter TOPDIR="$GITHUB_WORKSPACE" DL_DIR="$RUNNER_TEMP/wts-audit/archives" download V=s
          python3 package/mtk/applications/easymesh-n60/scripts/n60-vendor-lock.py verify-downloads \
            --repo "$GITHUB_WORKSPACE" --dl-dir "$RUNNER_TEMP/wts-audit/archives" --ids datconf mapfilter
          cd "$RUNNER_TEMP/wts-audit/archives"
          tar -xjf mapd-6eca4331.tar.bz2 -C "$RUNNER_TEMP/wts-audit/mapd"
          tar -xjf 1905daemon-35234223.tar.bz2 -C "$RUNNER_TEMP/wts-audit/1905"
          tar -xjf mapfilter-96f2afed.tar.bz2 -C "$RUNNER_TEMP/wts-audit/mapfilter"
          tar -xjf libmapd-0132d199.tar.bz2 -C "$RUNNER_TEMP/wts-audit/libmapd"
          tar -xjf bndstrg_plus-8350508d.tar.bz2 -C "$RUNNER_TEMP/wts-audit/bndstrg_plus"
          tar -xjf fwdd-bcbae0e4.tar.bz2 -C "$RUNNER_TEMP/wts-audit/fwdd"
          echo "MAPD source files: $(find "$RUNNER_TEMP/wts-audit/mapd" -type f | wc -l)"
          echo "P1905 source files: $(find "$RUNNER_TEMP/wts-audit/1905" -type f | wc -l)"
          echo "mapfilter source files: $(find "$RUNNER_TEMP/wts-audit/mapfilter" -type f | wc -l)"
          echo "libmapd source files: $(find "$RUNNER_TEMP/wts-audit/libmapd" -type f | wc -l)"
          echo "bndstrg_plus source files: $(find "$RUNNER_TEMP/wts-audit/bndstrg_plus" -type f | wc -l)"
          echo "fwdd source files: $(find "$RUNNER_TEMP/wts-audit/fwdd" -type f | wc -l)"
          echo "===== BUILD ENTRYPOINT INVENTORY ====="
          find "$RUNNER_TEMP/wts-audit" -type f \( -name Makefile -o -name makefile -o -name GNUmakefile -o -name CMakeLists.txt -o -name configure -o -name '*.mk' \) -print | sort

      - name: Trace WTS template semantics and device-specific MAC registration
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/wts-audit"
          python3 - <<'PY'
          import pathlib, re
          out = []
          roots = {"MAPD": pathlib.Path("mapd"), "P1905": pathlib.Path("1905")}
          patterns = re.compile(
              r"wts_bss_info_config|wts.?bss|bss_config_num|bss_config_priority|"
              r"temp.?bssid|bssid|al_inf|al.?mac|own.?mac|read_bss_conf|"
              r"get_wireless_interfaces|need_to_update_wts|WAPP_OPERBSS_REPORT|"
              r"topo_srv_update_wts_config|topo_srv_parse_wts_config",
              re.I
          )
          for label, root in roots.items():
              files = [p for p in root.rglob("*") if p.is_file() and p.suffix.lower() in {".c",".h",".cc",".cpp",".hpp"}]
              out.append(f"===== {label}: {len(files)} C/C++ source files =====")
              matches = 0
              for p in files:
                  lines = p.read_text(errors="replace").splitlines()
                  for n, line in enumerate(lines, 1):
                      if patterns.search(line):
                          out.append(f"{p}:{n}:{line[:260]}")
                          matches += 1
                          if matches >= 500:
                              out.append("MATCH LIMIT REACHED")
                              break
                  if matches >= 500:
                      break
              out.append(f"{label} MATCHES: {matches}")
          out.append("\n===== FUNCTION BODIES: WTS / BSS / MAC / INTERFACE =====")
          name_rx = re.compile(r"(wts|bss.*conf|conf.*bss|wireless_interfaces|al.?mac|own.*mac|mac.*addr|oper.*bss)", re.I)
          for label, root in roots.items():
              for p in root.rglob("*"):
                  if not p.is_file() or p.suffix.lower() not in {".c",".h"}:
                      continue
                  try: s = p.read_text(errors="replace")
                  except Exception: continue
                  lines = s.splitlines()
                  for i, line in enumerate(lines):
                      if name_rx.search(line) and re.search(r"\)\s*\{\s*$", line):
                          depth = 0
                          started = False
                          body = []
                          for j in range(i, min(len(lines), i+500)):
                              body.append(f"{p}:{j+1}:{lines[j]}")
                              depth += lines[j].count("{") - lines[j].count("}")
                              if "{" in lines[j]: started = True
                              if started and depth == 0:
                                  break
                          out.append("\n--- " + label + " " + line.strip() + " ---")
                          out.extend(body)
          report = "\n".join(out)
          pathlib.Path("wts-template-mac-audit.txt").write_text(report)
          print(report[:120000])
          PY

      - name: Upload source audit report
        uses: actions/upload-artifact@v6
        with:
          name: easymesh-wts-template-mac-audit
          path: |
