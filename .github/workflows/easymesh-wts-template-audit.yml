name: Audit EasyMesh WTS template and runtime MAC binding

on:
  push:
    branches: ["n60pro-mtk-closed-driver"]
    paths:
      - ".github/workflows/easymesh-wts-template-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download and verify all remaining 7.6.7.3 EasyMesh source packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wts-audit"/{archives,mapd,1905,mapfilter,libmapd,bndstrg_plus,fwdd}
          cd "$RUNNER_TEMP/wts-audit/archives"
          curl -fL --retry 3 https://github.com/laodadelaoda/immortalwrt-mt798x-rebase/releases/download/dl-sources-7.6.7.3/mapd-6eca4331.tar.bz2 -o mapd.tar.bz2
          echo "39ab37cb347d372e352ade03181bc9c23429d4d849d32acbdff00973547d7e18  mapd.tar.bz2" | sha256sum -c -
          curl -fL --retry 3 https://github.com/laodadelaoda/immortalwrt-mt798x-rebase/releases/download/dl-sources-7.6.7.3/1905daemon-35234223.tar.bz2 -o 1905daemon.tar.bz2
          echo "82f7cc4ad5731e750f87c9a4ad19a39d2456bb8fec0cf79bf4b3f3ccb4f14795  1905daemon.tar.bz2" | sha256sum -c -
          curl -fL --retry 3 https://github.com/laodadelaoda/immortalwrt-mt798x-rebase/releases/download/dl-sources-7.6.7.3/mapfilter-96f2afed.tar.bz2 -o mapfilter.tar.bz2
          echo "3928c6614b84e74f1f1762cee61de8e422299e792f5f363dc369dfc0ed0f1714  mapfilter.tar.bz2" | sha256sum -c -
          curl -fL --retry 3 https://github.com/laodadelaoda/immortalwrt-mt798x-rebase/releases/download/dl-sources-7.6.7.3/libmapd-0132d199.tar.bz2 -o libmapd.tar.bz2
          echo "d325b4a8dc2bf44bd3bd639a0c300380c0a6240f407807f8f2eea80d006c8dba  libmapd.tar.bz2" | sha256sum -c -
          curl -fL --retry 3 https://github.com/laodadelaoda/immortalwrt-mt798x-rebase/releases/download/dl-sources-7.6.7.3/bndstrg_plus-8350508d.tar.bz2 -o bndstrg_plus.tar.bz2
          echo "e6e64967c7dbc1b9c56183bcea279ad9718bc7267d61b7583965c2f700d179b4  bndstrg_plus.tar.bz2" | sha256sum -c -
          curl -fL --retry 3 https://github.com/laodadelaoda/immortalwrt-mt798x-rebase/releases/download/dl-sources-7.6.7.3/fwdd-bcbae0e4.tar.bz2 -o fwdd.tar.bz2
          echo "26a7ad4f55ca0a779e4178b5b8f918df99de90217d9d98a840a20fddd4123a65  fwdd.tar.bz2" | sha256sum -c -
          tar -xjf mapd.tar.bz2 -C "$RUNNER_TEMP/wts-audit/mapd"
          tar -xjf 1905daemon.tar.bz2 -C "$RUNNER_TEMP/wts-audit/1905"
          tar -xjf mapfilter.tar.bz2 -C "$RUNNER_TEMP/wts-audit/mapfilter"
          tar -xjf libmapd.tar.bz2 -C "$RUNNER_TEMP/wts-audit/libmapd"
          tar -xjf bndstrg_plus.tar.bz2 -C "$RUNNER_TEMP/wts-audit/bndstrg_plus"
          tar -xjf fwdd.tar.bz2 -C "$RUNNER_TEMP/wts-audit/fwdd"
          echo "MAPD source files: $(find "$RUNNER_TEMP/wts-audit/mapd" -type f | wc -l)"
          echo "P1905 source files: $(find "$RUNNER_TEMP/wts-audit/1905" -type f | wc -l)"
          echo "mapfilter source files: $(find "$RUNNER_TEMP/wts-audit/mapfilter" -type f | wc -l)"
          echo "libmapd source files: $(find "$RUNNER_TEMP/wts-audit/libmapd" -type f | wc -l)"
          echo "bndstrg_plus source files: $(find "$RUNNER_TEMP/wts-audit/bndstrg_plus" -type f | wc -l)"
          echo "fwdd source files: $(find "$RUNNER_TEMP/wts-audit/fwdd" -type f | wc -l)"
          echo "===== BUILD ENTRYPOINT INVENTORY ====="
          find "$RUNNER_TEMP/wts-audit" -type f \( -name Makefile -o -name makefile -o -name GNUmakefile -o -name CMakeLists.txt -o -name configure -o -name '*.mk' \) -print | sort

      - name: Trace WTS template semantics and device-specific MAC registration
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/wts-audit"
          python3 - <<'PY'
          import pathlib, re
          out = []
          roots = {"MAPD": pathlib.Path("mapd"), "P1905": pathlib.Path("1905")}
          patterns = re.compile(
              r"wts_bss_info_config|wts.?bss|bss_config_num|bss_config_priority|"
              r"temp.?bssid|bssid|al_inf|al.?mac|own.?mac|read_bss_conf|"
              r"get_wireless_interfaces|need_to_update_wts|WAPP_OPERBSS_REPORT|"
              r"topo_srv_update_wts_config|topo_srv_parse_wts_config",
              re.I
          )
          for label, root in roots.items():
              files = [p for p in root.rglob("*") if p.is_file() and p.suffix.lower() in {".c",".h",".cc",".cpp",".hpp"}]
              out.append(f"===== {label}: {len(files)} C/C++ source files =====")
              matches = 0
              for p in files:
                  lines = p.read_text(errors="replace").splitlines()
                  for n, line in enumerate(lines, 1):
                      if patterns.search(line):
                          out.append(f"{p}:{n}:{line[:260]}")
                          matches += 1
                          if matches >= 500:
                              out.append("MATCH LIMIT REACHED")
                              break
                  if matches >= 500:
                      break
              out.append(f"{label} MATCHES: {matches}")
          out.append("\n===== FUNCTION BODIES: WTS / BSS / MAC / INTERFACE =====")
          name_rx = re.compile(r"(wts|bss.*conf|conf.*bss|wireless_interfaces|al.?mac|own.*mac|mac.*addr|oper.*bss)", re.I)
          for label, root in roots.items():
              for p in root.rglob("*"):
                  if not p.is_file() or p.suffix.lower() not in {".c",".h"}:
                      continue
                  try: s = p.read_text(errors="replace")
                  except Exception: continue
                  lines = s.splitlines()
                  for i, line in enumerate(lines):
                      if name_rx.search(line) and re.search(r"\)\s*\{\s*$", line):
                          depth = 0
                          started = False
                          body = []
                          for j in range(i, min(len(lines), i+500)):
                              body.append(f"{p}:{j+1}:{lines[j]}")
                              depth += lines[j].count("{") - lines[j].count("}")
                              if "{" in lines[j]: started = True
                              if started and depth == 0:
                                  break
                          out.append("\n--- " + label + " " + line.strip() + " ---")
                          out.extend(body)
          report = "\n".join(out)
          pathlib.Path("wts-template-mac-audit.txt").write_text(report)
          print(report[:120000])
          PY

      - name: Upload source audit report
        uses: actions/upload-artifact@v4
        with:
          name: easymesh-wts-template-mac-audit
          path: |
            ${{ runner.temp }}/wts-audit/wts-template-mac-audit.txt
            ${{ runner.temp }}/wts-audit/archives/*.tar.bz2
            ${{ runner.temp }}/wts-audit/mapd/**
            ${{ runner.temp }}/wts-audit/1905/**
            ${{ runner.temp }}/wts-audit/mapfilter/**
            ${{ runner.temp }}/wts-audit/libmapd/**
            ${{ runner.temp }}/wts-audit/bndstrg_plus/**
            ${{ runner.temp }}/wts-audit/fwdd/**
          if-no-files-found: error
          retention-days: 7
