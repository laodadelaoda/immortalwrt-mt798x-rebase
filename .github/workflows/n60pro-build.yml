name: N60 Pro Build Pipeline

on:
  push:
    branches:
      - n60pro-mtk-closed-driver
      - n60pro-25.12-upstream-base
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - n60pro-mtk-closed-driver
      - n60pro-25.12-upstream-base
  workflow_dispatch:
    inputs:
      run_full:
        description: Run Full firmware after the canonical Vendor Audit succeeds
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  vendor-audit:
    name: Canonical vendor and EasyMesh patch audit
    uses: ./.github/workflows/easymesh-patch-replay.yml
    permissions:
      contents: read

  quick:
    name: N60 Pro Quick Build
    needs: vendor-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    concurrency:
      group: n60-pro-quick-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout exact audited source revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Build EasyMesh from source
        uses: ./.github/actions/easymesh-quick
        with:
          device: netcore_n60-pro

  # Quick remains an independent diagnostic; it never gates the Full firmware build.
  # Full consumes the exact-run Vendor Audit attestation before native OpenWrt patching.
  firmware:
    name: Build complete ImmortalWrt firmware for Netcore N60 Pro
    needs: [vendor-audit]
    if: needs.vendor-audit.result == 'success' && (github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_full))
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    concurrency:
      group: n60pro-full-firmware
      cancel-in-progress: false
    steps:
      - name: Checkout exact audited source revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "Build revision: $(git rev-parse HEAD)"

      - name: Download canonical Vendor Audit evidence from this run and attempt
        uses: actions/download-artifact@v6
        with:
          name: n60pro-canonical-vendor-audit-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n60pro-vendor-audit-evidence

      - name: Verify Vendor Audit attestation, Lock, source files and complete kernel patch inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 package/mtk/applications/easymesh-n60/scripts/verify-vendor-audit-attestation.py verify \
            --repo "$GITHUB_WORKSPACE" \
            --attestation "$RUNNER_TEMP/n60pro-vendor-audit-evidence/vendor-audit-attestation.json" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h

      - name: Install OpenWrt build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-dev rsync unzip zlib1g-dev file wget time xsltproc libelf-dev device-tree-compiler qemu-utils python3-setuptools python3-pyelftools swig ccache

      - name: Configure build environment
        shell: bash
        run: |
          echo "GOPROXY=https://goproxy.cn,direct" >> "$GITHUB_ENV"
          echo "GOSUMDB=off" >> "$GITHUB_ENV"

      - name: Restore Full-only build cache
        id: full-cache
        uses: actions/cache@v5
        with:
          path: |
            build_dir
            staging_dir
            dl
          key: ${{ runner.os }}-n60pro-full-${{ github.sha }}-${{ hashFiles('Makefile', 'rules.mk', 'config/**', 'feeds.conf.default', 'include/**', 'scripts/**', 'tools/**', 'toolchain/**', 'target/linux/**', 'package/mtk/applications/easymesh-n60/**', 'package/mtk/applications/datconf/**', 'package/libs/openssl/**', 'package/libs/libnl-tiny/**', 'package/mtk/vendor-sources.lock.json') }}

      - name: Report Full cache reuse
        shell: bash
        run: |
          if [ "${{ steps.full-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Restored build_dir, staging_dir and dl from a Full-mode cache for ${GITHUB_SHA}."
          else
            echo "No exact-revision Full cache found; Full will build missing targets normally."
          fi

      - name: Update and install feeds
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure N60 Pro Standard firmware
        shell: bash
        run: |
          set -euo pipefail
          cp config/n60pro-1001.config .config
          echo 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netcore_n60-pro=y' >> .config
          echo 'CONFIG_PACKAGE_easymesh-n60=y' >> .config
          make defconfig
          grep -Fx 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netcore_n60-pro=y' .config
          grep -Fx 'CONFIG_PACKAGE_easymesh-n60=y' .config

      - name: Verify complete Linux 6.12.116 native patch stack
        shell: bash
        run: |
          set -Eeuo pipefail
          PATCH_DIR="target/linux/mediatek/patches-6.12"
          test -d "$PATCH_DIR"
          test -f "$PATCH_DIR/999-eth-91-mtk_eth_soc-add-mtkhnat-driver-support.patch"
          test -f "$PATCH_DIR/999-eth-93-mtk_eth_soc-add-internal-SER-notify-event.patch"
          test -f "$PATCH_DIR/999-eth-90-mtk_eth_soc-support-proprietary-debugfs.patch"
          test ! -e "$PATCH_DIR/999-hnat-13-netdevice-add-ndo_flow_offload_stats64_add-for-offload-stats-correction.patch"
          mapfile -t PATCHES < <(find "$PATCH_DIR" -maxdepth 1 -type f -name '*.patch' -print | sort)
          COUNT="${#PATCHES[@]}"
          test "$COUNT" -gt 0
          echo "All native Linux 6.12 patch files are covered by the exact-run Vendor Audit attestation."
          echo "Patch count: $COUNT"
          sha256sum "${PATCHES[@]}" > "$RUNNER_TEMP/n60pro-kernel-patches.sha256"
          sha256sum "$RUNNER_TEMP/n60pro-kernel-patches.sha256"
          cat "$RUNNER_TEMP/n60pro-kernel-patches.sha256"

      - name: Download package sources
        shell: bash
        run: |
          set -euo pipefail
          make download -j8

      - name: Compile complete firmware
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j"$(nproc)" V=s

      - name: Confirm firmware output exists
        shell: bash
        run: |
          set -euo pipefail
          OUT="bin/targets/mediatek/filogic"
          test -d "$OUT"
          find "$OUT" -maxdepth 1 -type f -printf '%f\n' | tee "$RUNNER_TEMP/n60-firmware-files.txt"
          test -s "$RUNNER_TEMP/n60-firmware-files.txt"
          grep -Eq '\.(itb|bin|img|gz|zst)$' "$RUNNER_TEMP/n60-firmware-files.txt"

      - name: Upload N60 Pro firmware
        uses: actions/upload-artifact@v6
        with:
          name: n60pro-immortalwrt-firmware-${{ github.run_number }}
          path: bin/targets/mediatek/filogic/
          if-no-files-found: error
          retention-days: 30
