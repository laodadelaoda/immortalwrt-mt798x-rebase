name: N60 Pro Full Build

on:
  push:
    branches:
      - n60pro-25.12-upstream-base
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - n60pro-25.12-upstream-base
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  firmware:
    name: Build complete ImmortalWrt firmware for Netcore N60 Pro
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    concurrency:
      group: n60pro-full-firmware-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "Build revision: $(git rev-parse HEAD)"

      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h

      - name: Install OpenWrt build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-dev rsync unzip zlib1g-dev file wget time xsltproc libelf-dev device-tree-compiler qemu-utils python3-setuptools python3-pyelftools swig ccache

      - name: Configure build environment
        shell: bash
        run: |
          echo "GOPROXY=https://goproxy.cn,direct" >> "$GITHUB_ENV"
          echo "GOSUMDB=off" >> "$GITHUB_ENV"

      - name: Restore Full-only build cache
        id: full-cache
        uses: actions/cache@v5
        with:
          path: |
            build_dir
            staging_dir
            dl
          key: ${{ runner.os }}-n60pro-full-${{ github.sha }}-${{ hashFiles('Makefile', 'rules.mk', 'config/**', 'feeds.conf.default', 'include/**', 'scripts/**', 'tools/**', 'toolchain/**', 'target/linux/**', 'package/mtk/applications/easymesh-n60/**', 'package/mtk/applications/datconf/**', 'package/libs/openssl/**', 'package/libs/libnl-tiny/**', 'package/mtk/vendor-sources.lock.json') }}

      - name: Report Full cache reuse
        shell: bash
        run: |
          if [ "${{ steps.full-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Restored build_dir, staging_dir and dl from a Full-mode cache for ${GITHUB_SHA}."
          else
            echo "No exact-revision Full cache found; Full will build missing targets normally."
          fi

      - name: Update and install feeds
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure N60 Pro Standard firmware
        shell: bash
        run: |
          set -euo pipefail
          cp config/n60pro-1001.config .config
          echo 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netcore_n60-pro=y' >> .config
          echo 'CONFIG_PACKAGE_easymesh-n60=y' >> .config
          make defconfig
          grep -Fx 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netcore_n60-pro=y' .config
          grep -Fx 'CONFIG_PACKAGE_easymesh-n60=y' .config

      - name: Download package sources
        shell: bash
        run: |
          set -euo pipefail
          make download -j8

      - name: Compile complete firmware
        id: full-compile
        shell: bash
        run: |
          set -Eeuo pipefail
          LOG="$RUNNER_TEMP/n60pro-full-build.log"
          if make -j"$(nproc)" V=s >"$LOG" 2>&1; then
            tail -n 100 "$LOG"
          else
            rc=$?
            python3 - "$LOG" "$RUNNER_TEMP/n60pro-full-build-diagnostics.txt" <<'PY'
          from pathlib import Path
          import re, sys

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])
          lines = source.read_text(encoding="utf-8", errors="replace").splitlines()
          pattern = re.compile(
              r"fatal error:|\\berror:|undefined reference|undefined symbol|"
              r"No rule to make target|No such file or directory|Hunk FAILED|"
              r"patch: \\*\\*\\*\\*|collect2: error|Killed signal|"
              r"No space left on device|make(?:\\[\\d+\\])?: \\*\\*\\*",
              re.I,
          )
          hits = [i for i, line in enumerate(lines) if pattern.search(line)]
          ranges = []
          for i in hits:
              start, end = max(0, i - 150), min(len(lines), i + 151)
              if ranges and start <= ranges[-1][1]:
                  ranges[-1] = (ranges[-1][0], max(ranges[-1][1], end))
              else:
                  ranges.append((start, end))
          with target.open("w", encoding="utf-8") as out:
              out.write(f"LOG_LINES={len(lines)}\\nMATCH_COUNT={len(hits)}\\n")
              for start, end in ranges:
                  out.write(f"\\n===== LOG LINES {start + 1}-{end} =====\\n")
                  for n in range(start, end):
                      out.write(f"{n + 1}: {lines[n]}\\n")
              out.write("\\n===== FINAL 250 LOG LINES =====\\n")
              for n in range(max(0, len(lines) - 250), len(lines)):
                  out.write(f"{n + 1}: {lines[n]}\\n")
          print(f"Full log saved: {source} ({len(lines)} lines)")
          print(f"Failure context saved: {target} ({len(hits)} diagnostic matches)")
          PY
            tail -n 200 "$RUNNER_TEMP/n60pro-full-build-diagnostics.txt"
            exit "$rc"
          fi

      - name: Upload Full failure diagnostics
        if: failure() && steps.full-compile.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: n60pro-full-build-failure-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/n60pro-full-build.log
            ${{ runner.temp }}/n60pro-full-build-diagnostics.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Confirm firmware output exists
        shell: bash
        run: |
          set -euo pipefail
          OUT="bin/targets/mediatek/filogic"
          test -d "$OUT"
          find "$OUT" -maxdepth 1 -type f -printf '%f\n' | tee "$RUNNER_TEMP/n60-firmware-files.txt"
          test -s "$RUNNER_TEMP/n60-firmware-files.txt"
          grep -Eq '\.(itb|bin|img|gz|zst)$' "$RUNNER_TEMP/n60-firmware-files.txt"

      - name: Upload N60 Pro firmware
        uses: actions/upload-artifact@v6
        with:
          name: n60pro-immortalwrt-firmware-${{ github.run_number }}
          path: bin/targets/mediatek/filogic/
          if-no-files-found: error
          retention-days: 30

  merge-validated-upstream-candidate:
    name: Merge upstream candidate after successful Full firmware build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/automation/upstream-25.12-candidate'
    needs: firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify exact candidate revision and non-empty firmware artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RUN_ID"
          test -n "$HEAD_SHA"
          test "$GITHUB_REF" = "refs/heads/automation/upstream-25.12-candidate"
          ARTIFACTS_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts")"
          FIRMWARE_COUNT="$(printf '%s' "$ARTIFACTS_JSON" | jq --arg name "n60pro-immortalwrt-firmware-$RUN_NUMBER" '[.artifacts[] | select(.name == $name) | select(.expired == false) | select(.size_in_bytes > 0)] | length')"
          test "$FIRMWARE_COUNT" -ge 1
          echo "Exact candidate $HEAD_SHA passed Full and uploaded a non-empty firmware artifact."

      - name: Merge only the exact validated candidate PR
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          HEAD_BRANCH: automation/upstream-25.12-candidate
          TARGET_BRANCH: n60pro-25.12-upstream-base
        shell: bash
        run: |
          set -Eeuo pipefail
          PR_JSON="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_BRANCH" --base "$TARGET_BRANCH" --state open --json number,headRefOid,isDraft)"
          PR_COUNT="$(printf '%s' "$PR_JSON" | jq 'length')"
          test "$PR_COUNT" -eq 1
          PR_NUMBER="$(printf '%s' "$PR_JSON" | jq -r '.[0].number')"
          PR_HEAD="$(printf '%s' "$PR_JSON" | jq -r '.[0].headRefOid')"
          PR_DRAFT="$(printf '%s' "$PR_JSON" | jq -r '.[0].isDraft')"
          test "$PR_HEAD" = "$HEAD_SHA"
          if [ "$PR_DRAFT" = "true" ]; then gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"; fi
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge --delete-branch
          git init verify-merge
          cd verify-merge
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags origin "$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          git merge-base --is-ancestor "$HEAD_SHA" "refs/remotes/origin/$TARGET_BRANCH"
          echo "Merged PR #$PR_NUMBER after exact-SHA Full success and firmware artifact verification."
