name: Build Specific APK Package

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: '要编译的包名 (例如 kmod-fs-ksmbd 或 luci-app-ttyd)'
        required: true
        default: 'kmod-fs-ksmbd'
      device:
        description: '目标设备 (决定使用哪个 config)'
        required: true
        default: 'netcore_n60-pro'

jobs:
  build_apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-dev rsync unzip zlib1g-dev file wget time xsltproc \
            libelf-dev device-tree-compiler qemu-utils python3-setuptools \
            python3-pyelftools swig ccache

      # 极其重要：必须复用主固件的编译缓存，否则内核 Hash 不匹配，单独编 kmod 会耗费 40 分钟以上
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            build_dir/target-aarch64_cortex-a53_musl
            staging_dir
          key: ${{ runner.os }}-n60pro-builddir-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-n60pro-builddir-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure for specific package
        shell: bash
        run: |
          # 1. 加载与固件完全相同的基础配置，保证内核 Hash 匹配
          if [ -f "config/${{ github.event.inputs.device }}.config" ]; then
            cp "config/${{ github.event.inputs.device }}.config" .config
          else
            cp config/n60pro-1001.config .config
          fi
          
          # 2. 强制开启目标包
          echo "CONFIG_PACKAGE_${{ github.event.inputs.package_name }}=y" >> .config
          
          # 3. 生成最终配置
          make defconfig

      - name: Compile target package
        shell: bash
        run: |
          echo "===== Compiling ${{ github.event.inputs.package_name }} ====="
          # 只编译目标包及其依赖，跳过整个固件的打包过程
          make package/${{ github.event.inputs.package_name }}/compile V=s -j$(nproc)

      - name: Collect APK and Public Keys
        shell: bash
        env:
          PKG_NAME: ${{ github.event.inputs.package_name }}
        run: |
          mkdir -p custom-apks
          
          echo "===== 查找生成的 APK ====="
          # 抓取目标包
          find bin/packages/aarch64_cortex-a53/ -type f -name "${PKG_NAME}*.apk" -exec cp {} custom-apks/ \; 2>/dev/null
          # 抓取内核模块包（如果是 kmod，通常生成在 targets 目录）
          find bin/targets/mediatek/filogic/packages/ -type f -name "*.apk" -exec cp {} custom-apks/ \; 2>/dev/null
          
          echo "===== 提取本次编译的 APK 签名公钥 ====="
          # OpenWrt 25.12 apk 签名公钥通常在 staging_dir 里
          find staging_dir/ -name "*.pub" -exec cp {} custom-apks/ \; 2>/dev/null
          
          echo "===== 提取结果 ====="
          ls -l custom-apks/
          
          # 打包压缩
          if [ "$(ls -A custom-apks)" ]; then
            tar -czf specific-apks-${PKG_NAME}.tar.gz -C custom-apks .
            echo "✅ 打包成功: specific-apks-${PKG_NAME}.tar.gz"
          else
            echo "❌ 未找到任何 .apk 包，请检查包名是否正确。"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.package_name }}
          path: specific-apks-*.tar.gz
