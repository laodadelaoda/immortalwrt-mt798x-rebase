name: Build Specific APK Package

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: '仅允许构建已审阅依赖闭包的普通包'
        required: true
        type: choice
        default: luci-app-ttyd
        options:
          - luci-app-ttyd
          - kmod-fs-ksmbd
      device:
        description: '目标设备配置'
        required: true
        type: choice
        default: netcore_n60-pro
        options:
          - netcore_n60-pro

permissions:
  contents: read

jobs:
  build_apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-dev rsync unzip zlib1g-dev file wget time xsltproc \
            libelf-dev device-tree-compiler qemu-utils python3-setuptools \
            python3-pyelftools swig ccache

      - name: Restore package-specific build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/ccache
            build_dir/target-aarch64_cortex-a53_musl
            staging_dir
          key: ${{ runner.os }}-n60pro-package-${{ github.event.inputs.device }}-${{ github.event.inputs.package_name }}-${{ hashFiles('Makefile', 'rules.mk', 'config/n60pro-1001.config', 'feeds.conf.default', 'include/**', 'scripts/**', 'toolchain/**', 'target/linux/generic/**', 'target/linux/mediatek/**', 'package/**/Makefile') }}

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Validate package allowlist and configure
        shell: bash
        env:
          PACKAGE_NAME: ${{ github.event.inputs.package_name }}
          DEVICE_NAME: ${{ github.event.inputs.device }}
        run: |
          set -Eeuo pipefail
          # Closed allowlist: entries are admitted only after their transitive
          # DEPENDS closure has been reviewed to exclude the closed-source vendor stack.
          case "$PACKAGE_NAME" in
            luci-app-ttyd|kmod-fs-ksmbd) ;;
            *) echo "::error::Package is not in the reviewed safe allowlist."; exit 1 ;;
          esac
          case "$DEVICE_NAME" in
            netcore_n60-pro) CONFIG_FILE="config/n60pro-1001.config" ;;
            *) echo "::error::Unsupported device profile."; exit 1 ;;
          esac
          test -s "$CONFIG_FILE" || {
            echo "::error::Approved device config is missing: $CONFIG_FILE"; exit 1;
          }
          cp "$CONFIG_FILE" .config
          printf 'CONFIG_PACKAGE_%s=y\n' "$PACKAGE_NAME" >> .config
          make defconfig

      - name: Enforce closed-source dependency boundary
        shell: bash
        env:
          PACKAGE_NAME: ${{ github.event.inputs.package_name }}
        run: |
          set -Eeuo pipefail
          case "$PACKAGE_NAME" in
            easymesh-n60|mt_wifi|mt-wifi|conninfra|warp|datconf|mapfilter)
              echo "::error::Closed-source vendor packages require the attested N60 Quick/Full path."
              exit 1
              ;;
          esac
          # Expanding this allowlist requires a recursive DEPENDS audit and a matching governance-test update.

      - name: Compile target package
        shell: bash
        env:
          PACKAGE_NAME: ${{ github.event.inputs.package_name }}
        run: |
          set -Eeuo pipefail
          case "$PACKAGE_NAME" in
            luci-app-ttyd|kmod-fs-ksmbd) ;;
            *) echo "::error::Package allowlist validation failed."; exit 1 ;;
          esac
          echo "===== Compiling $PACKAGE_NAME ====="
          make "package/$PACKAGE_NAME/compile" V=s -j"$(nproc)"

      - name: Collect APK and Public Keys
        shell: bash
        env:
          PKG_NAME: ${{ github.event.inputs.package_name }}
        run: |
          set -Eeuo pipefail
          mkdir -p custom-apks
          find bin/packages/aarch64_cortex-a53/ -type f -name "${PKG_NAME}*.apk" -exec cp {} custom-apks/ \; 2>/dev/null || true
          find bin/targets/mediatek/filogic/packages/ -type f -name "*.apk" -exec cp {} custom-apks/ \; 2>/dev/null || true
          find staging_dir/ -name "*.pub" -exec cp {} custom-apks/ \; 2>/dev/null || true
          test -n "$(find custom-apks -type f -print -quit)" || {
            echo "::error::No APK or signing key artifacts were produced."; exit 1;
          }
          tar -czf "specific-apks-${PKG_NAME}.tar.gz" -C custom-apks .

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: apk-${{ github.event.inputs.package_name }}
          path: specific-apks-*.tar.gz
          if-no-files-found: error
          retention-days: 14
