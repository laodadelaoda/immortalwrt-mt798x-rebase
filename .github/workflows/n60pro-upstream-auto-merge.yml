name: N60 Pro upstream candidate auto-merge gate

on:
  workflow_run:
    workflows:
      - N60 Pro Build Pipeline
    types:
      - completed

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: n60pro-upstream-auto-merge
  cancel-in-progress: false

jobs:
  merge-validated-candidate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      startsWith(github.event.workflow_run.head_branch, 'automation/upstream-25.12-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify exact candidate revision and firmware artifact
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RUN_ID"
          test -n "$HEAD_SHA"
          test -n "$HEAD_BRANCH"
          test "${{ github.event.workflow_run.conclusion }}" = "success"
          test "${{ github.event.workflow_run.event }}" = "workflow_dispatch"
          ARTIFACTS_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts")"
          AUDIT_COUNT="$(printf '%s' "$ARTIFACTS_JSON" | jq --arg name "n60pro-canonical-vendor-audit-$RUN_ID-attempt-$RUN_ATTEMPT" '[.artifacts[] | select(.name == $name) | select(.expired == false) | select(.size_in_bytes > 0)] | length')"
          FIRMWARE_COUNT="$(printf '%s' "$ARTIFACTS_JSON" | jq --arg name "n60pro-immortalwrt-firmware-$RUN_NUMBER" '[.artifacts[] | select(.name == $name) | select(.expired == false) | select(.size_in_bytes > 0)] | length')"
          test "$AUDIT_COUNT" -eq 1
          test "$FIRMWARE_COUNT" -ge 1
          echo "Candidate $HEAD_SHA has successful Vendor Audit -> Full run $RUN_ID, exact-attempt audit evidence, and non-empty firmware artifact."

      - name: Merge only the exact validated candidate PR
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TARGET_BRANCH: n60pro-25.12-upstream-base
        shell: bash
        run: |
          set -Eeuo pipefail
          PR_JSON="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_BRANCH" --base "$TARGET_BRANCH" --state open --json number,headRefOid,isDraft)"
          PR_COUNT="$(printf '%s' "$PR_JSON" | jq 'length')"
          test "$PR_COUNT" -eq 1
          PR_NUMBER="$(printf '%s' "$PR_JSON" | jq -r '.[0].number')"
          PR_HEAD="$(printf '%s' "$PR_JSON" | jq -r '.[0].headRefOid')"
          PR_DRAFT="$(printf '%s' "$PR_JSON" | jq -r '.[0].isDraft')"
          test "$PR_HEAD" = "$HEAD_SHA"
          test "$PR_DRAFT" = "true"
          gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge --delete-branch
          git init verify-merge
          cd verify-merge
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags origin "$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          git merge-base --is-ancestor "$HEAD_SHA" "refs/remotes/origin/$TARGET_BRANCH"
          echo "Merged PR #$PR_NUMBER after exact-SHA Full success and firmware artifact verification."
