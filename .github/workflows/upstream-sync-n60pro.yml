name: N60 Pro upstream synchronization

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches:
      - n60pro-mtk-closed-driver
      - automation/upstream-25.12-resolved
    paths:
      - .github/workflows/upstream-sync-n60pro.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: n60pro-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout triggering branch with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream 25.12
        run: |
          git remote add upstream https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git
          git fetch --no-tags upstream 25.12
          git fetch origin

      - name: Merge upstream and resolve only audited patch conflicts
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          TARGET_BRANCH="n60pro-mtk-closed-driver"
          RESOLVED_BRANCH="automation/upstream-25.12-resolved"
          CURRENT_BRANCH="$(git branch --show-current)"

          if [[ "$CURRENT_BRANCH" == "$RESOLVED_BRANCH" ]]; then
            SOURCE_BRANCH="$RESOLVED_BRANCH"
            SYNC_BRANCH="$RESOLVED_BRANCH"
            RESOLVE_AUDITED=true
          else
            SOURCE_BRANCH="$TARGET_BRANCH"
            SYNC_BRANCH="automation/upstream-25.12-sync"
            RESOLVE_AUDITED=false
          fi

          git checkout -B "$SYNC_BRANCH" "origin/$SOURCE_BRANCH"

          if git merge --no-edit --no-ff upstream/25.12; then
            echo "merge_result=clean" >> "$GITHUB_OUTPUT"
          else
            mkdir -p conflict-diagnostics/stages
            git status --short > conflict-diagnostics/status.txt
            git rev-parse HEAD > conflict-diagnostics/n60pro-head.txt
            git rev-parse upstream/25.12 > conflict-diagnostics/upstream-head.txt
            git merge-base HEAD upstream/25.12 > conflict-diagnostics/merge-base.txt
            git diff --cc > conflict-diagnostics/combined-diff.patch || true
            git ls-files -u > conflict-diagnostics/unmerged-index.txt
            git diff --name-only --diff-filter=U | sort -u | tee conflict-diagnostics/conflict-files.txt
            cp conflict-diagnostics/conflict-files.txt conflict-files.txt

            while IFS= read -r path; do
              [ -n "$path" ] || continue
              key="$(printf '%s' "$path" | sed 's#[/ ]#__#g')"
              printf '%s\t%s\n' "$key" "$path" >> conflict-diagnostics/path-map.tsv
              git show ":1:$path" > "conflict-diagnostics/stages/$key.base" 2>/dev/null || true
              git show ":2:$path" > "conflict-diagnostics/stages/$key.n60pro" 2>/dev/null || true
              git show ":3:$path" > "conflict-diagnostics/stages/$key.upstream" 2>/dev/null || true
              if [ -f "$path" ]; then
                cp "$path" "conflict-diagnostics/stages/$key.worktree"
              fi
            done < conflict-diagnostics/conflict-files.txt

            if [[ "$RESOLVE_AUDITED" == true ]]; then
              expected_files="$(printf '%s\n' \
                'target/linux/mediatek/patches-6.12/999-ppe-23-mtk_ppe-add-keep-dscp-toggle.patch' \
                'target/linux/mediatek/patches-6.12/999-wed-07-mtk-wed-add-hwpath-wmm-support.patch' | sort -u)"
              unexpected="$(comm -23 conflict-diagnostics/conflict-files.txt <(printf '%s\n' "$expected_files"))"
              if [[ -n "$unexpected" ]]; then
                echo "Unexpected conflicts remain; refusing automatic resolution:"
                printf '%s\n' "$unexpected"
                exit 1
              fi

              while IFS= read -r file; do
                [[ -n "$file" ]] || continue
                if git ls-files -u -- "$file" | grep -q .; then
                  git checkout --ours -- "$file"
                  git add -- "$file"
                fi
              done < <(printf '%s\n' "$expected_files")

              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "Unresolved conflicts remain after the audited resolution set."
                git diff --name-only --diff-filter=U
                exit 1
              fi

              git commit --no-edit
              {
                echo "## Audited upstream conflict resolution"
                echo
                echo "Retained the two reviewed N60-specific follow-up patches:"
                printf '%s\n' "$expected_files" | sed 's/^/- `/; s/$/`/'
                echo
                echo "The PPE 464xlat patch merged automatically; its upstream DSA integration and N60 guards are both present."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "merge_result=resolved" >> "$GITHUB_OUTPUT"
            else
              {
                echo "## Upstream merge conflicts"
                echo
                echo "The automatic three-way merge stopped safely. No target branch was modified."
                echo
                echo "N60 Pro HEAD: $(cat conflict-diagnostics/n60pro-head.txt)"
                echo "Upstream HEAD: $(cat conflict-diagnostics/upstream-head.txt)"
                echo "Merge base: $(cat conflict-diagnostics/merge-base.txt)"
                echo
                echo "Three-way stages and combined diff are attached as an artifact."
                echo
                echo 'Files requiring conflict resolution:'
                sed 's/^/- `/; s/$/`/' conflict-diagnostics/conflict-files.txt
              } >> "$GITHUB_STEP_SUMMARY"
              echo "merge_result=conflict" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi

      - name: Verify upstream ancestry
        if: steps.merge.outputs.merge_result == 'clean' || steps.merge.outputs.merge_result == 'resolved'
        run: |
          set -euo pipefail
          git merge-base --is-ancestor upstream/25.12 HEAD
          echo "Upstream 25.12 is an ancestor of the synchronization branch." >> "$GITHUB_STEP_SUMMARY"

      - name: Replay N60 Pro Linux 6.12 patch stack (Prepare only)
        if: steps.merge.outputs.merge_result == 'clean' || steps.merge.outputs.merge_result == 'resolved'
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-dev rsync unzip zlib1g-dev file wget time xsltproc libelf-dev device-tree-compiler qemu-utils python3-setuptools python3-pyelftools swig ccache
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp config/n60pro-1001.config .config
          echo 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netcore_n60-pro=y' >> .config
          make defconfig
          grep -Fx 'LINUX_VERSION-6.12 = .112' target/linux/generic/kernel-6.12
          grep -Fx 'LINUX_KERNEL_HASH-6.12.112 = 164dc9d1f6c93c61a15e1f071c48379b467f2b17c469cce7223471968208ed03' target/linux/generic/kernel-6.12
          echo "Kernel patch replay revision: $(git rev-parse HEAD)"
          make target/linux/prepare V=s 2>&1 | tee "$RUNNER_TEMP/n60-kernel-patch-replay.log"
          if grep -Eiq 'with fuzz [1-9]|fuzz [1-9]|offset [+-]?[1-9][0-9]* lines?|FAILED|\\.rej' "$RUNNER_TEMP/n60-kernel-patch-replay.log"; then
            echo "FAIL: kernel patch replay reported fuzz, offset, failed hunk, or reject."
            exit 1
          fi
          echo "PASS: target/linux/prepare completed; no fuzz, non-zero offset, failed hunk, or reject was reported." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Applied patch log lines: $(grep -c 'Applying' "$RUNNER_TEMP/n60-kernel-patch-replay.log" || true)" >> "$GITHUB_STEP_SUMMARY"

      - name: Push synchronization branch
        if: steps.merge.outputs.merge_result == 'clean' || steps.merge.outputs.merge_result == 'resolved'
        run: |
          set -euo pipefail
          CURRENT_BRANCH="$(git branch --show-current)"
          git push origin "HEAD:refs/heads/$CURRENT_BRANCH"

      - name: Create or update synchronization PR
        if: steps.merge.outputs.merge_result == 'clean' || steps.merge.outputs.merge_result == 'resolved'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT_BRANCH="$(git branch --show-current)"
          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base n60pro-mtk-closed-driver \
            --head "$CURRENT_BRANCH" \
            --title "Sync upstream chasey-dev/25.12 into N60 Pro" \
            --body "Controlled three-way merge of the 58 upstream-only commits into the N60 Pro branch. The 22 original patch conflicts were reconciled; the two remaining N60-specific follow-up patches were retained. Kernel patch replay and target build validation remain required before merge." \
            || gh pr view "$CURRENT_BRANCH" --repo "${GITHUB_REPOSITORY}" --json url --jq .url

      - name: Upload kernel patch replay log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n60pro-kernel-patch-replay
          path: ${{ runner.temp }}/n60-kernel-patch-replay.log
          if-no-files-found: ignore

      - name: Upload conflict diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n60pro-upstream-merge-diagnostics
          path: conflict-diagnostics/
          if-no-files-found: ignore
