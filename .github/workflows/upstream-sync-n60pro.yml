name: N60 Pro upstream synchronization

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches:
      - n60pro-mtk-closed-driver
    paths:
      - .github/workflows/upstream-sync-n60pro.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: n60pro-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout N60 Pro branch with full history
        uses: actions/checkout@v4
        with:
          ref: n60pro-mtk-closed-driver
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream 25.12
        run: |
          git remote add upstream https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git
          git fetch --no-tags upstream 25.12
          git fetch origin n60pro-mtk-closed-driver

      - name: Build synchronization branch and merge upstream
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          BASE_BRANCH="n60pro-mtk-closed-driver"
          SYNC_BRANCH="automation/upstream-25.12-sync"
          git checkout -B "$SYNC_BRANCH" "origin/$BASE_BRANCH"
          if git merge --no-edit --no-ff upstream/25.12; then
            echo "merge_result=clean" >> "$GITHUB_OUTPUT"
            echo "Upstream merge completed without conflicts."
          else
            git diff --name-only --diff-filter=U | tee conflict-files.txt
            {
              echo "## Upstream merge conflicts"
              echo
              echo "The automatic three-way merge stopped safely. No target branch was modified."
              echo
              echo 'Files requiring conflict resolution:'
              sed 's/^/- `/; s/$/`/' conflict-files.txt
            } >> "$GITHUB_STEP_SUMMARY"
            echo "merge_result=conflict" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Verify upstream ancestry
        if: steps.merge.outputs.merge_result == 'clean'
        run: |
          set -euo pipefail
          git merge-base --is-ancestor upstream/25.12 HEAD
          test "$(git rev-list --count upstream/25.12..HEAD)" -ge 0
          echo "Upstream 25.12 is an ancestor of the synchronization branch." >> "$GITHUB_STEP_SUMMARY"

      - name: Push synchronization branch
        if: steps.merge.outputs.merge_result == 'clean'
        run: |
          git push --force-with-lease origin HEAD:refs/heads/automation/upstream-25.12-sync

      - name: Create or update synchronization PR
        if: steps.merge.outputs.merge_result == 'clean'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base n60pro-mtk-closed-driver \
            --head automation/upstream-25.12-sync \
            --title "Sync upstream chasey-dev/25.12 into N60 Pro" \
            --body "Automated three-way merge of upstream `chasey-dev/25.12` into `n60pro-mtk-closed-driver`. This PR is generated by the N60 Pro upstream synchronization workflow. Review CI and device-specific compatibility before merging." \
            || gh pr view automation/upstream-25.12-sync --repo "${GITHUB_REPOSITORY}" --json url --jq .url

      - name: Upload conflict report
        if: failure() && hashFiles('conflict-files.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: n60pro-upstream-merge-conflicts
          path: conflict-files.txt
          if-no-files-found: error
