name: N60 Pro upstream 25.12 synchronization

on:
  workflow_dispatch:
  push:
    branches:
      - n60pro-25.12-upstream-base
    paths:
      - .github/workflows/upstream-sync-n60pro.yml

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: n60pro-upstream-upgrade
  cancel-in-progress: false

jobs:
  prepare-upgrade:
    name: Map upstream commits and prepare validated merge candidate
    if: github.ref == 'refs/heads/n60pro-25.12-upstream-base'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact N60 Pro branch revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install GitHub CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v gh >/dev/null

      - name: Fetch upstream and verify target branch has not moved
        id: refs
        shell: bash
        run: |
          set -Eeuo pipefail
          git remote add upstream https://github.com/immortalwrt/immortalwrt.git
          git fetch --no-tags upstream +refs/heads/openwrt-25.12:refs/remotes/upstream/openwrt-25.12
          UPSTREAM_SHA="$(git rev-parse refs/remotes/upstream/openwrt-25.12)"
          git remote add mtk-base https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git
          git fetch --no-tags mtk-base +refs/heads/25.12:refs/remotes/mtk-base/25.12
          MTK_BASE_SHA="$(git rev-parse refs/remotes/mtk-base/25.12)"
          git fetch --no-tags origin n60pro-25.12-upstream-base
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/n60pro-25.12-upstream-base)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$MTK_BASE_SHA" HEAD
          BASE_SHA="$(git merge-base HEAD "$UPSTREAM_SHA")"
          UPSTREAM_AHEAD_COUNT="$(git rev-list --count "HEAD..$UPSTREAM_SHA")"
          LOCAL_AHEAD_COUNT="$(git rev-list --count "$UPSTREAM_SHA..HEAD")"
          {
            echo "upstream_sha=$UPSTREAM_SHA"
            echo "mtk_base_sha=$MTK_BASE_SHA"
            echo "base_sha=$BASE_SHA"
            echo "upstream_ahead_count=$UPSTREAM_AHEAD_COUNT"
            echo "local_ahead_count=$LOCAL_AHEAD_COUNT"
          } >> "$GITHUB_OUTPUT"
          mkdir -p upgrade-evaluation
          {
            echo "# N60 Pro upstream 25.12 evaluation"
            echo
            echo "- Target branch: n60pro-25.12-upstream-base"
            echo "- Target HEAD: $GITHUB_SHA"
            echo "- Primary upstream: immortalwrt/immortalwrt:openwrt-25.12"
            echo "- Primary upstream HEAD: $UPSTREAM_SHA"
            echo "- MTK integration baseline: chasey-dev/immortalwrt-mt798x-rebase:25.12"
            echo "- MTK baseline HEAD: $MTK_BASE_SHA"
            echo "- Merge base: $BASE_SHA"
            echo "- Upstream-only commits: $UPSTREAM_AHEAD_COUNT"
            echo "- Local-only commits: $LOCAL_AHEAD_COUNT"
            echo
            echo "## Ahead/behind"
            git rev-list --left-right --count "HEAD...$UPSTREAM_SHA"
            if [ "$UPSTREAM_AHEAD_COUNT" -eq 0 ]; then
              echo
              echo "No upstream-only commits exist on the configured 25.12 branch; no merge candidate will be created."
            fi
            echo
            echo "## Changed path inventory"
            git diff --name-status "$BASE_SHA" "$UPSTREAM_SHA" > upgrade-evaluation/UPSTREAM-PATHS.txt
            git diff --name-status "$BASE_SHA" HEAD > upgrade-evaluation/LOCAL-PATHS.txt
            echo "Upstream changed paths: $(wc -l < upgrade-evaluation/UPSTREAM-PATHS.txt)"
            echo "Local changed paths: $(wc -l < upgrade-evaluation/LOCAL-PATHS.txt)"
          } | tee upgrade-evaluation/UPSTREAM-EVALUATION.md

      - name: Build commit equivalence map using stable patch IDs
        env:
          BASE_SHA: ${{ steps.refs.outputs.base_sha }}
          UPSTREAM_SHA: ${{ steps.refs.outputs.upstream_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          def commits(rev):
              return git("rev-list", "--reverse", rev).splitlines()

          def metadata(sha):
              return git("show", "-s", "--format=%H%x09%P%x09%s", sha).split("\t", 2)

          def patch_id(sha, parents):
              if len(parents) > 1:
                  return None
              diff = subprocess.run(
                  ["git", "show", "--pretty=format:", "--binary", sha],
                  check=True, stdout=subprocess.PIPE
              ).stdout
              if not diff.strip():
                  return None
              p = subprocess.run(
                  ["git", "patch-id", "--stable"],
                  input=diff, stdout=subprocess.PIPE, stderr=subprocess.PIPE
              )
              return p.stdout.decode().split()[0] if p.stdout.strip() else None

          def changed_paths(sha):
              out = subprocess.check_output(
                  ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", sha],
                  text=True
              )
              return sorted(x for x in out.splitlines() if x)

          base = __import__("os").environ["BASE_SHA"]
          upstream = __import__("os").environ["UPSTREAM_SHA"]
          local_head = git("rev-parse", "HEAD")
          up_commits = commits(f"{base}..{upstream}")
          local_commits = commits(f"{base}..{local_head}")
          local_by_pid = {}
          local_rows = []
          for sha in local_commits:
              h, parents, subject = metadata(sha)
              pid = patch_id(sha, parents.split() if parents else [])
              row = {"sha":h, "parents":parents.split() if parents else [],
                     "subject":subject, "patch_id":pid,
                     "paths":changed_paths(sha),
                     "is_merge":len(parents.split()) > 1}
              local_rows.append(row)
              if pid:
                  local_by_pid.setdefault(pid, []).append(row)
          mapping = []
          for sha in up_commits:
              h, parents, subject = metadata(sha)
              pid = patch_id(sha, parents.split() if parents else [])
              matches = local_by_pid.get(pid, []) if pid else []
              up_paths = changed_paths(sha)
              path_candidates = []
              if not matches and len(parents.split()) <= 1:
                  up_set = set(up_paths)
                  for local in local_rows:
                      overlap = sorted(up_set.intersection(local["paths"]))
                      if overlap:
                          path_candidates.append({
                              "sha":local["sha"], "subject":local["subject"],
                              "overlap_count":len(overlap), "overlap_paths":overlap
                          })
                  path_candidates.sort(key=lambda x:(-x["overlap_count"],x["sha"]))
              status = ("equivalent" if len(matches)==1 else
                        "ambiguous-equivalent" if len(matches)>1 else
                        "merge" if len(parents.split())>1 else
                        "partial-candidate" if path_candidates else "unmapped")
              mapping.append({
                  "upstream_sha":h, "subject":subject,
                  "parents":parents.split() if parents else [],
                  "patch_id":pid, "status":status, "paths":up_paths,
                  "local_matches":[{"sha":x["sha"],"subject":x["subject"]} for x in matches],
                  "path_overlap_candidates":path_candidates[:12]
              })
          result = {
              "schema_version":1, "target_head":local_head, "upstream_head":upstream,
              "merge_base":base, "upstream_commit_count":len(up_commits),
              "local_commit_count":len(local_commits),
              "mapping_method":"git patch-id --stable; merge commits and empty commits are explicitly not equated",
              "limitations":"Patch-ID equality is a candidate equivalence signal, not semantic or ABI compatibility proof. Split/squash/partial mappings require manual/path-level review.",
              "upstream_commits":mapping, "local_commits":local_rows
          }
          Path("upgrade-evaluation/UPSTREAM-COMMIT-MAP.json").write_text(
              json.dumps(result,indent=2,ensure_ascii=False)+"\n")
          lines = [
              "# Upstream commit mapping",
              "",
              f"- Upstream commits since merge-base: {len(up_commits)}",
              f"- Local commits since merge-base: {len(local_commits)}",
              "- Method: stable patch-id equivalence; merge commits remain separately classified.",
              "- Patch-ID equality does not prove semantic compatibility.",
              "",
              "| Status | Count |",
              "|---|---:|"
          ]
          for status in ("equivalent","ambiguous-equivalent","partial-candidate","merge","unmapped"):
              lines.append(f"| {status} | {sum(x['status']==status for x in mapping)} |")
          lines += ["", "## Per-commit mapping", "", "| Upstream SHA | Status | Exact match(es) / path-overlap candidates | Subject |", "|---|---|---|---|"]
          for x in mapping:
              exact = ", ".join(m["sha"][:12] for m in x["local_matches"])
              partial = ", ".join(f"{m['sha'][:12]} ({m['overlap_count']} paths)" for m in x.get("path_overlap_candidates",[])[:5])
              matches = exact or partial or "—"
              subject = x["subject"].replace("|","\\|")
              lines.append(f"| {x['upstream_sha']} | {x['status']} | {matches} | {subject} |")
          Path("upgrade-evaluation/UPSTREAM-COMMIT-MAP.md").write_text("\n".join(lines)+"\n")
          PY

      - name: Check mergeability and create a real three-way merge candidate
        id: merge
        if: steps.refs.outputs.upstream_ahead_count != '0'
        env:
          UPSTREAM_SHA: ${{ steps.refs.outputs.upstream_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "$UPSTREAM_SHA" = "$(git rev-parse HEAD)" ]; then
            echo "UPSTREAM_STATUS=already-current" >> "$GITHUB_OUTPUT"
            {
              echo
              echo "## Synchronization result"
              echo "- Status: already up to date"
              echo "- Target HEAD and upstream HEAD are identical: $UPSTREAM_SHA"
              echo "- No candidate branch, pull request, or build dispatch is required."
            } | tee -a upgrade-evaluation/UPSTREAM-EVALUATION.md
            exit 0
          fi
          set +e
          git merge-tree --write-tree HEAD "$UPSTREAM_SHA" > upgrade-evaluation/merge-tree.txt 2>&1
          probe_rc=$?
          set -e
          if [ "$probe_rc" -ne 0 ]; then
            echo "MERGE_PROBE=conflict-or-error" >> "$GITHUB_OUTPUT"
            echo "Merge-tree did not produce a clean tree; no candidate branch or PR will be created." | tee -a upgrade-evaluation/UPSTREAM-EVALUATION.md
            exit 1
          fi
          git switch -c "automation/upstream-25.12-${UPSTREAM_SHA:0:12}-run-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git -c rerere.enabled=false merge --no-ff --no-edit "$UPSTREAM_SHA"; then
            git merge --abort || true
            echo "Real three-way merge failed; no candidate branch or PR will be created."
            exit 1
          fi
          MERGE_COMMIT="$(git rev-parse HEAD)"
          echo "MERGE_PROBE=clean" >> "$GITHUB_OUTPUT"
          {
            echo
            echo "## Candidate merge"
            echo "- Merge commit: $MERGE_COMMIT"
            echo "- Parents: $(git show -s --format=%P HEAD)"
            echo "- Upstream: $UPSTREAM_SHA"
            echo "- Result: clean real --no-ff merge; kernel patch refresh and strict replay follow."
          } >> upgrade-evaluation/UPSTREAM-EVALUATION.md

          sudo apt-get update
          sudo apt-get install -y quilt
          cp config/n60pro-1001.config .config
          make defconfig

          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          paths = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "target/linux/generic", "target/linux/mediatek"]
          ).decode().split("\0")
          paths = sorted(p for p in paths if p.endswith(".patch"))
          def code_payload(path):
              lines = Path(path).read_text(encoding="utf-8", errors="replace").splitlines()
              active = False
              binary = False
              out = []
              for line in lines:
                  if line.startswith("diff --git "):
                      active, binary = True, False
                      continue
                  if line.startswith("--- "):
                      active = True
                      continue
                  if line.startswith("+++ "):
                      active = True
                      continue
                  if not active:
                      continue
                  if line.startswith("GIT binary patch"):
                      binary = True
                      out.append(line)
                  elif binary:
                      out.append(line)
                  elif line.startswith(("+", "-")):
                      out.append(line)
              return hashlib.sha256("\n".join(out).encode()).hexdigest()
          data = {p: code_payload(p) for p in paths}
          Path("upgrade-evaluation/KERNEL-PATCH-PAYLOAD-BEFORE.json").write_text(
              json.dumps(data, indent=2, sort_keys=True) + "\n"
          )
          print(f"Tracked kernel patch files before refresh: {len(paths)}")
          PY

          REFRESH_LOG="$RUNNER_TEMP/n60pro-kernel-quilt-refresh.log"
          if make target/linux/refresh V=s >"$REFRESH_LOG" 2>&1; then
            echo "OpenWrt native Quilt refresh completed."
          else
            rc=$?
            cp "$REFRESH_LOG" upgrade-evaluation/kernel-patch-refresh.log
            tail -n 240 "$REFRESH_LOG"
            exit "$rc"
          fi
          cp "$REFRESH_LOG" upgrade-evaluation/kernel-patch-refresh.log

          python3 - <<'PY'
          import hashlib, json, subprocess, sys
          from pathlib import Path
          before = json.load(open("upgrade-evaluation/KERNEL-PATCH-PAYLOAD-BEFORE.json"))
          paths = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "target/linux/generic", "target/linux/mediatek"]
          ).decode().split("\0")
          paths = sorted(p for p in paths if p.endswith(".patch"))
          def code_payload(path):
              lines = Path(path).read_text(encoding="utf-8", errors="replace").splitlines()
              active = False
              binary = False
              out = []
              for line in lines:
                  if line.startswith("diff --git "):
                      active, binary = True, False
                      continue
                  if line.startswith("--- "):
                      active = True
                      continue
                  if line.startswith("+++ "):
                      active = True
                      continue
                  if not active:
                      continue
                  if line.startswith("GIT binary patch"):
                      binary = True
                      out.append(line)
                  elif binary:
                      out.append(line)
                  elif line.startswith(("+", "-")):
                      out.append(line)
              return hashlib.sha256("\n".join(out).encode()).hexdigest()
          after = {p: code_payload(p) for p in paths}
          if set(before) != set(after):
              print("Patch inventory changed during refresh.")
              print("Removed:", sorted(set(before)-set(after)))
              print("Added:", sorted(set(after)-set(before)))
              sys.exit(1)
          changed = [p for p in paths if before[p] != after[p]]
          if changed:
              print("Refresh altered patch added/deleted code, not only hunk locations/context:")
              print("\n".join(changed))
              sys.exit(1)
          Path("upgrade-evaluation/KERNEL-PATCH-PAYLOAD-AFTER.json").write_text(
              json.dumps(after, indent=2, sort_keys=True) + "\n"
          )
          Path("upgrade-evaluation/KERNEL-PATCH-REFRESH.md").write_text(
              "# Kernel patch refresh report\n\n"
              f"- Tracked patch files: {len(paths)}\n"
              f"- Refreshed patch files: {sum(Path(p).read_bytes() != subprocess.check_output(['git','show',f'HEAD:{p}']) for p in paths)}\n"
              "- Added/deleted patch code changed: 0 (per-file added/deleted-line payload hashes are identical)\n"
              "- Method: native OpenWrt make target/linux/refresh (Quilt), then a clean strict replay.\n"
          )
          print(f"Verified unchanged added/deleted code payload across {len(paths)} kernel patches.")
          PY

          git diff --check
          make target/linux/clean
          STRICT_LOG="$RUNNER_TEMP/n60pro-kernel-patch-strict-replay.log"
          if make PATCH='patch --fuzz=0' target/linux/prepare V=s >"$STRICT_LOG" 2>&1; then
            echo "Strict native Linux patch replay completed."
          else
            rc=$?
            cp "$STRICT_LOG" upgrade-evaluation/kernel-patch-strict-replay.log
            tail -n 240 "$STRICT_LOG"
            exit "$rc"
          fi
          if grep -Ein 'with fuzz [1-9]|offset [+-]?[1-9][0-9]* lines?|Hunk #[0-9]+ FAILED|Hunk FAILED|Patch failed!' "$STRICT_LOG"; then
            echo "Strict kernel replay reported fuzz, non-zero offset, or a rejected hunk."
            cp "$STRICT_LOG" upgrade-evaluation/kernel-patch-strict-replay.log
            exit 1
          fi
          KERNEL_DTS="$(find build_dir -type f -path '*/linux-*/arch/arm64/boot/dts/mediatek/mt7986a.dtsi' -print -quit)"
          test -n "$KERNEL_DTS"
          grep -Eq 'clock-frequency[[:space:]]*=[[:space:]]*<12986200>;' "$KERNEL_DTS"
          KERNEL_SOURCE_ROOT="\${KERNEL_DTS%/arch/arm64/boot/dts/mediatek/mt7986a.dtsi}"
          if find "$KERNEL_SOURCE_ROOT" -type f \( -name '*.rej' -o -name '*.orig' \) -print -quit | grep -q .; then
            find "$KERNEL_SOURCE_ROOT" -type f \( -name '*.rej' -o -name '*.orig' \) -print
            cp "$STRICT_LOG" upgrade-evaluation/kernel-patch-strict-replay.log
            exit 1
          fi
          APPLIED_COUNT="$(grep -Ec '^Applying .* using ' "$STRICT_LOG" || true)"
          test "$APPLIED_COUNT" -gt 0
          cp "$STRICT_LOG" upgrade-evaluation/kernel-patch-strict-replay.log
          echo "Strict replay passed: $APPLIED_COUNT native patches, zero fuzz, zero offset, zero rejects." | tee upgrade-evaluation/KERNEL-PATCH-STRICT-RESULT.txt

          git add target/linux/generic target/linux/mediatek/patches-6.12
          if ! git diff --cached --quiet; then
            git commit -m "kernel: refresh 6.12 patch stack for zero-offset replay"
          fi
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "- Final candidate revision after kernel patch refresh: $CANDIDATE_SHA" >> upgrade-evaluation/UPSTREAM-EVALUATION.md

      - name: Inspect sensitive integration surfaces and preserve inventories
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo
            echo "## N60 Pro integration surfaces"
            for path in target/linux/mediatek package/mtk config/n60pro-1001.config package/kernel/mapfilter package/libs/openssl; do
              if [ -e "$path" ]; then
                echo "### $path"
                git diff --stat "$GITHUB_SHA" HEAD -- "$path" || true
                find "$path" -type f \( -name '*.patch' -o -name 'Makefile' -o -name 'Kconfig*' -o -name '*.config' \) -print 2>/dev/null | sort | head -n 500
              fi
            done
            echo
            echo "## Fixed vendor lock"
            sha256sum package/mtk/vendor-sources.lock.json
            echo
            echo "## Active vendor and kernel patch counts"
            find package/mtk target/linux/mediatek/patches-6.12 -type f -name '*.patch' -print 2>/dev/null | sort | tee upgrade-evaluation/PATCH-INVENTORY.txt
            echo "patch_count=$(wc -l < upgrade-evaluation/PATCH-INVENTORY.txt)"
            echo
            echo "## Validation boundary"
            echo "This workflow prepares a merge candidate only. The candidate PR must pass the canonical vendor audit and Full firmware build before merge."
            echo "Patch-ID matching is not a substitute for semantic compatibility, zero-fuzz patch replay, native Package Prepare, kernel patch application, or firmware output verification."
          } >> upgrade-evaluation/UPSTREAM-EVALUATION.md
          sha256sum upgrade-evaluation/* > upgrade-evaluation/SHA256SUMS

      - name: Generate explicit migration plan and compatibility review inventory
        env:
          UPSTREAM_SHA: ${{ steps.refs.outputs.upstream_sha }}
          MTK_BASE_SHA: ${{ steps.refs.outputs.mtk_base_sha }}
          BASE_SHA: ${{ steps.refs.outputs.base_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "# N60 Pro upstream migration plan"
            echo
            echo "## Revisions"
            echo "- Target baseline: $GITHUB_SHA"
            echo "- Primary upstream candidate: $UPSTREAM_SHA"
            echo "- MTK integration baseline: $MTK_BASE_SHA"
            echo "- Merge base: $BASE_SHA"
            echo "- Candidate merge commit: $(git rev-parse HEAD)"
            echo
            echo "## Commit mapping result"
            python3 - <<'PY'
          import json
          d=json.load(open("upgrade-evaluation/UPSTREAM-COMMIT-MAP.json",encoding="utf-8"))
          from collections import Counter
          c=Counter(x["status"] for x in d["upstream_commits"])
          for k in ("equivalent","ambiguous-equivalent","partial-candidate","merge","unmapped"):
              print(f"- {k}: {c[k]}")
          print(f"- Local-only commits considered: {len(d['local_commits'])}")
          PY
            echo
            echo "## Sensitive-path delta introduced by merge"
            git diff --name-status "$GITHUB_SHA" HEAD -- \
              config/n60pro-1001.config target/linux/mediatek package/mtk \
              package/kernel/mapfilter package/libs/openssl \
              | tee upgrade-evaluation/SENSITIVE-PATH-DELTA.txt
            echo
            echo "## Required validation before merge"
            echo "1. Candidate PR must pass the canonical vendor-source Lock/SHA256 audit."
            echo "2. Every active vendor patch series must replay on the pinned archives with zero fuzz, zero offset, zero reject, and no skipped hunks."
            echo "3. Native OpenWrt Package Prepare and MT Wi-Fi 026 exact-path/function assertions must pass."
            echo "4. Linux 6.12 patch stack must be applied to the actual candidate kernel source with zero fuzz/offset/reject; syntax-only checks are insufficient."
            echo "5. Review upstream changes touching DTS, N60 Pro config, closed-driver integration, WARP/Conninfra/MT Wi-Fi/datconf/MAPFILTER, EasyMesh/DPP/WAPP, OpenSSL, EIP93, Makefiles and Kconfig."
            echo "6. The candidate PR's Full firmware workflow must succeed and upload a non-empty firmware artifact."
            echo "7. Canonical Vendor Audit must run native target/linux/prepare on the pinned Linux 6.12 source with PATCH=patch --fuzz=0; non-zero offsets, rejects, or .orig/.rej files fail the audit credential."
            echo
            echo "## Decision"
            if [ "${{ steps.refs.outputs.upstream_ahead_count }}" = "0" ]; then
              echo "The official ImmortalWrt openwrt-25.12 branch has no commits newer than the common base. This is a no-op synchronization; the local branch is preserved unchanged."
            else
              echo "A clean textual merge is only candidate generation. The candidate is eligible for auto-merge only after exact-SHA Vendor Audit, Full success, and a non-empty firmware artifact."
            fi
            echo "Unmapped, split/squash, ambiguous and merge commits require path/function-level review; patch-id is not semantic equivalence."
          } | tee upgrade-evaluation/UPSTREAM-MIGRATION-PLAN.md
          git diff --check "$GITHUB_SHA" HEAD
          sha256sum upgrade-evaluation/* > upgrade-evaluation/SHA256SUMS

      - name: Upload commit map and migration plan
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: n60pro-upstream-migration-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: upgrade-evaluation/
          if-no-files-found: error
          retention-days: 90

      - name: Publish candidate branch and open draft validation PR
        if: success() && steps.merge.outputs.CANDIDATE_SHA != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.merge.outputs.CANDIDATE_SHA }}
          UPSTREAM_SHA: ${{ steps.refs.outputs.upstream_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          TARGET_BRANCH="n60pro-25.12-upstream-base"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$GITHUB_SHA"
          CANDIDATE_BRANCH="automation/upstream-25.12-${UPSTREAM_SHA:0:12}-run-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          cat > "$RUNNER_TEMP/upstream-pr-body.md" <<EOF
          This is an automated N60 Pro upstream merge candidate.

          - Primary upstream: immortalwrt/immortalwrt:openwrt-25.12
          - Upstream commit: $UPSTREAM_SHA
          - Candidate merge commit: $CANDIDATE_SHA
          - Source branch baseline: $GITHUB_SHA
          - MTK integration baseline: ${{ steps.refs.outputs.mtk_base_sha }}

          Required gate: exact-SHA canonical Vendor Audit (including native Linux 6.12 zero-fuzz/zero-offset patch replay and MT Wi-Fi 026 assertions), Full firmware build, and a non-empty firmware artifact. The auto-merge gate runs only after all checks succeed.

          Full commit mapping, migration plan, path inventories, and SHA256 manifest are attached to workflow run $GITHUB_RUN_ID:
          https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$TARGET_BRANCH" \
            --head "$CANDIDATE_BRANCH" \
            --draft \
            --title "N60 Pro: synchronize upstream 25.12 (${UPSTREAM_SHA:0:12})" \
            --body-file "$RUNNER_TEMP/upstream-pr-body.md"
          # A PR created with GITHUB_TOKEN does not automatically emit pull_request
          # workflow runs. Explicit workflow_dispatch is an allowed token-triggered
          # event and runs the canonical Vendor Audit followed by Full on this candidate.
          gh workflow run n60pro-build.yml --repo "$GITHUB_REPOSITORY" --ref "$CANDIDATE_BRANCH"
          echo "Candidate PR created and candidate Vendor Audit -> Full pipeline dispatched."
          echo "Candidate PR created. Exact-SHA Vendor Audit -> Full and firmware artifact verification will be handled by the workflow_run merge gate."
