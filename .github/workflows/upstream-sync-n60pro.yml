name: N60 Pro upstream library upgrade evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n60pro-upstream-upgrade-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    name: Read-only upstream compatibility evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout the selected default-branch revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream 25.12 without modifying local refs or source
        shell: bash
        run: |
          set -Eeuo pipefail
          git remote add upstream https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git
          git fetch --no-tags --no-write-fetch-head upstream 25.12
          UPSTREAM_SHA="$(git rev-parse FETCH_HEAD)"
          BASE_SHA="$(git merge-base HEAD "$UPSTREAM_SHA")"
          {
            echo "BASE_SHA=$BASE_SHA"
            echo "UPSTREAM_SHA=$UPSTREAM_SHA"
          } >> "$GITHUB_ENV"
          mkdir -p upgrade-evaluation
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Evaluated revision: $(git rev-parse HEAD)"
            echo "Upstream: chasey-dev/immortalwrt-mt798x-rebase"
            echo "Upstream branch: 25.12"
            echo "Upstream revision: $UPSTREAM_SHA"
            echo "Merge base: $BASE_SHA"
            echo
            echo "## Ahead/behind"
            git rev-list --left-right --count "HEAD...$UPSTREAM_SHA"
            echo
            echo "## Change summary"
            git diff --stat "$BASE_SHA" "$UPSTREAM_SHA"
            echo
            echo "## Changed paths"
            git diff --name-status "$BASE_SHA" "$UPSTREAM_SHA"
          } | tee upgrade-evaluation/UPSTREAM-EVALUATION.txt

      - name: Probe merge compatibility without creating a merge commit
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          git merge-tree --write-tree HEAD "$UPSTREAM_SHA" > upgrade-evaluation/merge-tree.txt 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "MERGE_PROBE=clean" | tee -a upgrade-evaluation/UPSTREAM-EVALUATION.txt
            echo "The merge-tree probe completed without conflicts. No branch, index, or working-tree changes were made."
          else
            echo "MERGE_PROBE=conflicts-or-probe-error" | tee -a upgrade-evaluation/UPSTREAM-EVALUATION.txt
            echo "Inspect merge-tree.txt. This is an evaluation result, not an automatic resolution."
          fi

      - name: Record patch inventory and evaluation boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo
            echo "## Local patch inventory"
            find target/linux/mediatek/patches-6.12 package/mtk -type f -name '*.patch' -print 2>/dev/null | sort
            echo
            echo "## Safety boundary"
            echo "Read-only evaluation only. No merge, commit, push, branch creation, PR creation, or automatic patch rewrite."
          } >> upgrade-evaluation/UPSTREAM-EVALUATION.txt
          sha256sum upgrade-evaluation/* > upgrade-evaluation/SHA256SUMS

      - name: Upload upstream evaluation report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: n60pro-upstream-evaluation-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: upgrade-evaluation/
          if-no-files-found: error
          retention-days: 30
