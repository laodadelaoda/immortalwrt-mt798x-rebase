name: N60 Pro EasyMesh Quick Build

on:
  push:
    branches: ["n60pro-mtk-closed-driver"]
    paths:
      - "package/mtk/applications/easymesh-n60/**"
      - "package/mtk/applications/datconf/patches/**"
      - "package/mtk/applications/datconf/**"
      - "package/libs/openssl/**"
      - "package/libs/libnl-tiny/**"
      - "config/n60pro-1001.config"
      - "target/linux/mediatek/filogic/config-6.12"
      - "include/kernel.mk"
      - "include/kernel-build.mk"
      - "include/kernel-defaults.mk"
      - "include/toplevel.mk"
      - "target/linux/Makefile"
      - "target/linux/mediatek/Makefile"
      - "target/linux/mediatek/files-6.12/**"
      - "target/linux/mediatek/patches-6.12/**"
      - "target/linux/generic/**"
      - "target/linux/mediatek/**"
      - "include/**"
      - "config/**"
      - "scripts/**"
      - "tools/**"
      - "toolchain/**"
      - "Makefile"
      - "rules.mk"
      - "feeds.conf.default"
      - ".github/workflows/easymesh-quick.yml"
      - ".github/workflows/main.yml"
  workflow_dispatch:

permissions:
  contents: read

# Preserve active toolchain builds; a newer commit waits instead of cancelling
# a runner after it has already spent time preparing the target toolchain.
concurrency:
  group: n60-pro-easymesh-quick-step4c-v2
  cancel-in-progress: false

jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      DEVICE: netcore_n60-pro
      PROFILE: standard
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Static preflight - EasyMesh runtime configuration and dependency declarations
        shell: bash
        run: |
          set -euo pipefail
          ROOT="package/mtk/applications/easymesh-n60/files"
          BIN="$ROOT/usr/bin"
          for f in wapp mapd p1905_managerd wappctrl wapp-n60-wrapper; do
            test -s "$BIN/$f" || { echo "::error::Missing EasyMesh input: $f"; exit 1; }
          done
          for f in mapd_cfg mapd_user.cfg 1905d.cfg wts_bss_info_config; do
            test -s "$ROOT/etc/map/$f" || { echo "::error::Missing MAP config: $f"; exit 1; }
          done
          sh "package/mtk/applications/easymesh-n60/tests/test-vendor-wts-defaults.sh"
          sh "$ROOT/usr/sbin/easymesh-n60-validate-wts" "$ROOT/etc/map/wts_bss_info_config"
          for f in "$ROOT/etc/init.d/easymesh" "$ROOT/etc/uci-defaults/1001-easymesh-n60" "$BIN/wapp-n60-wrapper"; do
            sh -n "$f"
          done
          grep -qx 'DeviceRole=1' "$ROOT/etc/map/mapd_cfg"
          grep -qx 'DhcpCtl=0' "$ROOT/etc/map/mapd_cfg"
          grep -qx 'map_root=1' "$ROOT/etc/map/1905d.cfg"
          grep -qx 'map_agent=0' "$ROOT/etc/map/1905d.cfg"
          grep -qx 'bh_type=eth' "$ROOT/etc/map/1905d.cfg"
          grep -qx 'radio_band=24G;5GL;5GH;' "$ROOT/etc/map/1905d.cfg"
          grep -qx 'al_inf=rax0' "$ROOT/etc/map/1905d.cfg"
          grep -qx 'bss_config_priority=ra0;rax0' "$ROOT/etc/map/mapd_cfg"
          grep -qx 'bss_config_priority=ra0;rax0;apclix0' "$ROOT/etc/map/1905d.cfg"
          ! grep -Eq '^map_(controller|agent)_alid=' "$ROOT/etc/map/1905d.cfg"
          PKG_MAKEFILE="package/mtk/applications/easymesh-n60/Makefile"
          grep -Fqx 'PKG_BUILD_DEPENDS:=datconf openssl libnl-tiny' "$PKG_MAKEFILE" || {
            echo "::error::EasyMesh build dependency declaration changed; update the Quick staging matrix."
            exit 1
          }
          grep -Fqx '  DEPENDS:=+kmod-mapfilter +libnl-tiny +libkvcutil +libopenssl' "$PKG_MAKEFILE" || {
            echo "::error::EasyMesh runtime dependency declaration changed; update Full package verification."
            exit 1
          }
          grep -Fq -- '-ldatconf -lkvcutil -lssl -lcrypto' "$PKG_MAKEFILE" || {
            echo "::error::WAPP datconf/kvcutil/OpenSSL link dependencies are missing."
            exit 1
          }
          grep -Fq -- '-lnl-tiny -lssl -lcrypto' "$PKG_MAKEFILE" || {
            echo "::error::P1905 libnl-tiny/OpenSSL link dependencies are missing."
            exit 1
          }
          test -s "$ROOT/etc/ethernet_cfg.txt" || {
            echo "::error::Missing N60 Pro DSA ethernet_cfg.txt."
            exit 1
          }
          grep -qx 'lan=lan1 lan2 lan3 lan4' "$ROOT/etc/ethernet_cfg.txt"
          grep -qx 'br_lan=br-lan' "$ROOT/etc/ethernet_cfg.txt"
          grep -qx 'ext_phy_port=5 6' "$ROOT/etc/ethernet_cfg.txt"
          test "$(grep -c 'CONFIG_MAP_R2_SUPPORT=y' "$PKG_MAKEFILE")" -eq 3 || {
            echo "::error::MAP R2 base macro must be passed to WAPP, MAPD and P1905."
            exit 1
          }
          test "$(grep -c 'CONFIG_MAP_R3_SUPPORT=y' "$PKG_MAKEFILE")" -eq 3 || {
            echo "::error::MAP R3 macro must be passed to WAPP, MAPD and P1905."
            exit 1
          }
          grep -q 'UAPD_INCLUDE_PATH=' "$PKG_MAKEFILE" || {
            echo "::error::WAPP UAPI include path is not explicit."
            exit 1
          }
          grep -Fq '$(INSTALL_DATA) ./files/etc/ethernet_cfg.txt' "$PKG_MAKEFILE" || {
            echo "::error::P1905 DSA runtime config is not installed."
            exit 1
          }
          DSA_PATCH="package/mtk/applications/easymesh-n60/patches/001-dsa-use-linux-mii-ioctl.patch"
          test -s "$DSA_PATCH"
          grep -q 'SIOCGMIIREG' "$DSA_PATCH"
          grep -q 'patch -d $(PKG_BUILD_DIR)/1905daemon -p1' "$PKG_MAKEFILE"
          git apply --numstat "$DSA_PATCH" >/dev/null || { echo "::error::EasyMesh DSA patch has invalid unified-diff syntax."; exit 1; }
          echo "PASS: WAPP/MAPD/P1905/WTS/DSA configuration, R2/R3 macros and Linux 6.12 MII patch."

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-dev rsync unzip zlib1g-dev file wget time xsltproc \
            libelf-dev device-tree-compiler qemu-utils python3-setuptools \
            python3-pyelftools swig ccache

      - name: Set Go proxy
        run: |
          echo "GOPROXY=https://goproxy.cn,direct" >> "$GITHUB_ENV"
          echo "GOSUMDB=off" >> "$GITHUB_ENV"

      - name: Restore OpenWrt build environment cache
        uses: actions/cache@v4
        with:
          path: |
            build_dir
            staging_dir
            dl
          key: ${{ runner.os }}-n60pro-openwrt-${{ hashFiles('Makefile', 'rules.mk', 'config/**', 'feeds.conf.default', 'include/**', 'scripts/**', 'tools/**', 'toolchain/**', 'target/linux/generic/**', 'target/linux/mediatek/**', 'package/mtk/applications/easymesh-n60/**', 'package/mtk/applications/datconf/**', 'package/libs/openssl/**', 'package/libs/libnl-tiny/**', '.github/workflows/easymesh-quick.yml') }}
          restore-keys: |
            ${{ runner.os }}-n60pro-openwrt-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure N60 Pro build
        shell: bash
        run: |
          set -euo pipefail
          cp config/n60pro-1001.config .config
          # Quick only needs the target OpenSSL headers and libssl/libcrypto
          # link interfaces. The firmware config enables the optional
          # libopenssl-devcrypto engine, which requires cryptodev-linux's
          # kernel UAPI header and is unrelated to WAPP/MAPD/P1905.
          # Disable only that optional engine package in this ephemeral Quick
          # config; the committed N60 config and Full firmware remain unchanged.
          sed -i '/^CONFIG_PACKAGE_libopenssl-devcrypto=y$/d' .config
          echo '# CONFIG_PACKAGE_libopenssl-devcrypto is not set' >> .config
          if grep -q '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_' .config; then
            sed -i -E "s|^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_[^=]+=y|# &|" .config
            sed -i -E "s|^# (CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEVICE})=y|\\1=y|" .config
          fi
          if ! grep -q "^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEVICE}=y" .config; then
            echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEVICE}=y" >> .config
          fi
          make defconfig
          if grep -qx 'CONFIG_PACKAGE_libopenssl-devcrypto=y' .config; then
            echo "::error::Quick config unexpectedly re-enabled optional libopenssl-devcrypto."
            exit 1
          fi
          echo "PASS: Quick excludes optional devcrypto engine; Full firmware config is unchanged."
          for option in \
            CONFIG_MTK_WIFI_MODE_AP=m \
            CONFIG_MTK_MT_AP_SUPPORT=m \
            CONFIG_MTK_BAND_STEERING=y \
            CONFIG_MTK_MBO_SUPPORT=y \
            CONFIG_MTK_MAP_SUPPORT=y
          do
            grep -qx "$option" .config || {
              echo "::error::Required MTK option missing after defconfig: $option"
              exit 1
            }
          done
          grep -qx "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEVICE}=y" .config
          if grep -qx "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEVICE}-mtkuboot=y" .config; then
            echo "::error::MTK U-Boot profile must not be selected."
            exit 1
          fi
          echo "PASS: N60 Pro Standard configuration resolved."

      - name: Download required MTK package sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dl
          REL="https://github.com/laodadelaoda/immortalwrt-mt798x-rebase/releases/download/dl-sources-7.6.7.3"
          for f in \
            wappd-80ca5724.tar.bz2 \
            mapd-6eca4331.tar.bz2 \
            1905daemon-35234223.tar.bz2 \
            libmapd-0132d199.tar.bz2
          do
            test -s "dl/$f" || wget -q -P dl "$REL/$f"
            test -s "dl/$f" || { echo "::error::Required source archive missing: $f"; exit 1; }
          done
          ls -lh dl/

      - name: Download only EasyMesh build dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Avoid the global firmware download scheduler: it traverses unrelated
          # selected packages (including kernel/mapfilter) that Quick never builds.
          for pkg in package/libs/openssl package/mtk/applications/datconf package/libs/libnl-tiny; do
            echo "===== Download sources: $pkg ====="
            make -C "$pkg" TOPDIR="$GITHUB_WORKSPACE" download V=s
          done

      - name: Preflight datconf source archive structure
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="dl/datconf-757f9679.tar.bz2"
          test -s "$ARCHIVE"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          tar -xjf "$ARCHIVE" -C "$TMP"
          CMAKE_FILE="$(find "$TMP" -path '*/datconf/datconf/CMakeLists.txt' -type f -print -quit)"
          test -n "$CMAKE_FILE" || {
            echo "::error::Pinned datconf archive is missing datconf/datconf/CMakeLists.txt"
            exit 1
          }
          grep -Fq 'add_subdirectory(lua)' "$CMAKE_FILE" || {
            echo "::error::Pinned datconf source no longer contains its Lua binding declaration."
            exit 1
          }
          if grep -Fq 'add_subdirectory(ucode)' "$CMAKE_FILE"; then
            echo "::error::Pinned datconf source now has a ucode CMake target; review its build dependency before changing Quick."
            exit 1
          fi
          test -d "$(dirname "$CMAKE_FILE")/lua"
          echo "PASS: pinned datconf archive has Lua binding and no ucode CMake subdirectory; no ucode patch is required."

      - name: Prepare host tools, preflight sources, target toolchain and kernel headers
        shell: bash
        run: |
          set -euo pipefail
          make tools/install -j"$(nproc)" V=s
          test -x staging_dir/host/bin/sed
          test -x staging_dir/host/bin/cmake || {
            echo "::error::OpenWrt host CMake is missing after tools/install."; exit 1;
          }
          # Prepare source trees only after OpenWrt host tools (patch/tar/CMake)
          # are installed, but before the expensive target toolchain build.
          # CMAKE_OPTIONS is a command-line override and is not included in
          # datconf's PKG_CONFIG_DEPENDS, so remove restored configure stamps.
          make -C package/mtk/applications/datconf TOPDIR="$GITHUB_WORKSPACE" clean V=s
          make -C package/mtk/applications/easymesh-n60 TOPDIR="$GITHUB_WORKSPACE" clean V=s
          # Fail fast on source hashes and patch application before toolchain and
          # OpenSSL builds consume the majority of Quick's preparation time.
          make -C package/mtk/applications/datconf TOPDIR="$GITHUB_WORKSPACE" prepare V=s
          DATCONF_CMAKE="build_dir/target-aarch64_cortex-a53_musl/datconf/datconf/CMakeLists.txt"
          test -s "$DATCONF_CMAKE" || { echo "::error::Prepared datconf CMakeLists.txt is missing."; exit 1; }
          grep -Fq 'add_subdirectory(lua)' "$DATCONF_CMAKE" || {
            echo "::error::Prepared datconf source is missing its Lua binding declaration."; exit 1;
          }
          ! grep -Fq 'add_subdirectory(ucode)' "$DATCONF_CMAKE" || {
            echo "::error::Prepared datconf source unexpectedly gained a ucode CMake target; review dependencies."; exit 1;
          }
          make -C package/mtk/applications/easymesh-n60 TOPDIR="$GITHUB_WORKSPACE" prepare V=s
          EASYMESH_BUILD_DIR="build_dir/target-aarch64_cortex-a53_musl/easymesh-n60-7.6.7.3"
          for f in wappd/Makefile mapd/Makefile 1905daemon/Makefile libmapd/Makefile; do
            test -s "$EASYMESH_BUILD_DIR/$f" || {
              echo "::error::Prepared EasyMesh source tree is missing $f"; exit 1;
            }
          done
          grep -Fq 'SIOCGMIIREG' "$EASYMESH_BUILD_DIR/1905daemon/ethernet/mediatek_DSA/eth_ops_dsa.c" || {
            echo "::error::N60 Linux 6.12 DSA ioctl patch was not applied to P1905 source."; exit 1;
          }
          echo "PASS: datconf and all four EasyMesh source trees prepared; patch application verified before toolchain build."
          make toolchain/install -j"$(nproc)" V=s
          # Quick builds need OpenSSL's target development files, not runtime APKs.
          # Request the package's InstallDev staging stamp directly. The package-local
          # "compile" goal also enters APK generation and dependency scanning, which
          # is outside Quick's responsibility and can fail on unrelated runtime
          # package metadata (Run #53: libc.so/libgcc_s.so.1).
          # The stamp target builds OpenSSL and runs Build/InstallDev only; it does
          # not create libopenssl3 APKs or invoke the global package scheduler.
          TARGET_STAGING="$GITHUB_WORKSPACE/staging_dir/target-aarch64_cortex-a53_musl"
          make -C package/libs/openssl TOPDIR="$GITHUB_WORKSPACE" \
            "$TARGET_STAGING/stamp/.openssl_installed" -j"$(nproc)" V=s
          test -s "$TARGET_STAGING/usr/include/openssl/x509.h" || {
            echo "::error::Target OpenSSL development headers were not staged: $TARGET_STAGING/usr/include/openssl/x509.h"
            exit 1
          }
          for lib in libssl.so libssl.so.3 libcrypto.so libcrypto.so.3; do
            test -e "$TARGET_STAGING/usr/lib/$lib" || {
              echo "::error::Target OpenSSL link library missing: $TARGET_STAGING/usr/lib/$lib"; exit 1;
            }
          done
          echo "PASS: target OpenSSL headers and OpenSSL 3 link libraries staged."
          # The package-local EasyMesh compile intentionally bypasses OpenWrt's
          # global package dependency scheduler. Stage datconf's development
          # interface explicitly so WAPP can include libdatconf.h and link
          # against the matching target libdatconf/libkvcutil outputs.
          # WAPP needs datconf's C development interface only. The optional
          # datconf ucode module is not part of EasyMesh and requires libucode
          # headers that this package-local Quick path intentionally does not stage.
          # Disable that unrelated binding for this staging-only build; Full firmware
          # retains the normal package configuration and dependency resolution.
          make -C package/mtk/applications/datconf TOPDIR="$GITHUB_WORKSPACE" \
            CMAKE_OPTIONS="-DLUAPATH=/usr/lib/lua" \
            "$TARGET_STAGING/stamp/.datconf_installed" -j"$(nproc)" V=s
          test -s "$TARGET_STAGING/usr/include/libdatconf.h" || {
            echo "::error::Target datconf development header was not staged: $TARGET_STAGING/usr/include/libdatconf.h"
            exit 1
          }
          test -s "$TARGET_STAGING/usr/include/libkvcutil.h" || {
            echo "::error::Target kvcutil development header was not staged: $TARGET_STAGING/usr/include/libkvcutil.h"
            exit 1
          }
          test -s "$TARGET_STAGING/usr/lib/libdatconf.a" || {
            echo "::error::Target libdatconf archive was not staged."
            exit 1
          }
          test -e "$TARGET_STAGING/usr/lib/libkvcutil.so" || {
            echo "::error::Target libkvcutil shared library was not staged."
            exit 1
          }
          test -e "$TARGET_STAGING/usr/lib/libkvcutil.so.1" || {
            echo "::error::Target libkvcutil.so.1 ABI library was not staged."
            exit 1
          }
          echo "PASS: target datconf/kvcutil development headers and libraries staged."
          # libnl-tiny is the third declared PKG_BUILD_DEPENDS of easymesh-n60.
          # Stage its target headers and ABI library explicitly because the
          # package-local EasyMesh compile bypasses the global dependency scheduler.
          make -C package/libs/libnl-tiny TOPDIR="$GITHUB_WORKSPACE" \
            "$TARGET_STAGING/stamp/.libnl-tiny_installed" -j"$(nproc)" V=s
          test -d "$TARGET_STAGING/usr/include/libnl-tiny" || {
            echo "::error::Target libnl-tiny development include directory was not staged."
            exit 1
          }
          test -n "$(find "$TARGET_STAGING/usr/include/libnl-tiny" -type f -print -quit)" || {
            echo "::error::Target libnl-tiny development headers are empty."
            exit 1
          }
          test -e "$TARGET_STAGING/usr/lib/libnl-tiny.so.1" || {
            echo "::error::Target libnl-tiny ABI library was not staged."
            exit 1
          }
          test -e "$TARGET_STAGING/usr/lib/libnl-tiny.so" || {
            echo "::error::Target libnl-tiny linker interface libnl-tiny.so was not staged."
            exit 1
          }
          echo "PASS: target libnl-tiny development headers and ABI library staged."
          LIBGCC_SO="$(find staging_dir -type f -path '*/lib/libgcc_s.so.*' -print -quit)"
          test -n "$LIBGCC_SO" || { echo "::error::Target libgcc_s.so was not staged."; exit 1; }
          echo "PASS: target runtime staged: $LIBGCC_SO"
          # Quick consumes only the patched target kernel source tree and MTK
          # WAPP UAPI headers. It does not need kernel Kconfig, .config, modules
          # or mapfilter. kernel_oldconfig is an unnecessary interactive phase.
          make target/linux/prepare V=s
          KERNEL_BASE="build_dir/target-aarch64_cortex-a53_musl/linux-mediatek_filogic"
          KERNEL_DIR="$(find "$KERNEL_BASE" -mindepth 1 -maxdepth 1 -type d -name 'linux-*' -print -quit)"
          test -n "$KERNEL_DIR" || {
            echo "::error::Target Linux source directory was not prepared under $KERNEL_BASE."
            exit 1
          }
          test -s "$KERNEL_DIR/Makefile" || {
            echo "::error::Prepared target Linux source tree is incomplete: $KERNEL_DIR"
            exit 1
          }
          WAPP_UAPI_DIR="$KERNEL_DIR/include/uapi/linux/wapp"
          for header in wapp_cmm_type.h mt_wlan_cmm_oid.h; do
            test -s "$WAPP_UAPI_DIR/$header" || {
              echo "::error::Required MTK WAPP UAPI header missing: $WAPP_UAPI_DIR/$header"
              exit 1
            }
          done
          echo "PASS: patched target kernel source and MTK WAPP UAPI headers are ready: $KERNEL_DIR"

          # Persist the audited Quick dependency closure alongside the compiled
          # binaries. This is a report only; it does not expand Quick into kernel
          # module, APK or firmware packaging work.
          mkdir -p artifacts/easymesh-quick
          MATRIX="artifacts/easymesh-quick/PREPARE-DEPENDENCY-MATRIX.txt"
          {
            echo "Revision: $(git rev-parse HEAD)"
            echo "Scope: userspace EasyMesh source build; no kernel module/APK/ITB build"
            echo "Declared PKG_BUILD_DEPENDS:"
            grep '^PKG_BUILD_DEPENDS' package/mtk/applications/easymesh-n60/Makefile
            echo
            echo "Host tools:"
            for f in staging_dir/host/bin/sed staging_dir/host/bin/cmake; do
              test -x "$f" && printf "PASS %s\\n" "$f"
            done
            echo
            echo "Target OpenSSL development interface:"
            for f in usr/include/openssl/x509.h usr/lib/libssl.so usr/lib/libssl.so.3 usr/lib/libcrypto.so usr/lib/libcrypto.so.3; do
              test -e "$TARGET_STAGING/$f" && printf "PASS %s\\n" "$TARGET_STAGING/$f"
            done
            echo
            echo "Target datconf/kvcutil development interface:"
            for f in usr/include/libdatconf.h usr/include/libkvcutil.h usr/lib/libdatconf.a usr/lib/libkvcutil.so usr/lib/libkvcutil.so.1; do
              test -e "$TARGET_STAGING/$f" && printf "PASS %s\\n" "$TARGET_STAGING/$f"
            done
            echo
            echo "Target libnl-tiny development interface:"
            for f in usr/lib/libnl-tiny.so usr/lib/libnl-tiny.so.1; do
              test -e "$TARGET_STAGING/$f" && printf "PASS %s\\n" "$TARGET_STAGING/$f"
            done
            find "$TARGET_STAGING/usr/include/libnl-tiny" -type f -print | sort
            echo
            echo "Target runtime:"
            printf "PASS %s\\n" "$LIBGCC_SO"
            echo
            echo "MTK WAPP UAPI:"
            printf "Kernel source: %s\\n" "$KERNEL_DIR"
            for f in "$WAPP_UAPI_DIR/wapp_cmm_type.h" "$WAPP_UAPI_DIR/mt_wlan_cmm_oid.h"; do
              printf "PASS %s\\n" "$f"
            done
            echo
            echo "EasyMesh source archive checksums:"
            sha256sum dl/wappd-80ca5724.tar.bz2 dl/mapd-6eca4331.tar.bz2 dl/1905daemon-35234223.tar.bz2 dl/libmapd-0132d199.tar.bz2
          } > "$MATRIX"
          cat "$MATRIX"

      - name: Compile EasyMesh package only
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/easymesh-quick
          LOG="artifacts/easymesh-quick/easymesh-source-compile.log"
          # Build the package's source .built stamp directly. Even the package-local
          # "compile" goal enters APK generation and CheckDependencies; that is
          # Full-mode runtime packaging work and caused Run #53's libc.so/libgcc_s
          # package-metadata failure. Quick validates only the six source outputs.
          EASYMESH_BUILD_DIR="$GITHUB_WORKSPACE/build_dir/target-aarch64_cortex-a53_musl/easymesh-n60-7.6.7.3"
          make -C package/mtk/applications/easymesh-n60 TOPDIR="$GITHUB_WORKSPACE" \
            "$EASYMESH_BUILD_DIR/.built" -j"$(nproc)" V=s 2>&1 | tee "$LOG"
          test -s "$EASYMESH_BUILD_DIR/.built" || {
            echo "::error::EasyMesh source-build stamp was not produced."; exit 1;
          }
          if grep -Eq 'gen-dependencies\.sh|apk mkpkg|package/kernel/(gpio-button-hotplug|mapfilter)/compile' "$LOG"; then
            echo "::error::Quick entered APK dependency scanning or the global kernel-module scheduler."
            exit 1
          fi

          WAPP_BIN="$(find build_dir -type f -path '*/easymesh-n60*/wappd/wapp' -print -quit)"
          test -n "$WAPP_BIN" || { echo "::error::Source-built WAPP was not found."; exit 1; }
          SRC_DIR="$(dirname "$(dirname "$WAPP_BIN")")"
          MAPD_BIN="$SRC_DIR/mapd/mapd"
          P1905_BIN="$SRC_DIR/1905daemon/p1905_managerd"
          WAPPCTRL_BIN="$SRC_DIR/wappd/wappctrl"
          ETH_OPS_LIB="$SRC_DIR/1905daemon/ethernet/libeth_1905ops.so"
          MAPD_IF_LIB="$SRC_DIR/libmapd/libmapd_interface_client.so"

          for f in "$WAPP_BIN" "$MAPD_BIN" "$P1905_BIN" "$WAPPCTRL_BIN" "$ETH_OPS_LIB" "$MAPD_IF_LIB"; do
            test -s "$f" || { echo "::error::Missing source-built output: $f"; exit 1; }
            readelf -h "$f" | grep -Fq 'AArch64' || { echo "::error::Not an AArch64 ELF: $f"; exit 1; }
          done
          readelf -d "$WAPP_BIN" | grep -Fq 'libkvcutil.so.1'
          readelf -d "$WAPP_BIN" | grep -Fq 'libssl.so.3'
          readelf -d "$WAPP_BIN" | grep -Fq 'libcrypto.so.3'
          readelf -d "$P1905_BIN" | grep -Fq 'libnl-tiny.so.1'
          readelf -d "$P1905_BIN" | grep -Fq 'libeth_1905ops.so'
          readelf -d "$P1905_BIN" | grep -Fq 'libssl.so.3'
          readelf -d "$P1905_BIN" | grep -Fq 'libcrypto.so.3'
          if readelf -d "$WAPP_BIN" "$P1905_BIN" 2>/dev/null | grep -Eq 'lib(ssl|crypto)[.]so[.]1[.]1'; then
            echo "::error::Obsolete OpenSSL 1.1 dependency detected."
            exit 1
          fi
          for symbol in wapp_read_wts_map_config /etc/map/wts_bss_info_config wapp_socket_and_ctrl_inf_init driver_rrm_onoff driver_wnm_btm_onoff wapp_send_btm_req_11kv_api; do
            strings -a "$WAPP_BIN" | grep -Fq "$symbol" || { echo "::error::WAPP missing required WTS/11k/11v path: $symbol"; exit 1; }
          done
          for symbol in STEER_FSM topo_srv_handle_topology_event steer_fsm_trigger parse_client_steering_btm_report_message; do
            strings -a "$MAPD_BIN" | grep -Fq "$symbol" || { echo "::error::MAPD missing steering/topology path: $symbol"; exit 1; }
          done
          for symbol in "read wts_bss_info_config to ctx->bss_config" "send topology discovery data" "Topology Discovery"; do
            strings -a "$P1905_BIN" | grep -Fq "$symbol" || { echo "::error::P1905 missing WTS/topology path: $symbol"; exit 1; }
          done

          cp "$WAPP_BIN" "$MAPD_BIN" "$P1905_BIN" "$WAPPCTRL_BIN" "$ETH_OPS_LIB" "$MAPD_IF_LIB" artifacts/easymesh-quick/
          {
            echo "Build revision: $(git rev-parse HEAD)"
            echo "Build scope: source .built only; APK packaging and runtime dependency scanning are deferred to Full."
            echo "Source build directory: $SRC_DIR"
            echo "===== Dynamic dependencies: WAPP ====="
            readelf -d "$WAPP_BIN" | grep NEEDED
            echo "===== Dynamic dependencies: P1905 ====="
            readelf -d "$P1905_BIN" | grep NEEDED
            echo "===== Source-built EasyMesh binary checksums ====="
            sha256sum "$WAPP_BIN" "$MAPD_BIN" "$P1905_BIN" "$WAPPCTRL_BIN" "$ETH_OPS_LIB" "$MAPD_IF_LIB"
          } > artifacts/easymesh-quick/QUICK-BUILD-INFO.txt
          echo "PASS: WAPP, MAPD, P1905, wappctrl and both shared libraries source-built and audited; no APK packaging was run."

      - name: Upload EasyMesh Quick Build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: n60pro-easymesh-quick-${{ github.run_number }}
          path: artifacts/easymesh-quick/
          if-no-files-found: error
          retention-days: 14
