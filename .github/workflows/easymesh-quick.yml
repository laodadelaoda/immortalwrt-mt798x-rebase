name: N60 Pro EasyMesh Quick Build

on:
  push:
    branches: ["n60pro-mtk-closed-driver"]
    paths:
      - ".github/workflows/easymesh-quick.yml"
      - ".github/actions/easymesh-quick/**"
      - "package/mtk/**"
      - "target/linux/**"
      - "config/n60pro-1001.config"
      - "scripts/feeds"
      - "include/**"
  workflow_dispatch:
    inputs:
      device:
        description: Router model for EasyMesh compatibility validation
        required: true
        type: choice
        default: netcore_n60-pro
        options:
          - netcore_n60-pro

permissions:
  contents: read
  actions: read

concurrency:
  group: n60-pro-easymesh-quick
  cancel-in-progress: false

jobs:
  quick:
    name: Linux 6.12 / ImmortalWrt 25.12 / OpenSSL 3.x compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      # Quick now owns the practical gate: native OpenWrt Prepare, source
      # compilation and link checks. Independent audit workflows and their
      # cross-run attestations are not prerequisites for a build.
      - name: Run Quick compatibility and EasyMesh source-build gate
        uses: ./.github/actions/easymesh-quick
        with:
          device: ${{ github.event.inputs.device || 'netcore_n60-pro' }}
