name: N60 Pro EasyMesh Quick Build

on:
  push:
    branches: ["n60pro-mtk-closed-driver"]
    paths:
      - ".github/workflows/easymesh-quick.yml"
      - ".github/workflows/quick-prepare-audit.yml"
      - ".github/workflows/vendor-source-patch-audit.yml"
      - ".github/actions/easymesh-quick/**"
      # Include the complete MTK package closure: vendor Lock, ordered patches,
      # Package Makefiles, source-audit scripts and regression tests.
      - "package/mtk/**"
      # Audit manifests are executable inputs to the canonical Lock regression gate.
      - "docs/audit/**"
      # Quick's precompile gate also validates the selected kernel patch stack.
      - "target/linux/**"
      - "config/n60pro-1001.config"
      - "scripts/feeds"
      - "include/**"
  workflow_dispatch:
    inputs:
      device:
        description: Router model for EasyMesh compatibility validation
        required: true
        type: choice
        default: netcore_n60-pro
        options:
          - netcore_n60-pro

permissions:
  contents: read
  actions: read

concurrency:
  group: n60-pro-easymesh-quick-manual
  cancel-in-progress: false

jobs:
  vendor_source_patch_audit:
    name: Fixed vendor source patch audit
    uses: ./.github/workflows/vendor-source-patch-audit.yml

  quick_prepare_audit:
    name: Quick precompile Package Prepare audit
    needs: vendor_source_patch_audit
    uses: ./.github/workflows/quick-prepare-audit.yml

  quick:
    needs: [vendor_source_patch_audit, quick_prepare_audit]
    name: Linux 6.12 / ImmortalWrt 25.12 / OpenSSL 3.x compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download attestation from this workflow run
        uses: actions/download-artifact@v6
        with:
          name: n60-vendor-audit-attestation
          path: .audit-attestation
      - name: Enforce exact audited source revision
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 package/mtk/applications/easymesh-n60/scripts/verify-vendor-audit-attestation.py verify --repo "$GITHUB_WORKSPACE" --attestation .audit-attestation/vendor-audit-attestation.json --expected-run-id "$GITHUB_RUN_ID" --expected-run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Download OpenSSL API evidence and exact-run migration attestation
        uses: actions/download-artifact@v6
        with:
          name: n60-openssl-3.5.9-api-and-provider-audit
          path: .openssl-api-evidence
      - name: Download 40-API OpenSSL migration attestation
        uses: actions/download-artifact@v6
        with:
          name: n60-openssl-api-migration-attestation
          path: .openssl-api-attestation
      - name: Verify exact 40-API OpenSSL migration credential and evidence artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 package/mtk/applications/easymesh-n60/scripts/verify-openssl-api-migration-attestation.py verify \\
            --repo-root "$GITHUB_WORKSPACE" \\
            --attestation .openssl-api-attestation/openssl-api-migration-attestation.json \\
            --evidence-dir .openssl-api-evidence \\
            --vendor-attestation .audit-attestation/vendor-audit-attestation.json \\
            --expected-run-id "$GITHUB_RUN_ID" \\
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT" \\
            --repository "$GITHUB_REPOSITORY" \\
            --verify-remote-artifact

      - name: Run shared Quick compatibility and EasyMesh source-build gate
        uses: ./.github/actions/easymesh-quick
        with:
          device: ${{ github.event.inputs.device || 'netcore_n60-pro' }}
