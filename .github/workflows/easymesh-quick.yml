name: N60 Pro EasyMesh Quick Build (frozen pending audit)

on:
  workflow_dispatch:
    inputs:
      device:
        description: N60 Pro build target
        required: true
        type: choice
        default: netcore_n60-pro
        options:
          - netcore_n60-pro

permissions:
  contents: read
  actions: read

concurrency:
  group: n60-pro-easymesh-quick
  cancel-in-progress: false

jobs:
  quick:
    # HARD FREEZE: this currently invokes compilation/linking. It must remain
    # disabled until the single canonical audit emits a valid attestation for
    # this exact commit and this workflow verifies that attestation.
    if: false
    name: Linux 6.12 / ImmortalWrt 25.12 / OpenSSL 3.x compatibility (frozen)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Build EasyMesh from source
        uses: ./.github/actions/easymesh-quick
        with:
          device: ${{ github.event.inputs.device || 'netcore_n60-pro' }}
