name: Audit WAPP 7.6.7.3 source

on:
  push:
    branches: ["n60pro-mtk-closed-driver"]
    paths:
      - ".github/workflows/wapp-source-audit.yml"
      - "package/mtk/applications/easymesh-n60/**"
      - "package/mtk/vendor-sources.lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository binaries
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Validate source-audit scripts and vendor patch declarations
        shell: bash
        run: |
          set -euo pipefail
          PKG="package/mtk/applications/easymesh-n60"
          python3 -m py_compile "$PKG/tests/test-easymesh-static-contract.py" "$PKG/tests/test-dpp-source-contract.py" "$PKG/tests/test-vendor-artifact-inventory.py"
          bash -n "$PKG/scripts/n60-auxiliary-source-audit.sh"
          test -s "$PKG/patches/011-wapp-wts-security.patch"
          test -s "$PKG/patches/012-p1905-wts-hardening.patch"
          test -s "$PKG/patches/013-wapp-wts-parser-fail-closed.patch"
          test -s "$PKG/patches/014-wapp-wps-key-log-redaction.patch"
          git apply --numstat "$PKG/patches/012-p1905-wts-hardening.patch" >/dev/null
          git apply --numstat "$PKG/patches/013-wapp-wts-parser-fail-closed.patch" >/dev/null
          git apply --numstat "$PKG/patches/014-wapp-wps-key-log-redaction.patch" >/dev/null
          test -s "$PKG/patches/015-dpp-config-lookup-null-and-error-guard.patch"
          git apply --numstat "$PKG/patches/015-dpp-config-lookup-null-and-error-guard.patch" >/dev/null
          test -s "$PKG/patches/016-dpp-qr-count-boundaries-and-error-propagation.patch"
          git apply --numstat "$PKG/patches/016-dpp-qr-count-boundaries-and-error-propagation.patch" >/dev/null
          python3 "$PKG/scripts/n60-vendor-source-transforms.py" verify-lock "$GITHUB_WORKSPACE"
          grep -Fq 'apply_patch_strict' "$PKG/Makefile"
          grep -Fq 'if (i >= content_len - 1)' "$PKG/patches/011-wapp-wts-security.patch"
          grep -Fq 'key is configured' "$PKG/patches/011-wapp-wts-security.patch"
          git apply --numstat "$PKG/auxiliary-patches/001-bndstrg-gcc14-werror-and-init.patch" >/dev/null
          git apply --numstat "$PKG/auxiliary-patches/002-fwdd-gcc14-bounded-ifname-copy.patch" >/dev/null
          echo "PASS: current WTS patch, Python source-contract tests and auxiliary audit script validate; removed WTS rewriter is no longer referenced."

      - name: Download and verify exact WAPP source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wapp-audit"
          python3 package/mtk/applications/easymesh-n60/scripts/n60-vendor-lock.py download \
            --repo "$GITHUB_WORKSPACE" --dl-dir "$RUNNER_TEMP/wapp-audit" \
            --ids wappd mapd 1905daemon libmapd
          cd "$RUNNER_TEMP/wapp-audit"
          echo "===== ARCHIVE CONTENTS ====="
          tar -tjf wappd-80ca5724.tar.bz2 | tee archive-files.txt
          mkdir source
          tar -xjf wappd-80ca5724.tar.bz2 -C source
          mkdir dpp-patch-root
          tar -xjf wappd-80ca5724.tar.bz2 -C dpp-patch-root
          tar -xjf mapd-6eca4331.tar.bz2 -C dpp-patch-root
          tar -xjf 1905daemon-35234223.tar.bz2 -C dpp-patch-root
          tar -xjf libmapd-0132d199.tar.bz2 -C dpp-patch-root
          LOCK_HELPER="$GITHUB_WORKSPACE/package/mtk/applications/easymesh-n60/scripts/n60-vendor-lock.py"
          TRANSFORM_HELPER="$GITHUB_WORKSPACE/package/mtk/applications/easymesh-n60/scripts/n60-vendor-source-transforms.py"
          patch_names="$(python3 "$LOCK_HELPER" patch-order --repo "$GITHUB_WORKSPACE" --set easymesh --phase application)"
          test -n "$patch_names" || { echo "DPP source capture has no locked application patch order" >&2; exit 1; }
          for name in $patch_names; do
            if [ "$name" = "017-dpp-credential-bounds-zeroization-and-log-redaction.patch" ]; then
              mkdir -p pre017-snapshot/common pre017-snapshot/dpp
              cp dpp-patch-root/wappd/common/main.c pre017-snapshot/common/main.c
              cp dpp-patch-root/wappd/dpp/dpp_wdev.c pre017-snapshot/dpp/dpp_wdev.c
              cp dpp-patch-root/wappd/dpp/dpp.c pre017-snapshot/dpp/dpp.c
              cp dpp-patch-root/wappd/dpp/dpp.h pre017-snapshot/dpp/dpp.h
            fi
            patch_file="$GITHUB_WORKSPACE/package/mtk/applications/easymesh-n60/patches/$name"
            if [ "$name" = "008-dpp-parser-bounds-and-secret-redaction.patch" ]; then
              context_dir="$RUNNER_TEMP/wapp-audit/failed-patch-context/008"
              mkdir -p "$context_dir/source/wappd/common" "$context_dir/source/wappd/dpp" "$context_dir/patches"
              cp dpp-patch-root/wappd/common/main.c "$context_dir/source/wappd/common/main.c.before-008"
              cp dpp-patch-root/wappd/dpp/dpp.c "$context_dir/source/wappd/dpp/dpp.c.before-008"
              cp dpp-patch-root/wappd/dpp/dpp.h "$context_dir/source/wappd/dpp/dpp.h.before-008"
              cp dpp-patch-root/wappd/dpp/dpp_wdev.c "$context_dir/source/wappd/dpp/dpp_wdev.c.before-008"
              cp dpp-patch-root/wappd/common/wdev.c "$context_dir/source/wappd/common/wdev.c.before-008"
              for prior in 002-dpp-parser-safety.patch 007-openssl3-use-native-evp-pkey-get0-ec-key.patch; do
                cp "$GITHUB_WORKSPACE/package/mtk/applications/easymesh-n60/patches/$prior" "$context_dir/patches/"
              done
              cp "$patch_file" "$context_dir/patches/"
              {
                echo "repository_sha=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
                echo "lock_sha256=$(sha256sum "$GITHUB_WORKSPACE/package/mtk/vendor-sources.lock.json" | awk '{print $1}')"
                echo "patch_002_sha256=$(sha256sum "$context_dir/patches/002-dpp-parser-safety.patch" | awk '{print $1}')"
                echo "patch_007_sha256=$(sha256sum "$context_dir/patches/007-openssl3-use-native-evp-pkey-get0-ec-key.patch" | awk '{print $1}')"
                echo "patch_008_sha256=$(sha256sum "$context_dir/patches/008-dpp-parser-bounds-and-secret-redaction.patch" | awk '{print $1}')"
              } > "$context_dir/CONTEXT-MANIFEST.txt"
              if ! patch --verbose --dry-run --batch --forward --fuzz=0 -p1 -d dpp-patch-root < "$patch_file" > "$context_dir/008-dry-run.log" 2>&1; then
                cat "$context_dir/008-dry-run.log"
                exit 1
              fi
              cat "$context_dir/008-dry-run.log"
              if ! patch --verbose --batch --forward --fuzz=0 -p1 -d dpp-patch-root < "$patch_file" > "$context_dir/008-apply.log" 2>&1; then
                cat "$context_dir/008-apply.log"
                exit 1
              fi
              cat "$context_dir/008-apply.log"
            else
              patch --dry-run --batch --forward --fuzz=0 -p1 -d dpp-patch-root < "$patch_file"
              patch --batch --forward --fuzz=0 -p1 -d dpp-patch-root < "$patch_file"
            fi
          done
          python3 "$TRANSFORM_HELPER" normalize "$RUNNER_TEMP/wapp-audit/dpp-patch-root"
          post_names="$(python3 "$LOCK_HELPER" patch-order --repo "$GITHUB_WORKSPACE" --set easymesh --phase post_normalize)"
          for name in $post_names; do
            patch_root_suffix="$(python3 "$LOCK_HELPER" patch-root --repo "$GITHUB_WORKSPACE" --set easymesh --phase post_normalize --name "$name")"
            patch_root="dpp-patch-root"
            if [ -n "$patch_root_suffix" ]; then patch_root="$patch_root/$patch_root_suffix"; fi
            patch_file="$GITHUB_WORKSPACE/package/mtk/applications/easymesh-n60/patches/$name"
            patch --dry-run --batch --forward --fuzz=0 -p1 -d "$patch_root" < "$patch_file"
            patch --batch --forward --fuzz=0 -p1 -d "$patch_root" < "$patch_file"
          done
          python3 "$TRANSFORM_HELPER" finalize "$RUNNER_TEMP/wapp-audit/dpp-patch-root"
          python3 - <<'PY'
          import pathlib
          root = pathlib.Path("dpp-patch-root/wappd/dpp")
          targets = {
              "dpp_wdev.c": ["void wapp_dpp_get_uri_frm_file(", "void dpp_save_dpp_uri_to_file("],
              "dpp.c": ["int  dpp_reset_dpp_config_file(", "void  dpp_remove_uri_from_file("],
          }
          for filename, signatures in targets.items():
              source = (root / filename).read_text()
              for signature in signatures:
                  start = source.index(signature)
                  brace = source.index("{", start)
                  depth = 0
                  for end in range(brace, len(source)):
                      if source[end] == "{": depth += 1
                      elif source[end] == "}":
                          depth -= 1
                          if depth == 0: break
                  else: raise SystemExit(f"unterminated {signature}")
                  print(f"\\n===== POST-LOCK {filename}: {signature} =====")
                  print(source[start:end + 1])
          PY
          echo "===== EXTRACTED FILE COUNT ====="
          find source -type f | wc -l
          echo "===== EXACT DPP QR COUNT SOURCE CONTEXT (PINNED WAPP ARCHIVE) ====="
          grep -RIn -C 45 --include='*.c' --include='*.h' 'qr_count' source/wappd/dpp | head -700
          echo "===== DPP QR COUNT CALLS AND TYPES ====="
          grep -RInE --include='*.c' --include='*.h' 'atoi\(value\)|uri_num|uri_cnt|MAP_MAX_DPP_URI_COUNT|qr_count' source/wappd/dpp | head -300
          mkdir -p binaries
          for name in wapp mapd p1905_managerd; do
            cp "$GITHUB_WORKSPACE/package/mtk/applications/easymesh-n60/files/usr/bin/$name" "binaries/$name"
            file "binaries/$name"
            readelf -h "binaries/$name" | grep -E "Class:|Machine:" || true
            echo "===== STRINGS: $name ====="
            strings -a "binaries/$name" | grep -iE "WAPP_USER_GET_WTS_CONFIG|WAPP_WTS_CONFIG|wts_bss_info_config|wapp_read_wts_map_config|EVENT_REGISTER|/tmp/wapp_server|map_handler" | head -100 || true
          done

      - name: Upload exact post-Lock DPP source for patch generation
        uses: actions/upload-artifact@v4
        with:
          name: dpp-post-lock-source
          path: |
            ${{ runner.temp }}/wapp-audit/dpp-patch-root/wappd/dpp/dpp.c
            ${{ runner.temp }}/wapp-audit/dpp-patch-root/wappd/dpp/dpp.h
            ${{ runner.temp }}/wapp-audit/dpp-patch-root/wappd/dpp/dpp_wdev.c
            ${{ runner.temp }}/wapp-audit/dpp-patch-root/wappd/common/main.c
            ${{ runner.temp }}/wapp-audit/pre017-snapshot/common/main.c
            ${{ runner.temp }}/wapp-audit/pre017-snapshot/dpp/dpp_wdev.c
            ${{ runner.temp }}/wapp-audit/pre017-snapshot/dpp/dpp.c
            ${{ runner.temp }}/wapp-audit/pre017-snapshot/dpp/dpp.h
          if-no-files-found: error
          retention-days: 7

      - name: Upload exact pre-008 DPP failure context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wapp-dpp-008-failure-context
          path: ${{ runner.temp }}/wapp-audit/failed-patch-context/008/
          if-no-files-found: warn
          retention-days: 14

      - name: Audit WTS parser, events, interface registration and WTS writers
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/wapp-audit"
          python3 - <<'PY'
          import pathlib, re
          root = pathlib.Path("source")
          files = [p for p in root.rglob("*") if p.is_file() and p.suffix.lower() in {".c",".h",".cc",".cpp",".hpp",".mk"}]
          print("SOURCE FILES:", len(files))
          patterns = {
              "WTS parser": re.compile(r"wapp_read_wts_map_config", re.I),
              "WTS references and writers": re.compile(r"wts|bss_info_config", re.I),
              "event registration/dispatch": re.compile(r"register.{0,50}event|event.{0,50}register|map_handler|event_handler|event_callback|notify.{0,30}event", re.I),
              "interface registration": re.compile(r"register.{0,50}(interface|ifname|netdev)|(?:interface|ifname|netdev).{0,50}register", re.I),
          }
          for label, rx in patterns.items():
              print("\n===== " + label + " =====")
              count = 0
              for p in files:
                  try: lines = p.read_text(errors="replace").splitlines()
                  except OSError as exc: raise SystemExit(f"cannot read audited source file {p}: {exc}") from exc
                  for n,line in enumerate(lines,1):
                      if rx.search(line):
                          print(f"{p}:{n}:{line[:300]}")
                          count += 1
                          if count >= 180:
                              print("... output capped at 180 matches")
                              break
                  if count >= 180: break
              print("MATCHES PRINTED:", count)
          print("\n===== COMPLETE WTS PARSER FUNCTION =====")
          def print_function(filename, signature, label):
              p = root / filename
              s = p.read_text(errors="replace")
              start = s.index(signature)
              brace = s.index("{", start)
              depth = 0
              for i in range(brace, len(s)):
                  if s[i] == "{": depth += 1
                  elif s[i] == "}":
                      depth -= 1
                      if depth == 0:
                          print("\\n===== " + label + " (" + filename + ") =====")
                          print(s[start:i+1])
                          return
              raise RuntimeError("unterminated function " + signature)
          print_function("wappd/common/main.c", "int wapp_read_wts_map_config(", "WTS PARSER")
          print_function("wappd/common/wdev.c", "void wdev_wps_configuration_handle(", "WTS WRITER")
          print_function("wappd/map/map_1905.c", "int map_handle_get_wts_config(", "WTS GET EVENT")
          print_function("wappd/map/map_1905.c", "int map_build_wts_config(", "WTS EVENT BUILDER")
          print_function("wappd/wapp_usr_intf/wapp_usr_intf.c", "int wapp_iface_process(", "USER SOCKET COMMAND DISPATCH")
          print_function("wappd/wapp_usr_intf/wapp_usr_intf.c", "void send_event_dispatch(", "USER EVENT DISPATCH")
          print("\\n===== WPS EVENT ROUTING =====")
          p = root / "wappd/common/wapp_cmm.c"
          lines = p.read_text(errors="replace").splitlines()
          for n in range(1498, 1523):
              print(f"{p}:{n+1}:{lines[n]}")
          print("\\n===== WAPP STARTUP / INTERFACE INIT REFERENCES =====")
          for p in files:
              for n,line in enumerate(p.read_text(errors="replace").splitlines(),1):
                  if "wapp_iface_init(wapp)" in line or "wapp_get_wireless_interfaces(wapp)" in line:
                      print(f"{p}:{n}:{line}")
          PY

      - name: Download and audit exact MAPD and P1905 source archives
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/wapp-audit"
          test -s mapd-6eca4331.tar.bz2
          test -s 1905daemon-35234223.tar.bz2
          mkdir -p mapd-source p1905-source
          tar -xjf mapd-6eca4331.tar.bz2 -C mapd-source
          tar -xjf 1905daemon-35234223.tar.bz2 -C p1905-source
          echo "===== MAPD SOURCE MACROS / VERSION CONFIG ====="
          grep -RInE 'CONFIG_MAP_R[234]_SUPPORT|MAP_R[234]_SUPPORT|map_ver|MAP_VERSION' mapd-source | head -240 || true
          echo "===== P1905 SOURCE DSA / ETHERNET CONFIG REFERENCES ====="
          grep -RInE 'SWTICH_DSA_ARCH|SWITCH_DSA_ARCH|ethernet_cfg\.txt|ext_phy_port|br_lan|lan_vid|wan_vid|CONFIG_MAP_R[234]_SUPPORT|MAP_R[234]_SUPPORT' p1905-source | head -300 || true
          echo "===== P1905 CONFIG MAKEFILE ====="
          find p1905-source -path '*/ethernet/config.mk' -o -path '*/ethernet/Makefile' | sort
          for f in $(find p1905-source -path '*/ethernet/config.mk' -o -path '*/ethernet/Makefile' | sort); do
            echo "--- $f ---"
            sed -n '1,220p' "$f"
          done

          echo "===== VERIFY COMPLETE WTS PATCH ON ALL THREE PINNED SOURCE TREES ====="
          PATCH_ROOT="$RUNNER_TEMP/wapp-audit/wts-patch-root"
          rm -rf "$PATCH_ROOT"
          mkdir -p "$PATCH_ROOT"
          tar -xjf wappd-80ca5724.tar.bz2 -C "$PATCH_ROOT"
          tar -xjf mapd-6eca4331.tar.bz2 -C "$PATCH_ROOT"
          tar -xjf 1905daemon-35234223.tar.bz2 -C "$PATCH_ROOT"
          tar -xjf libmapd-0132d199.tar.bz2 -C "$PATCH_ROOT"
          LOCK_HELPER="$GITHUB_WORKSPACE/package/mtk/applications/easymesh-n60/scripts/n60-vendor-lock.py"
          TRANSFORM_HELPER="$GITHUB_WORKSPACE/package/mtk/applications/easymesh-n60/scripts/n60-vendor-source-transforms.py"
          patch_names="$(python3 "$LOCK_HELPER" patch-order --repo "$GITHUB_WORKSPACE" --set easymesh --phase application)"
          test -n "$patch_names" || { echo "::error::Locked EasyMesh application patch order is empty."; exit 1; }
          wts_captured=0
          for name in $patch_names; do
            patch_file="$GITHUB_WORKSPACE/package/mtk/applications/easymesh-n60/patches/$name"
            test -s "$patch_file" || { echo "::error::Missing Lock-listed EasyMesh patch: $patch_file"; exit 1; }
            patch --dry-run --batch --forward --fuzz=0 -p1 -d "$PATCH_ROOT" < "$patch_file"
            patch --batch --forward --fuzz=0 -p1 -d "$PATCH_ROOT" < "$patch_file"
            if [ "$name" = "011-wapp-wts-security.patch" ]; then
              # Capture the real Lock-ordered state immediately after 011.
              mkdir -p "$RUNNER_TEMP/p1905-post-011" "$RUNNER_TEMP/wapp-post-011"
              cp "$PATCH_ROOT/1905daemon/src/file_io.c" "$RUNNER_TEMP/p1905-post-011/file_io.c"
              cp "$PATCH_ROOT/wappd/common/main.c" "$RUNNER_TEMP/wapp-post-011/main.c"
              wts_captured=1
            fi
          done
          test "$wts_captured" -eq 1 || { echo "::error::Patch 011 was not present in the locked application series."; exit 1; }
          # Match Build/Prepare exactly: all application patches first, then normalize,
          # post-normalize patches in Lock order, and finally source transforms.
          python3 "$TRANSFORM_HELPER" normalize "$PATCH_ROOT"
          post_names="$(python3 "$LOCK_HELPER" patch-order --repo "$GITHUB_WORKSPACE" --set easymesh --phase post_normalize)"
          for name in $post_names; do
            patch_root_suffix="$(python3 "$LOCK_HELPER" patch-root --repo "$GITHUB_WORKSPACE" --set easymesh --phase post_normalize --name "$name")"
            patch_root="$PATCH_ROOT"
            if [ -n "$patch_root_suffix" ]; then patch_root="$patch_root/$patch_root_suffix"; fi
            patch_file="$GITHUB_WORKSPACE/package/mtk/applications/easymesh-n60/patches/$name"
            patch --dry-run --batch --forward --fuzz=0 -p1 -d "$patch_root" < "$patch_file"
            patch --batch --forward --fuzz=0 -p1 -d "$patch_root" < "$patch_file"
          done
          python3 "$TRANSFORM_HELPER" finalize "$PATCH_ROOT"
          python3 - "$PATCH_ROOT" <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          p = (root / "1905daemon/src/file_io.c").read_text()
          start = p.index("int _1905_read_set_config(")
          end = p.index("\nchar* get_raw_data_end", start)
          fn = p[start:end]
          assert "if (*pos1 == '\\0')\n\t\t\tbreak;" in fn, "P1905 clean end-of-input guard missing"
          assert fn.index("if (i >= max_bss_num)") < fn.index("bss_info[i].authmode"), "P1905 record limit is not checked before array writes"
          assert "i--;" not in fn, "P1905 legacy post-write count rollback remains"
          assert fn.count("break;") == 1, "P1905 parser has a non-EOF break that can return partial success"
          assert "os_memset(bss_info, 0, sizeof(*bss_info) * max_bss_num);" in fn[fn.index("err:"):]
          assert "*config_bss_num = 0;" in fn[fn.index("err:"):]
          close = fn.index("if (fclose(f) < 0)")
          assert fn.index("ctx->map_policy.setting.primary_vid = pending_primary_vid;") > close
          assert "ctx->map_policy.setting.primary_vid = vid;" not in fn
          assert "ctx->map_policy.setting.dft.PCP = pcp;" not in fn
          assert "ctx->map_policy.tpolicy.updated = 1;" not in fn
          for field_error in ("index not found", "mac not found", "opclass not found", "ssid not found",
                              "authmode not found", "encrytype not found", "key not found",
                              "resv1 not found", "end line not found"):
              pos = fn.find(field_error)
              block_end = fn.find("}", pos)
              block = fn[pos:block_end + 1] if pos >= 0 and block_end >= 0 else ""
              assert "goto err;" in block and "break;" not in block, f"P1905 field must fail closed: {field_error}"
          w = (root / "wappd/common/main.c").read_text()
          ws = w.index("int wapp_read_wts_map_config(")
          we = w.index("\n#ifdef DPP_SUPPORT", ws)
          wfn = w[ws:we]
          loop = wfn[wfn.index("while (1) {"):wfn.index("\n\tif (i == 0)")]
          assert loop.index("if (i >= max_bss_num)") < loop.index("bss_info[i].operating_chan"), "WAPP record bound is not checked before array writes"
          assert "i--;" not in loop and "too much bss wireless setting info" not in loop, "WAPP legacy post-write truncation remains"
          assert loop.count("break;") == 1, "WAPP parser loop contains non-EOF break"
          assert re.search(r'wrong format hidden ssid\\n"\);\s*goto err;', loop), "WAPP malformed hidden-SSID path is not fail-closed"
          err = wfn[wfn.index("err:"):]
          assert "*config_bss_num = 0;" in err and "memset(bss_info, 0, sizeof(*bss_info) * max_bss_num);" in err
          assert "if (ferror(f))\n\t\tgoto err;" in wfn
          assert "continue;" not in loop, "WAPP malformed sscanf input can continue with partial parser state"
          for field_error in ("index not found", "mac not found", "opclass not found", "ssid not found",
                              "authmode not found", "encrytype not found", "key not found",
                              "resv1 not found", "resv2 not found"):
              pos = loop.find(field_error)
              block_end = loop.find("}", pos)
              block = loop[pos:block_end + 1] if pos >= 0 and block_end >= 0 else ""
              assert "goto err;" in block and "break;" not in block, f"WAPP field must fail closed: {field_error}"
          wps = (root / "wappd/common/wdev.c").read_text()
          assert "key is configured, len = %d" in wps and "\\nSSID = %s, key = %s, len = %d" not in wps, "WAPP WPS credential log redaction missing"
          dw = (root / "wappd/dpp/dpp_wdev.c").read_text()
          conf_start = dw.index("int wapp_dpp_get_conf_frm_file(")
          conf_end = dw.index("\nvoid wapp_dpp_get_uri_frm_file", conf_start)
          conf_fn = dw[conf_start:conf_end]
          assert "char param[64] = {0}, value[64] = {0};" in conf_fn
          assert "if (!wapp || !wapp->map || !str)" in conf_fn
          assert "get_dpp_parameters(wapp->map, param, value, sizeof(value)) < 0" in conf_fn

          m = (root / "mapd/src/topologySrv/topologySrv.c").read_text()
          assert "key is configured" in m and "key=%s" not in m, "MAPD secret-log redaction missing"
          print("PASS: WAPP pre-write record bound, malformed-input fail-closed path and MAPD key-log redaction")
          print("PASS: P1905 pre-write record bound, fail-closed parser, output rollback and deferred MAP R2 state")
          PY
          echo "PASS: complete WAPP/MAPD/P1905 patch series applied to pinned archives with zero fuzz."

