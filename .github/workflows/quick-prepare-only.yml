name: N60 Pro Quick precompile Package Prepare only
# The reusable Prepare job consumes the exact-SHA baseline artifact generated on every branch push.

on:
  push:
    branches:
      - n60pro-mtk-closed-driver
    paths:
      - ".github/workflows/vendor-source-patch-audit.yml"
      - ".github/workflows/quick-prepare-audit.yml"
      - ".github/scripts/**"
      - "config/n60pro-1001.config"
      - "docs/audit/easymesh-patch-dependencies.csv"
      - "docs/easymesh-patch-maintenance-groups.csv"
      - "feeds.conf.default"
      - "include/**"
      - "Makefile"
      - "package/kernel/mapfilter/**"
      - "package/libs/libnl-tiny/**"
      - "package/libs/openssl/**"
      - "package/mtk/**"
      - "package/vendor/**"
      - "scripts/**"
      - "target/linux/generic/patches-6.12/**"
      - "target/linux/mediatek/patches-6.12/**"
      - "target/linux/mediatek/tests/**"
      - ".github/workflows/quick-prepare-only.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # Each audited SHA gets an isolated Prepare workspace; stale revisions cannot block the current gate.
  group: n60-pro-quick-prepare-only-v2-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  vendor_source_patch_audit:
    name: Fixed vendor source patch audit
    uses: ./.github/workflows/vendor-source-patch-audit.yml

  quick_prepare_audit:
    name: Quick precompile Package Prepare audit
    needs: vendor_source_patch_audit
    uses: ./.github/workflows/quick-prepare-audit.yml
