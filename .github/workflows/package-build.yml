name: N60 Pro - Single Package (APK Reuse Candidate or Build)

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "APK package name, e.g. htop, ksmbd-server, kmod-fs-exfat"
        required: true
        type: string
        default: "ksmbd-server"
      force_compile:
        description: "Force source build even if an ImmortalWrt candidate exists"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: n60-pro-package-${{ inputs.package_name }}
  cancel-in-progress: false

jobs:
  inspect:
    name: Search ImmortalWrt and OpenWrt APK feeds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      needs_build: ${{ steps.check.outputs.needs_build }}
      package_name: ${{ steps.check.outputs.package_name }}
    steps:
      - name: Search official APK package directories
        id: check
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          FORCE_COMPILE: ${{ inputs.force_compile }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PACKAGE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9+_.-]*$ ]]; then
            echo "::error::Invalid package name: $PACKAGE_NAME"
            exit 1
          fi
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts/package
          python3 - <<'PY'
          import hashlib, os, pathlib, re, tarfile, urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin

          package = os.environ["PACKAGE_NAME"]
          force = os.environ.get("FORCE_COMPILE", "false").lower() == "true"
          out = pathlib.Path("artifacts/package")
          arch_ok = {"aarch64_cortex-a53", "all", "noarch", "mediatek_filogic"}

          # Search target packages and all standard architecture feeds for both projects.
          roots = []
          for distro, host in [
              ("ImmortalWrt", "https://downloads.immortalwrt.org/releases/25.12-SNAPSHOT/"),
              ("OpenWrt", "https://downloads.openwrt.org/releases/25.12-SNAPSHOT/"),
          ]:
              roots += [
                  (distro, host + "targets/mediatek/filogic/packages/"),
                  *[(distro, host + f"packages/aarch64_cortex-a53/{feed}/")
                    for feed in ("base", "packages", "luci", "routing", "telephony", "video")],
              ]

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      href = dict(attrs).get("href")
                      if href:
                          self.hrefs.append(href)

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "N60Pro-APK-Package-Checker/2.0"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.read()

          def pkginfo(data):
              # APK files are tar/gzip archives; .PKGINFO contains package metadata.
              import io
              with tarfile.open(fileobj=io.BytesIO(data), mode="r:*") as tf:
                  member = next((m for m in tf.getmembers() if m.name.lstrip("./") == ".PKGINFO"), None)
                  if member is None:
                      raise ValueError("APK archive has no .PKGINFO")
                  text = tf.extractfile(member).read().decode("utf-8", "replace")
              fields = {}
              for line in text.splitlines():
                  m = re.match(r"^(pkgname|pkgver|arch|depend)\s*=\s*(.*)$", line)
                  if m:
                      fields.setdefault(m.group(1), []).append(m.group(2).strip())
              return {k: (v if k == "depend" else (v[0] if v else "")) for k, v in fields.items()}

          candidates = []
          for distro, root in roots:
              try:
                  parser = Links()
                  parser.feed(get(root).decode("utf-8", "replace"))
              except Exception as exc:
                  print(f"FEED_UNAVAILABLE {distro} {root}: {exc}")
                  continue
              names = sorted({h for h in parser.hrefs
                              if h.endswith(".apk") and h.startswith(package + "-")})
              for name in names:
                  url = urljoin(root, name)
                  try:
                      data = get(url)
                      meta = pkginfo(data)
                      if meta.get("pkgname") != package:
                          continue
                      arch = meta.get("arch", "")
                      if arch not in arch_ok:
                          print(f"REJECT_ARCH {distro} {name}: {arch}")
                          continue
                      deps = meta.get("depend", [])
                      has_kmod = any(re.search(r"(^|[^A-Za-z0-9_])kmod-[A-Za-z0-9+_.-]+", d) for d in deps)
                      candidates.append({
                          "distro": distro, "url": url, "name": name, "data": data,
                          "version": meta.get("pkgver", "unknown"), "arch": arch,
                          "deps": deps, "has_kmod": has_kmod
                      })
                      print(f"CANDIDATE {distro}: {name}; version={meta.get('pkgver')}; arch={arch}; kmod_dependency={has_kmod}")
                  except Exception as exc:
                      print(f"CANDIDATE_CHECK_FAILED {url}: {exc}")

          # Prefer same-distribution ImmortalWrt packages. OpenWrt packages are
          # reported as fallback candidates only; distro mismatch means source build.
          imm = next((c for c in candidates if c["distro"] == "ImmortalWrt"), None)
          owrt = next((c for c in candidates if c["distro"] == "OpenWrt"), None)
          chosen = imm or owrt
          build = force or package.startswith("kmod-") or chosen is None or chosen["distro"] != "ImmortalWrt" or chosen["has_kmod"]

          if build:
              if force:
                  reason = "force_compile selected"
              elif package.startswith("kmod-"):
                  reason = "kernel module: build from this repository to avoid kernel ABI mismatch"
              elif chosen is None:
                  reason = "package not found in checked official APK directories"
              elif chosen["distro"] != "ImmortalWrt":
                  reason = "only an OpenWrt candidate was found; build from the ImmortalWrt-based source tree"
              else:
                  reason = "ImmortalWrt candidate depends on a kmod; local build is required"
              print("DECISION=BUILD_REQUIRED:", reason)
              (out / "DECISION.txt").write_text(
                  f"Package: {package}\nDecision: BUILD_REQUIRED\nReason: {reason}\n"
                  f"ImmortalWrt candidate: {imm['url'] if imm else 'not found'}\n"
                  f"OpenWrt candidate: {owrt['url'] if owrt else 'not found'}\n"
                  "OpenWrt/ImmortalWrt candidates are not proof of compatibility with the installed Chasey-derived firmware.\n",
                  encoding="utf-8")
              pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a").write("needs_build=true\n")
          else:
              filename = pathlib.Path(chosen["url"]).name
              dest = out / filename
              dest.write_bytes(chosen["data"])
              digest = hashlib.sha256(chosen["data"]).hexdigest()
              (out / "PACKAGE-INFO.txt").write_text(
                  f"Package: {package}\nDecision: IMMORTALWRT_APK_CANDIDATE\n"
                  f"Version: {chosen['version']}\nArchitecture: {chosen['arch']}\n"
                  f"Dependencies: {', '.join(chosen['deps']) or '(none listed)'}\n"
                  f"Source: {chosen['url']}\nSHA256: {digest}\n"
                  "IMPORTANT: candidate only, not certified compatible. Compare firmware revision, installed library versions, APK architecture and dependency constraints before installing.\n",
                  encoding="utf-8")
              print("DECISION=IMMORTALWRT_APK_CANDIDATE")
              pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a").write("needs_build=false\n")
          PY

      - name: Upload ImmortalWrt APK candidate
        if: steps.check.outputs.needs_build == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: N60-Pro-Package-${{ inputs.package_name }}-ImmortalWrt-APK-Candidate
          path: artifacts/package/
          if-no-files-found: error
          retention-days: 14

      - name: Upload search report
        if: steps.check.outputs.needs_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: N60-Pro-Package-${{ inputs.package_name }}-Search-Report
          path: artifacts/package/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build package from repository source
    needs: inspect
    if: needs.inspect.outputs.needs_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout N60 Pro source
        uses: actions/checkout@v4
        with:
          ref: 25.12
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-dev rsync unzip zlib1g-dev file wget time xsltproc libelf-dev device-tree-compiler qemu-utils python3-setuptools python3-pyelftools swig ccache

      - name: Restore shared compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-openwrt-n60pro-ccache-25.12-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-openwrt-n60pro-ccache-25.12-
            ${{ runner.os }}-openwrt-n60pro-ccache-

      - name: Update feeds and configure N60 Pro target
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          mkdir -p "$HOME/.cache/ccache" artifacts/package
          ccache --max-size=5G
          ccache --set-config=compiler_check=content
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n60-pro=y
          CONFIG_CCACHE=y
          EOF
          if [[ "$PACKAGE_NAME" == kmod-* ]]; then
            printf 'CONFIG_PACKAGE_%s=m\n' "$PACKAGE_NAME" >> .config
          else
            printf 'CONFIG_PACKAGE_%s=y\n' "$PACKAGE_NAME" >> .config
          fi
          make defconfig
          if ! grep -Eq "^CONFIG_PACKAGE_${PACKAGE_NAME}=(y|m)$" .config; then
            echo "::error::Package is not selectable by this source tree: $PACKAGE_NAME"
            echo "Check the exact package name and whether its feed/source is available."
            exit 1
          fi
          cp .config artifacts/package/config.buildinfo
          echo "Configured package: $PACKAGE_NAME"
          echo "Source revision: $(git log -1 --format='%H %s')"

      - name: Find package source directory
        id: source
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re
          pkg = os.environ["PACKAGE_NAME"]
          kernel_name = pkg[5:] if pkg.startswith("kmod-") else None
          matches = []
          for root in (pathlib.Path("package"), pathlib.Path("feeds")):
              if not root.exists():
                  continue
              for makefile in root.rglob("Makefile"):
                  if ".git" in makefile.parts:
                      continue
                  try:
                      text = makefile.read_text(errors="ignore")
                  except OSError:
                      continue
                  direct = re.search(r"^\s*define\s+Package/" + re.escape(pkg) + r"\s*$", text, re.M)
                  kernel = kernel_name and re.search(r"^\s*define\s+KernelPackage/" + re.escape(kernel_name) + r"\s*$", text, re.M)
                  if direct or kernel:
                      directory = makefile.parent.as_posix().removeprefix("./")
                      if directory.startswith("feeds/"):
                          directory = "package/feeds/" + directory[len("feeds/"):]
                      if directory not in matches:
                          matches.append(directory)
          if not matches:
              raise SystemExit(f"Could not map package '{pkg}' to a source Makefile.")
          print("Matched source directory:", matches[0])
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("directory=" + matches[0] + "\n")
          PY

      - name: Compile selected package
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          PACKAGE_DIR: ${{ steps.source.outputs.directory }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Compiling $PACKAGE_NAME from $PACKAGE_DIR"
          make "$PACKAGE_DIR/compile" -j2 V=s

      - name: Collect APK output and checksums
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/package/apk
          find bin/packages bin/targets/mediatek/filogic/packages -type f -name "${PACKAGE_NAME}-*.apk" -exec cp -t artifacts/package/apk {} + 2>/dev/null || true
          if ! find artifacts/package/apk -maxdepth 1 -type f -name '*.apk' | grep -q .; then
            echo "::error::Build finished but no APK for '$PACKAGE_NAME' was found."
            echo "Recent APK outputs:"
            find bin/packages bin/targets/mediatek/filogic/packages -type f -name '*.apk' 2>/dev/null | tail -n 80 || true
            exit 1
          fi
          {
            echo "Package: $PACKAGE_NAME"
            echo "Decision: SOURCE_BUILD"
            echo "Repository: laodadelaoda/immortalwrt-mt798x-rebase"
            echo "Branch: 25.12"
            echo "Source revision: $(git log -1 --format='%H %s')"
            echo "Target: mediatek/filogic, netcore_n60-pro"
            echo "Build command: make <matched-package-directory>/compile -j2 V=s"
            echo "Review dependencies and kernel ABI compatibility before installing."
            echo
            echo "Generated APKs:"
            find artifacts/package/apk -maxdepth 1 -type f -printf '%f (%s bytes)\n' | sort
          } > artifacts/package/PACKAGE-INFO.txt
          (cd artifacts/package && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          cat artifacts/package/PACKAGE-INFO.txt
          cat artifacts/package/SHA256SUMS.txt

      - name: Upload compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: N60-Pro-Package-${{ inputs.package_name }}-Built-APK
          path: artifacts/package/
          if-no-files-found: error
          retention-days: 14

      - name: Report compiler cache
        if: always()
        run: ccache -s
