name: N60 Pro Merge Validated Upstream Candidate

on:
  workflow_run:
    workflows:
      - N60 Pro Full Build
    types:
      - completed
    branches:
      - automation/upstream-25.12-candidate

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: n60pro-merge-validated-upstream-candidate
  cancel-in-progress: false

jobs:
  merge-validated-candidate:
    name: Merge exact candidate after successful Full firmware build
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'workflow_dispatch' ||
       github.event.workflow_run.event == 'pull_request') &&
      github.event.workflow_run.head_branch == 'automation/upstream-25.12-candidate' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify exact candidate revision and non-empty firmware artifact
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          TARGET_BRANCH: n60pro-25.12-upstream-base
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RUN_ID"
          test -n "$HEAD_SHA"
          test "$HEAD_BRANCH" = "automation/upstream-25.12-candidate"
          case "$SOURCE_EVENT" in
            workflow_dispatch|pull_request) ;;
            *) echo "Unexpected Full trigger event: $SOURCE_EVENT"; exit 1 ;;
          esac
          test "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$SOURCE_CONCLUSION" = "success"
          PR_JSON="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_BRANCH" --base "$TARGET_BRANCH" --state open --json number,headRefOid)"
          PR_COUNT="$(printf '%s' "$PR_JSON" | jq 'length')"
          if [ "$PR_COUNT" -ne 1 ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "No unique open candidate PR remains; this Full run is stale."
            exit 0
          fi
          PR_HEAD="$(printf '%s' "$PR_JSON" | jq -r '.[0].headRefOid')"
          if [ "$PR_HEAD" != "$HEAD_SHA" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale Full run for $HEAD_SHA; current PR head is $PR_HEAD."
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
          RUN_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          test "$(printf '%s' "$RUN_JSON" | jq -r '.head_sha')" = "$HEAD_SHA"
          test "$(printf '%s' "$RUN_JSON" | jq -r '.head_branch')" = "$HEAD_BRANCH"
          test "$(printf '%s' "$RUN_JSON" | jq -r '.conclusion')" = "success"
          ARTIFACTS_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts")"
          FIRMWARE_COUNT="$(printf '%s' "$ARTIFACTS_JSON" | jq --arg name "n60pro-immortalwrt-firmware-$RUN_NUMBER" '[.artifacts[] | select(.name == $name) | select(.expired == false) | select(.size_in_bytes > 0)] | length')"
          test "$FIRMWARE_COUNT" -ge 1
          echo "Exact candidate $HEAD_SHA passed Full and uploaded a non-empty firmware artifact."

      - name: Merge only the exact validated candidate PR
        if: steps.verify.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: automation/upstream-25.12-candidate
          TARGET_BRANCH: n60pro-25.12-upstream-base
        shell: bash
        run: |
          set -Eeuo pipefail
          PR_JSON="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_BRANCH" --base "$TARGET_BRANCH" --state open --json number,headRefOid,isDraft)"
          PR_COUNT="$(printf '%s' "$PR_JSON" | jq 'length')"
          test "$PR_COUNT" -eq 1
          PR_NUMBER="$(printf '%s' "$PR_JSON" | jq -r '.[0].number')"
          PR_HEAD="$(printf '%s' "$PR_JSON" | jq -r '.[0].headRefOid')"
          PR_DRAFT="$(printf '%s' "$PR_JSON" | jq -r '.[0].isDraft')"
          test "$PR_HEAD" = "$HEAD_SHA"
          if [ "$PR_DRAFT" = "true" ]; then gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"; fi
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge --delete-branch
          git init verify-merge
          cd verify-merge
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags origin "$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          git merge-base --is-ancestor "$HEAD_SHA" "refs/remotes/origin/$TARGET_BRANCH"
          echo "Merged PR #$PR_NUMBER after exact-SHA Full success and firmware artifact verification from run $RUN_ID."
