name: N60 Pro Quick precompile Package Prepare audit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  prepare-audit:
    name: Native Package Prepare and EasyMesh source contract tests (no compile)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact audited revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download attestation from this workflow run
        uses: actions/download-artifact@v6
        with:
          name: n60-vendor-audit-attestation
          path: .audit-attestation

      - name: Enforce exact audited source revision and Lock
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 package/mtk/applications/easymesh-n60/scripts/verify-vendor-audit-attestation.py verify \
            --repo "$GITHUB_WORKSPACE" \
            --attestation .audit-attestation/vendor-audit-attestation.json \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Install feeds and configure N60 Pro
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp config/n60pro-1001.config .config
          make defconfig

      - name: Apply the complete Linux 6.12 kernel patch stack before kernel configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          KERNEL_PATCH_LOG="$RUNNER_TEMP/n60-linux-6.12-patch-prepare.log"
          echo "===== OpenWrt Kernel/Prepare: pristine source plus generic and MediaTek patch stacks ====="
          python3 target/linux/mediatek/tests/audit-kernel-patch-stack.py inventory --repo "$GITHUB_WORKSPACE" --output-dir "$GITHUB_WORKSPACE/kernel-patch-audit"
          PATCH_WRAPPER="$RUNNER_TEMP/n60-patch-snapshot-wrapper"
          cat > "$PATCH_WRAPPER" <<'PATCH_WRAPPER_EOF'
          #!/usr/bin/env bash
          set -u
          patch_input="$(mktemp)"
          trap 'rm -f "$patch_input"' EXIT

          targetdir="."
          patch_file=""
          args=("$@")
          for ((i = 0; i < ${#args[@]}; i++)); do
            case "${args[$i]}" in
              -d|--directory)
                if (( i + 1 < ${#args[@]} )); then targetdir="${args[$((i + 1))]}"; fi
                ;;
              -i|--input)
                if (( i + 1 < ${#args[@]} )); then patch_file="${args[$((i + 1))]}"; fi
                ;;
              -i?*)
                patch_file="${args[$i]#-i}"
                ;;
            esac
          done
          targetdir="$(cd "$targetdir" && pwd)"
          if [[ -n "$patch_file" && -f "$patch_file" ]]; then
            cp -f "$patch_file" "$patch_input"
          else
            cat > "$patch_input"
          fi

          # PPE stage identification is based on the resulting source tree,
          # not patch command-line spelling or mail-header text. OpenWrt may
          # invoke patch with stdin, -i, or normalized input.
          stage=""

          snapshot_sources() {
            local name="$1"
            local out="$GITHUB_WORKSPACE/kernel-patch-audit/ppe-reconstruction/$name"
            mkdir -p "$out"
            for rel in \
              drivers/net/ethernet/mediatek/mtk_ppe_offload.c \
              drivers/net/ethernet/mediatek/mtk_ppe_debugfs.c \
              drivers/net/ethernet/mediatek/mtk_ppe.c \
              drivers/net/ethernet/mediatek/mtk_ppe.h \
              drivers/net/ethernet/mediatek/mtk_eth_soc.h \
              include/net/flow_offload.h \
              include/net/netfilter/nf_conntrack_extend.h \
              include/net/netfilter/nf_conntrack_qos.h \
              include/net/netfilter/nf_flow_table.h \
              include/net/netns/conntrack.h \
              net/netfilter/nf_conntrack_core.c \
              net/netfilter/nf_conntrack_extend.c \
              net/netfilter/nf_conntrack_netlink.c \
              net/netfilter/nf_conntrack_standalone.c \
              net/netfilter/nf_flow_table_core.c \
              net/netfilter/nf_flow_table_ip.c \
              net/netfilter/nf_flow_table_offload.c \
              net/netfilter/xt_FLOWOFFLOAD.c; do
              if [[ -s "$targetdir/$rel" ]]; then
                mkdir -p "$out/$(dirname "$rel")"
                cp -f "$targetdir/$rel" "$out/$rel"
                [[ ! -s "$targetdir/$rel.rej" ]] || cp -f "$targetdir/$rel.rej" "$out/$rel.rej"
                [[ ! -s "$targetdir/$rel.orig" ]] || cp -f "$targetdir/$rel.orig" "$out/$rel.orig"
              fi
            done
            cp -f "$GITHUB_WORKSPACE/target/linux/mediatek/patches-6.12/999-ppe-04-mtk_ppe-change-to-internal-QoS-mode.patch" "$out/"
            if [[ "$stage" == "after-05" || "$name" == "before-05" || "$name" == "failed-05-partial" ]]; then
              cp -f "$GITHUB_WORKSPACE/target/linux/mediatek/patches-6.12/999-ppe-05-xt_FLOWOFFLOAD-add-DSCP-learning-flow.patch" "$out/"
            fi
            (cd "$out" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
            echo "Captured PPE source snapshot: $name"
          }

          ppe_offload="$targetdir/drivers/net/ethernet/mediatek/mtk_ppe_offload.c"
          ppe_core="$targetdir/drivers/net/ethernet/mediatek/mtk_ppe.c"
          ppe_eth_header="$targetdir/drivers/net/ethernet/mediatek/mtk_eth_soc.h"
          after04_snapshot="$GITHUB_WORKSPACE/kernel-patch-audit/ppe-reconstruction/after-04/drivers/net/ethernet/mediatek/mtk_ppe_offload.c"
          before05_snapshot="$GITHUB_WORKSPACE/kernel-patch-audit/ppe-reconstruction/before-05/drivers/net/ethernet/mediatek/mtk_ppe_offload.c"
          after05_snapshot="$GITHUB_WORKSPACE/kernel-patch-audit/ppe-reconstruction/after-05/drivers/net/ethernet/mediatek/mtk_ppe_offload.c"

          # The first patch invocation after PPE-04 is the pre-05 boundary.
          # Capture it before applying that next patch, while the QoS mode
          # change is present and the DSCP setter has not yet appeared.
          if [[ -s "$after04_snapshot" && ! -s "$before05_snapshot" ]] &&
             [[ -s "$ppe_eth_header" ]] && grep -Fq 'qos_toggle' "$ppe_eth_header" &&
             [[ -s "$ppe_offload" ]] && ! grep -Fq 'mtk_foe_entry_set_dscp' "$ppe_offload"; then
            stage="before-05"
            snapshot_sources "before-05"
          fi

          # Capture the complete netdevice.h state immediately before and after
          # every patch that touches it. This preserves the actual application chain,
          # rather than relying on reconstructed context from a failed hunk.
          snapshot_netdevice() {
            local phase="$1"
            local patch_name="$2"
            local out="$GITHUB_WORKSPACE/kernel-patch-audit/netdevice-chain/$patch_name/$phase"
            mkdir -p "$out"
            test -s "$targetdir/include/linux/netdevice.h" || return 0
            cp -f "$targetdir/include/linux/netdevice.h" "$out/netdevice.h"
            if [[ -s "$targetdir/include/linux/netdevice.h.rej" ]]; then
              cp -f "$targetdir/include/linux/netdevice.h.rej" "$out/netdevice.h.rej"
            fi
            cp -f "$patch_input" "$out/applied.patch"
            (cd "$out" && sha256sum netdevice.h applied.patch *.rej 2>/dev/null > SHA256SUMS || sha256sum netdevice.h applied.patch > SHA256SUMS)
            echo "NETDEVICE SNAPSHOT: $patch_name / $phase"
            cat "$out/SHA256SUMS"
          }

          netdevice_patch=0
          patch_digest="$(sha256sum "$patch_input" | awk '{print $1}')"
          patch_name="$(basename "${patch_file:-stdin.patch}")-${patch_digest:0:16}"
          if grep -Fq 'include/linux/netdevice.h' "$patch_input"; then
            netdevice_patch=1
            snapshot_netdevice "pre" "$patch_name"
          fi

          # Enforce the acceptance contract at invocation time, not only by log inspection.
          strict_args=()
          drop_fuzz_value=0
          for arg in "${args[@]}"; do
            if (( drop_fuzz_value )); then
              drop_fuzz_value=0
              continue
            fi
            case "$arg" in
              --fuzz|-F) drop_fuzz_value=1 ;;
              --fuzz=*|-F[0-9]*) ;;
              *) strict_args+=("$arg") ;;
            esac
          done
          strict_args+=(--verbose --fuzz=0 --batch --forward)

          if [[ -n "$patch_file" && -f "$patch_file" ]]; then
            /usr/bin/patch "${strict_args[@]}"
            rc=$?
          else
            /usr/bin/patch "${strict_args[@]}" < "$patch_input"
            rc=$?
          fi
          if (( rc != 0 )); then
            if (( netdevice_patch )); then snapshot_netdevice "failed" "$patch_name"; fi
            if [[ "$stage" == "after-05" ]]; then snapshot_sources "failed-05-partial"; fi
            exit "$rc"
          fi

          if (( netdevice_patch )); then snapshot_netdevice "post" "$patch_name"; fi

          # Capture the exact post-application source states at the PPE-04
          # and PPE-05 boundaries. These signatures are introduced by the
          # respective patches and remain independent of patch(1) arguments.
          if [[ ! -s "$after04_snapshot" ]] &&
             [[ -s "$ppe_eth_header" ]] && grep -Fq 'qos_toggle' "$ppe_eth_header" &&
             [[ -s "$ppe_offload" ]] && grep -Fq 'mtk_flow_set_output_device' "$ppe_offload"; then
            stage="after-04"
            snapshot_sources "after-04"
          fi
          if [[ ! -s "$after05_snapshot" ]] &&
             [[ -s "$ppe_core" ]] && grep -Fq 'mtk_foe_entry_set_dscp' "$ppe_core" &&
             [[ -s "$ppe_offload" ]] && grep -Fq 'mtk_foe_entry_set_dscp' "$ppe_offload"; then
            stage="after-05"
            snapshot_sources "after-05"
          fi
          PATCH_WRAPPER_EOF
          chmod +x "$PATCH_WRAPPER"
          PATCH_BIN="$RUNNER_TEMP/n60-patch-bin"
          mkdir -p "$PATCH_BIN"
          ln -sf "$PATCH_WRAPPER" "$PATCH_BIN/patch"
          export PATH="$PATCH_BIN:$PATH"
          unset PATCH
          echo "PATCH wrapper: $(command -v patch)"
          echo "Patch wrapper is injected through PATH so scripts invoking literal patch are also captured."
          if ! make target/linux/prepare V=s 2>&1 | tee "$KERNEL_PATCH_LOG"; then
            echo "::error::Linux 6.12 source preparation or complete kernel patch application failed."
            tail -n 250 "$KERNEL_PATCH_LOG"
            for reject in $(find build_dir -type f -name "*.rej"); do
              echo "===== $reject ====="
              sed -n "1,220p" "$reject"
            done
            for source in $(find build_dir -type f -path "*/drivers/pci/controller/pcie-mediatek-gen3.c"); do
              mkdir -p kernel-patch-audit/failure-source
              cp -f "$source" kernel-patch-audit/failure-source/pcie-mediatek-gen3.c
              if test -s "$source.rej"; then cp -f "$source.rej" kernel-patch-audit/failure-source/pcie-mediatek-gen3.c.rej; fi
              cp -f target/linux/mediatek/patches-6.12/999-pcie-02-pcie-mediatek-gen3-Add-PCIe-IRQ-affinity-support.patch kernel-patch-audit/failure-source/
              sha256sum kernel-patch-audit/failure-source/* || true
              echo "===== ACTUAL PCIe IRQ teardown context ($source) ====="
              grep -n -B 45 -A 70 "static void mtk_pcie_irq_teardown" "$source" || true
              echo "===== ACTUAL PCIe IRQ handler/setup context ($source) ====="
              sed -n '880,1035p' "$source"
              echo "===== ACTUAL PATCHED SOURCE: mtk_pcie_irq_handler ($source) ====="
              grep -n -B 12 -A 65 "static void mtk_pcie_irq_handler" "$source" || true
              echo "===== ACTUAL PATCHED SOURCE: mtk_pcie_setup_irq ($source) ====="
              grep -n -B 12 -A 35 "static int mtk_pcie_setup_irq" "$source" || true
              echo "===== ACTUAL PATCHED SOURCE: mtk_pcie_msi_handler ($source) ====="
              grep -n -B 8 -A 45 "static void mtk_pcie_msi_handler" "$source" || true
            done
            for source in $(find build_dir -type f -path "*/drivers/net/ethernet/mediatek/mtk_ppe_offload.c"); do
              mkdir -p kernel-patch-audit/failure-source/ppe
              cp -f "$source" kernel-patch-audit/failure-source/ppe/mtk_ppe_offload.c
              if test -s "$source.rej"; then cp -f "$source.rej" kernel-patch-audit/failure-source/ppe/mtk_ppe_offload.c.rej; fi
              cp -f target/linux/mediatek/patches-6.12/999-ppe-*.patch kernel-patch-audit/failure-source/ppe/
              cp -f target/linux/mediatek/patches-6.12/999-wed-07-mtk-wed-add-hwpath-wmm-support.patch kernel-patch-audit/failure-source/ppe/
              echo "===== ACTUAL PPE output-device function after failed patch application ($source) ====="
              grep -n -B 30 -A 100 "mtk_flow_set_output_device" "$source" || true
              echo "===== ACTUAL PPE conntrack QoS extension helper ====="
              grep -n -B 12 -A 25 "nf_ct_qos_ext_add" build_dir/target-*/linux-*/linux-6.12.112/include/net/netfilter/nf_conntrack_qos.h 2>/dev/null || true
              sha256sum kernel-patch-audit/failure-source/ppe/* || true
            done
            for source in $(find build_dir -type f -path "*/net/netfilter/nf_flow_table_core.c"); do
              mkdir -p kernel-patch-audit/failure-source/ppe
              cp -f "$source" kernel-patch-audit/failure-source/ppe/nf_flow_table_core.c
              if test -s "$source.rej"; then cp -f "$source.rej" kernel-patch-audit/failure-source/ppe/nf_flow_table_core.c.rej; fi
              echo "===== ACTUAL nf_flow_table_module_exit after failed PPE patch ($source) ====="
              grep -n -B 25 -A 45 "static void __exit nf_flow_table_module_exit" "$source" || true
              sha256sum kernel-patch-audit/failure-source/ppe/nf_flow_table_core.c*
            done
            for source in $(find build_dir -type f -path "*/include/linux/netdevice.h"); do
              out="kernel-patch-audit/failure-source/netdevice"
              mkdir -p "$out"
              cp -f "$source" "$out/netdevice.h.pre-wed"
              cp -f "$source.rej" "$out/netdevice.h.rej" 2>/dev/null || true
              cp -f target/linux/mediatek/patches-6.12/999-hnat-13-netdevice-add-ndo_flow_offload_stats64_add-for-offload-stats-correction.patch "$out/"
              cp -f target/linux/mediatek/patches-6.12/999-net-01-netdevice-add-macvlan-device-path-type.patch "$out/"
              cp -f target/linux/mediatek/patches-6.12/999-net-02-netdevice-add-dslite-device-path-type.patch "$out/"
              cp -f target/linux/mediatek/patches-6.12/999-net-02-netdevice-add-npu-device-path-type.patch "$out/"
              cp -f target/linux/mediatek/patches-6.12/999-net-03-netdevice-add-tnl-device-path-type.patch "$out/"
              cp -f target/linux/mediatek/patches-6.12/999-ppe-01-xt_FLOWOFFLOAD-add-bridging-support.patch "$out/"
              cp -f target/linux/mediatek/patches-6.12/999-wed-07-mtk-wed-add-hwpath-wmm-support.patch "$out/"
              sed -n '835,930p' "$source" > "$out/netdevice-path-context.txt"
              (cd "$out" && sha256sum netdevice.h.pre-wed netdevice.h.rej *.patch netdevice-path-context.txt 2>/dev/null > SHA256SUMS)
              echo "===== PRE-WED netdevice.h SHA256 and complete path layout ($source) ====="
              cat "$out/SHA256SUMS"
              cat "$out/netdevice-path-context.txt"
              echo "===== ACTUAL SOURCE: net_device_path_type ($source) ====="
              grep -n -B 5 -A 18 "enum net_device_path_type" "$source" || true
            done
            for source in $(find build_dir -type f -path "*/drivers/net/ethernet/mediatek/mtk_eth_soc.c"); do
              echo "===== ACTUAL PATCHED SOURCE: mtk_tx_timeout ($source) ====="
              grep -n -B 12 -A 28 "static void mtk_tx_timeout" "$source" || true
              echo "===== ACTUAL PATCHED SOURCE: mtk_get_irqs ($source) ====="
              grep -n -B 8 -A 42 "static int mtk_get_irqs" "$source" || true
              echo "===== ALL pending_work scheduling sites ($source) ====="
              grep -n -B 5 -A 5 "schedule_work(&eth->pending_work)" "$source" || true
            done
            KERNEL_MAKEFILE_DIAG="$(find build_dir -path "*/linux-6.12.112/Makefile" -print -quit)"
            if test -n "$KERNEL_MAKEFILE_DIAG"; then
              KERNEL_SRC_DIAG="$(dirname "$KERNEL_MAKEFILE_DIAG")"
              source="$KERNEL_SRC_DIAG/drivers/net/phy/air_en8811h.c"
              if test -e "$source"; then
                mkdir -p kernel-patch-audit/failure-source/phy
                cp -Lf "$source" kernel-patch-audit/failure-source/phy/air_en8811h.c
                if test -s "$source.rej"; then cp -f "$source.rej" kernel-patch-audit/failure-source/phy/air_en8811h.c.rej; fi
                cp -f target/linux/generic/backport-6.12/720-09-v6.14-net-phy-Constify-struct-mdio_device_id.patch kernel-patch-audit/failure-source/phy/
                cp -f target/linux/generic/backport-6.12/788-v7.3-net-phy-air_en8811h-move-LED-GPIO-configuration-to-config_init.patch kernel-patch-audit/failure-source/phy/
                echo "===== ACTUAL PHY SOURCE AROUND en8811h_config_init ($source) ====="
                sed -n '820,930p' "$source"
                sha256sum kernel-patch-audit/failure-source/phy/*
              else
                echo "::warning::PHY source snapshot not found at $source"
              fi
              source="$KERNEL_SRC_DIAG/drivers/net/ethernet/mediatek/mtk_ppe.c"
              if test -e "$source"; then
                mkdir -p kernel-patch-audit/failure-source/ppe
                cp -Lf "$source" kernel-patch-audit/failure-source/ppe/mtk_ppe.c
                if test -s "$source.rej"; then cp -f "$source.rej" kernel-patch-audit/failure-source/ppe/mtk_ppe.c.rej; fi
                cp -f target/linux/mediatek/patches-6.12/999-ppe-14-mtk_ppe-add-PPE-cache-preserved-line-lock.patch kernel-patch-audit/failure-source/ppe/
                cp -f target/linux/mediatek/patches-6.12/999-ppe-20-mtk_ppe-add-adaptive-PPPQ-mode.patch kernel-patch-audit/failure-source/ppe/
                echo "===== ACTUAL PPE source around __mtk_foe_entry_clear ($source) ====="
                grep -n -B 12 -A 55 "__mtk_foe_entry_clear" "$source" || true
                echo "===== ACTUAL PPE source around __mtk_foe_entry_commit ($source) ====="
                grep -n -B 12 -A 55 "__mtk_foe_entry_commit" "$source" || true
                sha256sum kernel-patch-audit/failure-source/ppe/mtk_ppe.c*
              else
                echo "::warning::PPE source snapshot not found at $source"
              fi
            else
              echo "::warning::Linux 6.12.112 source root not found for failure snapshots"
            fi
            exit 1
          fi
          if grep -Eiq "with fuzz [1-9]|fuzz [1-9]" "$KERNEL_PATCH_LOG"; then
            echo "::error::Non-zero patch fuzz detected in kernel patch log."
            exit 1
          fi
          KERNEL_MAKEFILE="$(find build_dir -type f -path "*/linux-6.12.112/Makefile" -print -quit)"
          test -n "$KERNEL_MAKEFILE" || { echo "::error::Expected Linux 6.12.112 source tree was not prepared."; exit 1; }
          grep -q "^VERSION = 6$" "$KERNEL_MAKEFILE"
          grep -q "^PATCHLEVEL = 12$" "$KERNEL_MAKEFILE"
          grep -q "^SUBLEVEL = 112$" "$KERNEL_MAKEFILE"
          KERNEL_SRC="$(dirname "$KERNEL_MAKEFILE")"
          # Intermediate PPE snapshots are diagnostic evidence only. Their
          # capture depends on observing OpenWrt's patch(1) invocation boundary
          # and must never override the authoritative final-tree checks below.
          # The PPE overlap contract is enforced against the fully patched
          # Linux source by test-ppe-qos-overlap.py in the next audit step.
          for stage in after-04 before-05 after-05; do
            snapshot="$GITHUB_WORKSPACE/kernel-patch-audit/ppe-reconstruction/$stage/drivers/net/ethernet/mediatek/mtk_ppe_offload.c"
            if test -s "$snapshot"; then
              echo "===== Optional PPE diagnostic snapshot: $stage ====="
              sha256sum "$snapshot"
            else
              echo "::warning::Optional PPE diagnostic snapshot unavailable: $stage (final-tree semantic audit remains mandatory)."
            fi
          done
          KERNEL_ARCHIVE="$GITHUB_WORKSPACE/dl/linux-6.12.112.tar.xz"
          test -s "$KERNEL_ARCHIVE" || { echo "::error::Pinned Linux 6.12.112 source archive is missing."; exit 1; }
          python3 target/linux/mediatek/tests/audit-kernel-patch-stack.py attest \
            --repo "$GITHUB_WORKSPACE" --output-dir "$GITHUB_WORKSPACE/kernel-patch-audit" \
            --kernel-src "$KERNEL_SRC" --patch-log "$KERNEL_PATCH_LOG" --kernel-archive "$KERNEL_ARCHIVE" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          echo "PASS: complete OpenWrt generic and MediaTek kernel patch stacks applied to Linux 6.12.112 with zero fuzz, before kernel_oldconfig and compilation."

      - name: Audit MT7530 DSA Netlink declarations, bounds and lifecycle
        shell: bash
        run: |
          set -Eeuo pipefail
          KERNEL_MAKEFILE="$(find build_dir -type f -path "*/linux-6.12.112/Makefile" -print -quit)"
          test -n "$KERNEL_MAKEFILE" || { echo "::error::Patched Linux 6.12.112 source tree is missing."; exit 1; }
          KERNEL_SRC="$(dirname "$KERNEL_MAKEFILE")"
          python3 target/linux/mediatek/tests/test-dsa-mt7530-netlink.py "$KERNEL_SRC"

      - name: Audit PCIe Gen3 MSI bounds and soft-power IRQ lifecycle
        shell: bash
        run: |
          set -Eeuo pipefail
          KERNEL_MAKEFILE="$(find build_dir -type f -path "*/linux-6.12.112/Makefile" -print -quit)"
          test -n "$KERNEL_MAKEFILE" || { echo "::error::Patched Linux 6.12.112 source tree is missing."; exit 1; }
          python3 target/linux/mediatek/tests/test-pcie-gen3-irq-lifecycle.py "$(dirname "$KERNEL_MAKEFILE")"

      - name: Audit PPE overlapping QoS, DSCP and WDMA patch contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          KERNEL_MAKEFILE="$(find build_dir -type f -path "*/linux-6.12.112/Makefile" -print -quit)"
          test -n "$KERNEL_MAKEFILE" || { echo "::error::Patched Linux 6.12.112 source tree is missing."; exit 1; }
          python3 target/linux/mediatek/tests/test-ppe-qos-overlap.py "$(dirname "$KERNEL_MAKEFILE")"

      - name: Verify actual GNU Make package variables and fetch manual EasyMesh archives
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 package/mtk/applications/easymesh-n60/scripts/n60-vendor-lock.py verify-packages --repo "$GITHUB_WORKSPACE"
          python3 package/mtk/applications/easymesh-n60/scripts/n60-vendor-lock.py download \
            --repo "$GITHUB_WORKSPACE" --dl-dir "$GITHUB_WORKSPACE/dl" \
            --ids wappd mapd 1905daemon libmapd

      - name: Download native OpenWrt Package sources and verify Lock hashes
        shell: bash
        run: |
          set -Eeuo pipefail
          for pkg in \
            package/mtk/drivers/warp \
            package/mtk/drivers/conninfra \
            package/mtk/drivers/mt_wifi \
            package/mtk/applications/datconf \
            package/kernel/mapfilter \
            package/libs/openssl \
            package/libs/libnl-tiny; do
            echo "===== Native download: $pkg ====="
            make -C "$pkg" TOPDIR="$GITHUB_WORKSPACE" download V=s
          done
          python3 package/mtk/applications/easymesh-n60/scripts/n60-vendor-lock.py verify-downloads \
            --repo "$GITHUB_WORKSPACE" --dl-dir "$GITHUB_WORKSPACE/dl" \
            --ids mtwifi conninfra warp datconf mapfilter

      - name: Verify executable build-system scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          for script in scripts/feeds scripts/download.pl scripts/patch-kernel.sh; do
            test -x "$script" || { echo "::error::Required OpenWrt build script is not executable: $script"; exit 1; }
          done

      - name: Run native Build Prepare for all fixed vendor packages (no compile)
        shell: bash
        run: |
          set -Eeuo pipefail
          for pkg in \
            package/mtk/drivers/warp \
            package/mtk/drivers/conninfra \
            package/mtk/drivers/mt_wifi \
            package/kernel/mapfilter \
            package/mtk/applications/datconf \
            package/mtk/applications/easymesh-n60; do
            echo "===== Native Build/Prepare only: $pkg ====="
