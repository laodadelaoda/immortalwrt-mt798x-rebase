name: Build N60 Pro - ImmortalWrt 25.12 (Standard Only)

on:
  push:
    branches: ["n60pro-mtk-closed-driver"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n60-pro-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Verify source layout (warnings only)
        shell: bash
        run: |
          set +e
          echo "===== Source revision ====="
          git log -1 --format='%H %s'

          echo "===== Device definition ====="
          grep -Rni --include='*.mk' 'netcore_n60-pro' target/linux/mediatek || true

          echo "===== DTS presence (warning only, does not block build) ====="
          DTS="target/linux/mediatek/dts/mt7986a-netcore-n60-pro.dts"
          if [ -s "$DTS" ]; then
            echo "DTS found: $DTS"
            sha256sum "$DTS"
          else
            echo "::warning::DTS not found at expected path; build will use whatever the target defines."
          fi

          echo "===== MTK Wi-Fi compatibility patches ====="
          ls -1 package/mtk/drivers/mt_wifi/patches-7673/ 2>/dev/null | head -50 || true

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-dev rsync unzip zlib1g-dev file wget time xsltproc \
            libelf-dev device-tree-compiler qemu-utils python3-setuptools \
            python3-pyelftools swig ccache strace

      - name: Set Go proxy
        run: |
          echo "GOPROXY=https://goproxy.cn,direct" >> $GITHUB_ENV
          echo "GOSUMDB=off" >> $GITHUB_ENV

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-n60pro-standard-ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-n60pro-standard-ccache-${{ github.ref_name }}-
            ${{ runner.os }}-n60pro-standard-ccache-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure standard profile only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/N60-Pro
          mkdir -p "$HOME/.cache/ccache" artifacts/N60-Pro/standard
          ccache --max-size=5G
          ccache --set-config=compiler_check=content

          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n60-pro=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-mod-network=y
          CONFIG_CCACHE=y

          CONFIG_PACKAGE_kmod-mt_wifi=y
          CONFIG_PACKAGE_kmod-conninfra=y
          CONFIG_PACKAGE_kmod-warp=y
          CONFIG_WARP_VERSION=2
          CONFIG_WARP_CHIPSET="mt7986"
          CONFIG_PACKAGE_kmod-mediatek_hnat=y
          CONFIG_PACKAGE_wifi-dats=y

          # CONFIG_PACKAGE_mtwifi-cfg is not set
          # CONFIG_PACKAGE_luci-app-mtk is not set
          # CONFIG_PACKAGE_wifi-profile is not set

          CONFIG_PACKAGE_mtwifi-cfg-ucode=y
          CONFIG_PACKAGE_datconf=y
          CONFIG_PACKAGE_l1util=y
          CONFIG_PACKAGE_ucode=y
          CONFIG_PACKAGE_ucode-mod-fs=y
          CONFIG_PACKAGE_ucode-mod-log=y
          CONFIG_PACKAGE_ucode-mod-ubus=y
          CONFIG_PACKAGE_ucode-mod-uci=y
          CONFIG_PACKAGE_ucode-mod-datconf=y
          CONFIG_PACKAGE_ucode-mod-l1parser=y
          CONFIG_PACKAGE_wifi-scripts=y

          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_iwinfo-ucode=y
          CONFIG_PACKAGE_luci-app-mtwifi-cfg=y

          CONFIG_MTK_MT_WIFI=m
          CONFIG_MTK_MT_AP_SUPPORT=y
          CONFIG_MTK_CFG80211_SUPPORT=y

          CONFIG_MTK_WIFI_EAP_FEATURE=y
          CONFIG_MTK_MGMT_TXPWR_CTRL=y

          CONFIG_MTK_WPA3_SUPPORT=y
          CONFIG_MTK_HOSTAPD_WPA3_SUPPORT=y
          CONFIG_MTK_MT_WIFI_DRIVER_VERSION_7673=y
          CONFIG_MTK_MT_WIFI_PATH="mt_wifi"
          CONFIG_MTK_CHIP_MT7986=y
          CONFIG_MTK_FIRST_IF_MT7986=y
          CONFIG_MTK_SECOND_IF_NONE=y
          CONFIG_MTK_THIRD_IF_NONE=y
          CONFIG_MTK_FIRST_IF_EEPROM_FLASH=y
          CONFIG_MTK_FIRST_IF_IPAILNA=y
          CONFIG_MTK_DBDC_MODE=y
          CONFIG_MTK_WIFI_MODE_AP=m
          CONFIG_MTK_WIFI_SKU_TYPE="AX6000"
          CONFIG_MTK_WIFI_ADIE_TYPE="mt7976"
          CONFIG_MTK_CONNINFRA_APSOC=y
          CONFIG_MTK_CONNINFRA_APSOC_MT7986=y
          CONFIG_MTK_DOT11K_RRM_SUPPORT=y
          CONFIG_first_card=y
          CONFIG_first_card_name="MT7986"
          EOF

          cp .config artifacts/N60-Pro/standard/config.before-defconfig
          make defconfig

          echo "=== RRM Kconfig after defconfig ==="
          grep -nE 'DOT11K_RRM_SUPPORT' .config | tee artifacts/N60-Pro/standard/RRM-KCONFIG-AFTER.txt || echo "(no RRM entries)"

          require_config() {
            if ! grep -Fqx "$1" .config; then
              echo "::error::Required configuration missing after make defconfig: $1"
              grep -E '^(CONFIG_MTK_|CONFIG_first_card|CONFIG_PACKAGE_(kmod-(mt_wifi|conninfra|warp|mediatek_hnat)|wifi-dats|mtwifi-cfg-ucode))' .config || true
              exit 1
            fi
          }
          require_config 'CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n60-pro=y'
          require_config 'CONFIG_PACKAGE_luci=y'
          require_config 'CONFIG_PACKAGE_kmod-mt_wifi=y'
          require_config 'CONFIG_PACKAGE_kmod-conninfra=y'
          require_config 'CONFIG_PACKAGE_kmod-warp=y'
          require_config 'CONFIG_WARP_VERSION=2'
          require_config 'CONFIG_WARP_CHIPSET="mt7986"'
          require_config 'CONFIG_PACKAGE_kmod-mediatek_hnat=y'
          require_config 'CONFIG_PACKAGE_wifi-dats=y'
          require_config 'CONFIG_PACKAGE_iwinfo-ucode=y'
          require_config 'CONFIG_PACKAGE_luci-app-mtwifi-cfg=y'
          require_config 'CONFIG_PACKAGE_mtwifi-cfg-ucode=y'
          require_config 'CONFIG_PACKAGE_datconf=y'
          require_config 'CONFIG_PACKAGE_l1util=y'
          require_config 'CONFIG_PACKAGE_ucode-mod-datconf=y'
          require_config 'CONFIG_PACKAGE_ucode-mod-l1parser=y'
          require_config 'CONFIG_MTK_WPA3_SUPPORT=y'
          require_config 'CONFIG_MTK_HOSTAPD_WPA3_SUPPORT=y'
          require_config 'CONFIG_MTK_WIFI_EAP_FEATURE=y'
          require_config 'CONFIG_MTK_MGMT_TXPWR_CTRL=y'

          if ! grep -Eq '^CONFIG_MTK_MT_AP_SUPPORT=(y|m)$' .config; then
            echo "::error::MTK AP support is neither built-in nor modular after make defconfig."
            grep -E '^CONFIG_MTK_MT_AP_SUPPORT=' .config || true
            exit 1
          fi
          require_config 'CONFIG_MTK_CFG80211_SUPPORT=y'
          require_config 'CONFIG_MTK_MT_WIFI=m'

          if grep -qx 'CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n60-pro-mtkuboot=y' .config; then
            echo "::error::MTK U-Boot profile must not be selected."
            exit 1
          fi

          require_config 'CONFIG_PACKAGE_mtwifi-cfg-ucode=y'
          if grep -qx 'CONFIG_PACKAGE_mtwifi-cfg=y' .config || grep -qx 'CONFIG_PACKAGE_luci-app-mtk=y' .config || grep -qx 'CONFIG_PACKAGE_iwinfo=y' .config; then
            echo "::error::Legacy mtwifi-cfg / luci-app-mtk / iwinfo conflicts with the ucode wireless stack."
            exit 1
          fi

          cp .config artifacts/N60-Pro/standard/config.buildinfo
          echo "===== Effective MTK Wi-Fi configuration ====="
          grep -E '^(CONFIG_WARP_VERSION=|CONFIG_WARP_CHIPSET=|CONFIG_PACKAGE_(kmod-mt_wifi|kmod-conninfra|kmod-warp|kmod-mediatek_hnat|wifi-dats|mtwifi-cfg-ucode|ucode-mod-datconf|ucode-mod-l1parser|iw|iwinfo|iwinfo-ucode)=|CONFIG_MTK_(MT_WIFI|MT_AP_SUPPORT|CFG80211_SUPPORT|WIFI_EAP_FEATURE|MGMT_TXPWR_CTRL|CHIP_MT7986|FIRST_IF_MT7986|WIFI_MODE|WIFI_SKU_TYPE|WIFI_ADIE_TYPE|CONNINFRA_APSOC|DBDC_MODE)|CONFIG_first_card)' .config
          echo "PASS: standard profile and MT7986 vendor Wi-Fi stack selected."

      - name: Download sources
        run: make download -j$(nproc)

      - name: Prepare driver source and run read-only diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "===== Step 1: verify management TX power configuration ====="
          require_config() {
            if ! grep -Fqx "$1" .config; then
              echo "::error::Required configuration missing: $1"
              grep -E '^CONFIG_MTK_(MT_AP_SUPPORT|CFG80211_SUPPORT|WIFI_EAP_FEATURE|MGMT_TXPWR_CTRL)=' .config || true
              exit 1
            fi
          }

          require_config 'CONFIG_MTK_WIFI_EAP_FEATURE=y'
          require_config 'CONFIG_MTK_MGMT_TXPWR_CTRL=y'

          echo "===== Effective management TX power configuration ====="
          grep -E '^CONFIG_MTK_(MT_AP_SUPPORT|CFG80211_SUPPORT|WIFI_EAP_FEATURE|MGMT_TXPWR_CTRL)=' .config

          echo "===== Step 2: standard MT Wi-Fi prepare ====="
          make package/mtk/drivers/mt_wifi/prepare V=s

          echo "===== Step 3: locate prepared driver source ====="
          mapfile -t RTMP_FILES < <(
            find build_dir -type f \
              -path '*/embedded/include/rtmp.h' -print
          )

          SOURCES=()
          for rtmp in "${RTMP_FILES[@]}"; do
            src="$(dirname "$(dirname "$(dirname "$rtmp")")")"
            if [ -f "$src/os/linux/config.mk" ] &&
               [ -f "$src/embedded/include/security/sec_cmm.h" ] &&
               [ -f "$src/embedded/ap/ap_cfg.c" ]; then
              SOURCES+=("$src")
            fi
          done

          if [ "${#SOURCES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one valid prepared MT Wi-Fi source root; found ${#SOURCES[@]}."
            printf '%s\n' "${RTMP_FILES[@]}"
            find build_dir -type f -path '*/embedded/ap/ap_cfg.c' -print || true
            find build_dir -type f -path '*/os/linux/config.mk' -print || true
            exit 1
          fi

          SRC="${SOURCES[0]}"
          CFG="$SRC/os/linux/config.mk"
          RTMP="$SRC/embedded/include/rtmp.h"
          SEC="$SRC/embedded/include/security/sec_cmm.h"
          AP_CFG="$SRC/embedded/ap/ap_cfg.c"

          echo "Resolved driver source root: $SRC"
          echo "RRM config: $CFG"
          echo "VLAN header: $RTMP"
          echo "SAE header: $SEC"
          echo "AP source: $AP_CFG"

          echo "===== Step 2.5: audit 042 SAE include change and sae_cmm.h guard ====="
          SAE_CMM="$SRC/embedded/include/security/sae_cmm.h"
          PATCH_042="package/mtk/drivers/mt_wifi/patches-7673/042-fix-sae-structure-include-guard.patch"

          test -s "$PATCH_042" || { echo "::error::042 SAE patch is missing or empty."; exit 1; }
          echo "--- 042 patch content ---"
          cat "$PATCH_042"

          python3 - "$PATCH_042" <<'PY'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text()
          expected = '#if defined(DOT11_SAE_SUPPORT) || defined(SUPP_SAE_SUPPORT)'
          if text.count(expected) != 1:
              raise SystemExit(f"ERROR: expected exactly one combined SAE include condition in 042; found {text.count(expected)}")
          if text.count('sec_cmm.h') < 2 or text.count('sae_cmm.h') < 2:
              raise SystemExit("ERROR: 042 patch does not contain expected sec_cmm/sae_cmm diff context")
          if 'rtmp.h' in text:
              raise SystemExit("ERROR: 042 patch unexpectedly mentions rtmp.h")
          print("PASS: 042 is a one-line sec_cmm.h include-condition patch.")
          PY

          test -s "$SAE_CMM" || { echo "::error::sae_cmm.h not found: $SAE_CMM"; exit 1; }
          echo "--- sae_cmm.h first 40 lines ---"
          nl -ba "$SAE_CMM" | sed -n '1,40p'

          python3 - "$SAE_CMM" <<'PY'
          import pathlib, re, sys
          lines = pathlib.Path(sys.argv[1]).read_text().splitlines()
          if len(lines) < 3:
              raise SystemExit("ERROR: sae_cmm.h is unexpectedly short")
          if not re.match(r'^\s*#\s*ifndef\b', lines[0]):
              raise SystemExit("ERROR: sae_cmm.h does not start with an include guard")
          m = re.match(r'^\s*#\s*ifndef\s+(\S+)', lines[0])
          macro = m.group(1)
          if not re.match(r'^\s*#\s*define\s+' + re.escape(macro) + r'\b', lines[1]):
              raise SystemExit(f"ERROR: sae_cmm.h guard mismatch: expected #define {macro} on line 2")
          depth = 0
          for i, line in enumerate(lines, 1):
              s = line.strip()
              if re.match(r'^#\s*(if|ifdef|ifndef)\b', s):
                  depth += 1
              elif re.match(r'^#\s*endif\b', s):
                  depth -= 1
                  if depth < 0:
                      raise SystemExit(f"ERROR: unmatched #endif at sae_cmm.h:{i}")
          if depth != 0:
              raise SystemExit(f"ERROR: unbalanced preprocessor directives in sae_cmm.h; depth={depth}")
          print(f"PASS: sae_cmm.h include guard is {macro} and preprocessor nesting is balanced.")
          PY

          echo "--- direct SAE include relationships ---"
          grep -nE '^[[:space:]]*#include[[:space:]]+".*(sec_cmm|sae_cmm)\.h"' "$SEC" "$SAE_CMM" "$RTMP" || true
          echo "PASS: 042 and sae_cmm.h read-only audit completed."

          DIAG="artifacts/N60-Pro/standard/DRIVER-PREPARE-DIAGNOSTICS.txt"
          mkdir -p "$(dirname "$DIAG")"

          {
            echo "=== MT Wi-Fi Prepare diagnostics ==="
            echo "Source root: $SRC"
            echo "Config: $CFG"
            echo "RTMP header: $RTMP"
            echo "SAE header: $SEC"
            echo "AP source: $AP_CFG"
            echo
            echo "=== Effective management TX power configuration ==="
            grep -E '^CONFIG_MTK_(MT_AP_SUPPORT|CFG80211_SUPPORT|WIFI_EAP_FEATURE|MGMT_TXPWR_CTRL)=' .config || true
            echo
            echo "=== SAE guard context ==="
            nl -ba "$SEC" | awk 'NR >= 10 && NR <= 20'
            echo
            echo "=== RRM config context around line 73 ==="
            nl -ba "$CFG" | awk 'NR >= 68 && NR <= 78'
            echo
            echo "=== bDynamicVlanDisabled references ==="
            grep -RniE --include='*.h' --include='*.c' \
              'bDynamicVlanDisabled' "$SRC" || true
            echo
            echo "=== VLAN guard context in rtmp.h ==="
            grep -n -B 8 -A 8 -E \
              'bDynamicVlanDisabled|DYNAMIC_VLAN_SUPPORT|RT_CFG80211_SUPPORT' \
              "$RTMP" || true
            echo
            echo "=== Management TX power references ==="
            grep -n -B 25 -A 25 -E \
              'rtmp_get_mgmtpwr|MgmtTxPwr|EpaFeGain|TxPwrDelta' \
              "$AP_CFG" || true
            echo
            echo "=== Management TX power member declarations ==="
            grep -RniE --include='*.h' \
              'MgmtTxPwr|EpaFeGain|TxPwrDelta' "$SRC" || true
            echo
            echo "=== Patch inventory ==="
            ls -1 package/mtk/drivers/mt_wifi/patches-7673/
            echo
            echo "CUSTOM_SOURCE_MODIFIED=no"
          } | tee "$DIAG"

          echo "PASS: read-only diagnostics saved to $DIAG"

      - name: Build standard profile
        id: build_step
        shell: bash
        continue-on-error: true
        run: |
          set -Eeuo pipefail

          echo "===== Step 0: audit effective MTK Wi-Fi configuration ====="

          require_config() {
            if ! grep -Fqx "$1" .config; then
              echo "::error::Required configuration missing before build: $1"
              grep -E '^CONFIG_MTK_(MT_AP_SUPPORT|CFG80211_SUPPORT|WIFI_EAP_FEATURE|MGMT_TXPWR_CTRL)=' .config || true
              exit 1
            fi
          }

          require_config 'CONFIG_MTK_WIFI_EAP_FEATURE=y'
          require_config 'CONFIG_MTK_MGMT_TXPWR_CTRL=y'
          require_config 'CONFIG_MTK_CFG80211_SUPPORT=y'
          require_config 'CONFIG_MTK_MT_WIFI=m'

          echo "===== Effective management TX power configuration ====="
          grep -E '^CONFIG_MTK_(MT_AP_SUPPORT|CFG80211_SUPPORT|WIFI_EAP_FEATURE|MGMT_TXPWR_CTRL)=' .config

          echo "===== Step 1: clean MT Wi-Fi package and prepare with static patches ====="
          make package/mtk/drivers/mt_wifi/clean V=s

          PREPARE_LOG="artifacts/N60-Pro/standard/mtwifi-prepare.log"
          mkdir -p "$(dirname "$PREPARE_LOG")"
          make package/mtk/drivers/mt_wifi/prepare V=s 2>&1 | tee "$PREPARE_LOG"

          for patch in \
            042-fix-sae-structure-include-guard.patch \
            050-fix-rrm-config.patch \
            051-fix-dynamic-vlan-guard.patch \
            052-fix-mgmt-txpwr-config.patch
          do
            if ! grep -Fq "$patch" "$PREPARE_LOG"; then
              echo "::error::Prepare log does not show $patch being applied."
              grep -n -E 'Applying|042-fix|050-fix|051-fix|052-fix|Patch failed|Hunk FAILED' "$PREPARE_LOG" || true
              exit 1
            fi
          done

          if grep -Eq 'Hunk FAILED|Patch failed|patch failed' "$PREPARE_LOG"; then
            echo "::error::Patch failure text found in prepare log."
            grep -n -B 3 -A 5 -E 'Hunk FAILED|Patch failed|patch failed' "$PREPARE_LOG" || true
            exit 1
          fi

          echo "PASS: prepare log contains 042, 050, 051, 052 patches."

          locate_driver_source() {
            local rtmp src
            local -a rtmp_files=()
            local -a sources=()

            mapfile -t rtmp_files < <(
              find build_dir -type f \
                -path '*/embedded/include/rtmp.h' -print
            )

            for rtmp in "${rtmp_files[@]}"; do
              src="$(dirname "$(dirname "$(dirname "$rtmp")")")"
              if [ -f "$src/os/linux/config.mk" ] &&
                 [ -f "$src/embedded/include/security/sec_cmm.h" ] &&
                 [ -f "$src/embedded/ap/ap_cfg.c" ]; then
                sources+=("$src")
              fi
            done

            if [ "${#sources[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one valid MT Wi-Fi source root; found ${#sources[@]}."
              printf '%s\n' "${rtmp_files[@]}"
              find build_dir -type f -path '*/os/linux/config.mk' -print || true
              find build_dir -type f -path '*/embedded/ap/ap_cfg.c' -print || true
              return 1
            fi

            printf '%s\n' "${sources[0]}"
          }

          SRC="$(locate_driver_source)"
          CFG="$SRC/os/linux/config.mk"
          RTMP="$SRC/embedded/include/rtmp.h"
          SEC="$SRC/embedded/include/security/sec_cmm.h"
          AP_CFG="$SRC/embedded/ap/ap_cfg.c"

          echo "Resolved source root: $SRC"
          test -f "$CFG"
          test -f "$RTMP"
          test -f "$SEC"
          test -f "$AP_CFG"

          echo "===== Step 2: verify all fixes in prepared source ====="
          grep -Fqx \
            '#if defined(DOT11_SAE_SUPPORT) || defined(SUPP_SAE_SUPPORT)' \
            <(awk 'NR==14 { print; exit }' "$SEC") || {
              echo "::error::SAE line-14 fix missing after prepare."
              nl -ba "$SEC" | awk 'NR >= 10 && NR <= 18'
              exit 1
            }

          grep -Fqx 'HAS_DOT11K_RRM_SUPPORT=y' "$CFG" || {
            echo "::error::RRM fix missing after prepare."
            grep -n -C 3 'HAS_DOT11K_RRM_SUPPORT' "$CFG" || true
            exit 1
          }

          grep -Fq \
            '#if defined(RT_CFG80211_SUPPORT) || defined(DYNAMIC_VLAN_SUPPORT)' \
            "$RTMP" || {
              echo "::error::VLAN fix missing after prepare."
              grep -n -B 8 -A 8 'bDynamicVlanDisabled' "$RTMP" || true
              exit 1
            }

          grep -Fqx 'HAS_MGMT_TXPWR_CTRL=y' "$CFG" || {
            echo "::error::HAS_MGMT_TXPWR_CTRL=y missing after prepare."
            grep -n -B 3 -A 3 'MGMT_TXPWR_CTRL' "$CFG" || true
            exit 1
          }

          grep -Fqx 'WFLAGS += -DMGMT_TXPWR_CTRL' "$CFG" || {
            echo "::error::WFLAGS mapping for MGMT_TXPWR_CTRL missing after prepare."
            grep -n -B 5 -A 5 'MGMT_TXPWR_CTRL' "$CFG" || true
            exit 1
          }

          echo "===== Verify management TX power member declarations ====="
          grep -n -B 4 -A 4 -E \
            'MgmtTxPwr|EpaFeGain|TxPwrDelta' "$RTMP" || {
              echo "::error::Expected management TX power member declarations not found in rtmp.h."
              exit 1
            }

          echo "===== Verify management TX power references ====="
          grep -n -B 5 -A 5 -E \
            'rtmp_get_mgmtpwr|MgmtTxPwr|EpaFeGain|TxPwrDelta' \
            "$AP_CFG" || {
              echo "::error::Expected management TX power references not found in ap_cfg.c."
              exit 1
            }

          echo "PASS: SAE, RRM, VLAN and MGMT_TXPWR_CTRL source/configuration checks passed."

          echo "===== Step 3: preserve original ap_ioctl.c without modifying it ====="
          AP_IOCTL="$SRC/os/linux/ap_ioctl.c"
          APIO_EVIDENCE="artifacts/N60-Pro/standard/AP_IOCTL-EVIDENCE.txt"
          mkdir -p "$(dirname "$APIO_EVIDENCE")"
          test -s "$AP_IOCTL" || { echo "::error::ap_ioctl.c not found: $AP_IOCTL"; exit 1; }
          { echo "Source: $AP_IOCTL"; nl -ba "$AP_IOCTL" | sed -n "1,40p"; echo; grep -nE "^[[:space:]]*#[[:space:]]*include" "$AP_IOCTL" || true; echo "SOURCE_MODIFIED_BY_DIAGNOSTIC_STEP=no"; } | tee "$APIO_EVIDENCE"

          echo "===== Step 4: trace actual compiler process calls ====="
          BUILD_LOG="artifacts/N60-Pro/standard/FULL-BUILD-VS-LOG.txt"
          STRACE_LOG="artifacts/N60-Pro/standard/AP_IOCTL-STRACE-EXECVE-CHDIR.txt"
          mkdir -p "$(dirname "$BUILD_LOG")"
          strace -V
          set -o pipefail
          strace -f -qq -s 65535 -e trace=execve,chdir -o "$STRACE_LOG" make -j"$(nproc)" V=s 2>&1 | tee "$BUILD_LOG"

          echo "===== Step 5: audit actual compiler log for MGMT_TXPWR_CTRL ====="
          if grep -Fq -- '-DMGMT_TXPWR_CTRL' "$BUILD_LOG"; then
            echo "PASS: full build log contains -DMGMT_TXPWR_CTRL."
            grep -n -m 10 -B 2 -A 2 -- '-DMGMT_TXPWR_CTRL' "$BUILD_LOG" || true
          else
            echo "::error::Full build log contains no -DMGMT_TXPWR_CTRL compiler flag."
            grep -n -i -m 50 -E 'MGMT_TXPWR_CTRL|mt_wifi.*ap_cfg\.c|ap_cfg\.c:|WFLAGS' "$BUILD_LOG" || true
            exit 1
          fi

          echo "===== Step 6: verify the exact standard N60 Pro sysupgrade image ====="
          SYSUP="bin/targets/mediatek/filogic/immortalwrt-mediatek-filogic-netcore_n60-pro-squashfs-sysupgrade.itb"

          if [ ! -s "$SYSUP" ]; then
            echo "::error::Expected non-empty sysupgrade ITB not found: $SYSUP"
            find bin/targets/mediatek/filogic -maxdepth 1 -type f \
              -printf '%f (%s bytes)\n' 2>/dev/null || true
            exit 1
          fi

          ls -lh "$SYSUP"
          sha256sum "$SYSUP"
          echo "PASS: standard N60 Pro sysupgrade ITB exists and is non-empty."

      - name: Capture ap_ioctl compiler and include evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          DEST="artifacts/N60-Pro/standard"
          TRACE="$DEST/AP_IOCTL-STRACE-EXECVE-CHDIR.txt"
          EVIDENCE="$DEST/AP_IOCTL-EVIDENCE.txt"
          RAW="$DEST/AP_IOCTL-GCC-RAW-ARGV.txt"
          CMD="$DEST/AP_IOCTL-GCC-COMMAND.sh"
          TREE="$DEST/AP_IOCTL-GCC-H-INCLUDE-TREE.txt"
          PRE="$DEST/AP_IOCTL-PREPROCESSED.i"
          DEP="$DEST/AP_IOCTL-OBJECT-DEPENDENCIES.d"
          DEP_INDEX="$DEST/AP_IOCTL-DEPENDENCY-FILES.txt"
          mkdir -p "$DEST"
          touch "$EVIDENCE"

          echo "===== Preserve GCC dependency file as independent evidence =====" | tee -a "$EVIDENCE"
          find build_dir -type f -name ".ap_ioctl.o.d" -print > "$DEP_INDEX" 2>/dev/null || true
          cat "$DEP_INDEX" | tee -a "$EVIDENCE"
          DEP_SOURCE="$(head -n 1 "$DEP_INDEX" || true)"
          if [ -n "$DEP_SOURCE" ] && [ -s "$DEP_SOURCE" ]; then
            cp "$DEP_SOURCE" "$DEP"
            echo "Copied dependency evidence from: $DEP_SOURCE" | tee -a "$EVIDENCE"
          else
            echo "No non-empty .ap_ioctl.o.d found; absence recorded." | tee -a "$EVIDENCE"
          fi

          if [ ! -s "$TRACE" ]; then
            echo "No strace log; compiler replay skipped." | tee -a "$EVIDENCE"
            exit 0
          fi

          python3 - "$TRACE" "$RAW" "$CMD" "$EVIDENCE" "$DEST" <<'PY'
          import ast, pathlib, re, shlex, sys
          trace_path, raw_path, cmd_path, evidence_path, dest = map(pathlib.Path, sys.argv[1:])
          lines = trace_path.read_text(errors="replace").splitlines()
          prefix = re.compile(r"^(?:\[pid\s+(\d+)\]\s+|(\d+)\s+)?")
          chdir_re = re.compile(r'\bchdir\("(?:\\.|[^"\\])*"\)\s+=\s+0')
          exec_re = re.compile(r'execve\("(?:\\.|[^"\\])*",\s*(\[.*\]),\s*.*\)\s+=')
          cwd_by_pid = {}
          initial_cwd = pathlib.Path.cwd().resolve()
          found = []
          for no, line in enumerate(lines, 1):
              m = prefix.match(line); pid = (m.group(1) or m.group(2) or "main") if m else "main"; body = line[m.end():] if m else line
              cm = chdir_re.search(body)
              if cm:
                  call = body[cm.start():cm.end()]
                  raw_dir = re.search(r'chdir\(("(?:\\.|[^"\\])*")\)', call).group(1)
                  directory = ast.literal_eval(raw_dir)
                  previous = cwd_by_pid.get(pid, initial_cwd)
                  p = pathlib.Path(directory)
                  cwd_by_pid[pid] = (p if p.is_absolute() else previous / p).resolve()
              em = exec_re.search(body)
              if not em: continue
              try: argv = ast.literal_eval(em.group(1))
              except (ValueError, SyntaxError): continue
              if not isinstance(argv, list) or not argv or not all(isinstance(x, str) for x in argv): continue
              exe = pathlib.PurePosixPath(argv[0]).name
              compiler = exe in ("gcc", "cc", "clang") or exe.endswith("-gcc") or ("gcc" in exe and "openwrt-linux" in exe)
              if compiler and any(pathlib.PurePosixPath(x).name == "ap_ioctl.c" for x in argv):
                  found.append((no, pid, argv, cwd_by_pid.get(pid), line))
          with evidence_path.open("a", encoding="utf-8") as ev:
              ev.write("\n===== Parsed compiler execve records =====\n")
              ev.write("matching compiler argv count: " + str(len(found)) + "\n")
              if not found:
                  ev.write("No compiler execve argv for ap_ioctl.c; -H/-E skipped.\n")
                  raise SystemExit(0)
              no, pid, argv, cwd, raw_line = found[-1]
              raw_path.write_text("trace line: %s\npid: %s\nrecorded chdir cwd: %r\nargv parsed with ast.literal_eval:\n%r\noriginal strace line:\n%s\n" % (no,pid,cwd,argv,raw_line), encoding="utf-8")
              ev.write("selected trace line: %s; pid=%s; recorded cwd=%r\n" % (no,pid,cwd))
              # If this PID has no chdir record, use a unique mt_wifi_ap directory only; otherwise skip.
              if cwd is None or not cwd.is_dir():
                  candidates = [p.resolve() for p in pathlib.Path("build_dir").rglob("mt_wifi_ap") if p.is_dir()]
                  if len(candidates) == 1: cwd = candidates[0]; ev.write("cwd fallback: unique mt_wifi_ap directory=%s\n" % cwd)
                  else: ev.write("cwd unproven; mt_wifi_ap candidates=%d; replay skipped\n" % len(candidates)); raise SystemExit(0)
              args=[]; i=0
              while i < len(argv):
                  a=argv[i]
                  if a in ("-c","-MD","-MMD","-MP"): i+=1; continue
                  if a in ("-o","-MF","-MT","-MQ"): i+=2; continue
                  if a.startswith(("-Wp,-MD,","-Wp,-MMD,","-Wp,-MF,","-Wp,-MT,")): i+=1; continue
                  args.append(a); i+=1
              args.extend(["-H","-E","-o",str((dest/"AP_IOCTL-PREPROCESSED.i").resolve())])
              cmd_path.write_text("#!/usr/bin/env bash\nset -Eeuo pipefail\ncd "+shlex.quote(str(cwd))+"\nexec "+shlex.join(args)+"\n", encoding="utf-8")
              cmd_path.chmod(0o700)
              ev.write("replay cwd=%s\ncommand script=%s\ncompiler/include/define flags came from parsed execve argv; none were invented\n" % (cwd,cmd_path))
          PY

          if [ -s "$CMD" ]; then
            set +e
            "$CMD" > "$DEST/AP_IOCTL-PREPROCESS-STDOUT.txt" 2> "$TREE"
            GCC_RC=$?
            set -e
            { echo "GCC -H -E exit status: $GCC_RC"; echo "===== include tree matches ====="; grep -nE "rt_config\.h|rtmp\.h|rtmp_comm\.h|rt_linux\.h|debug\.h|sec_cmm\.h|sae_cmm\.h" "$TREE" | head -300 || true; if [ -s "$PRE" ]; then echo "preprocessed bytes: $(wc -c < "$PRE")"; grep -nE "struct wifi_dev|PRTMP_ADAPTER|CHANNEL_CTRL|mtwf_dbg_prt" "$PRE" | head -200 || true; else echo "preprocessed output missing/empty"; fi; } | tee -a "$EVIDENCE"
          fi
          echo "===== Evidence artifacts ====="
          ls -lh "$EVIDENCE" "$TRACE" "$RAW" "$CMD" "$TREE" "$PRE" "$DEP" "$DEP_INDEX" 2>/dev/null || true
      - name: Check whether firmware was actually produced
        if: always()
        shell: bash
        run: |
          set +e
          OUT="bin/targets/mediatek/filogic"
          SYSUP="$OUT/immortalwrt-mediatek-filogic-netcore_n60-pro-squashfs-sysupgrade.itb"
          if [ -s "$SYSUP" ]; then
            echo "FIRMWARE_PRODUCED=yes" >> $GITHUB_ENV
            echo "Firmware produced: $SYSUP"
            ls -lh "$SYSUP"
          else
            echo "FIRMWARE_PRODUCED=no" >> $GITHUB_ENV
            echo "::warning::No sysupgrade ITB produced. Build failed or target output differs."
            ls -lh "$OUT" 2>/dev/null || echo "(output dir missing)"
          fi

      - name: Collect firmware artifacts
        if: always()
        shell: bash
        run: |
          set +e
          OUT="bin/targets/mediatek/filogic"
          DEST="artifacts/N60-Pro/standard"
          mkdir -p "$DEST"

          find "$OUT" -maxdepth 1 -type f \
            \( -name '*netcore_n60-pro*.itb' -o -name '*netcore_n60-pro*.manifest' \
               -o -name 'sha256sums' -o -name '*.buildinfo' \) \
            -exec cp -v {} "$DEST/" \; 2>/dev/null

          if find "$DEST" -maxdepth 1 -iname '*mtkuboot*' | grep -q .; then
            echo "::error::MTK U-Boot artifact detected; refusing to package."
            exit 1
          fi

          {
            echo "Build policy: STANDARD PROFILE ONLY; MTK U-Boot excluded"
            echo "Profile: netcore_n60-pro"
            echo "Source revision:"
            git log -1 --format='%H %s'
            echo "Build step outcome: ${{ steps.build_step.outcome }}"
            echo "Firmware produced: ${FIRMWARE_PRODUCED:-unknown}"
            echo "Files:"
            find "$DEST" -maxdepth 1 -type f -printf '%f\n' | sort
          } > "$DEST/BUILD-INFO.txt"

          (
            cd "$DEST"
            shopt -s nullglob
            if ls *.itb >/dev/null 2>&1; then
              sha256sum *.itb > SHA256SUMS.txt
              cat SHA256SUMS.txt
            fi
          ) || true

          echo "===== Artifact tree ====="
          find artifacts/N60-Pro -maxdepth 2 -type f -printf '%p (%s bytes)\n' | sort

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: N60-Pro-Standard-${{ github.run_number }}
          path: artifacts/N60-Pro/
          if-no-files-found: warn
          retention-days: 14

      - name: Report ccache statistics
        if: always()
        run: ccache -s || true

      - name: Enforce build and firmware success
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "Build step outcome: ${{ steps.build_step.outcome }}"
          echo "Firmware produced: ${FIRMWARE_PRODUCED:-no}"
          if [ "${{ steps.build_step.outcome }}" != "success" ]; then
            echo "::error::Firmware build step did not succeed. This run must remain failed."
            exit 1
          fi
          if [ "${FIRMWARE_PRODUCED:-no}" != "yes" ]; then
            echo "::error::Expected standard netcore_n60-pro sysupgrade ITB is missing."
            exit 1
          fi
          test -s "bin/targets/mediatek/filogic/immortalwrt-mediatek-filogic-netcore_n60-pro-squashfs-sysupgrade.itb"
          echo "PASS: build succeeded and the expected sysupgrade ITB exists."
