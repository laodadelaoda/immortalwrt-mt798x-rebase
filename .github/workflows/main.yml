       - name: Configure standard profile only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/N60-Pro
          mkdir -p "$HOME/.cache/ccache" artifacts/N60-Pro/standard
          ccache --max-size=5G
          ccache --set-config=compiler_check=content

          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n60-pro=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-mod-network=y
          CONFIG_CCACHE=y

          # ======= 关掉报错的毫无用处的包 =======
          # CONFIG_PACKAGE_prosody is not set
          
          # ======= 防止 wpad 冲突 =======
          # CONFIG_PACKAGE_wpad-basic-mbedtls is not set
          CONFIG_PACKAGE_wpad-openssl=y
          CONFIG_PACKAGE_libustream-openssl=y
          CONFIG_PACKAGE_libopenssl=y
          
          # ======= MTK Wi-Fi 核心驱动 =======
          CONFIG_PACKAGE_kmod-mt_wifi=y
          CONFIG_PACKAGE_kmod-mac80211=y
          CONFIG_PACKAGE_kmod-cfg80211=y
          CONFIG_PACKAGE_kmod-conninfra=y
          CONFIG_PACKAGE_kmod-warp=y
          CONFIG_WARP_VERSION=2
          CONFIG_WARP_CHIPSET="mt7986"
          CONFIG_PACKAGE_kmod-mediatek_hnat=m
          CONFIG_PACKAGE_wifi-dats=y

          # ======= 原厂微码固件加载开关 =======
          CONFIG_MTK_WIFI_FW_BIN_LOAD=y

          # CONFIG_PACKAGE_mtwifi-cfg is not set
          # CONFIG_PACKAGE_luci-app-mtk is not set
          # CONFIG_PACKAGE_wifi-profile is not set

          CONFIG_PACKAGE_mtwifi-cfg-ucode=y
          CONFIG_PACKAGE_datconf=y
          CONFIG_PACKAGE_l1util=y
          CONFIG_PACKAGE_ucode=y
          CONFIG_PACKAGE_ucode-mod-fs=y
          CONFIG_PACKAGE_ucode-mod-log=y
          CONFIG_PACKAGE_ucode-mod-ubus=y
          CONFIG_PACKAGE_ucode-mod-uci=y
          CONFIG_PACKAGE_ucode-mod-datconf=y
          CONFIG_PACKAGE_ucode-mod-l1parser=y
          CONFIG_PACKAGE_wifi-scripts=y

          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_iwinfo-ucode=y
          CONFIG_PACKAGE_luci-app-mtwifi-cfg=y

          CONFIG_MTK_MT_WIFI=m
          CONFIG_MTK_MT_AP_SUPPORT=y
          CONFIG_MTK_CFG80211_SUPPORT=y
          CONFIG_MTK_WIFI_EAP_FEATURE=y
          CONFIG_MTK_MGMT_TXPWR_CTRL=y
          
          # CONFIG_MTK_PRE_CAL_TRX_SET1_SUPPORT is not set
          # CONFIG_MTK_PRE_CAL_TRX_SET2_SUPPORT is not set
          # CONFIG_MTK_RLM_CAL_CACHE_SUPPORT is not set
          
          CONFIG_MTK_WPA3_SUPPORT=y
          CONFIG_MTK_HOSTAPD_WPA3_SUPPORT=y
          CONFIG_MTK_MT_WIFI_DRIVER_VERSION_7673=y
          CONFIG_MTK_MT_WIFI_PATH="mt_wifi"
          CONFIG_MTK_CHIP_MT7986=y
          CONFIG_MTK_FIRST_IF_MT7986=y
          CONFIG_MTK_SECOND_IF_NONE=y
          CONFIG_MTK_THIRD_IF_NONE=y
          CONFIG_MTK_FIRST_IF_EEPROM_FLASH=y
          CONFIG_MTK_FIRST_IF_IPAILNA=y
          CONFIG_MTK_DBDC_MODE=y
          CONFIG_MTK_WIFI_MODE_AP=m
          CONFIG_MTK_WIFI_SKU_TYPE="AX6000"
          CONFIG_MTK_WIFI_ADIE_TYPE="mt7976"
          CONFIG_MTK_CONNINFRA_APSOC=y
          CONFIG_MTK_CONNINFRA_APSOC_MT7986=y
          CONFIG_MTK_DOT11K_RRM_SUPPORT=y
          CONFIG_first_card=y
          CONFIG_first_card_name="MT7986"
          EOF

          cp .config artifacts/N60-Pro/standard/config.before-defconfig
          make defconfig

          # 打印出来看看最终生效了什么，不再强行拦截退出
          echo "===== Effective MTK Wi-Fi configuration ====="
          grep -E '^(CONFIG_MTK_|CONFIG_first_card|CONFIG_PACKAGE_(kmod-(mt_wifi|mac80211|cfg80211|conninfra|warp|mediatek_hnat)|wifi-dats|mtwifi-cfg-ucode))' .config || true

          if grep -qx 'CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n60-pro-mtkuboot=y' .config; then
            echo "::error::MTK U-Boot profile must not be selected."
            exit 1
          fi

          if grep -qx 'CONFIG_PACKAGE_mtwifi-cfg=y' .config || grep -qx 'CONFIG_PACKAGE_luci-app-mtk=y' .config || grep -qx 'CONFIG_PACKAGE_iwinfo=y' .config; then
            echo "::error::Legacy mtwifi-cfg / luci-app-mtk / iwinfo conflicts with the ucode wireless stack."
            exit 1
          fi

          cp .config artifacts/N60-Pro/standard/config.buildinfo
          echo "PASS: standard profile and MT7986 vendor Wi-Fi stack selected."
