name: Build N60 Pro - ImmortalWrt 25.12 (Standard Only)

on:
  push:
    branches: ["n60pro-mtk-closed-driver"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n60-pro-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      DEVICE: netcore_n60-pro
      PROFILE: standard

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify N60 Pro EasyMesh package, syntax and configuration
        shell: bash
        run: |
          set -euo pipefail
          ROOT="package/mtk/applications/easymesh-n60/files"
          BIN="$ROOT/usr/bin"
          for f in wapp mapd p1905_managerd wapp-n60-wrapper; do
            test -x "$BIN/$f" || { echo "::error::Missing or non-executable N60 EasyMesh file: $f"; exit 1; }
          done
          test -s "$BIN/wappctrl" || { echo "::error::Missing WAPP control client required for driver/MBO initialization"; exit 1; }

          # Validate the actual WAPP ELF option ABI against the N60 wrapper.
          WAPP_CMD="$(grep -E '^/usr/bin/wapp ' "$BIN/wapp-n60-wrapper")"
          test -n "$WAPP_CMD" || { echo "::error::WAPP invocation missing from wrapper"; exit 1; }
          for expected in \
            '-m OPMODE_AP' '-i RA_WEXT' '-d1' '-v2' \
            '-f /etc/wapp_ap.conf' '-F /etc/map/mapd_cfg' \
            '-u /etc/map/mapd_user.cfg' '-e br-lan' '-w br-lan' \
            '-c ra0' '-c rax0'
          do
            grep -Fq -- "$expected" <<<"$WAPP_CMD" || {
              echo "::error::WAPP invocation is missing an audited N60 WAPP ABI argument: $expected"
              exit 1
            }
          done
          if grep -Eq '(^|[[:space:]])-(l|K)([[:space:]]|$)' <<<"$WAPP_CMD"; then
            echo "::error::WAPP invocation contains an unsupported WAPP CLI option."
            exit 1
          fi
          strings -a "$BIN/wapp" | grep -Fxq 'm:f:i:d:v:e:w:k:c:F:u:' || {
            echo "::error::WAPP ELF option ABI differs from the audited N60 CLI contract."
            exit 1
          }
          # The 7.6.7.3 WAPP ELF contains its native WTS reader. Keep this
          # path in WAPP; do not introduce a generated replacement config.
          for symbol in wapp_read_wts_map_config /etc/map/wts_bss_info_config 'config_bss_num=%d' map_build_wts_config map_handle_get_wts_config; do
            strings -a "$BIN/wapp" | grep -Fq "$symbol" || {
              echo "::error::WAPP is missing its native WTS parser/config path: $symbol"
              exit 1
            }
          done
          test -x "$ROOT/etc/init.d/easymesh" || { echo "::error::Missing easymesh init service"; exit 1; }
          test -s "$ROOT/usr/sbin/generate-mapd-strng" || { echo "::error::Missing MAPD strength generator source"; exit 1; }
          test -s "$ROOT/usr/sbin/easymesh-n60-diagnose" || { echo "::error::Missing read-only EasyMesh diagnostic utility"; exit 1; }
          test -s "$ROOT/usr/sbin/easymesh-n60-validate-wts" || { echo "::error::Missing strict N60 WTS preflight validator"; exit 1; }
          test -s "package/mtk/applications/easymesh-n60/tests/test-vendor-wts-defaults.sh" || { echo "::error::Missing vendor WTS defaults regression test"; exit 1; }
          grep -Fq 'WAPP_LOG=/tmp/wapp-n60-startup.log' "$BIN/wapp-n60-wrapper" || { echo "::error::WAPP startup log capture is missing"; exit 1; }
          grep -Fq 'umask 077' "$BIN/wapp-n60-wrapper" || { echo "::error::WAPP diagnostic log must be private"; exit 1; }
          grep -Fq 'killall WAPP' "$BIN/wapp-n60-wrapper" || { echo "::error::WAPP wrapper does not clean up uppercase vendor daemon processes"; exit 1; }
          grep -Fq 'pidof WAPP' "$BIN/wapp-n60-wrapper" || { echo "::error::WAPP wrapper does not track uppercase vendor daemon processes"; exit 1; }
          grep -Fq 'killall WAPP' "$ROOT/etc/init.d/easymesh" || { echo "::error::EasyMesh stop service does not terminate uppercase WAPP daemon processes"; exit 1; }
          grep -Fq '>> "$WAPP_LOG" 2>&1' "$BIN/wapp-n60-wrapper" || { echo "::error::WAPP stdout/stderr is not captured"; exit 1; }
          grep -Fq 'WAPP startup log (credentials redacted)' "$ROOT/usr/sbin/easymesh-n60-diagnose" || { echo "::error::Read-only diagnostics do not expose the redacted WAPP startup log"; exit 1; }
          grep -Fq '[W]APP' "$ROOT/usr/sbin/easymesh-n60-diagnose" || { echo "::error::Diagnostics omit uppercase vendor WAPP processes"; exit 1; }
          for f in mapd_cfg 1905d.cfg mapd_user.cfg wts_bss_info_config; do
            test -s "$ROOT/etc/map/$f" || { echo "::error::Missing MAP config: $f"; exit 1; }
          done
          for f in "$ROOT/etc/init.d/easymesh" "$ROOT/etc/uci-defaults/1001-easymesh-n60" "$BIN/wapp-n60-wrapper" "$ROOT/usr/sbin/generate-mapd-strng" "$ROOT/usr/sbin/easymesh-n60-diagnose" "$ROOT/usr/sbin/easymesh-n60-validate-wts" "package/mtk/applications/easymesh-n60/tests/test-vendor-wts-defaults.sh"; do
            sh -n "$f"
          done
          sh "package/mtk/applications/easymesh-n60/tests/test-vendor-wts-defaults.sh"
          sh "$ROOT/usr/sbin/easymesh-n60-validate-wts" "$ROOT/etc/map/wts_bss_info_config"
          for f in package/mtk/applications/luci-app-mtk-dash2/htdocs/luci-static/resources/view/mtk-dash2/map.js package/mtk/applications/luci-app-mtk-dash2/htdocs/luci-static/resources/view/mtk-dash2/setup.js package/mtk/applications/luci-app-mtk-dash2/htdocs/luci-static/resources/view/mtk-dash2/wireless.js; do
            node --check "$f"
          done
          grep -qx 'DeviceRole=1' "$ROOT/etc/map/mapd_cfg"
          grep -qx 'DhcpCtl=0' "$ROOT/etc/map/mapd_cfg"
          grep -qx 'map_root=1' "$ROOT/etc/map/1905d.cfg"
          grep -qx 'map_agent=0' "$ROOT/etc/map/1905d.cfg"
          grep -qx 'bh_type=eth' "$ROOT/etc/map/1905d.cfg"
          grep -qx 'radio_band=24G;5GL;5GH;' "$ROOT/etc/map/1905d.cfg"
          grep -qx 'al_inf=rax0' "$ROOT/etc/map/1905d.cfg"
          grep -Fq 'validate_al_interface' "$ROOT/etc/init.d/easymesh"
          grep -Fq 'P1905 AL interface validated' "$ROOT/etc/init.d/easymesh"
          grep -Fq 'active AP/WEXT interface' "$ROOT/etc/init.d/easymesh"
          # WAPP discovers its native WTS file at /etc/map/wts_bss_info_config.
          # Radio discovery priority remains in MAPD's own configuration.
          grep -qx 'bss_config_priority=ra0;rax0' "$ROOT/etc/map/mapd_cfg"
          # P1905 has its own config file; retain its existing independent list.
          grep -qx 'bss_config_priority=ra0;rax0;apclix0' "$ROOT/etc/map/1905d.cfg"

          # The selected backend is mtwifi-cfg-ucode (the legacy Lua package
          # conflicts with it). Audit the actual setup path, not the inactive Lua file.
          MTWIFI_UCODE_CFG="package/mtk/applications/mtwifi-cfg-ucode/files/usr/share/ucode/mtwifi/config.uc"
          test -s "$MTWIFI_UCODE_CFG" || { echo "::error::Active mtwifi-cfg-ucode setup source is missing"; exit 1; }
          grep -Fq 'let diff_res = dat_diff(dat_old, dat_new);' "$MTWIFI_UCODE_CFG" || {
            echo "::error::Active ucode DAT diff calculation is missing"; exit 1;
          }
          grep -Fq 'if (diff_res.is_changed) driver.ifdown(vif);' "$MTWIFI_UCODE_CFG" || {
            echo "::error::Unchanged DAT setup must not down an already-UP VIF"; exit 1;
          }
          grep -Fq 'if (vif && !vif_cfg.disabled) {' "$MTWIFI_UCODE_CFG" || {
            echo "::error::Active ucode setup no longer restores enabled VIFs"; exit 1;
          }
          grep -Fq 'driver.init_dbdc_card(main_vif);' "$MTWIFI_UCODE_CFG" || {
            echo "::error::DBDC first-initialization path was removed"; exit 1;
          }
          if grep -Eq '^map_(controller|agent)_alid=' "$ROOT/etc/map/1905d.cfg"; then
            echo "::error::Fixed ALID must not be configured on N60 Pro."
            exit 1
          fi
          # N60 WTS is a static vendor credential/BSS-attribute template.
          # Keep the original per-band rows, wildcard MAC selectors and row order;
          # exclude 6 GHz because MT7986 N60 has no 6 GHz radio.
          WTS="$ROOT/etc/map/wts_bss_info_config"
          grep -qx '#ucc_bss_info' "$WTS"
          test "$(grep -c '^[0-9][0-9]*,ff:ff:ff:ff:ff:ff ' "$WTS")" -eq 12
          awk 'NR == 1 { if ($0 != "#ucc_bss_info") exit 1; next }
               { split($1, f, ","); if (f[1] != NR-1 || f[2] != "ff:ff:ff:ff:ff:ff") exit 1;
                 if ($2 !~ /^(8x|11x|12x)$/) exit 1 }
               END { if (NR != 13) exit 1 }' "$WTS"
          grep -Fq 'Multi-AP-24G-2' "$WTS"
          grep -Fq 'Multi-AP-5LG-2' "$WTS"
          grep -Fq 'Multi-AP-5HG-2' "$WTS"
          ! grep -Eq '13x|Multi-AP-6G-' "$WTS"
          test ! -e "$ROOT/usr/sbin/generate-wts-bss-info"

          # Static binary audit: the shipped 7.6.7.3 daemons must contain the
          # WAPP event/socket, 11k/11v, MAP steering and P1905 topology paths.
          for symbol in wapp_socket_and_ctrl_inf_init wapp_ctrl_iface_init wapp_ctrl_iface_event_register /tmp/wapp_server /tmp/wapp_ctrl driver_rrm_onoff driver_wnm_btm_onoff wapp_send_btm_req_11kv_api event_btm_req event_btm_rsp event_btm_query event_neighbor_report_pool_update; do
            strings -a "$BIN/wapp" | grep -Fq "$symbol" || {
              echo "::error::WAPP is missing required runtime path: $symbol"
              exit 1
            }
          done
          strings -a "$BIN/wapp" | grep -Fq 'mbo_default_assoc_retry_delay' || {
            echo "::error::WAPP is missing MBO default retry-delay support."
            exit 1
          }
          for symbol in STEER_FSM "BTM Success" "BTM Fail" "topo_srv_handle_topology_event" steer_fsm_trigger chan_mon_handle_steering_req parse_client_steering_btm_report_message; do
            strings -a "$BIN/mapd" | grep -Fq "$symbol" || {
              echo "::error::MAPD is missing required steering/topology path: $symbol"
              exit 1
            }
          done
          for symbol in "read wts_bss_info_config to ctx->bss_config" "send topology discovery data" "Topology Discovery"; do
            strings -a "$BIN/p1905_managerd" | grep -Fq "$symbol" || {
              echo "::error::P1905 is missing required WTS/topology path: $symbol"
              exit 1
            }
          done
          if test -s "$BIN/wappctrl"; then
            for symbol in btmreq drv_version wapp_cli_cmd_btmreq wapp_cli_cmd_drv_version /tmp/wapp_ctrl EVENT_REGISTER "mbo cmd [arg1] [arg2]" mbo_ap_transition_reason_code; do
              strings -a "$BIN/wappctrl" | grep -Fq "$symbol" || {
                echo "::error::wappctrl is missing required BTM/event diagnostic command: $symbol"
                exit 1
              }
            done
            echo "Optional diagnostic helper present: wappctrl (BTM/event CLI verified)"
          else
            echo "NOTICE: optional diagnostic helper wappctrl is absent."
          fi
          ls -lh "$BIN"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-dev rsync unzip zlib1g-dev file wget time xsltproc \
            libelf-dev device-tree-compiler qemu-utils python3-setuptools \
            python3-pyelftools swig ccache

      - name: Set Go proxy
        run: |
          echo "GOPROXY=https://goproxy.cn,direct" >> $GITHUB_ENV
          echo "GOSUMDB=off" >> $GITHUB_ENV

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-n60pro-ccache-${{ github.ref_name }}-${{ env.DEVICE }}-${{ env.PROFILE }}
          restore-keys: |
            ${{ runner.os }}-n60pro-ccache-${{ github.ref_name }}-${{ env.DEVICE }}-
            ${{ runner.os }}-n60pro-ccache-${{ github.ref_name }}-
            ${{ runner.os }}-n60pro-ccache-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure firmware
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Device: $DEVICE, Profile: $PROFILE ====="

          rm -rf artifacts
          mkdir -p "$HOME/.cache/ccache" "artifacts/$DEVICE/$PROFILE"
          ccache --max-size=5G
          ccache --set-config=compiler_check=content

          BASE_CONFIG="config/n60pro-1001.config"

          if [ ! -f "$BASE_CONFIG" ]; then
            echo "::error::Config not found: $BASE_CONFIG"
            exit 1
          fi

          cp "$BASE_CONFIG" .config
          cp .config "artifacts/$DEVICE/$PROFILE/config.before-defconfig"
          wc -l .config

          # 替换设备行：只保留目标设备的 DEVICE=y
          if grep -q '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_' .config; then
            sed -i -E "s|^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_[^=]+=y|# &|" .config
            sed -i -E "s|^# (CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEVICE})=y|\\1=y|" .config
          fi

          # 如果 config 里没有目标设备行，显式追加
          if ! grep -q "^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEVICE}=y" .config; then
            echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEVICE}=y" >> .config
          fi

          make defconfig

          echo "===== MTK driver feature selection ====="
          echo "Resolved MTK feature values after make defconfig:"
          grep -E '^(CONFIG_MTK_(WIFI_MODE_AP|MT_AP_SUPPORT|BAND_STEERING|MBO_SUPPORT|MAP_SUPPORT)=|# CONFIG_MTK_(WIFI_MODE_AP|MT_AP_SUPPORT|BAND_STEERING|MBO_SUPPORT|MAP_SUPPORT) is not set)' .config || true

          # AP mode and AP support are tristate symbols under the kmod-mt_wifi
          # package menu, so the valid module value is m (not y).
          for option in \
            CONFIG_MTK_WIFI_MODE_AP=m \
            CONFIG_MTK_MT_AP_SUPPORT=m \
            CONFIG_MTK_BAND_STEERING=y \
            CONFIG_MTK_MBO_SUPPORT=y \
            CONFIG_MTK_MAP_SUPPORT=y
          do
            if ! grep -qx "$option" .config; then
              echo "::error::Required MTK driver option missing after defconfig: $option"
              exit 1
            fi
          done
          echo "PASS: AP module mode, Band Steering, MBO and MAP are enabled."

          echo "===== Save minimal Kconfig for audit ====="
          KCONFIG_CONFIG=.config ./scripts/config/conf --savedefconfig="artifacts/$DEVICE/$PROFILE/config.savedefconfig" Config.in
          test -s "artifacts/$DEVICE/$PROFILE/config.savedefconfig" || {
            echo "::error::Kconfig savedefconfig output is missing."
            exit 1
          }
          echo "PASS: generated minimal Kconfig snapshot."

          echo "===== DEVICE 选择 ====="
          grep -E "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEVICE}" .config || {
            echo "::error::Target device ${DEVICE} not selected after defconfig"
            exit 1
          }

          if grep -qx "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEVICE}-mtkuboot=y" .config 2>/dev/null; then
            echo "::error::MTK U-Boot profile must not be selected."
            exit 1
          fi

          cp .config "artifacts/$DEVICE/$PROFILE/config.buildinfo"
          echo "PASS: $DEVICE / $PROFILE config loaded."

      - name: Download required MTK package sources
        run: |
          mkdir -p dl
          REL="https://github.com/laodadelaoda/immortalwrt-mt798x-rebase/releases/download/dl-sources-7.6.7.3"
          for f in \
            mt79xx_20250408-705eb4.tar.xz \
            mapfilter-96f2afed.tar.bz2 \
            wappd-80ca5724.tar.bz2 \
            mapd-6eca4331.tar.bz2 \
            1905daemon-35234223.tar.bz2 \
            libmapd-0132d199.tar.bz2
          do
            wget -q -P dl "$REL/$f" || { echo "::error::download $f failed"; exit 1; }
          done
          ls -lh dl/

      - name: Download sources
        run: make download -j$(nproc)

      - name: Build firmware
        id: build_step
        shell: bash
        continue-on-error: true
        run: |
          set -Eeuo pipefail

          echo "===== Step 1: clean MT Wi-Fi package ====="
          make package/mtk/drivers/mt_wifi/clean V=s

          echo "===== Step 2: retain upstream driver baseline and N60 WNM fixes ====="
          PATCH_DIR="package/mtk/drivers/mt_wifi/patches-7673"
          for patch in \
            094-fix-wnm-fortify.patch \
            095-fix-wnm-fortify-rsp.patch \
            096-wnm-fix-send-btm-req-fortify.patch
          do
            test -s "$PATCH_DIR/$patch" || { echo "::error::Missing required patch: $patch"; exit 1; }
          done

          echo "===== Step 3: prepare mt_wifi ====="
          PREPARE_LOG="artifacts/$DEVICE/$PROFILE/mtwifi-prepare.log"
          make package/mtk/drivers/mt_wifi/prepare V=s 2>&1 | tee "$PREPARE_LOG"

          for patch in \
            094-fix-wnm-fortify.patch \
            095-fix-wnm-fortify-rsp.patch \
            096-wnm-fix-send-btm-req-fortify.patch
          do
            if ! grep -Fq "$patch" "$PREPARE_LOG"; then
              echo "::error::Prepare log does not show $patch being applied."
              exit 1
            fi
          done

          if grep -Eq 'Hunk FAILED|Patch failed|patch failed' "$PREPARE_LOG"; then
            echo "::error::Patch failure text found in prepare log."
            exit 1
          fi

          echo "PASS: 094, 095, 096 applied."

          echo "===== Step 4: source-build EasyMesh 7.6.7.3 stack ====="
          EASYMESH_LOG="artifacts/$DEVICE/$PROFILE/easymesh-source-compile.log"
          : > "$EASYMESH_LOG"
          echo "===== Step 4a: install OpenWrt host tools before isolated package compilation ====="
          make tools/install -j"$(nproc)" V=s
          test -x staging_dir/host/bin/sed || {
            echo "::error::OpenWrt host sed is still missing after tools/install."
            exit 1
          }

          echo "===== Step 4b: install the target cross-toolchain before isolated package compilation ====="
          make toolchain/install -j"$(nproc)" V=s
          LIBGCC_SO="$(find staging_dir -type f -path '*/lib/libgcc_s.so.*' -print -quit)"
          test -n "$LIBGCC_SO" || {
            echo "::error::Target toolchain install did not stage libgcc_s.so."
            exit 1
          }
          echo "PASS: target toolchain runtime staged: $LIBGCC_SO"

          echo "===== Step 4c: generate the target Linux kernel configuration required by kmod package builds ====="
          # Run the target/linux Makefile's oldconfig forwarding rule.
          # The top-level make interface does not expose target/linux/oldconfig;
          # entering target/linux forwards oldconfig to the selected board/subtarget,
          # where Kernel/Configure generates linux-*/.config from the resolved
          # firmware .config before isolated package compilation.
          make -C target/linux oldconfig V=s
          KERNEL_CONFIG="$(find build_dir/target-aarch64_cortex-a53_musl/linux-mediatek_filogic -type f -name .config -print -quit)"
          test -n "$KERNEL_CONFIG" && test -s "$KERNEL_CONFIG" || {
            echo "::error::make -C target/linux oldconfig did not generate the target Linux .config required by kmod dependencies."
            exit 1
          }
          echo "PASS: target Linux configuration generated: $KERNEL_CONFIG"

          make package/mtk/applications/easymesh-n60/clean V=s
          make package/mtk/applications/easymesh-n60/compile V=s 2>&1 | tee "$EASYMESH_LOG"

          WAPP_BIN="$(find build_dir -type f -path '*/easymesh-n60*/wappd/wapp' -print -quit)"
          test -n "$WAPP_BIN" || { echo "::error::Source-built WAPP output was not found."; exit 1; }
          EASYMESH_SRC_DIR="$(dirname "$(dirname "$WAPP_BIN")")"
          MAPD_BIN="$EASYMESH_SRC_DIR/mapd/mapd"
          P1905_BIN="$EASYMESH_SRC_DIR/1905daemon/p1905_managerd"
          WAPPCTRL_BIN="$EASYMESH_SRC_DIR/wappd/wappctrl"
          ETH_OPS_LIB="$EASYMESH_SRC_DIR/1905daemon/ethernet/libeth_1905ops.so"
          MAPD_IF_LIB="$EASYMESH_SRC_DIR/libmapd/libmapd_interface_client.so"
          for f in "$MAPD_BIN" "$P1905_BIN" "$WAPPCTRL_BIN" "$ETH_OPS_LIB" "$MAPD_IF_LIB"; do
            test -s "$f" || { echo "::error::Missing source-built EasyMesh output: $f"; exit 1; }
            readelf -h "$f" | grep -Fq 'AArch64' || { echo "::error::EasyMesh output is not AArch64: $f"; exit 1; }
          done

          readelf -d "$WAPP_BIN" | grep -Fq 'libkvcutil.so.1'
          readelf -d "$WAPP_BIN" | grep -Fq 'libssl.so.3'
          readelf -d "$WAPP_BIN" | grep -Fq 'libcrypto.so.3'
          readelf -d "$P1905_BIN" | grep -Fq 'libnl-tiny.so.1'
          readelf -d "$P1905_BIN" | grep -Fq 'libeth_1905ops.so'
          readelf -d "$P1905_BIN" | grep -Fq 'libssl.so.3'
          readelf -d "$P1905_BIN" | grep -Fq 'libcrypto.so.3'
          if readelf -d "$WAPP_BIN" | grep -Fq 'libssl.so.1.1' || readelf -d "$P1905_BIN" | grep -Fq 'libssl.so.1.1'; then
            echo "::error::Source-built EasyMesh binaries still depend on obsolete OpenSSL 1.1."
            exit 1
          fi
          if readelf -d "$WAPP_BIN" | grep -Fq 'libcrypto.so.1.1' || readelf -d "$P1905_BIN" | grep -Fq 'libcrypto.so.1.1'; then
            echo "::error::Source-built EasyMesh binaries still depend on obsolete OpenSSL 1.1."
            exit 1
          fi

          for symbol in wapp_read_wts_map_config /etc/map/wts_bss_info_config wapp_socket_and_ctrl_inf_init driver_rrm_onoff driver_wnm_btm_onoff wapp_send_btm_req_11kv_api; do
            strings -a "$WAPP_BIN" | grep -Fq "$symbol" || { echo "::error::Source-built WAPP is missing required WTS/11k/11v path: $symbol"; exit 1; }
          done
          for symbol in STEER_FSM topo_srv_handle_topology_event steer_fsm_trigger parse_client_steering_btm_report_message; do
            strings -a "$MAPD_BIN" | grep -Fq "$symbol" || { echo "::error::Source-built MAPD is missing steering/topology path: $symbol"; exit 1; }
          done
          for symbol in "read wts_bss_info_config to ctx->bss_config" "send topology discovery data" "Topology Discovery"; do
            strings -a "$P1905_BIN" | grep -Fq "$symbol" || { echo "::error::Source-built P1905 is missing WTS/topology path: $symbol"; exit 1; }
          done
          echo "PASS: WAPP, MAPD, P1905 and both shared libraries were cross-compiled for AArch64 with OpenSSL 3."
          {
            echo "Source build directory: $EASYMESH_SRC_DIR"
            find "$EASYMESH_SRC_DIR" -maxdepth 3 -type f -print | sort
            echo "===== WAPP NEEDED ====="
            readelf -d "$WAPP_BIN" | grep NEEDED
            echo "===== P1905 NEEDED ====="
            readelf -d "$P1905_BIN" | grep NEEDED
          } >> "$EASYMESH_LOG"

          echo "===== Step 5: full build ====="
          BUILD_LOG="artifacts/$DEVICE/$PROFILE/FULL-BUILD-VS-LOG.txt"
          : > "$BUILD_LOG"
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee -a "$BUILD_LOG"

          echo "===== Step 6: verify sysupgrade ITB ====="
          SYSUP="bin/targets/mediatek/filogic/immortalwrt-mediatek-filogic-${DEVICE}-squashfs-sysupgrade.itb"
          if [ ! -s "$SYSUP" ]; then
            echo "::error::Expected sysupgrade ITB not found: $SYSUP"
            exit 1
          fi
          ls -lh "$SYSUP"
          sha256sum "$SYSUP"

      - name: Check firmware produced
        if: always()
        shell: bash
        run: |
          set +e
          SYSUP="bin/targets/mediatek/filogic/immortalwrt-mediatek-filogic-${DEVICE}-squashfs-sysupgrade.itb"
          if [ -s "$SYSUP" ]; then
            echo "FIRMWARE_PRODUCED=yes" >> $GITHUB_ENV
          else
            echo "FIRMWARE_PRODUCED=no" >> $GITHUB_ENV
          fi

      - name: Collect artifacts
        if: always()
        shell: bash
        run: |
          set +e
          OUT="bin/targets/mediatek/filogic"
          DEST="artifacts/$DEVICE/$PROFILE"
          mkdir -p "$DEST"
          find "$OUT" -maxdepth 1 -type f \
            \( -name "*${DEVICE}*.itb" -o -name "*${DEVICE}*.manifest" \
               -o -name 'sha256sums' -o -name '*.buildinfo' \) \
            -exec cp -v {} "$DEST/" \; 2>/dev/null
          if find "$DEST" -maxdepth 1 -iname '*mtkuboot*' | grep -q .; then
            echo "::error::MTK U-Boot artifact detected; refusing to package."
            exit 1
          fi
          {
            echo "Build policy: DEVICE=$DEVICE, PROFILE=$PROFILE"
            echo "Source revision:"
            git log -1 --format='%H %s'
            echo "Build step outcome: ${{ steps.build_step.outcome }}"
            echo "Firmware produced: ${FIRMWARE_PRODUCED:-unknown}"
            echo "Files:"
            find "$DEST" -maxdepth 1 -type f -printf '%f\n' | sort
          } > "$DEST/BUILD-INFO.txt"
          ( cd "$DEST" && shopt -s nullglob && if ls *.itb >/dev/null 2>&1; then sha256sum *.itb > SHA256SUMS.txt; cat SHA256SUMS.txt; fi ) || true
          find artifacts -maxdepth 3 -type f -printf '%p (%s bytes)\n' | sort

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEVICE }}-${{ env.PROFILE }}-${{ github.run_number }}
          path: artifacts/${{ env.DEVICE }}/${{ env.PROFILE }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Report ccache statistics
        if: always()
        run: ccache -s || true

      - name: Enforce build success
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.build_step.outcome }}" != "success" ]; then
            echo "::error::Build step did not succeed."
            exit 1
          fi
          if [ "${FIRMWARE_PRODUCED:-no}" != "yes" ]; then
            echo "::error::Firmware not produced."
            exit 1
          fi
          SYSUP="bin/targets/mediatek/filogic/immortalwrt-mediatek-filogic-${DEVICE}-squashfs-sysupgrade.itb"
          test -s "$SYSUP"
          echo "PASS: build succeeded, sysupgrade ITB exists."
