name: N60 Pro Full Firmware Build

on:
  push:
    branches: ["n60pro-mtk-closed-driver"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n60pro-full-firmware
  cancel-in-progress: false

jobs:
  firmware:
    name: Build ImmortalWrt 25.12 / Linux 6.12 for Netcore N60 Pro
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h

      - name: Install OpenWrt build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-dev rsync unzip zlib1g-dev file wget time xsltproc libelf-dev device-tree-compiler qemu-utils python3-setuptools python3-pyelftools swig ccache

      - name: Configure build environment
        shell: bash
        run: |
          echo "GOPROXY=https://goproxy.cn,direct" >> "$GITHUB_ENV"
          echo "GOSUMDB=off" >> "$GITHUB_ENV"

      - name: Update and install feeds
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure N60 Pro Standard firmware
        shell: bash
        run: |
          set -euo pipefail
          cat > .config <<'N60PRO_CONFIG_EOF'
# N60 Pro / MT7986 Filogic feature fragment.
# Router model selection is owned by .github/workflows/main.yml.
# Keep this file limited to platform baseline and explicit product features;
# make defconfig resolves version-specific defaults and package dependencies.

CONFIG_TARGET_mediatek=y
CONFIG_TARGET_mediatek_filogic=y
CONFIG_DEFAULT_TARGET_mediatek_filogic=y
CONFIG_TARGET_MULTI_PROFILE=y
CONFIG_TARGET_PER_DEVICE_ROOTFS=y

CONFIG_INCLUDE_CONFIG=y
# CONFIG_KERNEL_KEYS is not set
CONFIG_KERNEL_CGROUP_FREEZER=y
CONFIG_KERNEL_CGROUP_DEVICE=y
# CONFIG_KERNEL_CFS_BANDWIDTH is not set
# CONFIG_KERNEL_BLK_DEV_THROTTLING is not set
CONFIG_KERNEL_NET_CLS_CGROUP=y
# CONFIG_PKG_CHECK_FORMAT_SECURITY is not set
CONFIG_PKG_FORTIFY_SOURCE_2=y
CONFIG_DEVEL=y
CONFIG_TOOLCHAINOPTS=y
# CONFIG_GDB is not set
# CONFIG_FEED_packages is not set
# CONFIG_FEED_luci is not set
# CONFIG_FEED_routing is not set
# CONFIG_FEED_telephony is not set
# CONFIG_FEED_video is not set
CONFIG_PACKAGE_blockd=y
CONFIG_BUSYBOX_CUSTOM=y
CONFIG_BUSYBOX_CONFIG_BLKID=y
CONFIG_BUSYBOX_CONFIG_FEATURE_BLKID_TYPE=y
CONFIG_PACKAGE_ca-certificates=y
CONFIG_PACKAGE_libatomic=y
CONFIG_PACKAGE_resolveip=y
CONFIG_PACKAGE_wireless-tools=y
CONFIG_PACKAGE_zram-swap=y
CONFIG_PACKAGE_wireless-regdb=y
CONFIG_PACKAGE_kmod-ata-core=y
CONFIG_PACKAGE_kmod-crypto-ccm=y
CONFIG_PACKAGE_kmod-crypto-cmac=y
CONFIG_PACKAGE_kmod-crypto-gcm=y
CONFIG_PACKAGE_kmod-crypto-md4=y
CONFIG_PACKAGE_kmod-fs-vfat=y
CONFIG_PACKAGE_kmod-ebtables-ipv4=y
CONFIG_PACKAGE_kmod-ebtables-ipv6=y
CONFIG_PACKAGE_kmod-nft-compat=y
CONFIG_PACKAGE_kmod-nft-socket=y
CONFIG_PACKAGE_kmod-nft-tproxy=y
CONFIG_PACKAGE_kmod-ifb=y
CONFIG_PACKAGE_kmod-inet-diag=y
CONFIG_PACKAGE_kmod-tcp-bbr=y
CONFIG_PACKAGE_kmod-tun=y
CONFIG_OPENSSL_WITH_NPN=y
CONFIG_PACKAGE_libopenssl-devcrypto=y
# CONFIG_WOLFSSL_HAS_ECC25519 is not set
CONFIG_PACKAGE_libblkid=y
CONFIG_PACKAGE_libncurses=y
CONFIG_PACKAGE_libnl=y
CONFIG_PACKAGE_libubus-lua=y
CONFIG_PACKAGE_luci-app-mtwifi-cfg=y
CONFIG_PACKAGE_mii_mgr=y
CONFIG_PACKAGE_mtkhqos_util=y
CONFIG_PACKAGE_regs=y
CONFIG_PACKAGE_switch=y
CONFIG_MTK_CONNINFRA_APSOC=y
CONFIG_MTK_CONNINFRA_APSOC_MT7986=y
CONFIG_CONNINFRA_EMI_SUPPORT=y
CONFIG_CONNINFRA_AUTO_UP=y
CONFIG_PACKAGE_kmod-mt_wifi=y
CONFIG_MTK_FIRST_IF_MT7986=y
CONFIG_MTK_MT_WIFI=m
CONFIG_MTK_THERMAL_PROTECT_SUPPORT=y
CONFIG_MTK_SCS_FW_OFFLOAD=y
CONFIG_MTK_OFFCHANNEL_SCAN_FEATURE=y
# CONFIG_MTK_MULTI_PROFILE_SUPPORT is not set
# CONFIG_MTK_DEFAULT_5G_PROFILE is not set
CONFIG_MTK_FAST_NAT_SUPPORT=y
CONFIG_MTK_WHNAT_SUPPORT=m
CONFIG_MTK_WARP_V2=y
# CONFIG_MTK_PRE_CAL_TRX_SET1_SUPPORT is not set
# CONFIG_MTK_RLM_CAL_CACHE_SUPPORT is not set
# CONFIG_MTK_PRE_CAL_TRX_SET2_SUPPORT is not set
CONFIG_MTK_WLAN_SERVICE=y
CONFIG_MTK_MBO_SUPPORT=y
CONFIG_MTK_MAP_SUPPORT=y
CONFIG_MTK_MAP_R2_VER_SUPPORT=y
CONFIG_MTK_MAP_R3_VER_SUPPORT=y
CONFIG_MTK_FIRST_IF_IPAILNA=y
CONFIG_MTK_WIFI_FW_BIN_LOAD=y
CONFIG_MTK_WIFI_MODE_AP=m
# CONFIG_MTK_MAC_REPEATER_SUPPORT is not set
CONFIG_MTK_MLME_MULTI_QUEUE_SUPPORT=y
CONFIG_MTK_VLAN_SUPPORT=y
# CONFIG_MTK_SNIFFER_RADIOTAP_SUPPORT is not set
CONFIG_MTK_ANTENNA_CONTROL_SUPPORT=y
CONFIG_MTK_MGMT_TXPWR_CTRL=y
CONFIG_MTK_RA_PHY_RATE_SUPPORT=y
CONFIG_MTK_AMPDU_CONF_SUPPORT=y
CONFIG_MTK_ACK_CTS_TIMEOUT_SUPPORT=y
CONFIG_MTK_MBSS_DTIM_SUPPORT=y
CONFIG_MTK_QOS_R1_SUPPORT=y
CONFIG_MTK_CON_WPS_SUPPORT=y
CONFIG_MTK_WLAN_HOOK=y
# CONFIG_MTK_PCIE_ASPM_DYM_CTRL_SUPPORT is not set
CONFIG_MTK_AIR_MONITOR=y
CONFIG_MTK_WPA3_SUPPORT=y
CONFIG_MTK_OWE_SUPPORT=y
CONFIG_WARP_VERSION=2
CONFIG_WARP_CHIPSET="mt7986"
CONFIG_first_card_name="MT7986"
CONFIG_PACKAGE_ip-bridge=y
CONFIG_PACKAGE_tc-tiny=y
CONFIG_PACKAGE_easymesh-n60=y
CONFIG_PACKAGE_ethtool=y
CONFIG_PACKAGE_iw=y
CONFIG_PACKAGE_tcpdump=y
CONFIG_PACKAGE_openssl-util=y
# This fragment intentionally contains no CONFIG_TARGET_DEVICE selector; main.yml selects the model.
# No CONFIG_TARGET_DEVICE selector: main.yml selects the router model before make defconfig.
N60PRO_CONFIG_EOF
          # Select the N60 Pro device explicitly; the platform fragment above
          # intentionally contains only the platform baseline.
          echo 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netcore_n60-pro=y' >> .config
          make defconfig
          echo "Build revision: $(git rev-parse HEAD)"
          echo "Target profile:"
          grep -Fx 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netcore_n60-pro=y' .config

      - name: Download package sources
        shell: bash
        run: |
          set -euo pipefail
          make download -j8

      - name: Compile complete firmware
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j"$(nproc)" V=s

      - name: Confirm firmware output exists
        shell: bash
        run: |
          set -euo pipefail
          OUT="bin/targets/mediatek/filogic"
          test -d "$OUT"
          find "$OUT" -maxdepth 1 -type f -printf '%f\n' | tee "$RUNNER_TEMP/n60-firmware-files.txt"
          test -s "$RUNNER_TEMP/n60-firmware-files.txt"
          grep -Eq '\.(itb|bin|img|gz|zst)$' "$RUNNER_TEMP/n60-firmware-files.txt"

      - name: Upload N60 Pro firmware
        uses: actions/upload-artifact@v6
        with:
          name: n60pro-immortalwrt-firmware-${{ github.run_number }}
          path: |
            bin/targets/mediatek/filogic/
          if-no-files-found: error
          retention-days: 30
