name: N60 Pro Full Firmware Build

on:
  push:
    branches: ["n60pro-mtk-closed-driver"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n60pro-full-firmware
  cancel-in-progress: false

jobs:
  firmware:
    # HARD FREEZE: do not compile/link until the canonical vendor + native
    # Prepare attestation is implemented, verified and bound to this exact SHA.
    if: false
    name: Build ImmortalWrt 25.12 / Linux 6.12 for Netcore N60 Pro (frozen)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h

      - name: Install OpenWrt build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-dev rsync unzip zlib1g-dev file wget time xsltproc libelf-dev device-tree-compiler qemu-utils python3-setuptools python3-pyelftools swig ccache

      - name: Configure build environment
        shell: bash
        run: |
          echo "GOPROXY=https://goproxy.cn,direct" >> "$GITHUB_ENV"
          echo "GOSUMDB=off" >> "$GITHUB_ENV"

      - name: Update and install feeds
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure N60 Pro Standard firmware
        shell: bash
        run: |
          set -euo pipefail
          cp config/n60pro-1001.config .config
          echo 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netcore_n60-pro=y' >> .config
          make defconfig
          echo "Build revision: $(git rev-parse HEAD)"
          grep -Fx 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netcore_n60-pro=y' .config

      - name: Download package sources
        shell: bash
        run: |
          set -euo pipefail
          make download -j8

      - name: Compile complete firmware
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j"$(nproc)" V=s

      - name: Confirm firmware output exists
        shell: bash
        run: |
          set -euo pipefail
          OUT="bin/targets/mediatek/filogic"
          test -d "$OUT"
          find "$OUT" -maxdepth 1 -type f -printf '%f\n' | tee "$RUNNER_TEMP/n60-firmware-files.txt"
          test -s "$RUNNER_TEMP/n60-firmware-files.txt"
          grep -Eq '\.(itb|bin|img|gz|zst)$' "$RUNNER_TEMP/n60-firmware-files.txt"

      - name: Upload N60 Pro firmware
        uses: actions/upload-artifact@v6
        with:
          name: n60pro-immortalwrt-firmware-${{ github.run_number }}
          path: bin/targets/mediatek/filogic/
          if-no-files-found: error
          retention-days: 30
