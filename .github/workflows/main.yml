name: Build ImmortalWrt 25.12 (MT798x filogic)

on:
  push:
    branches: ["n60pro-mtk-closed-driver"]
  workflow_dispatch:
    inputs:
      device:
        description: 'Target device'
        required: true
        default: 'netcore_n60-pro'
        type: choice
        options:
          - netcore_n60-pro
          - netcore_n60
          - cudy_tr3000-v1
          - cmcc_rax3000m
          - xiaomi_redmi-router-ax6000-stock
          - xiaomi_mi-router-ax3000t
          - jdcloud_re-cp-03
          - glinet_gl-mt3000
          - bananapi_bpi-r3
          - bananapi_bpi-r4
      profile:
        description: 'Config profile'
        required: true
        default: 'standard'
        type: choice
        options:
          - standard
          - minimal
          - full
      quick_wifi_only:
        description: 'Quick WiFi only (skip full firmware)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

concurrency:
  group: n60-pro-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      DEVICE: ${{ inputs.device || 'netcore_n60-pro' }}
      PROFILE: ${{ inputs.profile || 'standard' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-dev rsync unzip zlib1g-dev file wget time xsltproc \
            libelf-dev device-tree-compiler qemu-utils python3-setuptools \
            python3-pyelftools swig ccache

      - name: Set Go proxy
        run: |
          echo "GOPROXY=https://goproxy.cn,direct" >> $GITHUB_ENV
          echo "GOSUMDB=off" >> $GITHUB_ENV

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-n60pro-ccache-${{ github.ref_name }}-${{ env.DEVICE }}-${{ env.PROFILE }}
          restore-keys: |
            ${{ runner.os }}-n60pro-ccache-${{ github.ref_name }}-${{ env.DEVICE }}-
            ${{ runner.os }}-n60pro-ccache-${{ github.ref_name }}-
            ${{ runner.os }}-n60pro-ccache-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure firmware
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Device: $DEVICE, Profile: $PROFILE ====="

          rm -rf artifacts
          mkdir -p "$HOME/.cache/ccache" "artifacts/$DEVICE/$PROFILE"
          ccache --max-size=5G
          ccache --set-config=compiler_check=content

          # 选择基础 config
          case "$PROFILE" in
            standard) BASE_CONFIG="config/n60pro-1001.config" ;;
            minimal)  BASE_CONFIG="config/n60pro-minimal.config" ;;
            full)     BASE_CONFIG="config/n60pro-full.config" ;;
            *) echo "::error::Unknown profile: $PROFILE"; exit 1 ;;
          esac

          if [ ! -f "$BASE_CONFIG" ]; then
            echo "::error::Config not found: $BASE_CONFIG"
            exit 1
          fi

          cp "$BASE_CONFIG" .config
          cp .config "artifacts/$DEVICE/$PROFILE/config.before-defconfig"
          wc -l .config

          # 替换设备行：只保留目标设备的 DEVICE=y
          if grep -q '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_' .config; then
            sed -i -E "s|^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_[^=]+=y|# &|" .config
            sed -i -E "s|^# (CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEVICE})=y|\\1=y|" .config
          fi

          # 如果 config 里没有目标设备行，显式追加
          if ! grep -q "^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEVICE}=y" .config; then
            echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEVICE}=y" >> .config
          fi

          make defconfig

          echo "===== DEVICE 选择 ====="
          grep -E "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEVICE}" .config || {
            echo "::error::Target device ${DEVICE} not selected after defconfig"
            exit 1
          }

          if grep -qx "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEVICE}-mtkuboot=y" .config 2>/dev/null; then
            echo "::error::MTK U-Boot profile must not be selected."
            exit 1
          fi

          cp .config "artifacts/$DEVICE/$PROFILE/config.buildinfo"
          echo "PASS: $DEVICE / $PROFILE config loaded."

      - name: Download MTK closed-source packages
        run: |
          mkdir -p dl
          REL="https://github.com/laodadelaoda/immortalwrt-mt798x-rebase/releases/download/dl-sources-7.6.7.3"
          for f in \
            mt79xx_20250408-705eb4.tar.xz \
            mapfilter-96f2afed.tar.bz2 \
            wappd-80ca5724.tar.bz2 \
            mapd-6eca4331.tar.bz2 \
            libmapd-0132d199.tar.bz2 \
            1905daemon-35234223.tar.bz2 \
            bndstrg_plus-8350508d.tar.bz2 \
            fwdd-bcbae0e4.tar.bz2
          do
            wget -q -P dl "$REL/$f" || { echo "::error::download $f failed"; exit 1; }
          done
          ls -lh dl/

      - name: Download sources
        run: make download -j$(nproc)

      - name: Build firmware
        id: build_step
        shell: bash
        continue-on-error: true
        run: |
          set -Eeuo pipefail

          echo "===== Step 1: clean MT Wi-Fi package ====="
          make package/mtk/drivers/mt_wifi/clean V=s

          echo "===== Step 2: remove 042~077, keep 001~041 + 091 + 093 + 094 ====="
          rm -f package/mtk/drivers/mt_wifi/patches-7673/042-*.patch
          rm -f package/mtk/drivers/mt_wifi/patches-7673/050-*.patch
          rm -f package/mtk/drivers/mt_wifi/patches-7673/051-*.patch
          rm -f package/mtk/drivers/mt_wifi/patches-7673/052-*.patch
          rm -f package/mtk/drivers/mt_wifi/patches-7673/053-*.patch
          rm -f package/mtk/drivers/mt_wifi/patches-7673/054-*.patch
          rm -f package/mtk/drivers/mt_wifi/patches-7673/055-*.patch
          rm -f package/mtk/drivers/mt_wifi/patches-7673/057-*.patch
          rm -f package/mtk/drivers/mt_wifi/patches-7673/058-*.patch
          rm -f package/mtk/drivers/mt_wifi/patches-7673/059-*.patch
          rm -f package/mtk/drivers/mt_wifi/patches-7673/060-*.patch
          rm -f package/mtk/drivers/mt_wifi/patches-7673/061-*.patch
          rm -f package/mtk/drivers/mt_wifi/patches-7673/062-*.patch
          rm -f package/mtk/drivers/mt_wifi/patches-7673/063-*.patch
          rm -f package/mtk/drivers/mt_wifi/patches-7673/064-*.patch
          rm -f package/mtk/drivers/mt_wifi/patches-7673/065-*.patch
          rm -f package/mtk/drivers/mt_wifi/patches-7673/066-*.patch
          rm -f package/mtk/drivers/mt_wifi/patches-7673/067-*.patch
          rm -f package/mtk/drivers/mt_wifi/patches-7673/068-*.patch
          rm -f package/mtk/drivers/mt_wifi/patches-7673/069-*.patch
          rm -f package/mtk/drivers/mt_wifi/patches-7673/070-*.patch
          rm -f package/mtk/drivers/mt_wifi/patches-7673/071-*.patch
          rm -f package/mtk/drivers/mt_wifi/patches-7673/072-*.patch
          rm -f package/mtk/drivers/mt_wifi/patches-7673/073-*.patch
          rm -f package/mtk/drivers/mt_wifi/patches-7673/074-*.patch
          rm -f package/mtk/drivers/mt_wifi/patches-7673/075-*.patch
          rm -f package/mtk/drivers/mt_wifi/patches-7673/076-*.patch
          rm -f package/mtk/drivers/mt_wifi/patches-7673/077-*.patch

          echo "===== Step 3: prepare mt_wifi ====="
          PREPARE_LOG="artifacts/$DEVICE/$PROFILE/mtwifi-prepare.log"
          make package/mtk/drivers/mt_wifi/prepare V=s 2>&1 | tee "$PREPARE_LOG"

          for patch in \
            091-fix-gpl-license.patch \
            093-debug-probe.patch \
            094-fix-wnm-fortify.patch
          do
            if ! grep -Fq "$patch" "$PREPARE_LOG"; then
              echo "::error::Prepare log does not show $patch being applied."
              exit 1
            fi
          done

          if grep -Eq 'Hunk FAILED|Patch failed|patch failed' "$PREPARE_LOG"; then
            echo "::error::Patch failure text found in prepare log."
            exit 1
          fi

          echo "PASS: 091, 093, 094 applied."

          echo "===== Step 4: full build ====="
          BUILD_LOG="artifacts/$DEVICE/$PROFILE/FULL-BUILD-VS-LOG.txt"
          : > "$BUILD_LOG"
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee -a "$BUILD_LOG"

          echo "===== Step 5: verify sysupgrade ITB ====="
          SYSUP="bin/targets/mediatek/filogic/immortalwrt-mediatek-filogic-${DEVICE}-squashfs-sysupgrade.itb"
          if [ ! -s "$SYSUP" ]; then
            echo "::error::Expected sysupgrade ITB not found: $SYSUP"
            exit 1
          fi
          ls -lh "$SYSUP"
          sha256sum "$SYSUP"

      - name: Check firmware produced
        if: always()
        shell: bash
        run: |
          set +e
          SYSUP="bin/targets/mediatek/filogic/immortalwrt-mediatek-filogic-${DEVICE}-squashfs-sysupgrade.itb"
          if [ -s "$SYSUP" ]; then
            echo "FIRMWARE_PRODUCED=yes" >> $GITHUB_ENV
          else
            echo "FIRMWARE_PRODUCED=no" >> $GITHUB_ENV
          fi

      - name: Collect artifacts
        if: always()
        shell: bash
        run: |
          set +e
          OUT="bin/targets/mediatek/filogic"
          DEST="artifacts/$DEVICE/$PROFILE"
          mkdir -p "$DEST"
          find "$OUT" -maxdepth 1 -type f \
            \( -name "*${DEVICE}*.itb" -o -name "*${DEVICE}*.manifest" \
               -o -name 'sha256sums' -o -name '*.buildinfo' \) \
            -exec cp -v {} "$DEST/" \; 2>/dev/null
          if find "$DEST" -maxdepth 1 -iname '*mtkuboot*' | grep -q .; then
            echo "::error::MTK U-Boot artifact detected; refusing to package."
            exit 1
          fi
          {
            echo "Build policy: DEVICE=$DEVICE, PROFILE=$PROFILE"
            echo "Source revision:"
            git log -1 --format='%H %s'
            echo "Build step outcome: ${{ steps.build_step.outcome }}"
            echo "Firmware produced: ${FIRMWARE_PRODUCED:-unknown}"
            echo "Files:"
            find "$DEST" -maxdepth 1 -type f -printf '%f\n' | sort
          } > "$DEST/BUILD-INFO.txt"
          ( cd "$DEST" && shopt -s nullglob && if ls *.itb >/dev/null 2>&1; then sha256sum *.itb > SHA256SUMS.txt; cat SHA256SUMS.txt; fi ) || true
          find artifacts -maxdepth 3 -type f -printf '%p (%s bytes)\n' | sort

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEVICE }}-${{ env.PROFILE }}-${{ github.run_number }}
          path: artifacts/${{ env.DEVICE }}/${{ env.PROFILE }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Report ccache statistics
        if: always()
        run: ccache -s || true

      - name: Enforce build success
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.build_step.outcome }}" != "success" ]; then
            echo "::error::Build step did not succeed."
            exit 1
          fi
          if [ "${FIRMWARE_PRODUCED:-no}" != "yes" ]; then
            echo "::error::Firmware not produced."
            exit 1
          fi
          SYSUP="bin/targets/mediatek/filogic/immortalwrt-mediatek-filogic-${DEVICE}-squashfs-sysupgrade.itb"
          test -s "$SYSUP"
          echo "PASS: build succeeded, sysupgrade ITB exists."
