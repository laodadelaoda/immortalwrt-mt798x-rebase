name: Build N60 Pro - ImmortalWrt 25.12 (Standard Only)

on:
  push:
    branches: ["n60pro-mtk-closed-driver"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n60-pro-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Verify source layout (warnings only)
        shell: bash
        run: |
          set +e
          echo "===== Source revision ====="
          git log -1 --format='%H %s'

          echo "===== Device definition ====="
          grep -Rni --include='*.mk' 'netcore_n60-pro' target/linux/mediatek || true

          echo "===== DTS presence (warning only, does not block build) ====="
          DTS="target/linux/mediatek/dts/mt7986a-netcore-n60-pro.dts"
          if [ -s "$DTS" ]; then
            echo "DTS found: $DTS"
            sha256sum "$DTS"
          else
            echo "::warning::DTS not found at expected path; build will use whatever the target defines."
          fi

          echo "===== MTK Wi-Fi compatibility patches ====="
          ls -1 package/mtk/drivers/mt_wifi/patches-7673/ 2>/dev/null | head -50 || true

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-dev rsync unzip zlib1g-dev file wget time xsltproc \
            libelf-dev device-tree-compiler qemu-utils python3-setuptools \
            python3-pyelftools swig ccache

      - name: Set Go proxy
        run: |
          echo "GOPROXY=https://goproxy.cn,direct" >> $GITHUB_ENV
          echo "GOSUMDB=off" >> $GITHUB_ENV

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-n60pro-standard-ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-n60pro-standard-ccache-${{ github.ref_name }}-
            ${{ runner.os }}-n60pro-standard-ccache-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure standard profile only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/N60-Pro
          mkdir -p "$HOME/.cache/ccache" artifacts/N60-Pro/standard
          ccache --max-size=5G
          ccache --set-config=compiler_check=content

          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n60-pro=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-mod-network=y
          CONFIG_CCACHE=y

          # MTK MT7986 vendor Wi-Fi driver and kernel dependencies
          CONFIG_PACKAGE_kmod-mt_wifi=y
          CONFIG_PACKAGE_kmod-conninfra=y
          CONFIG_PACKAGE_kmod-warp=y
          # MT7986 must use the chip-specific WARP v2 implementation.
          CONFIG_WARP_VERSION=2
          CONFIG_WARP_CHIPSET="mt7986"
          CONFIG_PACKAGE_kmod-mediatek_hnat=y
          CONFIG_PACKAGE_wifi-dats=y

          # Explicitly disable legacy packages that conflict with mtwifi-cfg-ucode.
          # CONFIG_PACKAGE_mtwifi-cfg is not set
          # CONFIG_PACKAGE_luci-app-mtk is not set
          # CONFIG_PACKAGE_wifi-profile is not set

          # Dependencies required by mtwifi-cfg-ucode (verified in package Makefile)
          CONFIG_PACKAGE_mtwifi-cfg-ucode=y
          CONFIG_PACKAGE_datconf=y
          CONFIG_PACKAGE_l1util=y          CONFIG_PACKAGE_ucode=y          CONFIG_PACKAGE_ucode-mod-fs=y
          CONFIG_PACKAGE_ucode-mod-log=y
          CONFIG_PACKAGE_ucode-mod-ubus=y
          CONFIG_PACKAGE_ucode-mod-uci=y
          CONFIG_PACKAGE_ucode-mod-datconf=y
          CONFIG_PACKAGE_ucode-mod-l1parser=y
          CONFIG_PACKAGE_wifi-scripts=y

          # Wi-Fi userspace tools
          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_iwinfo-ucode=y
          CONFIG_PACKAGE_luci-app-mtwifi-cfg=y

          # MT7986 driver profile and factory calibration
          CONFIG_MTK_MT_WIFI=m
          CONFIG_MTK_MT_AP_SUPPORT=y
          CONFIG_MTK_CFG80211_SUPPORT=y
          CONFIG_MTK_WPA3_SUPPORT=y
          CONFIG_MTK_HOSTAPD_WPA3_SUPPORT=y
          CONFIG_MTK_MT_WIFI_DRIVER_VERSION_7673=y
          CONFIG_MTK_MT_WIFI_PATH="mt_wifi"
          CONFIG_MTK_CHIP_MT7986=y
          CONFIG_MTK_FIRST_IF_MT7986=y
          CONFIG_MTK_SECOND_IF_NONE=y
          CONFIG_MTK_THIRD_IF_NONE=y
          CONFIG_MTK_FIRST_IF_EEPROM_FLASH=y
          CONFIG_MTK_FIRST_IF_IPAILNA=y
          CONFIG_MTK_DBDC_MODE=y
          CONFIG_MTK_WIFI_MODE_AP=m
          CONFIG_MTK_WIFI_SKU_TYPE="AX6000"
          CONFIG_MTK_WIFI_ADIE_TYPE="mt7976"
          CONFIG_MTK_CONNINFRA_APSOC=y
          CONFIG_MTK_CONNINFRA_APSOC_MT7986=y
          CONFIG_MTK_DOT11K_RRM_SUPPORT=y
          CONFIG_first_card=y
          CONFIG_first_card_name="MT7986"

          # Keep SAE/WPA3 enabled consistently with the vendor driver's
          # SaeCfg field and delete_saeinstance_entry implementation.
          EOF

          cp .config artifacts/N60-Pro/standard/config.before-defconfig
          make defconfig

          echo "=== RRM Kconfig after defconfig ==="
          grep -nE 'DOT11K_RRM_SUPPORT' .config | tee artifacts/N60-Pro/standard/RRM-KCONFIG-AFTER.txt || echo "(no RRM entries)"

          # ---- Diagnostic: list any SAE-related Kconfig symbols present ----
          {
            echo "===== SAE-related Kconfig symbols in this tree ====="
            grep -rniE 'config.*SAE' package/mtk/ target/linux/mediatek/ 2>/dev/null | head -40 || true
            echo
            echo "===== SAE-related options in effective .config ====="
            grep -iE 'SAE' .config || echo "(none)"
            echo
            echo "===== SAE symbols in downloaded driver source (if present) ====="
            grep -rniE 'SaeCfg|delete_saeinstance_entry' build_dir/target-*/linux-*/ 2>/dev/null | head -20 || true
          } | tee artifacts/N60-Pro/standard/SAE-DIAGNOSTIC.txt

          # ---- Required configuration (kept minimal; only what we're sure about) ----
          require_config() {
            if ! grep -Fqx "$1" .config; then
              echo "::error::Required configuration missing after make defconfig: $1"
              echo "===== Effective MTK options ====="
              grep -E '^(CONFIG_MTK_|CONFIG_first_card|CONFIG_PACKAGE_(kmod-(mt_wifi|conninfra|warp|mediatek_hnat)|wifi-dats|mtwifi-cfg-ucode))' .config || true
              exit 1
            fi
          }
          require_config 'CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n60-pro=y'
          require_config 'CONFIG_PACKAGE_luci=y'
          require_config 'CONFIG_PACKAGE_kmod-mt_wifi=y'
          require_config 'CONFIG_PACKAGE_kmod-conninfra=y'
          require_config 'CONFIG_PACKAGE_kmod-warp=y'
          require_config 'CONFIG_WARP_VERSION=2'
          require_config 'CONFIG_WARP_CHIPSET="mt7986"'
          require_config 'CONFIG_PACKAGE_kmod-mediatek_hnat=y'
          require_config 'CONFIG_PACKAGE_wifi-dats=y'
          require_config 'CONFIG_PACKAGE_iwinfo-ucode=y'
          require_config 'CONFIG_PACKAGE_luci-app-mtwifi-cfg=y'
          require_config 'CONFIG_PACKAGE_mtwifi-cfg-ucode=y'
          require_config 'CONFIG_PACKAGE_datconf=y'
          require_config 'CONFIG_PACKAGE_l1util=y'
          require_config 'CONFIG_PACKAGE_ucode-mod-datconf=y'
          require_config 'CONFIG_PACKAGE_ucode-mod-l1parser=y'
          require_config 'CONFIG_MTK_WPA3_SUPPORT=y'
          require_config 'CONFIG_MTK_HOSTAPD_WPA3_SUPPORT=y'
          if ! grep -Eq '^CONFIG_MTK_MT_AP_SUPPORT=(y|m)$' .config; then
            echo "::error::MTK AP support is neither built-in nor modular after make defconfig."
            grep -E '^CONFIG_MTK_MT_AP_SUPPORT=' .config || true
            exit 1
          fi
          require_config 'CONFIG_MTK_CFG80211_SUPPORT=y'
          require_config 'CONFIG_MTK_MT_WIFI=m'

          # ---- Forbidden profiles / conflicting packages ----
          if grep -qx 'CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n60-pro-mtkuboot=y' .config; then
            echo "::error::MTK U-Boot profile must not be selected."
            exit 1
          fi
          # The ucode configurator must remain selected; its dependencies are
          # explicitly listed above so make defconfig cannot silently drop it.
          require_config 'CONFIG_PACKAGE_mtwifi-cfg-ucode=y'
          if grep -qx 'CONFIG_PACKAGE_mtwifi-cfg=y' .config || grep -qx 'CONFIG_PACKAGE_luci-app-mtk=y' .config || grep -qx 'CONFIG_PACKAGE_iwinfo=y' .config; then
            echo "::error::Legacy mtwifi-cfg / luci-app-mtk / iwinfo conflicts with the ucode wireless stack."
            exit 1
          fi

          cp .config artifacts/N60-Pro/standard/config.buildinfo
          echo "===== Effective MTK Wi-Fi configuration ====="
          grep -E '^(CONFIG_WARP_VERSION=|CONFIG_WARP_CHIPSET=|CONFIG_PACKAGE_(kmod-mt_wifi|kmod-conninfra|kmod-warp|kmod-mediatek_hnat|wifi-dats|mtwifi-cfg-ucode|ucode-mod-datconf|ucode-mod-l1parser|iw|iwinfo|iwinfo-ucode)=|CONFIG_MTK_(MT_WIFI|CHIP_MT7986|FIRST_IF_MT7986|WIFI_MODE|WIFI_SKU_TYPE|WIFI_ADIE_TYPE|CONNINFRA_APSOC|DBDC_MODE)|CONFIG_first_card)' .config
          echo "PASS: standard profile and MT7986 vendor Wi-Fi stack selected."

      - name: Download sources
        run: make download -j$(nproc)

      - name: Prepare driver source, diagnose SAE structures and RRM
        shell: bash
        run: |
          set -euo pipefail
          echo "===== Step 1: prepare MTK driver source ====="          make package/mtk/drivers/mt_wifi/prepare V=s

          echo "===== Step 2: locate the actual driver header ====="
          mapfile -t SEC_FILES < <(
            find build_dir -type f -path '*/embedded/include/security/sec_cmm.h' -print
          )

          if [ "${#SEC_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one prepared security/sec_cmm.h; found ${#SEC_FILES[@]}."
            printf '%s\n' "${SEC_FILES[@]}"
            exit 1
          fi

          SEC="${SEC_FILES[0]}"
          SRC="${SEC%/embedded/include/security/sec_cmm.h}"
          if [ ! -d "$SRC" ] || [ ! -f "$SRC/embedded/include/rtmp.h" ] || [ ! -d "$SRC/os/linux" ]; then
            echo "::error::Resolved driver source root is invalid: $SRC"
            exit 1
          fi
          # ---- Targeted SAE preprocessor fix: line 14; accept already-patched source ----
          SAE_LINE="$(awk 'NR==14 { print; exit }' "$SEC")"
          if [ "$SAE_LINE" = "#ifdef SUPP_SAE_SUPPORT" ]; then
            awk 'NR==14 {
              if ($0 == "#ifdef SUPP_SAE_SUPPORT")
                $0 = "#if defined(DOT11_SAE_SUPPORT) || defined(SUPP_SAE_SUPPORT)"
            } { print }' "$SEC" > "$SEC.tmp"
            cat "$SEC.tmp" > "$SEC"
            rm -f "$SEC.tmp"
          elif [ "$SAE_LINE" != "#if defined(DOT11_SAE_SUPPORT) || defined(SUPP_SAE_SUPPORT)" ]; then
            echo "::error::Unexpected sec_cmm.h line 14; refusing to patch the wrong source revision."
            nl -ba "$SEC" | awk 'NR>=10 && NR<=18'
            exit 1
          fi
          if [ "$(awk 'NR==14 { print; exit }' "$SEC")" != "#if defined(DOT11_SAE_SUPPORT) || defined(SUPP_SAE_SUPPORT)" ]; then
            echo "::error::SAE line-14 patch verification failed."
            exit 1
          fi
          echo "PASS: sec_cmm.h line 14 has consistent SAE guards."
          awk 'NR>=12 && NR<=16' "$SEC"

          # ---- Targeted RRM fix: change only config.mk line 73 ----
          CFG="$SRC/os/linux/config.mk"
          test -f "$CFG" || { echo "::error::config.mk not found: $CFG"; exit 1; }
          RRM_LINE="$(awk 'NR==73 { print; exit }' "$CFG")"
          if [ "$RRM_LINE" = "HAS_DOT11K_RRM_SUPPORT=n" ]; then
            awk 'NR==73 {
              if ($0 == "HAS_DOT11K_RRM_SUPPORT=n")
                $0 = "HAS_DOT11K_RRM_SUPPORT=y"
            } { print }' "$CFG" > "$CFG.tmp"
            cat "$CFG.tmp" > "$CFG"
            rm -f "$CFG.tmp"
          elif [ "$RRM_LINE" != "HAS_DOT11K_RRM_SUPPORT=y" ]; then
            echo "::error::Unexpected config.mk line 73; refusing to patch the wrong source revision."
            nl -ba "$CFG" | awk 'NR>=70 && NR<=76'
            exit 1
          fi
          if [ "$(awk 'NR==73 { print; exit }' "$CFG")" != "HAS_DOT11K_RRM_SUPPORT=y" ]; then
            echo "::error::RRM line-73 patch verification failed."
            exit 1
          fi
          echo "PASS: patched config.mk line 73 for RRM."
          awk 'NR>=71 && NR<=75' "$CFG"

          echo "Prepared source root: $SRC"
          echo "Using header: $SEC"

          SAE_DIAG="artifacts/N60-Pro/standard/SAE-STRUCT-LOOKUP.txt"
          mkdir -p "$(dirname "$SAE_DIAG")"
          {
            echo "=== Prepared source ==="
            echo "$SRC"
            echo
            echo "=== Structure definitions and references ==="
            grep -RniE --include='*.h' --include='*.c' \
              'struct[[:space:]]+(pwd_id_list|sae_capability|sae_pk_cfg)\b' "$SRC" || true
            echo
            echo "=== typedef aliases mentioning the three SAE structure tags ==="
            grep -RniE --include='*.h' --include='*.c' \
              'typedef.*(pwd_id_list|sae_capability|sae_pk_cfg)|(pwd_id_list|sae_capability|sae_pk_cfg).*typedef' "$SRC" || true
            echo
            echo "=== All declarations and references for the three SAE type names ==="
            grep -RniE --include='*.h' --include='*.c' \
              'pwd_id_list|sae_capability|sae_pk_cfg' "$SRC" | head -400 || true
            echo
            echo "=== All sae_cmm.h paths ==="
            find "$SRC" -type f -name 'sae_cmm.h' -print
            echo
            echo "=== sec_cmm.h lines 1-30 ==="
            sed -n '1,30p' "$SEC"
            echo
            echo "=== sec_cmm.h lines 500-540 ==="
            sed -n '500,540p' "$SEC"
            echo
            echo "=== SAE-related preprocessor directives in sec_cmm.h ==="
            grep -nE '^[[:space:]]*#[[:space:]]*(if|ifdef|ifndef|elif|define|undef).*SAE|SAE.*(SUPPORT|CFG|ENABLE|PK)' "$SEC" || true
            echo
            echo "SAE_SOURCE_MODIFIED=no"
          } | tee "$SAE_DIAG"

          echo "===== Step 3: RRM diagnostics (read-only) ====="
          DIAG="artifacts/N60-Pro/standard/DRIVER-PATCH-AND-RRM-DIAG.txt"
          mkdir -p "$(dirname "$DIAG")"
          {
            echo "=== Prepared source ==="
            echo "$SRC"
            echo
            echo "=== RRM config.mk files and matching lines ==="
            while IFS= read -r cfg; do
              echo "--- $cfg ---"
              grep -nE -C 3 'HAS_DOT11K_RRM_SUPPORT|DOT11K_RRM_SUPPORT' "$cfg" || true
            done < <(find "$SRC" -type f -path '*/os/linux/config.mk' -print)

            echo
            echo "=== Makefile and .mk references ==="
            find "$SRC" -type f \
              \( -name 'Makefile' -o -name '*.mk' \) \
              -exec grep -nH -E 'HAS_DOT11K_RRM_SUPPORT|DOT11K_RRM_SUPPORT' {} + \
              || true
            echo
            echo "=== RRM header and type references ==="            grep -RniE \
              --include='*.h' --include='*.c' --include='Makefile' --include='*.mk' \
              'RRM_BEACON_REQ_INFO|DOT11K_RRM_SUPPORT|HAS_DOT11K_RRM_SUPPORT' \
              "$SRC" | head -250 || true

            echo
            echo "=== Effective RRM Kconfig ==="
            grep -E '^CONFIG_MTK_DOT11K_RRM_SUPPORT=|^# CONFIG_MTK_DOT11K_RRM_SUPPORT is not set' .config || true

            echo
            echo "RRM_SOURCE_MODIFIED=no"
          } | tee "$DIAG"

          echo "===== Diagnostics saved to $SAE_DIAG and $DIAG ====="
          
          echo "===== Step 4: VLAN diagnostics (read-only) ====="
          VLAN_DIAG="artifacts/N60-Pro/standard/VLAN-DIAG.txt"
          mkdir -p "$(dirname "$VLAN_DIAG")"
          AP_DATA="$SRC/embedded/ap/ap_data.c"
          {
            echo "=== VLAN diagnostic metadata ==="
            echo "Prepared source root: $SRC"
            echo "Driver header: $SEC"
            echo "Driver config: $CFG"
            echo "AP source: $AP_DATA"
            echo "VLAN_SOURCE_MODIFIED=no"
            echo "VLAN_CONFIG_CHANGED=no"
            echo

            echo "=== All bDynamicVlanDisabled occurrences in .h and .c ==="
            grep -RniE --include='*.h' --include='*.c' 'bDynamicVlanDisabled' "$SRC" || true
            echo

            echo "=== bDynamicVlanDisabled declaration context inside struct _COMMON_CONFIG (10 lines before, 3 after) ==="
            COMMON_CONFIG_FOUND=no
            while IFS= read -r -d '' header; do
              awk '
                { lines[NR] = $0 }
                /struct[[:space:]]+_COMMON_CONFIG([[:space:]]|$)/ { in_struct = 1; struct_start = NR }
                in_struct && /bDynamicVlanDisabled/ { field_line = NR }
                in_struct && /^[[:space:]]*};/ {
                  if (field_line) {
                    first = field_line - 10
                    if (first < 1) first = 1
                    last = field_line + 3
                    print "--- " FILENAME ":" field_line " (inside struct _COMMON_CONFIG) ---"
                    for (i = first; i <= last; i++) {
                      if (i in lines) printf "%6d  %s\n", i, lines[i]
                    }
                    found = 1
                  }
                  in_struct = 0
                  field_line = 0
                }
                END {
                  if (!found) exit 1
                }
              ' "$header" && COMMON_CONFIG_FOUND=yes || true
            done < <(find "$SRC" -type f -name '*.h' -print0)
            if [ "$COMMON_CONFIG_FOUND" = no ]; then
              echo "No bDynamicVlanDisabled field declaration was found inside a struct _COMMON_CONFIG definition in .h files."
              echo "Candidate struct definitions:"
              grep -RniE --include='*.h' 'struct[[:space:]]+_COMMON_CONFIG' "$SRC" || true
            fi
            echo

            echo "=== ap_data.c lines 335-370 (numbered) ==="
            if [ -f "$AP_DATA" ]; then
              nl -ba "$AP_DATA" | awk 'NR >= 335 && NR <= 370'
              echo
              echo "=== All preprocessor directives in ap_data.c lines 325-385 (30 lines around line 355) ==="
              nl -ba "$AP_DATA" | awk 'NR >= 325 && NR <= 385 && $2 ~ /^#/ { print }'
            else
              echo "ERROR: expected ap_data.c not found at $AP_DATA"
            fi
            echo

            echo "=== All VLAN or DYNAMIC-related lines in config.mk ==="
            grep -niE 'VLAN|DYNAMIC' "$CFG" || true
            echo

            echo "=== Complete HAS_* switch inventory: ^HAS_[A-Z0-9_]+= ==="
            grep -nE '^HAS_[A-Z0-9_]+=' "$CFG" || true
            echo

            echo "=== All DYNAMIC_VLAN / VLAN_SUPPORT macro references in driver .h and .c files ==="
            grep -RniE --include='*.h' --include='*.c' 'DYNAMIC_VLAN|VLAN_SUPPORT' "$SRC" || true
            echo
            echo "=== End of read-only VLAN diagnostics ==="
          } | tee "$VLAN_DIAG"

          echo "VLAN diagnostics saved to $VLAN_DIAG"

          echo "===== Step 5: patch bDynamicVlanDisabled guard in rtmp.h ====="
          export SRC
          export VLAN_AUDIT="vlan_patch_audit.txt"

          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          OLD = "#ifdef DYNAMIC_VLAN_SUPPORT"
          NEW = "#if defined(RT_CFG80211_SUPPORT) || defined(DYNAMIC_VLAN_SUPPORT)"
          AUDIT = Path(os.environ["VLAN_AUDIT"])

          def fail(msg):
              print("ERROR: " + msg)
              sys.exit(1)

          src = Path(os.environ["SRC"]).resolve()
          header = src / "embedded/include/rtmp.h"

          if not src.is_dir():
              fail(f"SRC directory not found: {src}")
          if not header.is_file():
              fail(f"rtmp.h not found: {header}")

          text = header.read_text(encoding="utf-8")
          lines = text.splitlines(keepends=True)

          # Locate the actual declaration inside struct _COMMON_CONFIG.
          struct_re = re.compile(r"\\bstruct[ \\t]+_COMMON_CONFIG\\b")
          member_re = re.compile(r"^.*\\bbDynamicVlanDisabled\\b.*$")
          structs = [i for i, line in enumerate(lines) if struct_re.search(line)]
          if len(structs) != 1:
              fail(f"expected exactly one struct _COMMON_CONFIG, found {len(structs)}")

          struct_start = structs[0]
          members = [i for i, line in enumerate(lines)
                     if member_re.search(line) and i >= struct_start]
          if len(members) != 1:
              fail(f"expected exactly one bDynamicVlanDisabled declaration, found {len(members)}")
          member = members[0]

          # Confirm the member is before the end of the _COMMON_CONFIG definition.
          depth = 0
          opened = False
          struct_end = None
          for i in range(struct_start, len(lines)):
              depth += lines[i].count("{") - lines[i].count("}")
              if depth > 0:
                  opened = True
              elif opened and depth == 0:
                  struct_end = i
                  break
          if struct_end is None or not (struct_start <= member <= struct_end):
              fail("bDynamicVlanDisabled is not inside struct _COMMON_CONFIG")

          # Track conditional-compilation nesting up to the declaration.
          stack = []
          directive = re.compile(r"^#[ \\t]*(if|ifdef|ifndef|elif|else|endif)\\b")
          for i in range(member + 1):
              s = lines[i].strip()
              m = directive.match(s)
              if not m:
                  continue
              kind = m.group(1)
              if kind in ("if", "ifdef", "ifndef"):
                  stack.append((i, s))
              elif kind in ("elif", "else"):
                  if not stack:
                      fail(f"unbalanced #{kind} at line {i + 1}")
              elif kind == "endif":
                  if not stack:
                      fail(f"unbalanced #endif at line {i + 1}")
                  stack.pop()

          if not stack:
              fail("no enclosing preprocessor condition for bDynamicVlanDisabled")

          guard_idx, guard = stack[-1]
          if guard != OLD:
              fail(
                  f"unexpected enclosing guard at line {guard_idx + 1}: "
                  f"{guard!r}; expected {OLD!r}"
              )

          # Approved replacement only; never alter an unexpected source revision.
          newline = "\\r\\n" if lines[guard_idx].endswith("\\r\\n") else "\\n"
          lines[guard_idx] = NEW + newline
          patched = "".join(lines)
          if patched == text:
              fail("replacement made no change")

          header.write_text(patched, encoding="utf-8")

          # Mandatory post-patch verification.
          verify = header.read_text(encoding="utf-8").splitlines()
          if verify[guard_idx].strip() != NEW:
              fail("post-patch guard verification failed")
          if sum(1 for x in verify if x.strip() == OLD) != 0:
              fail("old guard remains after patch")
          if sum(1 for x in verify if x.strip() == NEW) != 1:
              fail("expected exactly one new guard after patch")
          if sum(1 for x in verify if "bDynamicVlanDisabled" in x) != 1:
              fail("bDynamicVlanDisabled declaration count changed")

          report = [
              "=== VLAN member-condition patch: PASS ===",
              f"SRC: {src}",
              f"Header: {header}",
              f"struct _COMMON_CONFIG line: {struct_start + 1}",
              f"bDynamicVlanDisabled declaration line: {member + 1}",
              f"Original guard line: {guard_idx + 1}: {OLD}",
              f"Applied guard line: {guard_idx + 1}: {NEW}",
              "Declaration scope validation: PASS",
              "Guard validation: PASS",
              "Post-patch verification: PASS",
              "Idempotency state: PATCHED",
              "=== End VLAN member-condition patch ===",
          ]
          AUDIT.write_text("\\n".join(report) + "\\n", encoding="utf-8")
          print(AUDIT.read_text(encoding="utf-8"), end="")
          PY

          echo "VLAN patch audit saved to $VLAN_AUDIT"

      - name: Upload VLAN patch audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n60pro-vlan-patch-audit
          path: vlan_patch_audit.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Build standard profile
        id: build_step
        run: make -j$(nproc) V=s
        continue-on-error: true

      - name: Check whether firmware was actually produced
        if: always()
        shell: bash
        run: |
          set +e
          OUT="bin/targets/mediatek/filogic"
          SYSUP="$OUT/immortalwrt-mediatek-filogic-netcore_n60-pro-squashfs-sysupgrade.itb"
          if [ -s "$SYSUP" ]; then
            echo "FIRMWARE_PRODUCED=yes" >> $GITHUB_ENV
            echo "Firmware produced: $SYSUP"
            ls -lh "$SYSUP"
          else
            echo "FIRMWARE_PRODUCED=no" >> $GITHUB_ENV
            echo "::warning::No sysupgrade ITB produced. Build failed or target output differs."
            echo "===== Contents of $OUT ====="
            ls -lh "$OUT" 2>/dev/null || echo "(output dir missing)"
          fi

          if [ "${{ steps.build_step.outcome }}" = "failure" ] && [ "$FIRMWARE_PRODUCED" = "no" ]; then            echo "::error::Build step failed and no firmware was produced. See build log above."
            exit 1
          fi

      - name: Verify MTK Wi-Fi driver and runtime packages
        if: always() && env.FIRMWARE_PRODUCED == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          OUT="bin/targets/mediatek/filogic"
          EXTRACT="/tmp/n60pro-driver-package"
          mkdir -p "$EXTRACT"

          find_package() {
            local pattern_apk="$1"
            local pattern_ipk="$2"
            find bin/packages "$OUT" -type f \( -name "$pattern_apk" -o -name "$pattern_ipk" \) -print -quit 2>/dev/null || true
          }
          list_package_files() {
            local package="$1"
            local destination="$2"
            if [[ "$package" == *.apk ]]; then
              local apk_bin="$PWD/staging_dir/host/bin/apk"
              test -x "$apk_bin" || { echo "::error::Host apk tool missing."; exit 1; }
              mkdir -p "$destination"
              "$apk_bin" extract --allow-untrusted --destination "$destination" "$package"
              find "$destination" -type f -printf '%p\n' | sed "s#^$destination/##"
            else
              ar p "$package" data.tar.gz | tar -tzf -
            fi
          }

          check_package() {
            local pkgname="$1"; local expect_ko="$2"
            local pkg
            pkg="$(find_package "${pkgname}-*.apk" "${pkgname}_*.ipk")"
            if [ -z "$pkg" ]; then
              echo "::error::${pkgname} package was not produced."
              exit 1
            fi
            echo "Package: $pkg"
            local files
            files="$(list_package_files "$pkg" "/tmp/n60pro-$pkgname")"
            echo "$files" > "/tmp/${pkgname}-files.txt"
            echo "$files" | grep -Eq "(^|/)${expect_ko}$" || {
              echo "::error::${pkgname} does not contain ${expect_ko}."
              cat "/tmp/${pkgname}-files.txt"
              exit 1
            }
            echo "  OK: contains ${expect_ko}"
          }

          check_package kmod-mt_wifi mt_wifi.ko
          check_package kmod-warp mtk_warp.ko
          check_package kmod-mediatek_hnat mtkhnat.ko
          check_package kmod-conninfra conninfra.ko

          # MT7986 firmware blobs in kmod-mt_wifi
          grep -Eq '(^|/)lib/firmware/MT7986_' /tmp/kmod-mt_wifi-files.txt || {
            echo "::warning::MT7986 firmware blobs not found in kmod-mt_wifi."
          }

          # Manifest check
          MANIFEST="$(find "$OUT" -maxdepth 1 -type f -name '*.manifest' -print -quit)"
          if [ -n "$MANIFEST" ]; then
            cp "$MANIFEST" artifacts/N60-Pro/standard/image-packages.manifest
            for pkg in kmod-mt_wifi kmod-conninfra kmod-warp kmod-mediatek_hnat wifi-dats mtwifi-cfg-ucode; do
              grep -Eq "^$pkg([[:space:]]|$)" "$MANIFEST" || {
                echo "::warning::$pkg not listed in image manifest."
              }
            done
            echo "PASS: manifest checked."
          else
            echo "::warning::No image manifest found."
          fi

      - name: Collect firmware artifacts
        if: always()
        shell: bash
        run: |
          set +e
          OUT="bin/targets/mediatek/filogic"
          DEST="artifacts/N60-Pro/standard"
          mkdir -p "$DEST"

          find "$OUT" -maxdepth 1 -type f \
            \( -name '*netcore_n60-pro*.itb' -o -name '*netcore_n60-pro*.manifest' \
               -o -name 'sha256sums' -o -name '*.buildinfo' \) \
            -exec cp -v {} "$DEST/" \; 2>/dev/null

          if find "$DEST" -maxdepth 1 -iname '*mtkuboot*' | grep -q .; then
            echo "::error::MTK U-Boot artifact detected; refusing to package."
            exit 1