          {
            echo
            echo "===== gcc -H -E diagnostics ====="
            echo "gcc exit status: $GCC_RC"
            if grep -q 'rtmp\.h' "$INCLUDE_LOG"; then
              echo "RESULT: rtmp.h APPEARS in actual ap_ioctl.c include tree."
            else
              echo "RESULT: rtmp.h DOES NOT APPEAR in actual ap_ioctl.c include tree."
            fi
            echo
            echo "IMPORTANT: This evidence uses the exact compiler command captured from the real build log; it does not modify ap_ioctl.c."
          } | tee -a "$APIO_EVIDENCE"

          echo "PASS: GCC include-chain evidence capture completed."
          echo "Artifacts:"
          ls -lh "$APIO_EVIDENCE" "$APIO_TREE" "$APIO_CMD" 2>/dev/null || true
          ls -lh "$APIO_PRE" 2>/dev/null || true
      - name: Check whether firmware was actually produced
        if: always()
        shell: bash
        run: |
          set +e
          OUT="bin/targets/mediatek/filogic"
          SYSUP="$OUT/immortalwrt-mediatek-filogic-netcore_n60-pro-squashfs-sysupgrade.itb"
          if [ -s "$SYSUP" ]; then
            echo "FIRMWARE_PRODUCED=yes" >> $GITHUB_ENV
            echo "Firmware produced: $SYSUP"
            ls -lh "$SYSUP"
          else
            echo "FIRMWARE_PRODUCED=no" >> $GITHUB_ENV
            echo "::warning::No sysupgrade ITB produced. Build failed or target output differs."
            ls -lh "$OUT" 2>/dev/null || echo "(output dir missing)"
          fi

      - name: Collect firmware artifacts
        if: always()
        shell: bash
        run: |
          set +e
          OUT="bin/targets/mediatek/filogic"
          DEST="artifacts/N60-Pro/standard"
          mkdir -p "$DEST"

          find "$OUT" -maxdepth 1 -type f \
            \( -name '*netcore_n60-pro*.itb' -o -name '*netcore_n60-pro*.manifest' \
               -o -name 'sha256sums' -o -name '*.buildinfo' \) \
            -exec cp -v {} "$DEST/" \; 2>/dev/null

          if find "$DEST" -maxdepth 1 -iname '*mtkuboot*' | grep -q .; then
            echo "::error::MTK U-Boot artifact detected; refusing to package."
            exit 1
          fi

          {
            echo "Build policy: STANDARD PROFILE ONLY; MTK U-Boot excluded"
            echo "Profile: netcore_n60-pro"
            echo "Source revision:"
            git log -1 --format='%H %s'
            echo "Build step outcome: ${{ steps.build_step.outcome }}"
            echo "Firmware produced: ${FIRMWARE_PRODUCED:-unknown}"
            echo "Files:"
            find "$DEST" -maxdepth 1 -type f -printf '%f\n' | sort
          } > "$DEST/BUILD-INFO.txt"

          (
            cd "$DEST"
            shopt -s nullglob
            if ls *.itb >/dev/null 2>&1; then
              sha256sum *.itb > SHA256SUMS.txt
              cat SHA256SUMS.txt
            fi
          ) || true

          echo "===== Artifact tree ====="
          find artifacts/N60-Pro -maxdepth 2 -type f -printf '%p (%s bytes)\n' | sort

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: N60-Pro-Standard-${{ github.run_number }}
          path: artifacts/N60-Pro/
          if-no-files-found: warn
          retention-days: 14

      - name: Report ccache statistics
        if: always()
        run: ccache -s || true

      - name: Enforce build and firmware success
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "Build step outcome: ${{ steps.build_step.outcome }}"
          echo "Firmware produced: ${FIRMWARE_PRODUCED:-no}"
          if [ "${{ steps.build_step.outcome }}" != "success" ]; then
            echo "::error::Firmware build step did not succeed. This run must remain failed."
            exit 1
          fi
          if [ "${FIRMWARE_PRODUCED:-no}" != "yes" ]; then
            echo "::error::Expected standard netcore_n60-pro sysupgrade ITB is missing."
            exit 1
          fi
          test -s "bin/targets/mediatek/filogic/immortalwrt-mediatek-filogic-netcore_n60-pro-squashfs-sysupgrade.itb"
          echo "PASS: build succeeded and the expected sysupgrade ITB exists."
