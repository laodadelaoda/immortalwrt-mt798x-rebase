name: N60 Pro fixed-vendor-source patch diagnostics
# Retained as an explicitly invoked diagnostic workflow. Quick/Full builds
# no longer call this workflow and do not consume its attestation.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-patch-audit:
    name: Optional fixed-vendor patch and native Prepare diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify vendor Lock and patch application
        shell: bash
        run: |
          set -Eeuo pipefail
          cp config/n60pro-1001.config .config
          make defconfig
          python3 package/mtk/applications/easymesh-n60/tests/test-vendor-lock-evaluation.py
          python3 package/mtk/applications/easymesh-n60/scripts/n60-vendor-source-transforms.py verify-lock "$GITHUB_WORKSPACE"
          python3 package/mtk/applications/easymesh-n60/scripts/n60-vendor-lock.py verify-packages --repo "$GITHUB_WORKSPACE"
          echo "Diagnostic only: this workflow is not a Quick/Full build prerequisite."
