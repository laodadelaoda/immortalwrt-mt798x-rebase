name: N60 Pro fixed-vendor-source patch audit

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-patch-audit:
    name: Apply all pinned vendor patches without fuzz (no compilation)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify archives and audit all active patch stacks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          # Establish report output and EXIT capture before config generation or
          # any preflight. A failed preflight must still leave a diagnostic artifact.
          ROOT="$RUNNER_TEMP/n60-vendor-patch-audit"
          INPUT="$ROOT/input"
          SRC="$ROOT/source"
          OUT="$ROOT/report"
          mkdir -p "$INPUT" "$SRC" "$OUT" "$OUT/downloads"
          : > "$OUT/PATCH-APPLICATION-REPORT.txt"
          trap 'status=$?; if [ -f "$OUT/PATCH-APPLICATION-REPORT.txt" ]; then cp "$OUT/PATCH-APPLICATION-REPORT.txt" PATCH-APPLICATION-REPORT.txt; fi; exit "$status"' EXIT

          cp config/n60pro-1001.config .config
          if ! make defconfig 2>&1 | tee -a "$OUT/PATCH-APPLICATION-REPORT.txt"; then
            echo "FAIL: N60 Pro make defconfig failed" | tee -a "$OUT/PATCH-APPLICATION-REPORT.txt"
            exit 1
          fi
          if ! python3 package/mtk/applications/easymesh-n60/tests/test-vendor-lock-evaluation.py 2>&1 | tee -a "$OUT/PATCH-APPLICATION-REPORT.txt"; then
            echo "FAIL: Vendor Lock Make-variable regression tests failed" | tee -a "$OUT/PATCH-APPLICATION-REPORT.txt"
            exit 1
          fi
          if ! python3 package/mtk/applications/easymesh-n60/scripts/n60-vendor-source-transforms.py verify-lock "$GITHUB_WORKSPACE" 2>&1 | tee -a "$OUT/PATCH-APPLICATION-REPORT.txt"; then
            echo "FAIL: canonical vendor Lock verification failed" | tee -a "$OUT/PATCH-APPLICATION-REPORT.txt"
            exit 1
          fi
          if ! python3 package/mtk/applications/easymesh-n60/scripts/n60-vendor-lock.py verify-packages --repo "$GITHUB_WORKSPACE" 2>&1 | tee -a "$OUT/PATCH-APPLICATION-REPORT.txt"; then
            echo "FAIL: GNU Make Package variable verification failed" | tee -a "$OUT/PATCH-APPLICATION-REPORT.txt"
            exit 1
          fi
          echo "===== Generate unified Linux kernel + fixed-vendor patch manifest ====="
          python3 target/linux/mediatek/tests/audit-kernel-patch-stack.py inventory \
            --repo "$GITHUB_WORKSPACE" \
            --output-dir "$GITHUB_WORKSPACE/kernel-patch-audit"
          FAILURES=0
          CHECKED=0

          fail() {
            echo "FAIL: $*" | tee -a "$OUT/PATCH-APPLICATION-REPORT.txt"
            FAILURES=$((FAILURES + 1))
          }
          capture_failed_context() {
            local patch_file="$1" patch_root="$2" ctx_tmp="$3" log_file="$4" phase="$5"
            local patch_name ctx_out rel
            patch_name="$(basename "$patch_file")"
            ctx_out="$OUT/failed-context/patches/$patch_name/$phase"
            mkdir -p "$ctx_out"
            cp -a "$ctx_tmp/before" "$ctx_out/"
            cp "$patch_file" "$ctx_out/"
            cp "$log_file" "$ctx_out/$phase.log"
            while IFS= read -r rel; do
              [ -n "$rel" ] || continue
              if [ -f "$patch_root/$rel" ]; then
                mkdir -p "$ctx_out/before-numbered/$(dirname "$rel")"
                nl -ba "$patch_root/$rel" > "$ctx_out/before-numbered/$rel.numbered"
              fi
            done < <(sed -n 's/^+++ b\/\([^[:space:]]*\).*/\1/p' "$patch_file" | sort -u)
            {
              echo "phase=$phase"
              echo "patch=$patch_file"
              echo "patch_sha256=$(sha256sum "$patch_file" | awk '{print $1}')"
              echo "patch_root=$patch_root"
              echo "log=$log_file"
              find "$ctx_out" -type f ! -name CONTEXT-MANIFEST.txt -print0 | sort -z | xargs -0 sha256sum
            } > "$ctx_out/CONTEXT-MANIFEST.txt"
            echo "FAILURE CONTEXT SAVED: $patch_name phase=$phase" | tee -a "$OUT/PATCH-APPLICATION-REPORT.txt"
          }
          # Release Asset metadata is a preflight only; downloaded bytes are always
          # checked independently against the immutable Lock SHA256.
          release_asset_preflight() {
            local name="$1" url="$2" sha="$3" parsed owner repo tag asset cache api tmp metrics rc status effective ip redirects elapsed
            parsed="$(python3 - "$url" <<'PY'
          import sys
          from urllib.parse import urlparse, unquote
          u=urlparse(sys.argv[1]); p=[unquote(x) for x in u.path.split("/") if x]
          if u.hostname != "github.com" or len(p)<6 or p[2:4] != ["releases","download"]: print("NOT_RELEASE")
          else: print("\t".join((p[0],p[1],p[4],"/".join(p[5:]))))
          PY
          )"
            [ "$parsed" != "NOT_RELEASE" ] || return 0
            IFS="$(printf '\t')" read -r owner repo tag asset <<< "$parsed"
            [ "$asset" = "$name" ] || { echo "FAIL: release URL asset=$asset differs from Lock archive=$name"; return 1; }
            cache="$ROOT/release-api-$owner-$repo-$tag.json"
            api="https://api.github.com/repos/$owner/$repo/releases/tags/$tag"
            if [ ! -s "$cache" ]; then
              tmp="$cache.tmp"
              if metrics="$(curl --silent --show-error --location --connect-timeout 20 --max-time 60 \
                -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
                -H "Authorization: Bearer $GITHUB_TOKEN" -o "$tmp" \
                -w '%{http_code}\t%{url_effective}\t%{remote_ip}\t%{num_redirects}\t%{time_total}' "$api" \
                2>"$OUT/downloads/release-api-$owner-$repo-$tag.stderr")"; then rc=0; else rc=$?; fi
              IFS="$(printf '\t')" read -r status effective ip redirects elapsed <<< "$metrics"
              printf 'API request=%s status=%s effective_url=%s remote_ip=%s redirects=%s total_seconds=%s curl_exit=%s\n' \
                "$api" "${status:-000}" "${effective:-}" "${ip:-}" "${redirects:-0}" "${elapsed:-}" "$rc" \
                | tee "$OUT/downloads/release-api-$owner-$repo-$tag.log" | tee -a "$OUT/PATCH-APPLICATION-REPORT.txt"
              if [ "$rc" -ne 0 ] || [ "${status:-000}" != 200 ] || [ ! -s "$tmp" ]; then
                rm -f "$tmp"; echo "FAIL: RELEASE_API_UNAVAILABLE archive=$name"; return 1
              fi
              mv "$tmp" "$cache"
            fi
            python3 - "$cache" "$tag" "$name" "$url" "$sha" <<'PY' 2>&1 | tee -a "$OUT/PATCH-APPLICATION-REPORT.txt" "$OUT/downloads/release-api-$owner-$repo-$tag.assets.log"
          import json,sys
          path,tag,name,url,sha=sys.argv[1:]
          d=json.load(open(path,encoding="utf-8"))
          assert d.get("tag_name")==tag, f"Release tag mismatch: {d.get('tag_name')}"
          a=[x for x in d.get("assets",[]) if x.get("name")==name]
          assert len(a)==1, f"Release asset missing/ambiguous: {name} count={len(a)}"
          x=a[0]
          assert x.get("digest")==("sha256:"+sha), f"Release API digest mismatch: {name} api={x.get('digest')} lock=sha256:{sha}"
          assert x.get("browser_download_url")==url, f"Release asset URL mismatch: {name}"
          print(f"PASS: RELEASE_API asset={name} id={x.get('id')} size={x.get('size')} digest={x.get('digest')}")
          PY
          }

          fetch_archive() {
            local name="$1" url="$2" sha="$3" dir="$OUT/downloads/$1"
            local n tmp hdr metrics rc status final ip redirects dns tcp tls ttfb total cls host
            mkdir -p "$dir"
            printf 'archive=%s\nrequest_url=%s\nlock_sha256=%s\n' "$name" "$url" "$sha" | tee "$dir/summary.txt" | tee -a "$OUT/PATCH-APPLICATION-REPORT.txt"
            release_asset_preflight "$name" "$url" "$sha" || return 1
            # One request per archive: preserve the first failure instead of masking it with blind retries.
            for n in 1; do
              tmp="$INPUT/$name.part"; hdr="$dir/attempt-$n.headers"; rm -f "$tmp"; : > "$hdr"
              if metrics="$(curl --silent --show-error --location --connect-timeout 30 --max-time 300 \
                --dump-header "$hdr" --output "$tmp" \
                --write-out '%{http_code}\t%{url_effective}\t%{remote_ip}\t%{num_redirects}\t%{time_namelookup}\t%{time_connect}\t%{time_appconnect}\t%{time_starttransfer}\t%{time_total}' \
                "$url" 2>"$dir/attempt-$n.stderr")"; then rc=0; else rc=$?; fi
              IFS="$(printf '\t')" read -r status final ip redirects dns tcp tls ttfb total <<< "$metrics"
              status="${status:-000}"; final="${final:-unknown}"; ip="${ip:-unknown}"; redirects="${redirects:-0}"
              if [ "$rc" -ne 0 ] && [ "$status" = 000 ]; then cls=NETWORK_DNS_TCP_TLS_OR_TRANSFER
              elif [ "$status" -ge 500 ] 2>/dev/null; then
                host="$(python3 -c 'import sys; from urllib.parse import urlparse; print(urlparse(sys.argv[1]).hostname or "")' "$final")"
                case "$host" in
                  github.com) cls=GITHUB_DOWNLOAD_ENTRY_5XX ;;
                  *.githubusercontent.com|*.githubassets.com|*.amazonaws.com|*.cloudfront.net) cls=REDIRECTED_CDN_5XX ;;
                  *) cls=REDIRECT_TARGET_UPSTREAM_5XX ;;
                esac
              elif [ "$status" = 404 ]; then cls=HTTP_404_ASSET_OR_PATH
              elif [ "$status" = 403 ]; then cls=HTTP_403_ACCESS_OR_POLICY
              elif [ "$status" = 429 ]; then cls=HTTP_429_RATE_LIMIT
              elif [ "$rc" -eq 0 ] && [ "$status" -ge 200 ] && [ "$status" -lt 300 ] && [ ! -s "$tmp" ]; then cls=HTTP_EMPTY_BODY
              elif [ "$rc" -eq 0 ] && [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then cls=HTTP_OK_PENDING_LOCK_SHA256
              else cls=HTTP_OR_CURL_FAILURE; fi
              {
                printf 'attempt=%s\nrequest_url=%s\nfinal_url=%s\nhttp_status=%s\nremote_ip=%s\nredirect_count=%s\ndns_seconds=%s\ntcp_connect_seconds=%s\ntls_seconds=%s\ntime_to_first_byte_seconds=%s\ntotal_seconds=%s\ncurl_exit=%s\nclassification=%s\n' \
                  "$n" "$url" "$final" "$status" "$ip" "$redirects" "${dns:-}" "${tcp:-}" "${tls:-}" "${ttfb:-}" "${total:-}" "$rc" "$cls"
                echo "redirect_chain:"
                python3 - "$hdr" <<'PY'
          import sys
          for s in open(sys.argv[1],errors="replace"):
              s=s.rstrip("\r\n")
              if s.startswith("HTTP/") or s.lower().startswith("location:"): print(s)
          PY
              } | tee "$dir/attempt-$n.log" | tee -a "$OUT/PATCH-APPLICATION-REPORT.txt"
              if [ "$cls" = HTTP_OK_PENDING_LOCK_SHA256 ] && [ -s "$tmp" ]; then
                if printf '%s  %s\n' "$sha" "$tmp" | sha256sum --check - >"$dir/lock-sha256.log" 2>&1; then
                  mv "$tmp" "$INPUT/$name"
                  echo "PASS: local archive bytes match Lock SHA256: $name" | tee -a "$dir/summary.txt" | tee -a "$OUT/PATCH-APPLICATION-REPORT.txt"
                  return 0
                fi
                cat "$dir/lock-sha256.log" | tee -a "$OUT/PATCH-APPLICATION-REPORT.txt"
                echo "FAIL: LOCAL_LOCK_SHA256_MISMATCH archive=$name" | tee -a "$dir/summary.txt"; rm -f "$tmp"; return 1
              fi
              rm -f "$tmp"
              echo "FAIL: DOWNLOAD_FAILED archive=$name class=$cls attempts=$n" | tee -a "$dir/summary.txt" | tee -a "$OUT/PATCH-APPLICATION-REPORT.txt"
              return 1
            done
          }

          apply_one() {
            patch_file="$1"; patch_root="$2"
            CHECKED=$((CHECKED + 1))
            patch_name="$(basename "$patch_file")"
            dry_log="$ROOT/$patch_name.dry-run.log"
            apply_log="$ROOT/$patch_name.apply.log"
            expected_hunks="$(grep -c '^@@ ' "$patch_file" || true)"
            ctx_tmp="$ROOT/offset-context-$CHECKED"
            rm -rf "$ctx_tmp"
            mkdir -p "$ctx_tmp/before"
            while IFS= read -r rel; do
              [ -n "$rel" ] || continue
              if [ -f "$patch_root/$rel" ]; then
                mkdir -p "$ctx_tmp/before/$(dirname "$rel")"
                cp -p "$patch_root/$rel" "$ctx_tmp/before/$rel"
              fi
            done < <(sed -n 's/^+++ b\/\([^[:space:]]*\).*/\1/p' "$patch_file" | sort -u)
            echo "===== PATCH $patch_file | expected_hunks=$expected_hunks =====" | tee -a "$OUT/PATCH-APPLICATION-REPORT.txt"
            if [ "$expected_hunks" -le 0 ]; then
              fail "patch has no unified-diff hunks: $patch_file"
              return 1
            fi

            if patch --verbose --dry-run --batch --forward --fuzz=0 -p1 -d "$patch_root" < "$patch_file" > "$dry_log" 2>&1; then
              cat "$dry_log" | tee -a "$OUT/PATCH-APPLICATION-REPORT.txt"
              if grep -Eiq 'Hunk #[0-9]+ succeeded at .*\(offset [+-]?[1-9][0-9]* lines?\)' "$dry_log"; then
                grep -Ei 'Hunk #[0-9]+ succeeded at .*\(offset [+-]?[1-9][0-9]* lines?\)' "$dry_log" | tee -a "$OUT/PATCH-APPLICATION-REPORT.txt"
                fail "non-zero line offset detected in dry-run: $patch_file"
                echo "DIAGNOSTIC CONTINUE: applying this zero-fuzz patch to discover downstream context offsets." | tee -a "$OUT/PATCH-APPLICATION-REPORT.txt"
              fi
            else
              cat "$dry_log" | tee -a "$OUT/PATCH-APPLICATION-REPORT.txt"
              capture_failed_context "$patch_file" "$patch_root" "$ctx_tmp" "$dry_log" "dry-run"
              fail "zero-fuzz dry-run failed: $patch_file"
              return 1
            fi
            if grep -Eiq 'Skipping patch|Reversed \(or previously applied\)|Ignoring previously applied' "$dry_log"; then
              fail "dry-run skipped or treated patch as already applied: $patch_file"
              return 1
            fi
            dry_hunks="$(grep -Ec 'Hunk #[0-9]+ succeeded' "$dry_log" || true)"
            if [ "$dry_hunks" -ne "$expected_hunks" ]; then
              fail "dry-run applied $dry_hunks/$expected_hunks hunks: $patch_file"
              return 1
            fi

            if patch --verbose --batch --forward --fuzz=0 -p1 -d "$patch_root" < "$patch_file" > "$apply_log" 2>&1; then
              cat "$apply_log" | tee -a "$OUT/PATCH-APPLICATION-REPORT.txt"
              if grep -Eiq 'Hunk #[0-9]+ succeeded at .*\(offset [+-]?[1-9][0-9]* lines?\)' "$apply_log"; then
                grep -Ei 'Hunk #[0-9]+ succeeded at .*\(offset [+-]?[1-9][0-9]* lines?\)' "$apply_log" | tee -a "$OUT/PATCH-APPLICATION-REPORT.txt"
                fail "non-zero line offset detected during actual apply: $patch_file"
                echo "DIAGNOSTIC CONTINUE: patch applied with offset; later dependent patches will still be checked." | tee -a "$OUT/PATCH-APPLICATION-REPORT.txt"
              fi
            else
              cat "$apply_log" | tee -a "$OUT/PATCH-APPLICATION-REPORT.txt"
              capture_failed_context "$patch_file" "$patch_root" "$ctx_tmp" "$apply_log" "actual-apply"
              fail "actual application failed after successful dry-run: $patch_file"
              return 1
            fi
            if grep -Eiq 'Skipping patch|Reversed \(or previously applied\)|Ignoring previously applied' "$apply_log"; then
              fail "actual application skipped or treated patch as already applied: $patch_file"
              return 1
            fi
            applied_hunks="$(grep -Ec 'Hunk #[0-9]+ succeeded' "$apply_log" || true)"
            if [ "$applied_hunks" -ne "$expected_hunks" ]; then
              fail "actual application applied $applied_hunks/$expected_hunks hunks: $patch_file"
              return 1
            fi
            if grep -Eiq 'Hunk #[0-9]+ succeeded at .*\(offset [+-]?[1-9][0-9]* lines?\)' "$dry_log" "$apply_log"; then
              ctx_out="$OUT/offset-context/$patch_name"
              mkdir -p "$ctx_out"
              cp -a "$ctx_tmp/before" "$ctx_out/"
              mkdir -p "$ctx_out/after"
              while IFS= read -r rel; do
                [ -n "$rel" ] || continue
                if [ -f "$patch_root/$rel" ]; then
                  mkdir -p "$ctx_out/after/$(dirname "$rel")"
                  cp -p "$patch_root/$rel" "$ctx_out/after/$rel"
                fi
              done < <(sed -n 's/^+++ b\/\([^[:space:]]*\).*/\1/p' "$patch_file" | sort -u)
              cp "$patch_file" "$ctx_out/"
              cp "$dry_log" "$ctx_out/dry-run.log"
              cp "$apply_log" "$ctx_out/actual-apply.log"
              {
                echo "patch=$patch_file"
                echo "patch_sha256=$(sha256sum "$patch_file" | awk '{print $1}')"
                echo "patch_root=$patch_root"
                find "$ctx_out/before" "$ctx_out/after" -type f -print0 | sort -z | xargs -0 sha256sum
              } > "$ctx_out/CONTEXT-MANIFEST.txt"
            fi
            echo "PASS: all $applied_hunks/$expected_hunks hunks dry-run and applied with zero fuzz: $patch_file" | tee -a "$OUT/PATCH-APPLICATION-REPORT.txt"
          }
          apply_locked_series() {
            set_id="$1"; patch_root="$2"; phase="$3"
            patch_dir="$(python3 -c 'import json,sys; from pathlib import Path; d=json.loads((Path(sys.argv[1])/"package/mtk/vendor-sources.lock.json").read_text()); print(next(x["directory"] for x in d["patch_sets"] if x["id"]==sys.argv[2]))' "$GITHUB_WORKSPACE" "$set_id")"
            echo "===== LOCKED SERIES $set_id phase=$phase dir=$patch_dir =====" | tee -a "$OUT/PATCH-APPLICATION-REPORT.txt"
            mapfile -t locked_names < <(python3 package/mtk/applications/easymesh-n60/scripts/n60-vendor-lock.py patch-order --repo "$GITHUB_WORKSPACE" --set "$set_id" --phase "$phase")
            for name in "${locked_names[@]}"; do
              test -s "$patch_dir/$name" || { fail "missing/empty locked patch: $patch_dir/$name"; continue; }
              if [ "$set_id" = "easymesh" ] && [ "$name" = "009-dpp-null-guard-and-unused-cred-length.patch" ]; then
                mkdir -p "$OUT/failed-context/009"
                cp "$patch_root/wappd/common/main.c" "$OUT/failed-context/009/main.c.before-009"
                cp "$patch_dir/002-dpp-parser-safety.patch" "$OUT/failed-context/009/"
                cp "$patch_dir/007-openssl3-use-native-evp-pkey-get0-ec-key.patch" "$OUT/failed-context/009/"
                cp "$patch_dir/008-dpp-parser-bounds-and-secret-redaction.patch" "$OUT/failed-context/009/"
                cp "$patch_dir/009-dpp-null-guard-and-unused-cred-length.patch" "$OUT/failed-context/009/"
                nl -ba "$patch_root/wappd/common/main.c" > "$OUT/failed-context/009/main.c.before-009.numbered"
                sha256sum "$OUT/failed-context/009/"* > "$OUT/failed-context/009/SHA256SUMS"
              fi
              if [ "$set_id" = "easymesh" ] && [ "$name" = "017-dpp-credential-bounds-zeroization-and-log-redaction.patch" ]; then
                mkdir -p "$OUT/pre017"
                cp "$patch_root/wappd/common/main.c" "$OUT/pre017/main.c"
                cp "$patch_root/wappd/dpp/dpp_wdev.c" "$OUT/pre017/dpp_wdev.c"
                sha256sum "$OUT/pre017/main.c" "$OUT/pre017/dpp_wdev.c" > "$OUT/pre017/SHA256SUMS"
              fi
              apply_one "$patch_dir/$name" "$patch_root"
            done
          }

          while IFS="$(printf '\t')" read -r name url sha; do
            [ -n "$name" ] || continue
            fetch_archive "$name" "$url" "$sha"
          done < <(python3 - "$GITHUB_WORKSPACE" <<'PY'
          import json, sys
          from pathlib import Path
          lock = json.loads((Path(sys.argv[1]) / "package/mtk/vendor-sources.lock.json").read_text(encoding="utf-8"))
          for item in lock["sources"]:
              print(item["archive"] + "\t" + item["url"] + "\t" + item["sha256"])
          PY
          )

          mkdir -p "$SRC/easymesh" "$SRC/mtwifi" "$SRC/conninfra" "$SRC/warp" "$SRC/datconf" "$SRC/mapfilter" "$SRC/bndstrg" "$SRC/fwdd"
          for name in wappd-80ca5724 mapd-6eca4331 1905daemon-35234223 libmapd-0132d199; do
            tar -xjf "$INPUT/$name.tar.bz2" -C "$SRC/easymesh"
          done
          tar -xJf "$INPUT/mt79xx_20250408-705eb4.tar.xz" -C "$SRC/mtwifi"
          tar -xJf "$INPUT/mt79xx_conninfra_20250408-f2fa25.tar.xz" -C "$SRC/conninfra"
          tar -xJf "$INPUT/warp_20250408-5f71ec.tar.xz" -C "$SRC/warp"
          tar -xjf "$INPUT/datconf-757f9679.tar.bz2" -C "$SRC/datconf"
          tar -xjf "$INPUT/mapfilter-96f2afed.tar.bz2" -C "$SRC/mapfilter"
          tar -xjf "$INPUT/bndstrg_plus-8350508d.tar.bz2" -C "$SRC/bndstrg"
          tar -xjf "$INPUT/fwdd-bcbae0e4.tar.bz2" -C "$SRC/fwdd"

          # Keep immutable extracts for archive-to-source and patch-delta verification.
          mkdir -p "$SRC/pristine"
          cp -a "$SRC/mtwifi" "$SRC/pristine/mtwifi"
          cp -a "$SRC/conninfra/conninfra" "$SRC/pristine/conninfra"
          cp -a "$SRC/warp/warp" "$SRC/pristine/warp"
          cp -a "$SRC/datconf/datconf" "$SRC/pristine/datconf"
          cp -a "$SRC/mapfilter/mapfilter" "$SRC/pristine/mapfilter"
          cp -a "$SRC/easymesh/wappd" "$SRC/pristine/wappd"
          cp -a "$SRC/easymesh/mapd" "$SRC/pristine/mapd"
          cp -a "$SRC/easymesh/1905daemon" "$SRC/pristine/1905daemon"
          cp -a "$SRC/easymesh/libmapd" "$SRC/pristine/libmapd"
          cp -a "$SRC/bndstrg/bndstrg_plus" "$SRC/pristine/bndstrg_plus"
          cp -a "$SRC/fwdd/fwdd" "$SRC/pristine/fwdd"

          # Lock is the sole ordered source for every vendor patch series.
          apply_locked_series easymesh "$SRC/easymesh" application
          python3 package/mtk/applications/easymesh-n60/scripts/n60-vendor-source-transforms.py normalize "$SRC/easymesh"
          # Lock order is shared, but the DSA patch is scoped to the 1905daemon subtree.
          EASY_POST_DIR="$(python3 -c 'import json,sys; from pathlib import Path; d=json.loads((Path(sys.argv[1])/"package/mtk/vendor-sources.lock.json").read_text()); print(next(x["directory"] for x in d["patch_sets"] if x["id"]=="easymesh"))' "$GITHUB_WORKSPACE")"
          mapfile -t easy_post_names < <(python3 package/mtk/applications/easymesh-n60/scripts/n60-vendor-lock.py patch-order --repo "$GITHUB_WORKSPACE" --set easymesh --phase post_normalize)
          for name in "${easy_post_names[@]}"; do
            case "$name" in
              006-*) apply_one "$EASY_POST_DIR/$name" "$SRC/easymesh" ;;
              001-*) apply_one "$EASY_POST_DIR/$name" "$SRC/easymesh/1905daemon" ;;
              *) fail "unexpected EasyMesh post-normalize Lock patch: $name" ;;
            esac
          done
          apply_locked_series mtwifi-7673 "$SRC/mtwifi" all
          apply_locked_series conninfra "$SRC/conninfra/conninfra" all
          apply_locked_series warp "$SRC/warp/warp" all
          # Native OpenWrt Build/Prepare/Default: unpack -> ./src overlay -> Build/Patch.
          cp -a package/mtk/applications/datconf/src/. "$SRC/datconf/datconf/"
          echo "PASS: datconf ./src overlay applied before Package patch series" | tee -a "$OUT/PATCH-APPLICATION-REPORT.txt"
          apply_locked_series datconf "$SRC/datconf/datconf" all
          apply_locked_series mapfilter "$SRC/mapfilter/mapfilter" all

          # Auxiliary patch inputs are audited too; these sources are not added to firmware.
          mapfile -t auxiliary_names < <(python3 package/mtk/applications/easymesh-n60/scripts/n60-vendor-lock.py patch-order --repo "$GITHUB_WORKSPACE" --set auxiliary --phase all)
          for name in "${auxiliary_names[@]}"; do
            case "$name" in
              001-bndstrg*) apply_one "package/mtk/applications/easymesh-n60/auxiliary-patches/$name" "$SRC/bndstrg" ;;
              002-fwdd*) apply_one "package/mtk/applications/easymesh-n60/auxiliary-patches/$name" "$SRC/fwdd" ;;
              *) fail "unexpected auxiliary Lock patch: $name" ;;
            esac
          done

          # Run only after every patch series, including auxiliary source patches,
          # has been applied; compare the complete patched trees with pristine archives.
          python3 package/mtk/applications/easymesh-n60/tests/test-vendor-archive-integrity.py \
            "$INPUT" "$SRC" "$SRC/pristine" "$GITHUB_WORKSPACE"

          # The exact same helper is invoked by package Build/Prepare.
          # This prevents the audit's transformation logic drifting from the real build.
          python3 package/mtk/applications/easymesh-n60/scripts/n60-vendor-source-transforms.py finalize "$SRC/easymesh"
          # Run the same semantic DPP source contract used by Build/Prepare before
          # issuing the fixed-vendor audit attestation.
          python3 package/mtk/applications/easymesh-n60/tests/test-dpp-source-contract.py "$SRC/easymesh"
          python3 package/mtk/applications/easymesh-n60/scripts/test-dpp-cred-len-preprocess.py "$SRC/easymesh" "$GITHUB_WORKSPACE" "$OUT/cred-len-preprocess"

          # Preserve an independently reviewable DPP source pair: pristine vendor
          # WAPP and the exact fully patched/normalized WAPP tree used by Prepare.
          mkdir -p "$OUT/dpp-audit/pristine" "$OUT/dpp-audit/patched"
          cp -a "$SRC/pristine/wappd/." "$OUT/dpp-audit/pristine/"
          cp -a "$SRC/easymesh/wappd/." "$OUT/dpp-audit/patched/"
          {
            echo "Repository revision: $(git rev-parse HEAD)"
            echo "WAPP archive SHA256: $(python3 -c 'import json; from pathlib import Path; d=json.loads(Path("package/mtk/vendor-sources.lock.json").read_text()); print(next(x["sha256"] for x in d["sources"] if x["id"]=="wappd"))')"
            echo "DPP patch series: 017-dpp-credential-bounds-zeroization-and-log-redaction.patch -> 018-dpp-security-logging-and-credential-lifecycle.patch"
            sha256sum \
              package/mtk/applications/easymesh-n60/patches/017-dpp-credential-bounds-zeroization-and-log-redaction.patch \
              package/mtk/applications/easymesh-n60/patches/018-dpp-security-logging-and-credential-lifecycle.patch \
              "$OUT/dpp-audit/pristine/common/main.c" \
              "$OUT/dpp-audit/pristine/common/wdev.c" \
              "$OUT/dpp-audit/pristine/dpp/dpp.c" \
              "$OUT/dpp-audit/pristine/dpp/dpp_reconfig.c" \
              "$OUT/dpp-audit/pristine/dpp/dpp_wdev.c" \
              "$OUT/dpp-audit/pristine/dpp/dpp_wired.c" \
              "$OUT/dpp-audit/pristine/map/map_1905.c" \
              "$OUT/dpp-audit/patched/common/main.c" \
              "$OUT/dpp-audit/patched/common/wdev.c" \
              "$OUT/dpp-audit/patched/dpp/dpp.c" \
              "$OUT/dpp-audit/patched/dpp/dpp_reconfig.c" \
              "$OUT/dpp-audit/patched/dpp/dpp_wdev.c" \
              "$OUT/dpp-audit/patched/dpp/dpp_wired.c" \
              "$OUT/dpp-audit/patched/map/map_1905.c"
          } > "$OUT/dpp-audit/SOURCE-MANIFEST.txt"

          # Git's unified-diff parser must also accept every active patch.
          while IFS= read -r patch_file; do
            if git apply --numstat "$patch_file" >/dev/null 2>"$RUNNER_TEMP/git-apply-parse.err"; then
              echo "PASS: git unified-diff parser: $patch_file"
            else
              cat "$RUNNER_TEMP/git-apply-parse.err"
              fail "git apply parser rejected patch syntax: $patch_file"
            fi
          done < <(find \
            package/mtk/applications/easymesh-n60/patches \
            package/mtk/applications/easymesh-n60/auxiliary-patches \
            package/mtk/applications/datconf/patches \
            package/mtk/drivers/mt_wifi/patches-7673 \
            package/mtk/drivers/conninfra/patches \
            package/mtk/drivers/warp/patches \
            package/kernel/mapfilter/patches \
            -type f -name '*.patch' -print | sort)

          # Kernel integration patches are syntax-checked here; applying them to
          # the actual Linux 6.12 tree remains a Full-kernel validation task.
          for kernel_patch in \
            target/linux/mediatek/patches-6.12/999-zzz-5203-mtk-wifi_utility-add-universal-eeprom-read-write-backend.patch \
            target/linux/mediatek/patches-6.12/999-mapfilter-add-kconfig.patch; do
            test -s "$kernel_patch" || fail "missing kernel integration patch: $kernel_patch"
            git apply --numstat "$kernel_patch" >/dev/null || fail "malformed kernel integration patch: $kernel_patch"
          done

          {
            echo
            echo "Repository revision: $(git rev-parse HEAD)"
            echo "Active patch files checked: $CHECKED"
            echo "Patch failures: $FAILURES"
            echo "Patch mode: dry-run then actual apply; --batch --forward --fuzz=0; canonical Lock order per package."
            echo "No feeds, host tools, target toolchain, kernel build or package compilation was run."
            echo
            echo "===== Non-patch source transformations in EasyMesh Build/Prepare (separately inventoried) ====="
            grep -nE 'python3 -c|sed -i|tr -d|printf .*conf_list' package/mtk/applications/easymesh-n60/Makefile || true
          } | tee -a "$OUT/PATCH-APPLICATION-REPORT.txt"
          cp "$OUT/PATCH-APPLICATION-REPORT.txt" PATCH-APPLICATION-REPORT.txt
          if [ "$FAILURES" -ne 0 ]; then
            echo "::error::Vendor patch audit found $FAILURES failure(s); Quick compilation must remain gated."
            exit 1
          fi
          echo "===== Execute the real OpenWrt Package prepare targets ====="
          # Stage the already SHA256-verified Lock archives in OpenWrt's real DL_DIR.
          # Do not reimplement unpack, ./src overlay, or Build/Patch here: invoke each
          # Package's native prepare target so package.mk controls the actual sequence.
          mkdir -p dl
          cp -f "$INPUT"/* dl/
          python3 - "$GITHUB_WORKSPACE" <<'PY' > "$ROOT/native-prepare-targets.tsv"
          import json, sys
          from pathlib import Path
          repo = Path(sys.argv[1])
          lock = json.loads((repo / "package/mtk/vendor-sources.lock.json").read_text(encoding="utf-8"))
          targets = {}
          for item in lock["sources"]:
              if item.get("source_scope") == "auxiliary-audit-only":
                  continue
              package_dir = str(Path(item["package_makefile"]).parent)
              targets.setdefault(package_dir, item["id"])

          # EasyMesh declares PKG_BUILD_DEPENDS:=datconf openssl libnl-tiny.
          # Its Build/Prepare inventory test inspects datconf's native PKG_BUILD_DIR,
          # so prepare the independent datconf package before EasyMesh. This mirrors
          # the dependency order already used by quick-prepare-audit.yml.
          prepare_order = [
              "package/mtk/applications/datconf",
              "package/mtk/drivers/mt_wifi",
              "package/mtk/drivers/conninfra",
              "package/mtk/drivers/warp",
              "package/kernel/mapfilter",
              "package/mtk/applications/easymesh-n60",
          ]
          ordered = [p for p in prepare_order if p in targets]
          ordered.extend(p for p in targets if p not in ordered)
          for package_dir in ordered:
              print(package_dir + "|" + targets[package_dir])
          PY
          while IFS='|' read -r package_dir source_id; do
            [ -n "$package_dir" ] || continue
            prepare_log="$ROOT/native-$source_id-prepare.log"
            echo "===== make $package_dir/prepare (source representative: $source_id) ====="
            if ! make --no-print-directory -j1 "$package_dir/prepare" V=s 2>&1 | tee "$prepare_log"; then
              fail "native OpenWrt Prepare failed: $package_dir"
              continue
            fi
            python3 - "$GITHUB_WORKSPACE" "$package_dir" "$source_id" <<'PY'
          import json, sys
          from pathlib import Path
          repo, package_dir, source_id = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          lock = json.loads((repo / "package/mtk/vendor-sources.lock.json").read_text(encoding="utf-8"))
          item = next(x for x in lock["sources"] if x["id"] == source_id)
          expected = repo / item["expected_build_dir"]
          if not expected.is_dir():
              raise SystemExit(f"FAIL: native Prepare did not create expected PKG_BUILD_DIR: {expected}")
          related = [x for x in lock["sources"]
                     if str(Path(x["package_makefile"]).parent) == package_dir
                     and x.get("source_scope") != "auxiliary-audit-only"]
          for source in related:
              root_name = source.get("extract_root")
              if root_name:
                  extracted = expected / root_name
                  if not extracted.is_dir():
                      raise SystemExit(
                          f"FAIL: Lock extract_root for {source['id']} is absent from native PKG_BUILD_DIR: {extracted}"
                      )
                  print(f"NATIVE EXTRACT ROOT PASS: {source['id']} -> {extracted}")
          print(f"NATIVE PREPARE PASS: {package_dir} -> {expected}")
          PY
          done < "$ROOT/native-prepare-targets.tsv"
          if [ "$FAILURES" -ne 0 ]; then
            echo "::error::Native OpenWrt Package Prepare verification failed."
            exit 1
          fi
          echo "PASS: real OpenWrt Package Prepare targets completed; no package compilation was run."
          echo "PASS: every active fixed-vendor patch applied to its pinned archive with zero fuzz."
          echo "Package preparation simulation: datconf archive -> ./src overlay -> Lock-ordered Build/Patch series."

      - name: Assert MT Wi-Fi 026 exact Prepare path, patch result and function replacement
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 package/mtk/drivers/mt_wifi/tests/test-026-prandom-u32-prepare.py \
            --repo "$GITHUB_WORKSPACE" \
            --evidence-dir "$RUNNER_TEMP/mtwifi-026-audit"

      - name: Upload MT Wi-Fi 026 source, path and function evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: n60-mtwifi-026-source-audit
          path: ${{ runner.temp }}/mtwifi-026-audit/
          if-no-files-found: warn
          retention-days: 14

      - name: Create immutable audit attestation
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 package/mtk/applications/easymesh-n60/scripts/verify-vendor-audit-attestation.py create --repo "$GITHUB_WORKSPACE" --attestation vendor-audit-attestation.json

      - name: Upload MAP_R3 cred_len preprocessing evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: n60-map-r3-cred-len-preprocess
          path: ${{ runner.temp }}/n60-vendor-patch-audit/report/cred-len-preprocess/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload immutable audit attestation
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: n60-vendor-audit-attestation
          path: vendor-audit-attestation.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload per-archive download diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: n60-vendor-download-diagnostics
          path: ${{ runner.temp }}/n60-vendor-patch-audit/report/downloads/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload complete patch audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: n60-fixed-vendor-patch-audit
          path: PATCH-APPLICATION-REPORT.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload exact pre/post source contexts for offset patches
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: n60-offset-patch-contexts
          path: ${{ runner.temp }}/n60-vendor-patch-audit/report/offset-context/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload exact source context for every failed patch application
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: n60-failed-patch-source-context
          path: ${{ runner.temp }}/n60-vendor-patch-audit/report/failed-context/patches/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload exact source context before DPP patch 009
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: n60-dpp-009-failure-context
          path: ${{ runner.temp }}/n60-vendor-patch-audit/report/failed-context/009/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload actual pre-017 source from full audit patch stage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dpp-pre017-full-audit-source
          path: ${{ runner.temp }}/n60-vendor-patch-audit/report/pre017/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload pristine and fully patched WAPP source for DPP security review
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dpp-security-audit-source
          path: ${{ runner.temp }}/n60-vendor-patch-audit/report/dpp-audit/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unified patch inventory, dependency CSVs and SHA256 credentials
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: n60-unified-patch-inventory
          path: kernel-patch-audit/
          if-no-files-found: warn
          retention-days: 30
